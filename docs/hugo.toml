baseURL = "https://fernandezvara.github.io/backd/"
languageCode = "en-us"
title = "back(d)"
enableGitInfo = true

[markup.goldmark.renderer]
  unsafe = false

[markup.highlight]
  noClasses = false

[markup.tableOfContents]
  startLevel = 2
  endLevel = 3

[module]
  [[module.imports]]
    path = "github.com/fernandezvara/hugodoks"

  # The default mounts, restated because adding one replaces them all.
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "data"
    target = "data"
  [[module.mounts]]
    source = "layouts"
    target = "layouts"
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "i18n"
    target = "i18n"
  # The runnable examples the pages quote, read by the example-file shortcode
  # (layouts/shortcodes/example-file.html) so the docs show the code that is
  # actually tested.
  [[module.mounts]]
    source = "../examples/config/workshop"
    target = "assets/examples/workshop"
    includeFiles = ["**.ts", "**.yaml", "**.json"]
    excludeFiles = ["**/.build/**"]
  [[module.mounts]]
    source = "../examples/config/blog"
    target = "assets/examples/blog"
    includeFiles = ["**.yaml", "**.json"]
    excludeFiles = ["**/.build/**"]
  [[module.mounts]]
    source = "../examples/config/hr"
    target = "assets/examples/hr"
    includeFiles = ["**.yaml", "**.json"]
    excludeFiles = ["**/.build/**"]
  [[module.mounts]]
    source = "../examples/config/shelf"
    target = "assets/examples/shelf"
    includeFiles = ["**.ts", "**.yaml", "**.json", "**.html", "**.txt", "**.lock"]
    excludeFiles = ["**/.build/**"]
  # The tutorial's downloads: the same files the repo runs, served under
  # /tutorial/ so readers never need a backd checkout.
  [[module.mounts]]
    source = "../examples/config/shelf"
    target = "static/tutorial/config/shelf"
    excludeFiles = ["**/.build/**"]
  [[module.mounts]]
    source = "../clients/js/examples/shelf"
    target = "static/tutorial/app"
  [[module.mounts]]
    source = "../clients/js/src"
    target = "static/tutorial/client"
  # The fake `ctx` the chapters' function tests import.
  [[module.mounts]]
    source = "../clients/functions-testing/src"
    target = "static/tutorial/functions-testing"
    includeFiles = ["index.js"]

# Hugo does not merge outputs from a theme: the search index is ours to enable.
[outputs]
  home = ["html", "rss", "searchindex"]

[params]
  description = "Config-driven REST backend over MongoDB"

  [params.footer]
    copyright = "© 2026 backd contributors · [MIT License](https://github.com/fernandezvara/backd/blob/main/LICENSE)"

  [params.social]
    github = "fernandezvara/backd"

  [params.docs]
    editPage = true
    lastMod = true
    aiAssist = true
    aiAssistIcon = "sparkle"
    repoURL = "https://github.com/fernandezvara/backd"
    repoBranch = "main"
    repoContentDir = "docs/content"
    navDefaultIcon = "dot-outline"

  [params.brand]
    icon = "sliders"

  # Palette overrides — emitted as CSS variables, no stylesheet edits.
  # `primary` derives the whole --pico-primary-* family for the light theme;
  # `primaryDark` does the same for dark (defaults to `primary`).
  [params.style]
    #primary = "#016630"
    primary = "#4b8666"
    primaryDark = "#4b8666"

  # Raw CSS variable overrides (names without "--"), applied to both themes.
  # Nest [params.cssvars.light] / [params.cssvars.dark] to scope to one theme.
  [params.cssvars]
    pico-border-radius = "0.2em"
  #   pico-font-family = "Inter, system-ui, sans-serif"
  #   hd-hint-info = "#8855cc"   # hint accents: hd-hint-{info,note,warning,danger,success,tip}
  #   [params.cssvars.dark]
  #     pico-code-background-color = "#0d1117"



[menu]
  [[menu.primary]]
    name = "Docs"
    pageRef = "/docs"
    identifier = "docs"
    weight = 10
  [[menu.primary]]
    name = "GitHub"
    url = "https://github.com/fernandezvara/backd"
    identifier = "github"
    weight = 20
