# The tutorial stack's edge: serves the Shelf app and proxies backd's API on
# one origin, so the app needs no CORS settings (chapter 12 revisits this).
server {
    listen 80;
    server_name localhost;

    # Slightly above backd's MAX_BODY_BYTES (1 MiB), so backd answers 413 itself.
    client_max_body_size 2m;

    # Files uploaded through backd (chapter 13): the body is the file, up to the
    # field's max_size (25 MiB for assets.file), streamed instead of buffered.
    location ~ ^/v1/[^/]+/[^/]+/[^/]+(/[^/]+)?/_files/ {
        client_max_body_size 26m;
        proxy_request_buffering off;
        proxy_http_version 1.1;
        proxy_pass http://backd:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # backd's HTTP API.
    location = /healthz { proxy_pass http://backd:8080; }
    location = /readyz  { proxy_pass http://backd:8080; }
    location /v1/ {
        proxy_pass http://backd:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The backd-js module the app's importmap points at.
    location /example/client/ {
        alias /srv/client/;
        add_header Cache-Control "no-store";
    }

    # The Shelf app itself.
    location / {
        root /srv/app;
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-store";
    }
}
