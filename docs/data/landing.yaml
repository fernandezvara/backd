# Landing page sections, ordered by weight. Rendered by the hugodoks theme.

sections:

  hero:
    enable: true
    weight: 10
    template: hero

    badge: "v0.8.3 · organizations for B2B apps: teams, team roles with time windows, documents that belong to a company, membership hooks and company email templates"

    title: "backd"
    subtitle: "A **config-driven** REST backend over MongoDB. Declare realms, databases and collections as files on disk, and get a **schema-validated**, **queryable** document API. Add **server-side functions** for the logic clients can't be trusted with: background jobs, cron schedules and webhooks included."

    cta:
      - text: "Get started"
        icon: rocket_launch
        url: "docs/getting-started/"
      - text: "Functions"
        icon: function
        url: "docs/functions/"
        style: secondary
        outline: true
      - text: "GitHub"
        icon: code
        url: "https://github.com/fernandezvara/backd"
        style: contrast
        outline: true

    info: "**Open source**, MIT licensed. Before exposing a realm, go through the [hardening checklist](docs/operations/checklist/)."

  liveExample:
    enable: true
    weight: 15
    template: banner
    only_when_param: exampleurl
    text: "**Live examples are running.** A blog and a shared-expenses app, built with Alpine.js and the JavaScript client, on this same server."
    cta:
      text: "Open the examples"
      icon: rocket_launch

  features:
    enable: true
    weight: 20
    template: features

    title: What you get
    subtitle: One stateless Go service and a MongoDB database. No handlers to write per collection.

    items:
      - title: Configuration as files
        icon: folder_open
        description: "A directory per realm, database and collection. Each collection is a JSON Schema, with optional indexes.json. Invalid config stops startup and names the file."

      - title: Schema-validated writes
        icon: rule
        description: "JSON Schema draft 2020-12 enforced on every write, with field-level errors. The same schema is mirrored as a MongoDB $jsonSchema validator."

      - title: Queries without injection
        icon: search
        description: "Filter with where, sort with order_by, paginate and count. Every field and value is checked against the schema. Client input never reaches MongoDB raw."

      - title: Optimistic concurrency
        icon: sync_lock
        description: "_meta.version, ETag and If-Match. Every write is conditional, so concurrent updates are never silently lost."

      - title: Automatic provisioning
        icon: database
        description: "Collections, validators and indexes are created at startup, or verified for least-privilege deployments. Nothing is ever dropped."

      - title: Users and single sign-on
        icon: group
        description: "Built-in users per realm with argon2id passwords, sessions valid across the realm's databases, API keys for services, invitations and brute-force protection. Sign in with Google, Microsoft or Apple, a second factor, magic links, email verification, password reset and address changes through any email provider you call from a function, consents, and erasure of a user's data on request."

      - title: Access rules
        icon: policy
        description: "The rules of each collection decide who may read, create, update and delete each document. Read rules run inside the database query, so lists and counts only show what callers may see."

      - title: Server-side functions
        icon: function
        description: "JavaScript or TypeScript next to your collections, run in isolated Deno processes: sync calls, background jobs you can follow, cron schedules, webhooks. Rules, secrets, rate limits, idempotency, a network allowlist and full call history are built in. [Start here](docs/functions/)."

      - title: Typed from your config
        icon: code
        description: "`backd types` turns the config into TypeScript for your app and your functions, and `backd openapi` into an OpenAPI 3.1 document per realm for client generators. In development the config reloads as you save it. [Typing and OpenAPI](docs/clients/types/)."

      - title: Files, push and app configuration
        icon: attach_file
        description: "Files in your own S3-compatible storage with image versions and quotas, push notifications to FCM, APNs and browsers, and a configuration your apps read, with history and rollback, and conditional GET so they ask only when it changed."

      - title: Organizations and team access
        icon: domain
        description: "Groups of users for B2B apps: roles per organization, teams, team roles with time windows and delegation, documents that belong to an organization or a team, membership hooks and company email templates. [Start here](docs/organizations/)."

      - title: Built for operations
        icon: monitor_heart
        description: "JSON logs with request IDs, health and readiness probes, Prometheus metrics with Grafana dashboards, request limits, timeouts and graceful shutdown."
