signup: open
sessions:
  cookie:
    enabled: true
roles:
  admin: {}
  ops:
    admin: true
cors:
  origins: [http://localhost:5173]

# Push notifications, for the push integration test: the capture provider stores each delivery
# in the realm's push_outbox, which GET /_dev/push reads (development only).
push:
  android:
    provider: capture
