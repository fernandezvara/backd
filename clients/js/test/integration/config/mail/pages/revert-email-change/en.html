<!doctype html>
<html lang="{{.Locale}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Undo the email change</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; margin: 0; background: #f6f7f9; color: #1f2328; }
  main { max-width: 26rem; margin: 3rem auto; padding: 1.5rem; background: #fff; border: 1px solid #d0d7de; border-radius: 8px; }
  h1 { font-size: 1.3rem; margin: 0 0 1rem; }
  label { display: grid; gap: .25rem; margin: .75rem 0; font-size: .9rem; }
  input { font: inherit; padding: .5rem .6rem; border: 1px solid #d0d7de; border-radius: 6px; }
  button { font: inherit; padding: .55rem 1rem; border: 1px solid #1f6feb; background: #1f6feb; color: #fff; border-radius: 6px; cursor: pointer; }
  .error { background: #ffebe9; border: 1px solid #ff8182; border-radius: 6px; padding: .5rem .75rem; }
  .muted { color: #656d76; font-size: .9rem; }
</style>
</head>
<body>
<main>
<h1>Undo the email change</h1>
<p>This restores the previous address of your account{{if .Email}}, <strong>{{.Email}}</strong>{{end}}, and asks you to choose a new password.</p>
{{if .Error}}<p class="error" role="alert">{{.Error}}</p>{{end}}
<form method="post" action="{{.Action}}">
<input type="hidden" name="token" value="{{.Token}}">
<button type="submit">Undo the change</button>
</form>
</main>
</body>
</html>
