[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "backd"
version = "0.0.1"
description = "Python client for backd: auth, sessions and data for services, scripts and notebooks."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Antonio Fdez." }]
keywords = ["backd", "client", "sdk", "rest", "mongodb", "auth", "httpx"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27,<1"]

[project.urls]
Homepage = "https://fernandezvara.github.io/backd/docs/build/clients/python/"
Issues = "https://github.com/fernandezvara/backd/issues"
Source = "https://github.com/fernandezvara/backd/tree/main/clients/python"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=1.11", "build", "twine"]

[tool.hatch.build.targets.wheel]
packages = ["src/backd"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "CHANGELOG.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 120
src = ["src", "tests"]
extend-exclude = ["src/backd/_sync"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src", "tests", "scripts"]
