# A minimal realm that exists only so this deployment's own test
# (deploy/production/test.sh) can prove the F4 egress and network-placement
# design from a real function call, in this stack's own topology — not a
# usable app. `auth` defaults to enabled; `signup` defaults to closed, so
# the only way in is the admin bootstrapped by the test.
#
# Review or remove this realm before adapting this reference for your own
# config, the same as you would the blog example.
roles:
  admin:
    admin: true

# The realm's files live in this deployment's own object storage (compose.yaml:
# minio, on the `storage` network). Its keys are secrets of the realm: test.sh
# sets them, then runs `backd storage check`.
storage:
  provider: minio
  endpoint: https://minio:9000
  bucket: backd-files
  prefix: prod
  access_key: secret:STORAGE_ACCESS_KEY
  secret_key: secret:STORAGE_SECRET_KEY
