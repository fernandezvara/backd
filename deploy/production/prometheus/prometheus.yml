# Scrapes every backd process's private metrics port (docs: Operations ->
# Metrics). The token is the one the processes ask for (METRICS_TOKEN).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: backd
    authorization:
      credentials_file: /etc/prometheus/metrics-token
    static_configs:
      - targets: ["backd:9090"]
        labels: { role: api }
      - targets: ["worker:9090"]
        labels: { role: worker }
      - targets: ["executor:9090"]
        labels: { role: executor }
      - targets: ["egress:9090"]
        labels: { role: egress }
