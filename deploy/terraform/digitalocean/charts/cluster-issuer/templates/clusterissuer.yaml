apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Values.name }}
spec:
  acme:
    email: {{ required "email is required" .Values.email | quote }}
    server: {{ .Values.server | quote }}
    privateKeySecretRef:
      name: {{ .Values.name }}-account-key
    solvers:
      - dns01:
          digitalocean:
            tokenSecretRef:
              name: {{ .Values.tokenSecret.name }}
              key: {{ .Values.tokenSecret.key }}
