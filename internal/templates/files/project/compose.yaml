# Local development stack: MongoDB, backd (dev mode), the functions
# executor and egress (the executor's only way out), and MinIO. Nothing
# is built: every service runs a released image. `docker compose up` is
# all it takes — once the three secrets below live in a `.env` file next
# to this one (compose reads it automatically, so they persist across
# sessions; `.env` is gitignored):
#
#   cat > .env <<EOF
#   EXECUTOR_TOKEN=$(openssl rand -base64 32)
#   CALLBACK_KEY=$(openssl rand -base64 32)
#   EGRESS_KEY=$(openssl rand -base64 32)
#   EOF
#
# The three are required: `${NAME:?...}` stops compose before anything
# starts, naming the missing variable and how to generate it.
#
# backd runs BACKD_DEV=true: it follows config/ live — a saved change is
# served in a moment, functions are bundled again and `backd.d.ts` types
# are written back for your editor. Don't compile or rebuild anything.
#
# All backd services use the backd-executor image, not the deployment
# one: it carries Deno, which dev mode needs to bundle functions on
# change. BACKD_VERSION (default `latest`) pins them all at once.
#
# WARNING: dev mode, fixed dev-only defaults and the published ports are
# for localhost only. Read the docs' hardening checklist before any of
# this leaves your machine.

x-backd-image: &backd-image ghcr.io/fernandezvara/backd-executor:${BACKD_VERSION:-latest}
# Files backd writes into ./config (bundles, types) should belong to you.
# Root in the container is your own user under rootless podman; on
# Docker (rootful) set DEV_UID/DEV_GID to your ids in .env instead, so
# generated files aren't root-owned.
x-dev-user: &dev-user "${DEV_UID:-0}:${DEV_GID:-0}"

x-backd-env: &backd-env
  CONFIG_DIR: /config
  MONGO_URI: mongodb://mongo:27017/?replicaSet=rs0
  LOG_LEVEL: ${LOG_LEVEL:-info}
  HTTP_ADDR: ":8080"
  # Dev mode: follow CONFIG_DIR, bundle functions again, write types, allow
  # http storage endpoints (MinIO). _ANY_ADDR because :8080 binds every
  # interface in the container; only 127.0.0.1 is published on the host.
  BACKD_DEV: "true"
  BACKD_DEV_ANY_ADDR: "true"
  BACKD_URL: http://localhost:8080
  BACKD_ADMIN_UI: "true"
  # The worker and the API call the executor with this token, and functions
  # call back to the API's internal listener with this key.
  BACKD_EXECUTOR_URL: http://executor:9100
  BACKD_EXECUTOR_TOKEN: ${EXECUTOR_TOKEN:?EXECUTOR_TOKEN required - see README.md (Develop locally)}
  BACKD_CALLBACK_URL: http://backd:8081
  BACKD_CALLBACK_KEY: ${CALLBACK_KEY:?CALLBACK_KEY required - see README.md (Develop locally)}
  EXECUTOR_PROXY: http://egress:3128
  BACKD_EGRESS_KEY: ${EGRESS_KEY:?EGRESS_KEY required - see README.md (Develop locally)}
  # Extra links on the dev landing page at http://127.0.0.1:8080/
  # ("Label=URL;Label=URL") — local tools next to the API.
  BACKD_DEV_LINKS: "MinIO console=http://127.0.0.1:9001"
  # Encrypts the realms' secrets (TOTP for the admin role the sample realm
  # requires). Dev-only default: set your own for anything that matters.
  BACKD_SECRETS_KEY: ${BACKD_SECRETS_KEY:-local-dev-secrets-key-not-a-secret-0123456789abc}
  # Deno (bundling) and its cache run as your user, which has no home in the image.
  HOME: /tmp
  DENO_DIR: /tmp/deno

services:
  # A single-node replica set (backd refuses standalone servers); the
  # health check initiates it on first start and passes once it is the
  # primary.
  mongo:
    image: docker.io/library/mongo:8.2
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports: ["127.0.0.1:27017:27017"]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status() } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongo:27017'}]}) } if (!db.hello().isWritablePrimary) quit(1)"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [data]

  # S3-compatible storage for realms' files (provider: minio in
  # realm.yaml). Dev-only defaults; override both MINIO_ROOT_* values to
  # use your own. backd reaches it at http://minio:9000, your browser at
  # http://localhost:9000 (console: http://localhost:9001 — create the
  # bucket there when a realm configures storage:).
  minio:
    image: cgr.dev/chainguard/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-backd-dev}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-dev-p4ssw0rd!}
      # Browsers PUT to presigned URLs from your app's origin: any local
      # dev server is allowed here. This is a dev setting.
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    networks: [data]

  # One-shot: bundles every functions project before backd starts (backd
  # refuses stale or missing bundles). In dev mode backd bundles again
  # whenever a function changes, so you only notice this one at `up`.
  functions-build:
    image: *backd-image
    pull_policy: missing
    entrypoint: ["/usr/local/bin/backd"]
    command: ["functions", "build"]
    user: *dev-user
    environment:
      CONFIG_DIR: /config
      HOME: /tmp
      DENO_DIR: /tmp/deno
    volumes:
      - ./config:/config
    # Function dependencies may be fetched from the network on build.
    networks: [uplink]

  # The API, the admin API and UI, the internal listener for functions —
  # and the worker role too (--with-worker): async jobs and scheduled
  # functions run while it does.
  backd:
    image: *backd-image
    pull_policy: missing
    entrypoint: ["/usr/local/bin/backd"]
    command: ["serve", "--with-worker"]
    user: *dev-user
    environment:
      <<: *backd-env
      BACKD_INTERNAL_ADDR: ":8081"
    volumes:
      - ./config:/config
    ports: ["127.0.0.1:8080:8080"]
    networks: [data, isolated]
    depends_on:
      mongo: { condition: service_healthy }
      functions-build: { condition: service_completed_successfully }
    stop_grace_period: 20s

  # One Deno process per function call. No route to MongoDB or the
  # internet: only `isolated`, where its only peers are backd's internal
  # listener and egress.
  executor:
    image: *backd-image
    pull_policy: missing
    environment:
      BACKD_EXECUTOR_TOKEN: ${EXECUTOR_TOKEN:?EXECUTOR_TOKEN required - see README.md (Develop locally)}
      EXECUTOR_PROXY: http://egress:3128
      BACKD_EGRESS_KEY: ${EGRESS_KEY:?EGRESS_KEY required - see README.md (Develop locally)}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    networks: [isolated]
    depends_on:
      - backd

  # The executor network's only way out: on `isolated` (backd and the
  # executor) and `uplink` (the internet).
  egress:
    image: *backd-image
    pull_policy: missing
    entrypoint: ["/usr/local/bin/backd"]
    command: ["egress"]
    environment:
      BACKD_EGRESS_KEY: ${EGRESS_KEY:?EGRESS_KEY required - see README.md (Develop locally)}
      EGRESS_ALLOW_PRIVATE: "backd:8081"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    networks: [isolated, uplink]
    depends_on:
      - backd

volumes:
  mongo-data:
  minio-data:

networks:
  data: {}
  isolated:
    internal: true
  uplink: {}
