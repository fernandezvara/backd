# realm.yaml: settings for this realm. backd refuses to start without it.
# Every key except `auth` and the admin role is commented out and shows
# its default value.
# Uncomment and change what you need.

# Authentication: enabled or disabled.
# With `disabled` the realm has no users and no access rules: anyone who can
# reach backd can read and modify all of its data. Never expose such a realm
# to the internet. The keys below only apply when auth is enabled.
auth: enabled

# Who can create accounts:
#   open    anyone can sign up
#   invite  sign-up needs an invitation from an administrator
#   closed  administrators create the users
# signup: closed

# Sessions expire after `idle_timeout` without use, and never live longer
# than `max_lifetime`. Use days ("30d") or Go durations ("12h").
# sessions:
#   idle_timeout: 30d
#   max_lifetime: 90d

# Minimum password length, between 8 and 128.
# password:
#   min_length: 12

# How failed logins are slowed down, per account and per client address:
# past a threshold each new attempt waits twice as long as the last, up to
# max_delay (never more than window). Values shown are the defaults. There
# is no lockout, and it can be tuned but not turned off.
# login_throttle:
#   account_threshold: 5
#   ip_threshold: 50
#   window: 15m
#   max_delay: 15m

# How long the audit trail keeps its records (at least 1d). They hold user
# ids and client addresses: personal data in many jurisdictions.
# audit:
#   retention: 365d

# Browser origins allowed to call this realm (CORS). Empty means CORS is off.
# cors:
#   origins:
#     - https://app.example.com

# Caps how many function calls may run at once on this backd instance
# (applies whether or not auth is enabled). This is PER INSTANCE, not a
# limit for the whole deployment: with N instances, up to N × this value
# can run at once. A function's own `concurrency` (function.yaml) caps it
# individually; this caps the realm's functions together. Unset means
# unlimited (bounded only by each function's own limit, and the
# executor's own cap on running processes).
# functions:
#   max_concurrency: 50

# Email. backd never sends mail itself: it renders each message from the
# templates in this realm's `email/` folder (written next to this file; edit
# them freely) and hands it to ONE function of yours, which delivers it
# through any provider (Postmark, SES, Resend, Mailgun, ...). That function
# must be `internal: true` and `mode: async` (see the docs, Functions ->
# Email). Without this section the realm sends no email.
#
# Deliverability (a verified sending domain, SPF/DKIM/DMARC, bounces and
# complaints) is the sender's responsibility, handled with your provider.
# email:
#   function: notifications/deliver        # <database>/<function>
#   from: "Acme <no-reply@acme.example>"
#   reply_to: support@acme.example         # optional
#   public_url: https://api.acme.example   # backd's public address, for links in emails;
#                                          # overrides the BACKD_URL environment variable
#   default_locale: en                     # language of the templates used when a user has none
#   locales: [en]                          # each listed language needs every template (es.txt, ...)
#                                          # and every page in pages/ (es.html, ...)
#   redirect_delay: 3s                     # how long the result page waits before sending the user back to your app
#   allowed_redirects:                     # where links may send users afterwards: origins, or an app's scheme
#     - https://app.acme.example
#     - acme://
#   redirects:                             # where, per flow, when the request didn't say
#     verify_email: https://app.acme.example/verified
#     reset_password: https://app.acme.example/signin
#   links:                                 # optional: your own page instead of backd's (it posts the token as JSON)
#     reset_password: https://app.acme.example/reset?token={token}
#   limits:                                # defaults shown
#     per_recipient: { per_kind_per_hour: 3, per_day: 10 }
#     per_ip: { per_hour: 20 }
#     per_function: { per_hour: 200, per_invocation: 50 }   # custom emails from functions (email: true)
#     recipients_per_message: 10

# Accounts. Each setting here needs the `email:` section above.
# account:
#   require_verified_email: false  # true: no session until the address is verified (sign-up answers 202;
#                                  # a login with the right password answers 403 email_not_verified)
#   welcome_email: false           # true: send the `welcome` email once the address is verified
#   allow_email_change: false      # true: users may change their own address (confirmed by the new one, undone by the old one)
#   purge_unverified_after: 30d    # optional: delete accounts that never verified (never ones with roles)
#   tokens:
#     verify_email: 48h            # how long the verification link works (default shown)
#     reset_password: 1h           # how long a password reset link works (default shown)
#     change_email: 24h            # how long the confirmation of an email change works (default shown)
#     revert_email_change: 7d      # how long the link to undo one works (default shown)

# Roles that access rules can check. `users` lists emails that get the role
# at startup (seed assignments): plain emails, or objects with an `email`.
# Keeping them here lets you rebuild the realm on new infrastructure; roles
# assigned through the admin API live only in the database.
#
# `admin: true` makes a role an admin role: its users' sessions can use the
# admin API, and `backd bootstrap` gives it to the realm's first
# administrator. Keep at least one: without it, nobody can manage the realm.
# A list opens only some areas (users, invitations, apikeys, secrets, audit,
# functions, data): `admin: [users, invitations]`. `admin: read` is a
# read-only level (admin.read_access decides whether it sees users and data).
roles:
  admin:
    description: Manages users, invitations and API keys
    admin: true
    # users:
    #   - ops@example.com
  # editor:
  #   description: Publishes articles
