# Access rules (docs: Authentication -> Access rules). Each key is an operation; its
# value is an expression that must be true to allow it. Operations without a rule are
# denied, and a collection with no `rules:` is reachable with API keys only. `user` is
# the signed-in user (nil for anonymous callers: check `user != nil` first), `document`
# the stored document and `data` the one being written. `write` stands for create,
# update and delete at once. Everything below is commented out.
#
# rules:
#   read: user != nil
#   create: user != nil
#   update: user != nil && document._meta.owner == user.id
#   delete: user != nil && document._meta.owner == user.id
#
# Soft delete (docs: Configuration -> collection.yaml). With it, DELETE marks a
# document deleted instead of removing it: nothing reads it, it can be restored
# (POST /{id}/restore) or purged (DELETE /{id}?purge=true) under the `restore`
# and `purge` rules, and its unique values are free again. `retention` removes
# deleted documents for good after that long (leave it out to keep them).
#
# soft_delete:
#   retention: 30d
#
# What happens to this collection when an administrator erases a user
# (`backd user delete`, docs: Auth -> Erasing users). Everything below is
# commented out: with no `on_owner_delete`, an erase leaves this collection
# alone and its documents keep everything, which is what you want for records
# you must keep (purchases, invoices). Uncomment only what you need.
#
# on_owner_delete:
#   # What happens to the documents the user owns (`_meta.owner` is their id):
#   #   delete     removes them
#   #   anonymize  applies `remove` and `replace` below, and clears the owner
#   # Leave `action` out to keep them and only clean up references (`pull`, `unset`).
#   action: anonymize
#   remove: [phone]                          # anonymize: these fields are removed
#   replace:                                 # anonymize: these fields get a fixed value
#     buyer_name: "Erased customer"
#
#   # References to the user in ANY document of this collection, whoever owns it.
#   # Each field says what it holds: `email` (the user's address, in the
#   # normalized lower-case form backd stores) or `id`.
#   pull:                                    # arrays of strings: the user is removed from them
#     members: email
#   unset:                                   # string fields: cleared where they hold the user
#     paid_by: id
#
# `backd` checks all of this against schema.json when it starts: named fields
# must exist; a required field can't be removed or unset; `replace` values must
# satisfy the schema and can't be in a unique index; `pull` fields must be
# arrays of strings without `minItems`.
#
# Files (docs: Files -> File fields). A collection that lets documents carry files
# declares the fields here, and the realm needs a `storage:` section. Everything below is
# commented out.
#
# files:
#   photo:
#     max_size: 10MiB
#     types: [image/jpeg, image/png]
#     # Metadata of JPEG and PNG pictures is REMOVED when they are stored: a photograph
#     # carries the camera, the time and often the GPS position of where it was taken,
#     # and uploading it would hand that to everyone who can open it. Pixels are not
#     # touched (the image is not re-compressed) and the orientation is kept, so the
#     # picture still shows upright. Set this to keep the file exactly as it was sent,
#     # for photography, evidence or archives:
#     # keep_metadata: true
#     versions:                  # resized copies, made by workers (docs: File fields)
#       thumb: { max_width: 256, max_height: 256, fit: cover }
