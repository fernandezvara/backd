aggregate:
  group_by: [status, paid_at, _meta.created_at]
  metrics: [total, paid_at]
references:
  invoice:
    field: invoice_id
    collection: invoices
  related:
    collection: orders
    many: true
rules:
  read: user != nil
  create: user != nil
files:
  receipt:
    max_size: 2MiB
    types: [application/pdf]
