<!doctype html>
<html lang="{{.Locale}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sign-in didn't complete</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; margin: 0; background: #f6f7f9; color: #1f2328; }
  main { max-width: 26rem; margin: 3rem auto; padding: 1.5rem; background: #fff; border: 1px solid #d0d7de; border-radius: 8px; }
  h1 { font-size: 1.3rem; margin: 0 0 1rem; }
  .muted { color: #656d76; font-size: .9rem; }
</style>
</head>
<body>
<main>
<h1>Sign-in didn't complete</h1>
<p>This sign-in attempt has expired, was already used, or doesn't belong to this site. Go back to the app and start again.</p>
{{if .BackURL}}<p><a href="{{.BackURL}}">Back to the app</a></p>{{end}}
<p class="muted">Nothing was changed on your account.</p>
</main>
</body>
</html>
