openapi: 3.1.0
info:
  title: backd HTTP API
  version: 0.9.2
  summary: Config-driven, schema-validated REST API over MongoDB.
  description: |
    The contract of backd's HTTP API. Collections and their document fields
    are defined per deployment (CONFIG_DIR), so documents appear here as
    open objects; their system fields (`id`, `_meta`) are described exactly.

    Every error response uses the `Error` envelope. `default` responses list
    errors that can happen on any operation (for example `413`, `415`, `500`,
    `503`, or `404` for an unknown realm).

    Any `/v1/{realm}/…` request may carry `X-Backd-Types`, the fingerprint
    of the types a development build was generated from (`realm.json`, made
    by `backd types`). When it isn't the fingerprint of the types the running
    config generates, the answer carries `X-Backd-Types-Stale: true` (and
    nothing else changes); production builds send no header.
  license:
    name: MIT
    identifier: MIT

servers:
  - url: "{baseUrl}"
    description: Your backd deployment.
    variables:
      baseUrl:
        default: https://localhost:8443

tags:
  - name: health
    description: Liveness and readiness probes, outside the /v1 prefix.
  - name: auth
    description: "Sign-up, login and sessions of a realm with `auth: enabled`."
  - name: admin
    description: >-
      User, role and invitation management with an API key, or the session of a
      user whose admin role opens the area (users, invitations, apikeys,
      secrets, audit, functions, data, config). A request for an area the roles don't open
      answers 403 naming it. The admin data route (`/_admin/data/…`) serves the
      data operations past the collections' rules to the `data` area. A read-only level (`admin: read`) reads every area,
      users and data only when `admin.read_access` grants them, and every change
      answers 403.
  - name: organizations
    description: "Organizations of a realm: groups of users with roles the realm declares, which documents can belong to."
  - name: documents
    description: CRUD and queries on any configured collection.
  - name: functions
    description: Calls to a database's server-side functions (preview).

security: []

paths:
  /healthz:
    get:
      tags: [health]
      summary: Liveness probe
      operationId: healthz
      responses:
        "200":
          description: The process is running.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }

  /readyz:
    get:
      tags: [health]
      summary: Readiness probe
      operationId: readyz
      responses:
        "200":
          description: MongoDB is reachable. Includes the fingerprint of the config this instance runs.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
        "503":
          $ref: "#/components/responses/Error"

  # ── /_auth ────────────────────────────────────────────────────────────
  /v1/{realm}/_auth/signup:
    parameters: [{ $ref: "#/components/parameters/realm" }]
    post:
      tags: [auth]
      summary: Create an account and sign in
      description: |
        Realms with `signup: open` accept anyone; `signup: invite` needs a
        valid `invitation`; `signup: closed` refuses.

        The new user's `locale` is the best language the realm lists for
        what was asked: the request's `locale`, else `Accept-Language` (by
        quality), matched exactly (`es-MX`), then by language (`es`), else the
        realm's `default_locale`. It never fails: an unlisted language is
        replaced by the default.

        In a realm with `email`, sign-up also asks for the `verify-email`
        message. With `account.require_verified_email: true` there is no
        session until the address is verified: the answer is `202` and the
        user signs in after following the link. In that mode an already
        registered address gets the same `202` (and the owner an
        `account-exists` email), so the answer doesn't reveal who is
        registered; the password is hashed either way, so the time taken
        doesn't either. Where a session is issued at sign-up, a registered
        address answers `409 email_taken`: such a realm can't hide who is
        registered.
      operationId: signup
      parameters:
        - name: Accept-Language
          in: header
          description: The browser's languages, used when the body has no `locale`.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8, maxLength: 128 }
                invitation: { type: string, description: "Invitation token (`bdi_…`), for `signup: invite`." }
                locale: { type: string, description: "The language to use for the user, such as `es` or `es-MX`; mapped silently to one the realm lists." }
                redirect_to: { type: string, description: "Where the page after the verification link may send the user: an absolute URL within the realm's `email.allowed_redirects` (`400 invalid_redirect` otherwise)." }
                cookie: { type: boolean, description: "Keep the session in an HttpOnly cookie, as for login." }
                org: { type: string, description: "The organization the person comes from, an organization id. It is used only when the address belongs to one of its members (or has an invitation by email to it): the emails of the flow, and the pages of their links, then carry its context (`email.data_hook`, `pages.data_hook`). Anything else is ignored, with the same answer and work." }
                consents: { $ref: "#/components/schemas/ConsentsGiven" }
      responses:
        "201": { $ref: "#/components/responses/SessionCreated" }
        "200":
          description: >-
            The account was created, but its roles require a second factor: `mfa_enrollment_required`
            with the challenge to set it up (see `POST /_auth/login`).
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MFAEnrollmentChallenge" }
        "202":
          description: >-
            The account exists but has no session: the realm requires the
            address to be verified first (`account.require_verified_email`).
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [verification_required] }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_auth/login:
    parameters: [{ $ref: "#/components/parameters/realm" }]
    post:
      tags: [auth]
      summary: Sign in with email and password
      description: |
        The first factor. A user without a second factor gets the session. A user who has one
        (TOTP) gets `{mfa_required, challenge, methods}` instead, and trades the challenge and a
        code for the session at `POST /_auth/mfa/verify`; a user in a role the realm requires to
        use MFA who has none yet gets `{mfa_enrollment_required, challenge}`. A challenge is not
        a session, and it is only given after the password was checked.

        A correct password that was set before the realm's password epoch, or after an
        administrator expired it, gets no session: `401 password_expired`, and a reset email is
        queued (when the realm sends email) as a reset request would, with the same limits: the `password-expired` message, with a link to choose a new password. When that email was queued the error's `details` hold `{path: reset_email, reason: queued}`, so an app can say so. A
        wrong password is still `invalid_credentials`, so the answer says nothing to someone
        who doesn't know the password. A new password (reset, change, administrator) makes the
        account usable again.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
                org: { type: string, description: "The organization the person comes from, an organization id. It is used only when the address belongs to one of its members (or has an invitation by email to it): the emails of the flow, and the pages of their links, then carry its context (`email.data_hook`, `pages.data_hook`). Anything else is ignored, with the same answer and work." }
                cookie:
                  type: boolean
                  description: >-
                    Keep the session in an HttpOnly cookie (`__Secure-backd_session`, path `/v1/{realm}`) instead of
                    returning the token. Only in realms with `sessions.cookie.enabled`, and only from this API's own
                    origin or one of the realm's `cors.origins` (`403` otherwise). The response then has no `token`.
      responses:
        "200": { $ref: "#/components/responses/SignInResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403":
          description: >-
            `email_not_verified`: the password is right, but the realm
            requires a verified address (`account.require_verified_email`).
            Only answered after the password was checked.
          headers: { X-Request-ID: { $ref: "#/components/headers/RequestID" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_auth/verify-email:
    parameters: [{ $ref: "#/components/parameters/realm" }]
    get:
      tags: [auth]
      summary: The page the verification link opens
      description: |
        The link in the `verify-email` message. Shows a page with a button;
        it never uses the token up, so mail scanners that open links can't
        spoil it. The page is the realm's `pages/verify-email/<locale>.html`,
        in the language of `Accept-Language`, and is sent with
        `Cache-Control: no-store`, `Referrer-Policy: no-referrer`, a strict
        `Content-Security-Policy` and `frame-ancestors 'none'`. A token that
        is expired, used or unknown shows the same error page (`400`).
      operationId: verifyEmailPage
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
        - name: Accept-Language
          in: header
          schema: { type: string }
      responses:
        "200": { $ref: "#/components/responses/HostedPage" }
        "400": { $ref: "#/components/responses/HostedPage" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [auth]
      summary: Verify an email address
      description: |
        Uses the token: the address becomes verified (and the `welcome`
        message is sent when `account.welcome_email` is on). No session is
        issued. The hosted page posts its form here
        (`application/x-www-form-urlencoded`, answered with a page); an app
        with its own pages posts JSON. A token that is expired, used,
        unknown or for another purpose is `400 invalid_token`.
      operationId: verifyEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token: { type: string }
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200": { $ref: "#/components/responses/HostedPage" }
        "204": { description: The address is verified. }
        "400":
          description: Invalid, expired or used token (`invalid_token`), or an invalid body.
          headers: { X-Request-ID: { $ref: "#/components/headers/RequestID" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
            text/html:
              schema: { type: string }
        "404": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_auth/verify-email/resend:
    parameters: [{ $ref: "#/components/parameters/realm" }]
    post:
      tags: [auth]
      summary: Ask for the verification email again
      description: |
        Answers `202` whether or not the address belongs to an account, or is
        already verified, so it can't be used to find out who is registered.
        The email limits apply (and are counted the same in every case);
        reaching one doesn't change the answer. `404` in a realm without
        `email`.
      operationId: resendVerification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email: { type: string }
                redirect_to: { type: string, description: "Within the realm's `email.allowed_redirects`." }
      responses:
        "202":
          description: Accepted.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [accepted] }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_auth/reset-password/request:
    parameters: [{ $ref: "#/components/parameters/realm" }]
    post:
      tags: [auth]
      summary: Ask for a password reset email
      description: |
        Answers `202` whether or not the address belongs to an account (a
        disabled account gets no message either), so it can't be used to find
        out who is registered. Requests are counted per address and per client
        address, for every address alike: past the limit the answer is `429`
        with `Retry-After`. The email limits apply on top and are silent.
        `404` in a realm without `email`.
      operationId: requestPasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email: { type: string }
                redirect_to: { type: string, description: "Where the page after the reset may send the user: within the realm's `email.allowed_redirects`." }
                org: { type: string, description: "The organization the person comes from, an organization id. It is used only when the address belongs to one of its members (or has an invitation by email to it): the emails of the flow, and the pages of their links, then carry its context (`email.data_hook`, `pages.data_hook`). Anything else is ignored, with the same answer and work." }
      responses:
        "202":
          description: Accepted.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [accepted] }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_auth/reset-password:
    parameters: [{ $ref: "#/components/parameters/realm" }]
    get:
      tags: [auth]
      summary: The form the reset link opens
      description: |
        The link in the `reset-password` message: a form for the new password
        (twice). Opening it never uses the token up. The page is the realm's
        `pages/reset-password/<locale>.html`; an expired, used or unknown
        token shows the same error page (`400`).
      operationId: resetPasswordPage
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
        - name: Accept-Language
          in: header
          schema: { type: string }
      responses:
        "200": { $ref: "#/components/responses/HostedPage" }
        "400": { $ref: "#/components/responses/HostedPage" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [auth]
      summary: Set a new password with a reset token
      description: |
        Applies the realm's password policy first: a refused password leaves the
        token usable (`400 validation_error`, or the form again with the
        reason). On success the password is set, **every session of the user
        ends**, the address is marked verified (the token proves the person
        reads that mailbox) and `password-changed` is sent. No session is
        issued. The hosted form posts here
        (`application/x-www-form-urlencoded`, answered with a page); an app with
        its own pages posts JSON. A token that is expired, used, unknown or for
        another purpose is `400 invalid_token`.
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string }
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [token, password, password_confirm]
              properties:
                token: { type: string }
                password: { type: string }
                password_confirm: { type: string }
      responses:
        "200": { $ref: "#/components/responses/HostedPage" }
        "204": { description: The password is set and the user's sessions have ended. }
        "400":
          description: Invalid, expired or used token (`invalid_token`), a password the policy refuses, or an invalid body.
          headers: { X-Request-ID: { $ref: "#/components/headers/RequestID" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
            text/html:
              schema: { type: string }
        "404": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_auth/email:
    parameters: [{ $ref: "#/components/parameters/realm" }]
    post:
      tags: [auth]
      summary: Ask to change the email address
      description: |
        Needs the session and a fresh [re-authentication](#tag/auth) (`X-Backd-Reauth`). The change applies only
        when the new address confirms it with the link sent there; the answer is
        `202` whether or not the address is free, so it can't be used to find
        out who is registered. Only in a realm with `account.allow_email_change`
        (`404` otherwise: the route doesn't exist). `429` when an email limit is
        reached.
      operationId: requestEmailChange
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/reauth" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [new_email]
              properties:
                new_email: { type: string }
                redirect_to: { type: string, description: "Within the realm's `email.allowed_redirects`." }
      responses:
        "202":
          description: Accepted.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [accepted] }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_auth/confirm-email-change:
    parameters: [{ $ref: "#/components/parameters/realm" }]
    get:
      tags: [auth]
      summary: The page the email change confirmation link opens
      description: |
        The link sent to the **new** address. Shows a button naming it; opening the link never uses the token up.
        Only in a realm with `account.allow_email_change` (`404` otherwise).
      operationId: confirmEmailChangePage
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
        - name: Accept-Language
          in: header
          schema: { type: string }
      responses:
        "200": { $ref: "#/components/responses/HostedPage" }
        "400": { $ref: "#/components/responses/HostedPage" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [auth]
      summary: Confirm the new email address
      description: |
        Uses the token: the address changes and counts as verified, **every session of the user ends**, and the old address is sent `email-changed` with a link to undo it for 7 days. No session is issued. The address having been registered meanwhile, or a later request having replaced this one, is `400 invalid_token`.
      operationId: confirmEmailChange
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token: { type: string }
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200": { $ref: "#/components/responses/HostedPage" }
        "204": { description: The address changed. }
        "400":
          description: Invalid, expired or used token (`invalid_token`), or an invalid body.
          headers: { X-Request-ID: { $ref: "#/components/headers/RequestID" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
            text/html:
              schema: { type: string }
        "404": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_auth/revert-email-change:
    parameters: [{ $ref: "#/components/parameters/realm" }]
    get:
      tags: [auth]
      summary: The page the undo link opens
      description: |
        The link sent to the **old** address after a change. Shows a button; opening it never uses the token up.
      operationId: revertEmailChangePage
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
        - name: Accept-Language
          in: header
          schema: { type: string }
      responses:
        "200": { $ref: "#/components/responses/HostedPage" }
        "400": { $ref: "#/components/responses/HostedPage" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [auth]
      summary: Undo an email change
      description: |
        Uses the token: restores the previous address, ends every session, makes the current password unusable (whoever changed the address may know it) and sends a `reset-password` email to the restored address. No session is issued.
      operationId: revertEmailChange
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token: { type: string }
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200": { $ref: "#/components/responses/HostedPage" }
        "204": { description: The previous address is back. }
        "400":
          description: Invalid, expired or used token (`invalid_token`), or an invalid body.
          headers: { X-Request-ID: { $ref: "#/components/headers/RequestID" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
            text/html:
              schema: { type: string }
        "404": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_auth/accept-invitation:
    parameters: [{ $ref: "#/components/parameters/realm" }]
    get:
      tags: [auth]
      summary: The page the invitation link opens
      description: |
        The link in an `invitation` email: a form to choose a password, showing the invited address. Opening it never uses the token up.
      operationId: acceptInvitationPage
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
        - name: Accept-Language
          in: header
          schema: { type: string }
      responses:
        "200": { $ref: "#/components/responses/HostedPage" }
        "400": { $ref: "#/components/responses/HostedPage" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [auth]
      summary: Accept an invitation
      description: |
        Creates the account for the invited address with the chosen password, **already verified** (only its owner received the link), and uses up the invitation. No session is issued: the user logs in. A revoked or expired invitation, or an address registered meanwhile, is `400 invalid_token`; a password the policy refuses leaves the link usable.
      operationId: acceptInvitation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string }
                locale: { type: string, description: "The user's language, such as `es`; mapped to one the realm lists." }
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [token, password, password_confirm]
              properties:
                token: { type: string }
                password: { type: string }
                password_confirm: { type: string }
      responses:
        "200": { $ref: "#/components/responses/HostedPage" }
        "204": { description: The account exists. }
        "400":
          description: Invalid, expired or used token (`invalid_token`), or an invalid body.
          headers: { X-Request-ID: { $ref: "#/components/headers/RequestID" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
            text/html:
              schema: { type: string }
        "404": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_auth/logout:
    parameters: [{ $ref: "#/components/parameters/realm" }]
    post:
      tags: [auth]
      summary: End the current session
      operationId: logout
      security: [{ session: [] }]
      responses:
        "204": { description: Session ended. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_auth/logout-all:
    parameters: [{ $ref: "#/components/parameters/realm" }]
    post:
      tags: [auth]
      summary: End every session of the user
      operationId: logoutAll
      security: [{ session: [] }]
      responses:
        "204": { description: All sessions ended. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_auth/me:
    parameters: [{ $ref: "#/components/parameters/realm" }]
    get:
      tags: [auth]
      summary: The signed-in user
      description: |
        The user, with their sign-in methods (`identities`): a password and any number of
        external providers. Each says the address the provider reported (the password's is
        the user's own), when it was linked and when it was last used (`null` before the
        first use is recorded). The provider's subject, hashes and tokens are never shown.
      operationId: me
      security: [{ session: [] }]
      responses:
        "200":
          description: The user.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      tags: [auth]
      summary: Change the user's own settings
      description: |
        Today the language: `locale` must be one the realm lists
        (case ignored); any other value answers `400 invalid_locale` with
        the allowed ones in `details`. Unlike at sign-up, an explicit change
        is never mapped silently.
      operationId: updateMe
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                locale: { type: string, description: "One of the realm's `locales` (top level of `realm.yaml`)." }
      responses:
        "200":
          description: The updated user.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [auth]
      summary: Delete the account (deactivates it)
      description: |
        Needs a fresh [re-authentication](#tag/auth) (`X-Backd-Reauth`), and no body. The account is **deactivated**: it is
        disabled and every session ends, and all data is kept (an administrator
        can reactivate it). Deactivating is not erasing: erasing a user's data is an
        administrator's action (`DELETE /_admin/users/{id}`).
      operationId: deleteMe
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/reauth" }]
      responses:
        "204": { description: Account deactivated. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_auth/me/export:
    parameters: [{ $ref: "#/components/parameters/realm" }]
    post:
      tags: [auth]
      summary: Ask for a copy of the user's personal data
      description: |
        Queues the export of everything the realm holds about the signed-in user (design: access and
        portability). Needs a fresh [re-authentication](#tag/auth) (`X-Backd-Reauth`), and the realm
        must set `compliance.export: true` (`404` otherwise). A user may ask once every 24 hours:
        `429` with `Retry-After`; an export that failed does not count.

        The export is built in the background as a **zip** (the [export package](#tag/auth) layout:
        `manifest.json`, `<db>/<collection>.jsonl`, `<db>/_files/`, `_account/*.jsonl` and a
        `README.html` in the user's language). When it is ready the user is emailed a link to the app's
        download page (`compliance.export_page`), never to the file; the package is deleted after
        `compliance.export_retention` (7 days by default). Poll `GET /_auth/me/exports/{id}`, or wait
        for the email.
      operationId: requestExport
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/reauth" }]
      responses:
        "202":
          description: The export was queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataExport" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_auth/me/exports:
    parameters: [{ $ref: "#/components/parameters/realm" }]
    get:
      tags: [auth]
      summary: The user's exports
      description: |
        The exports the user asked for, newest first, with their state and when each expires. Those an
        administrator made on their behalf are not listed: the package went to the administrator.
      operationId: listExports
      security: [{ session: [] }]
      responses:
        "200":
          description: Exports.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/DataExport" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_auth/me/exports/{id}:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [auth]
      summary: One export, for a page that waits for it
      description: While it is queued or running, `step` names what it is doing.
      operationId: getExport
      security: [{ session: [] }]
      responses:
        "200":
          description: The export.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataExport" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_auth/me/exports/{id}/download:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [auth]
      summary: Download a ready export
      description: |
        Redirects (`302`) to a signed link to the package that works for five minutes. A page that
        fetches the API cannot follow a redirect to another origin: with `Accept: application/json` the
        answer is `200` with the link instead. In a realm whose files are proxied (the storage is not
        reachable by its clients) backd sends the zip itself, with `Content-Disposition: attachment`.
        `409` while the export is not ready, `410` once it has expired. Each download is audited.
      operationId: downloadExport
      security: [{ session: [] }]
      responses:
        "200":
          description: The link as JSON (or the zip itself, when files are proxied).
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [url, expires_at]
                properties:
                  url: { type: string }
                  expires_at: { $ref: "#/components/schemas/Timestamp" }
            application/zip:
              schema: { type: string, format: binary }
        "302":
          description: The signed link, in `Location`.
          headers:
            Location: { schema: { type: string } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_auth/password:
    parameters: [{ $ref: "#/components/parameters/realm" }]
    post:
      tags: [auth]
      summary: Change the password
      description: >-
        Needs a fresh [re-authentication](#tag/auth) (`X-Backd-Reauth`). The current session stays valid;
        every other session ends.
      operationId: changePassword
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/reauth" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [new_password]
              properties:
                new_password: { type: string, minLength: 8, maxLength: 128 }
      responses:
        "204": { description: Password changed. }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        default: { $ref: "#/components/responses/Error" }

    delete:
      tags: [auth]
      summary: Remove the password
      description: |
        The user stops having a password and signs in with a link or a provider only. Needs a fresh
        [re-authentication](#tag/auth) (`X-Backd-Reauth`). Refused with `409 last_sign_in_method`
        when nothing else would be left: a way in is a provider, or a verified address in a realm
        with [magic links](#tag/auth). Every other session of the user ends, and they are told by
        email. `404` when the account has no password; set one again with `POST /_auth/password`
        or a password reset.
      operationId: removePassword
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/reauth" }]
      responses:
        "204": { description: Password removed. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_auth/sessions:
    parameters: [{ $ref: "#/components/parameters/realm" }]
    get:
      tags: [auth]
      summary: The user's active sessions
      operationId: listSessions
      security: [{ session: [] }]
      responses:
        "200":
          description: Sessions, newest first.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/SessionInfo" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_auth/sessions/{id}:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/id" }
    delete:
      tags: [auth]
      summary: End one of the user's sessions
      operationId: revokeSession
      security: [{ session: [] }]
      responses:
        "204": { description: Session ended. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_dev/push:
    parameters: [{ $ref: "#/components/parameters/realm" }]
    get:
      tags: [auth]
      summary: What the capture push provider took (development only)
      description: |
        The deliveries the `capture` provider stored instead of sending, newest first, with the
        message and the outcome each device was given. **No authentication**, like the email
        outbox: it exists only in a realm with a capture provider, which startup refuses outside
        `BACKD_DEV=true`; anywhere else it answers `404`. The Mailbox's Push tab reads it.
      operationId: devPushOutbox
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        "200":
          description: The captured deliveries.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, realm]
                properties:
                  realm: { type: string }
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [id, send_id, user_id, device_id, platform, status, attempt, created_at, message]
                      properties:
                        id: { type: string }
                        send_id: { type: string }
                        user_id: { type: string }
                        device_id: { type: string }
                        platform: { type: string, enum: [android, ios, web] }
                        status: { type: string, enum: [sent, invalid, retry, failed] }
                        attempt: { type: integer }
                        created_at: { $ref: "#/components/schemas/Timestamp" }
                        message:
                          type: object
                          additionalProperties: false
                          properties:
                            kind: { type: string }
                            title: { type: string }
                            body: { type: string }
                            link: { type: string }
                            data: { type: [object, "null"], additionalProperties: { type: string } }
                            badge: { type: [integer, "null"] }
                            sound: { type: string }
                            group: { type: string }
                            priority: { type: string }
                            silent: { type: boolean }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_auth/devices:
    parameters: [{ $ref: "#/components/parameters/realm" }]
    post:
      tags: [auth]
      summary: Register a device for push notifications
      description: |
        Registers the device the app runs on, or refreshes it: apps call this at **each launch** and
        after signing in. `token` is what the platform's push service gave the app (the FCM
        registration token, the APNs device token) or, for `web`, the browser's push subscription as
        JSON (`endpoint` and `keys`). A token belongs to one user: registering one that exists moves it
        to the caller, so a second-hand phone never receives the previous user's pushes. The device is
        removed with the session that registered it, after `push.devices.stale_after` unseen, and when
        the user has more than `push.devices.max_per_user` (the least recently seen goes). At most 30
        registrations an hour per session. Needs a session: an API key can't register devices. The
        answer never contains the token.
      operationId: registerDevice
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [platform, token]
              properties:
                platform: { type: string, enum: [android, ios, web] }
                token: { type: string, maxLength: 4096 }
                name: { type: string, maxLength: 100, description: "A label to show the user, such as Ana's Pixel." }
      responses:
        "200":
          description: The device.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Device" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    get:
      tags: [auth]
      summary: The user's registered devices
      operationId: listDevices
      security: [{ session: [] }]
      responses:
        "200":
          description: Devices, most recently seen first. Never a token.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Device" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_auth/devices/web-key:
    parameters: [{ $ref: "#/components/parameters/realm" }]
    get:
      tags: [auth]
      summary: The public key browsers subscribe with
      description: The VAPID public key for `pushManager.subscribe`. Public and cacheable; `404` when the realm has no web platform.
      operationId: getWebPushKey
      responses:
        "200":
          description: The key.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [public_key]
                properties:
                  public_key: { type: string }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_auth/devices/{id}:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/id" }
    delete:
      tags: [auth]
      summary: Remove one of the user's devices
      description: Someone else's device is a `404`.
      operationId: removeDevice
      security: [{ session: [] }]
      responses:
        "204": { description: Device removed. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_orgs:
    parameters: [{ $ref: "#/components/parameters/realm" }]
    post:
      tags: [organizations]
      summary: Create an organization
      description: |
        Creates an organization with the caller as a member holding the realm's `creator_roles`.
        Allowed when the realm's `organizations.create` rule says so (by default: a verified
        address) and below `max_created_per_user` (`409 org_limit_reached`). `slug` is optional and
        unique among organizations that aren't deleted (`409 slug_taken`). Needs a session: an API
        key can't create organizations. Realm administrators create them for any user with the
        admin API.

        The caller's own session stays as it is. The answer also holds `session`, a **new session
        scoped to the new organization** (`token`, `expires_at`, `org`): the app keeps it beside the
        other, one token per organization (see `POST /_auth/orgs/{org}/login`).
      operationId: createOrganization
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                slug: { type: string, maxLength: 63, pattern: "^[a-z0-9]+(-[a-z0-9]+)*$" }
      responses:
        "201":
          description: The organization, as its creator sees it, with a session scoped to it (`session`).
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    get:
      tags: [organizations]
      summary: The caller's organizations
      description: With the caller's effective roles and teams in each. Deleted organizations aren't listed.
      operationId: listOrganizations
      security: [{ session: [] }]
      responses:
        "200":
          description: The organizations.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Organization" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_orgs/{org}:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/org" }
    get:
      tags: [organizations]
      summary: One organization
      description: |
        Name, slug, status and claims (read-only: realm administrators and functions write them).
        A non-member and an unknown organization answer the same `403 not_org_member`, so the
        answer never says whether an organization exists.
      operationId: getOrganization
      security: [{ session: [] }]
      responses:
        "200":
          description: The organization.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      tags: [organizations]
      summary: Rename an organization, change its slug or its second-factor requirement
      description: |
        Needs a role with `manage: org`. `require_mfa: true` makes members' sessions count only when
        they used a second factor: it needs a fresh proof of identity (`401 reauth_required`),
        `organizations.allow_require_mfa` (`409 require_mfa_not_allowed`) and a session of the
        caller that has a second factor itself (`403 org_requires_mfa`). Audited as `org.require_mfa`.
      operationId: updateOrganization
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                slug: { type: string, maxLength: 63, description: "An empty string removes the slug." }
                require_mfa: { type: boolean }
      responses:
        "200":
          description: The organization.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

    delete:
      tags: [organizations]
      summary: Delete an organization
      description: |
        Needs `manage: org` and a fresh proof of identity (`401 reauth_required`, then
        `POST /_auth/reauth` and send its token in `X-Backd-Reauth`). Access ends **at once**: the
        status becomes `deleted` (the record stays, with its name and dates) and memberships, teams
        and invitations are removed. A job then applies each collection's `on_org_delete`: `delete`
        removes the documents (soft-deleted ones too) and queues their files for deletion; `keep`
        leaves them, readable only by realm administrators. The slug is released.
      operationId: deleteOrganization
      security: [{ session: [] }]
      responses:
        "204":
          description: The organization was deleted.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_orgs/{org}/members:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/org" }
    get:
      tags: [organizations]
      summary: The members of an organization
      description: |
        A page of members sorted by user id: their direct roles, their teams and their effective
        roles with where each came from (`direct`, `default` or a team). `overlap` lists the roles
        held both directly and through a team or by default. Emails appear according to the
        realm's `members_visible_to`.
      operationId: listOrganizationMembers
      security: [{ session: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
        - { name: after, in: query, description: "The `next` of the previous page.", schema: { type: string } }
      responses:
        "200":
          description: A page of members.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationMembers" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_orgs/{org}/members/{user}:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/org" }
      - { name: user, in: path, required: true, description: "A user id.", schema: { type: string } }
    patch:
      tags: [organizations]
      summary: Change a member's direct roles
      description: |
        Replaces the member's direct roles. With `manage: roles` any role may be given or taken
        away; with `manage: members` only roles that open no capability the caller lacks, and not
        for a member who holds capabilities the caller lacks. The last member who can manage the
        organization can't lose that (`409 last_org_manager`).
      operationId: updateOrganizationMember
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [roles]
              properties:
                roles: { type: array, items: { type: string } }
      responses:
        "200":
          description: The member.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationMember" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [organizations]
      summary: Remove a member
      description: "Needs `manage: members`, and can't remove someone who holds capabilities the caller lacks. The last manager can't be removed (`409 last_org_manager`). Their access ends at once; the documents they created stay."
      operationId: removeOrganizationMember
      security: [{ session: [] }]
      responses:
        "204":
          description: The member was removed.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_orgs/{org}/leave:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/org" }
    post:
      tags: [organizations]
      summary: Leave an organization
      description: The last member who can manage the organization can't leave (`409 last_org_manager`).
      operationId: leaveOrganization
      security: [{ session: [] }]
      responses:
        "204":
          description: The caller left.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_orgs/{org}/sso:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/org" }
    get:
      tags: [organizations]
      summary: The organization's sign-in connections
      description: |
        The providers the organization connected, with what a client needs to finish the setup:
        whether the client secret is stored (never its value) and the redirect address to register
        with each provider. `providers` and `max_connections` are the realm's `organizations.sso`
        limits. Needs `manage: sso`. With `organizations.sso` off in `realm.yaml` the whole surface answers `404`.
      operationId: listOrganizationConnections
      security: [{ session: [] }]
      responses:
        "200":
          description: The connections, sorted by provider.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationConnections" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_orgs/{org}/sso/{provider}:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/org" }
      - { $ref: "#/components/parameters/ssoProvider" }
    get:
      tags: [organizations]
      summary: One sign-in connection
      operationId: getOrganizationConnection
      security: [{ session: [] }]
      responses:
        "200":
          description: The connection.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationConnection" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    put:
      tags: [organizations]
      summary: Set the organization's sign-in connection
      description: |
        Creates the connection or replaces every field of it. The client secret is **write-only**:
        sent here it is stored as an organization secret (sealed with the instance key, readable by
        nobody, not by functions), and left out it keeps the stored one (required the first time).
        Who may come in is the restriction: `hosted_domain` (Google Workspace) or `tenant` (a Microsoft
        tenant id; `common`, `organizations` and `consumers` are refused). `join_roles` follow the
        granting rules: nothing the caller couldn't give themselves.
        Needs `manage: sso` and a fresh re-authentication. Audited as `org.sso.set`, without the secret.
      operationId: setOrganizationConnection
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrganizationConnectionInput" }
      responses:
        "200":
          description: The connection, without its secret.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationConnection" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [organizations]
      summary: Remove the organization's sign-in connection
      description: |
        Removes the connection and its client secret. Needs `manage: sso` and a fresh re-authentication. Audited as `org.sso.deleted`.
      operationId: deleteOrganizationConnection
      security: [{ session: [] }]
      responses:
        "204":
          description: Removed.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_orgs/{org}/invitations:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/org" }
    get:
      tags: [organizations]
      summary: An organization's invitations
      description: Status, binding, uses and expiry, newest first. Never tokens. Needs `manage` of members.
      operationId: listOrganizationInvitations
      security: [{ session: [] }]
      responses:
        "200":
          description: The invitations.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/OrganizationInvitation" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [organizations]
      summary: Invite to an organization
      description: |
        Creates an invitation and answers its `token` and `link` (the realm's
        `organizations.invitation_link` with the token), which are shown only here. `binding` says who may
        accept it: `user` (only that user id), `email` (the signed-in user whose **verified** address
        matches) or `none` (anyone signed in who holds the link, `max_uses` times). `roles` and `teams`
        follow the granting rules: the caller gives only what they could do themselves, and an open link
        can't give a role that manages the organization, directly or through a team. With `send: true`
        an `email` binding is also emailed (the `org-invitation` email), which keeps the token sealed
        with the instance's secrets key until the invitation ends. Needs `manage` of members.
        `409 invitations_limit` at `max_pending_invitations`.
      operationId: createOrganizationInvitation
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrganizationInvitationInput" }
      responses:
        "201":
          description: The invitation, with its token and link.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationInvitationCreated" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_orgs/{org}/invitations/{id}:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/org" }
      - { $ref: "#/components/parameters/id" }
    delete:
      tags: [organizations]
      summary: Revoke an invitation
      operationId: revokeOrganizationInvitation
      security: [{ session: [] }]
      responses:
        "204":
          description: The invitation can't be used any more.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_orgs/{org}/invitations/{id}/link:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/org" }
      - { $ref: "#/components/parameters/id" }
    post:
      tags: [organizations]
      summary: Issue a new link
      description: Replaces the token of a pending invitation and invalidates the old link, since a lost link can't be shown again.
      operationId: renewOrganizationInvitationLink
      security: [{ session: [] }]
      responses:
        "200":
          description: The invitation with its new token and link.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationInvitationCreated" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_orgs/{org}/invitations/{id}/send:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/org" }
      - { $ref: "#/components/parameters/id" }
    post:
      tags: [organizations]
      summary: Send the invitation's email again
      description: Only for a pending invitation bound to an email address. Uses the realm's email limits (`429`).
      operationId: resendOrganizationInvitation
      security: [{ session: [] }]
      responses:
        "202":
          description: The email was queued.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_orgs/invitations/preview:
    parameters: [{ $ref: "#/components/parameters/realm" }]
    post:
      tags: [organizations]
      summary: See what an invitation offers
      description: |
        Says which organization, roles and teams a token offers, so an app can ask "Join Acme as
        editor?". Needs a session, so anonymous callers can't probe tokens. Unknown, expired, revoked
        and used-up tokens answer the same `400 invalid_invitation`; a token bound to someone else
        answers `403 invitation_not_for_you`, only after it has proved valid.
      operationId: previewOrganizationInvitation
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200":
          description: What accepting would do.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationInvitationPreview" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_orgs/invitations/accept:
    parameters: [{ $ref: "#/components/parameters/realm" }]
    post:
      tags: [organizations]
      summary: Accept an invitation
      description: |
        Makes the caller a member of the organization, or gives an existing member the invitation's
        roles and teams. Needs a session. The same errors as the preview; `409 org_limit_reached`
        when the caller belongs to the most organizations a user may. An organization that
        requires a second factor counts the membership only for sessions that used one.
      operationId: acceptOrganizationInvitation
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200":
          description: The organization, as the new member sees it.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_orgs/{org}/teams:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/org" }
    get:
      tags: [organizations]
      summary: An organization's teams
      description: Groups of members that carry organization roles, sorted by name. Any member may list them.
      operationId: listOrganizationTeams
      security: [{ session: [] }]
      responses:
        "200":
          description: The teams.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/OrganizationTeam" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [organizations]
      summary: Create a team
      description: |
        A team carries organization roles, which its members hold in addition to their direct roles.
        `roles` follow the granting rules: only roles the caller could give themselves. Names are unique
        in the organization (`409 team_name_taken`), up to `max_teams_per_org` (`409 team_limit_reached`).
        Needs `manage` of teams.
      operationId: createOrganizationTeam
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 60 }
                roles: { type: array, items: { type: string } }
      responses:
        "201":
          description: The team.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationTeam" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_orgs/{org}/teams/{team}:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/org" }
      - { name: team, in: path, required: true, schema: { type: string } }
    patch:
      tags: [organizations]
      summary: Rename a team or change its roles
      description: The roles it gains or loses follow the granting rules, and the organization keeps a member who can manage it (`409 last_org_manager`). Changes apply at the members' next request. Needs `manage` of teams.
      operationId: updateOrganizationTeam
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, minLength: 1, maxLength: 60 }
                roles: { type: array, items: { type: string } }
      responses:
        "200":
          description: The team.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationTeam" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [organizations]
      summary: Delete a team
      description: It leaves every membership, and its roles go with it. Needs `manage` of teams.
      operationId: deleteOrganizationTeam
      security: [{ session: [] }]
      responses:
        "204":
          description: The team was deleted.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_orgs/{org}/teams/{team}/members:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/org" }
      - { name: team, in: path, required: true, schema: { type: string } }
    get:
      tags: [organizations]
      summary: The members and role holders of a team
      description: |
        A page, sorted by user id, of the organization's members who belong to the team and of
        those who hold a team role in it, whether or not they belong. Grants outside their
        window are left out. With `role`, only the holders of that role. Emails appear according
        to the realm's `members_visible_to`. Any member of the organization may list; granting and revoking need `manage` of teams.
      operationId: listOrganizationTeamMembers
      security: [{ session: [] }]
      parameters:
        - { name: role, in: query, description: "A team role declared in `organizations.team_roles`.", schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
        - { name: after, in: query, description: "The `next` of the previous page.", schema: { type: string } }
      responses:
        "200":
          description: A page of members and holders.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationTeamMembers" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_orgs/{org}/teams/{team}/roles:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/org" }
      - { name: team, in: path, required: true, schema: { type: string } }
    post:
      tags: [organizations]
      summary: Give a member a team role
      description: |
        The member must belong to the organization, not to the team: a team role can be held
        outside it. `from` and `until` set the window it counts in. Granting what is already held
        changes nothing (use `PATCH` for the window). At most 50 team role grants per member
        (`409 team_limit_reached`). Needs `manage` of teams, or a team role of that team whose
        `grants` lists this role (only in that team).
      operationId: grantOrganizationTeamRole
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrganizationTeamRoleInput" }
      responses:
        "200":
          description: The member as seen from the team.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationTeamMember" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      tags: [organizations]
      summary: Change the window of a team role grant
      description: |
        Replaces `from` and `until` of a grant the member holds (absent means open); `404` when
        the member doesn't hold the role in the team. Needs `manage` of teams, or a team role of that team that grants this role.
      operationId: changeOrganizationTeamRoleWindow
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrganizationTeamRoleInput" }
      responses:
        "200":
          description: The member as seen from the team.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationTeamMember" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [organizations]
      summary: Take a team role from a member
      description: Access through the role ends at the member's next request. Needs `manage` of teams, or a team role of that team whose `grants` lists this role.
      operationId: revokeOrganizationTeamRole
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrganizationTeamRoleRef" }
      responses:
        "200":
          description: The member as seen from the team.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationTeamMember" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_orgs/{org}/templates:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/org" }
    get:
      tags: [organizations]
      summary: An organization's email templates
      description: |
        The kinds of email the realm lets companies customize (`email.customizable`), with the
        placeholders each must print, and the overrides the organization has with their versions
        (without the text). Needs the capability `email.overrides.permission` names (`manage: org`
        by default).
      operationId: listOrganizationTemplates
      security: [{ session: [] }]
      responses:
        "200":
          description: The customizable kinds and the organization's overrides.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationTemplates" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_orgs/{org}/templates/{kind}/{locale}:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/org" }
      - { name: kind, in: path, required: true, schema: { type: string } }
      - { name: locale, in: path, required: true, schema: { type: string } }
    get:
      tags: [organizations]
      summary: One template with its versions
      operationId: getOrganizationTemplate
      security: [{ session: [] }]
      responses:
        "200":
          description: The template and its previous versions (up to 20), newest first.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationTemplate" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    put:
      tags: [organizations]
      summary: Write the organization's version of a kind in a language
      description: |
        Subject, text and HTML in a logic-less syntax: `{{Link}}`, `{{App.name}}`, `{{#App.logo}}…{{/App.logo}}`,
        `{{^App.logo}}…{{/App.logo}}`; every value is escaped; there are no includes, partials or helpers.
        The kind must be in `email.customizable`. It is checked: each part at most 64 KiB, the syntax
        (`400 invalid_template`, with the line and column in `details`), the placeholders the kind
        needs (the link of a token kind, an invitation's link and organization name) and a render
        with sample data. The HTML passes an allowlist sanitizer when a message is made, and
        `removed` lists what it drops from the sample. The previous version is kept (the last 20).
        Audited, never with the text.
      operationId: putOrganizationTemplate
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrganizationTemplateInput" }
      responses:
        "200":
          description: The saved template.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationTemplate" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [organizations]
      summary: Go back to the realm's own template
      operationId: deleteOrganizationTemplate
      security: [{ session: [] }]
      responses:
        "204": { description: "Removed; the kind uses the realm's file again." }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_orgs/{org}/templates/{kind}/{locale}/preview:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/org" }
      - { name: kind, in: path, required: true, schema: { type: string } }
      - { name: locale, in: path, required: true, schema: { type: string } }
    post:
      tags: [organizations]
      summary: Preview a template
      description: |
        Renders a draft (all three parts), or the saved version when none is given, without
        sending anything. `data` is `sample` (default) or `real`, which calls the realm's
        `email.data_hook` for the caller and the organization. Show `html` in a sandboxed frame.
      operationId: previewOrganizationTemplate
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrganizationTemplatePreviewInput" }
      responses:
        "200":
          description: The rendered message.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationTemplatePreview" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_orgs/{org}/templates/{kind}/{locale}/test:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/org" }
      - { name: kind, in: path, required: true, schema: { type: string } }
      - { name: locale, in: path, required: true, schema: { type: string } }
    post:
      tags: [organizations]
      summary: Send a test of a template to yourself
      description: |
        Sends a draft (or the saved version) to the **requesting user's own address only**, with
        "[TEST]" in the subject, through the realm's delivery function. At most 10 per hour per
        organization (`429 template_test_limit`). Audited.
      operationId: testOrganizationTemplate
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrganizationTemplateDraft" }
      responses:
        "202":
          description: Queued.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status: { type: string, enum: [queued] }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_orgs/{org}/teams/{team}/members/{user}:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/org" }
      - { name: team, in: path, required: true, schema: { type: string } }
      - { name: user, in: path, required: true, schema: { type: string } }
    put:
      tags: [organizations]
      summary: Put a member in a team
      description: The user must be a member of the organization. They gain the team's roles, which the caller must be able to give (`403 forbidden`). Up to `max_teams_per_member` (`409 team_limit_reached`). Needs `manage` of teams.
      operationId: addOrganizationTeamMember
      security: [{ session: [] }]
      responses:
        "200":
          description: The member.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationMember" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [organizations]
      summary: Take a member out of a team
      description: They lose the team's roles at their next request, unless they hold them another way. The last member who can manage the organization stays (`409 last_org_manager`). Needs `manage` of teams.
      operationId: removeOrganizationTeamMember
      security: [{ session: [] }]
      responses:
        "200":
          description: The member.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationMember" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_auth/oauth/{provider}/start:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/oauthProvider" }
    get:
      tags: [auth]
      summary: Start signing in with a provider (a redirect)
      description: |
        Begins the redirect flow for a provider the realm lists under `providers:`
        (`google`, `microsoft`, `apple`): remembers the attempt (a random `state`, a
        nonce and PKCE for the provider, kept for 10 minutes and good for one callback)
        and answers `302` to the provider's sign-in page. After the user signs in, the
        provider sends them to the callback, which sends them on to `redirect_to` with a
        one-time `backd_code` or a `backd_error` (see the callback). `redirect_to` must be
        within the realm's `sign_in.allowed_redirects` (or `email.allowed_redirects`);
        when it is absent the realm's `sign_in.app_url` is used, and a realm that has none
        answers `400 invalid_redirect`. `code_challenge` is the S256 challenge of a verifier only the app holds.
        Linking a provider to a signed-in user needs `POST`, which carries the session.
        At most 30 starts a minute per address (`429`).
      operationId: oauthStart
      parameters:
        - { name: redirect_to, in: query, schema: { type: string }, description: "Where the flow ends; the realm's `sign_in.app_url` when absent." }
        - { name: code_challenge, in: query, required: true, schema: { type: string, minLength: 43, maxLength: 43 } }
        - { name: invitation, in: query, schema: { type: string }, description: "An invitation token, for realms with `signup: invite`." }
        - { name: locale, in: query, schema: { type: string } }
      responses:
        "302":
          description: To the provider.
          headers:
            Location: { schema: { type: string } }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503":
          description: "`provider_unavailable`: a secret of the provider is not set, or backd's public address (`BACKD_URL`) is unknown."
          headers: { X-Request-ID: { $ref: "#/components/headers/RequestID" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [auth]
      summary: Start signing in with a provider, or linking one
      description: |
        The same as `GET`, with the answer in JSON: `authorize_url` is where the app sends
        the user. It is the only way to **link** a provider to the signed-in user
        (`intent: "link"`, with the session in `Authorization`): a browser navigation
        can't carry that header. The flow then ends at `redirect_to?backd_linked=<provider>`
        instead of a login code.
      operationId: oauthStartJSON
      security: [{}, { session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code_challenge]
              properties:
                redirect_to: { type: string, description: "Where the flow ends; the realm's `sign_in.app_url` when absent." }
                code_challenge: { type: string, minLength: 43, maxLength: 43, description: The S256 PKCE challenge of the app's verifier. }
                intent: { type: string, enum: [signin, link], default: signin }
                invitation: { type: string }
                consents: { $ref: "#/components/schemas/ConsentsGiven" }
                locale: { type: string }
      responses:
        "200":
          description: Where to send the user.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [authorize_url]
                properties:
                  authorize_url: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503":
          description: "`provider_unavailable`."
          headers: { X-Request-ID: { $ref: "#/components/headers/RequestID" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_auth/oauth/{provider}/callback:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/oauthProvider" }
    get:
      tags: [auth]
      summary: Where the provider sends the user back to
      description: |
        The address registered with the provider as the redirect URI (the realm's public
        address plus this path). It finds the attempt by its `state` (one use), asks the
        provider for the user's ID token, verifies it and decides who the person is
        (linking, sign-up and the other rules of provider sign-in, described in the docs),
        then answers `302` to the app's `redirect_to` with one of:

        - `backd_code`: a one-time login code (valid one minute, bound to the app's PKCE
          challenge) to redeem at `POST /_auth/token`;
        - `backd_linked=<provider>`: the provider account was added to the signed-in user;
        - `backd_error=<code>`: `cancelled`, `account_exists` (with `backd_provider`), `signup_closed`,
          `invitation_invalid`, `link_conflict`, `email_not_verified`, `email_required`,
          `signin_refused` or `provider_error`.

        An attempt that can't be traced to an app (the `state` is unknown, used, expired or
        for another provider) can't be sent anywhere: the answer is the realm's
        `pages/oauth-error/<locale>.html` page (the built-in one without it), with `400`.
        A session never appears in a URL.
      operationId: oauthCallback
      parameters:
        - { name: state, in: query, schema: { type: string } }
        - { name: code, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
      responses:
        "302": { $ref: "#/components/responses/BackToApp" }
        "400": { $ref: "#/components/responses/HostedPage" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [auth]
      summary: The provider's callback as a form post
      description: |
        The same, for providers that answer with `response_mode=form_post` (Apple): the
        fields come in an `application/x-www-form-urlencoded` body and the redirect to
        the app is `303`, so the browser follows it with a `GET`.
      operationId: oauthCallbackForm
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                state: { type: string }
                code: { type: string }
                error: { type: string }
      responses:
        "303": { $ref: "#/components/responses/BackToApp" }
        "400": { $ref: "#/components/responses/HostedPage" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_auth/providers:
    parameters: [{ $ref: "#/components/parameters/realm" }]
    get:
      tags: [auth]
      summary: The providers a client may offer now
      description: |
        The names of the external providers (`google`, `microsoft`, `apple`) the realm has configured
        **and** that are usable now: their secrets are set and backd's public address is known, which
        is what makes `start` answer `503 provider_unavailable`, so the list and `start` agree. Apps use
        it to choose which buttons to show. Public; the answer is the same for everyone and may be
        cached for a minute. Password and magic links are not providers in this sense. At most 60 a
        minute per address (`429`).
      operationId: listProviders
      security: [{}]
      responses:
        "200":
          description: The provider names, sorted.
          headers: { Cache-Control: { schema: { type: string, example: "public, max-age=60" } } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderNames" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_auth/orgs:
    parameters: [{ $ref: "#/components/parameters/realm" }]
    post:
      tags: [auth, organizations]
      summary: A new person creates an account and an organization
      description: |
        How a company starts (design/scoped-sessions.md §5.2): one call makes the account, the
        organization, with the person as its creator (`creator_roles`), and a session **scoped to it**.
        The realm's `signup` must be `open` (`403 signup_closed` otherwise). `organizations.create` is
        not asked for this first organization (a new account cannot satisfy `user.email_verified`);
        `max_created_per_user` is. `slug` is required, unique among organizations that aren't deleted
        (`409 slug_taken`, which creates nothing) and may not look like an organization id.

        The account follows the sign-up rules of `POST /_auth/signup`: with `account.require_verified_email`
        the answer is `202` and no session (the organization exists; the person signs in to it after
        verifying), the same for a registered address, which makes nothing and whose owner is told by
        email. Where a session is issued, a registered address answers `409 email_taken`: the person
        signs in to one of their organizations and creates another from there (`POST /_orgs`).
      operationId: createAccountAndOrganization
      security: [{}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password, name, slug]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8, maxLength: 128 }
                name: { type: string, minLength: 1, maxLength: 100, description: "The organization's name." }
                slug: { type: string, maxLength: 63, pattern: "^[a-z0-9]+(-[a-z0-9]+)*$" }
                locale: { type: string }
                redirect_to: { type: string, description: "Where the page after the verification link may send the user." }
                cookie: { type: boolean }
                consents: { $ref: "#/components/schemas/ConsentsGiven" }
      responses:
        "201":
          description: The account, the organization (`organization`) and the session scoped to it.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationSession" }
        "202":
          description: Verification required first; no session. The same answer for a registered address.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [verification_required] }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_auth/orgs/find:
    parameters: [{ $ref: "#/components/parameters/realm" }]
    post:
      tags: [auth, organizations]
      summary: "Which companies am I in?"
      description: |
        For someone who does not remember where they belong. Nothing in the API lists organizations,
        so the answer goes to the address's mailbox: an address that has an account with memberships
        gets the `organizations-found` email, listing each active organization by name with the link
        to its sign-in page (`organizations.signin_link`). The answer is `202` for every address, and
        the work is the same, so it says nothing to whoever asked.

        At most 3 requests an hour per address and 30 per client address (`429`). `404` in a realm
        that sets no `organizations.signin_link` or has no `email`.
      operationId: findOrganizations
      security: [{}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email: { type: string }
                locale: { type: string }
      responses:
        "202":
          description: Accepted, whatever the address.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [accepted] }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_auth/orgs/{org}/login:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/orgSignIn" }
    post:
      tags: [auth, organizations]
      summary: Sign in to an organization with email and password
      description: |
        Like `POST /_auth/login`, for one organization: the session (or the second step) is **scoped
        to it**, so its token reaches this organization and no other. The person must be a member, or
        hold a valid `invitation` of this organization, which is used as part of the sign-in and makes
        them a member.

        A wrong password, an address with no account, a person who is not a member, an organization
        that is not there or is deleted, and an invitation that is not theirs all answer the same
        `401 invalid_credentials`, after the same work, and count the same toward the sign-in limits
        (`429`): nothing says who belongs where. `{org}` is the organization's id or slug.
      operationId: orgLogin
      security: [{}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
                invitation: { type: string, description: "An invitation token of this organization (`bdo_…`)." }
                cookie: { type: boolean, description: "As for `POST /_auth/login`." }
      responses:
        "200": { $ref: "#/components/responses/SignInResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_auth/orgs/{org}/signup:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/orgSignIn" }
    post:
      tags: [auth, organizations]
      summary: Create an account by invitation and sign in to the organization
      description: |
        For someone an organization invited who has no account. The `invitation` is required, whatever
        the realm's `signup` says: it must be for this organization (`400 invalid_invitation`) and, if it
        is bound to an address or a user, for this one (`403 invitation_not_for_you`). The account is
        made, the invitation used (so the person is a member) and a session scoped to the organization
        given. An invitation bound to the address was sent to it, so the account is born verified; an
        open link vouches for nothing, and the address is verified as in `POST /_auth/signup`.

        The rest follows `POST /_auth/signup`: `202` while the realm wants the address verified (the same
        for a registered address), else `409 email_taken`.
      operationId: orgSignup
      security: [{}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password, invitation]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8, maxLength: 128 }
                invitation: { type: string, description: "An invitation token of this organization (`bdo_…`)." }
                locale: { type: string }
                redirect_to: { type: string }
                cookie: { type: boolean }
                consents: { $ref: "#/components/schemas/ConsentsGiven" }
      responses:
        "201": { $ref: "#/components/responses/SessionCreated" }
        "202":
          description: Verification required first; no session. The same answer for a registered address.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [verification_required] }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_auth/orgs/{org}/magic-link:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/orgSignIn" }
    post:
      tags: [auth, organizations]
      summary: Ask for a link and a code to sign in to an organization
      description: |
        `POST /_auth/magic-link` for one organization: only its members are sent a link, and the session
        the link or the code gives is **scoped to it**. A stranger, an address with no account and an
        organization that is not there all answer the same `202` with a request id, and no email is sent.
        A new address never gets an account this way (joining needs an invitation). `403 magic_link_disabled`
        in a realm without magic links.
      operationId: orgMagicLink
      security: [{}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, code_challenge]
              properties:
                email: { type: string }
                code_challenge: { type: string, minLength: 43, maxLength: 43 }
                redirect_to: { type: string }
                locale: { type: string }
                consents: { $ref: "#/components/schemas/ConsentsGiven" }
      responses:
        "202":
          description: A request was made; the same for everybody.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [request_id]
                properties:
                  request_id: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_auth/orgs/{org}/reset-password/request:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/orgSignIn" }
    post:
      tags: [auth, organizations]
      summary: Ask for a password reset email, from an organization's page
      description: |
        `POST /_auth/reset-password/request` coming from one organization's sign-in page: when the
        address is one of its members the email and the page of its link carry the organization's
        context (`email.data_hook`, `pages.data_hook`). The answer is `202` for every address and every
        organization, with the same work.
      operationId: orgRequestPasswordReset
      security: [{}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email: { type: string }
                redirect_to: { type: string }
      responses:
        "202":
          description: Accepted.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [accepted] }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_auth/orgs/{org}/invitations/preview:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/orgSignIn" }
    post:
      tags: [auth, organizations]
      summary: See what an invitation offers, before signing in
      description: |
        Says which organization, roles and teams a token offers, so an app can ask "Join Acme as
        editor?" before the person has a session. The token proves the right to know: unknown, expired,
        revoked and used-up tokens, and a token of another organization than `{org}`, all answer the same
        `400 invalid_invitation`. Whom the invitation is bound to is checked when it is used.
      operationId: orgPreviewInvitation
      security: [{}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200":
          description: What accepting would do.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationInvitationPreview" }
        "400": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_auth/orgs/{org}/providers:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/orgSignIn" }
    get:
      tags: [auth, organizations]
      summary: How people may sign in to an organization now
      description: |
        The providers a client may offer for one organization, and its other ways in. `items` holds the
        realm's own providers and the connections the organization made (`organizations.sso`; a
        connection replaces the realm's provider of the same name) that are enabled, with their secret
        set, while the organization is active. `methods` says `password` and, when the realm has them,
        `magic_link`.

        An unknown organization, a deleted one, one without connections and one with the feature off
        all answer as a plain organization: the realm's providers and methods. The list says nothing
        about who exists. `{org}` is the id or the slug.
      operationId: listOrganizationProviders
      security: [{}]
      responses:
        "200":
          description: The provider names, sorted.
          headers: { Cache-Control: { schema: { type: string, example: "public, max-age=60" } } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProviderNames" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_auth/orgs/{org}/oauth/{provider}/start:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/orgSignIn" }
      - { $ref: "#/components/parameters/oauthProvider" }
    get:
      tags: [auth, organizations]
      summary: Start signing in through an organization's connection (a redirect)
      description: |
        The redirect flow of `GET /_auth/oauth/{provider}/start`, with the application, secret and
        restrictions of the organization's connection (`google` or `microsoft`), or, when the organization
        has none of that name, the realm's own provider used to sign in **to this organization**: the
        person must be one of its members (or hold its `invitation`, a `bdo_…` token) when they come
        back, and the session is scoped to it. An organization that can't be signed in to is
        answered like any other, and the refusal comes after the provider has vouched for the person
        (`backd_error=not_allowed`). `404` is for a provider the organization and the realm do not
        have, and for a connection without its secret. At most 30 starts a minute per address (`429`).
      operationId: orgOAuthStart
      parameters:
        - { name: redirect_to, in: query, schema: { type: string }, description: "Where the flow ends; the realm's `sign_in.app_url` when absent." }
        - { name: code_challenge, in: query, required: true, schema: { type: string, minLength: 43, maxLength: 43 } }
        - { name: invitation, in: query, schema: { type: string } }
        - { name: locale, in: query, schema: { type: string } }
      responses:
        "302":
          description: To the provider.
          headers:
            Location: { schema: { type: string } }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503":
          description: "`provider_unavailable`: backd's public address (`BACKD_URL`) is unknown."
          headers: { X-Request-ID: { $ref: "#/components/headers/RequestID" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [auth, organizations]
      summary: Start signing in through an organization's connection, or linking it
      description: |
        The same as `GET`, answering `authorize_url` in JSON, and the way to **link** the organization's
        provider to the signed-in user (`intent: "link"`). A person who already has an account with the
        same address links this way: an organization sign-in never links by address.
      operationId: orgOAuthStartJSON
      security: [{}, { session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code_challenge]
              properties:
                redirect_to: { type: string }
                code_challenge: { type: string, minLength: 43, maxLength: 43 }
                intent: { type: string, enum: [signin, link], default: signin }
                invitation: { type: string }
                consents: { $ref: "#/components/schemas/ConsentsGiven" }
                locale: { type: string }
      responses:
        "200":
          description: Where to send the user.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [authorize_url]
                properties:
                  authorize_url: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503":
          description: "`provider_unavailable`."
          headers: { X-Request-ID: { $ref: "#/components/headers/RequestID" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_auth/orgs/{org}/oauth/{provider}/callback:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/orgCallback" }
      - { $ref: "#/components/parameters/oauthProvider" }
    get:
      tags: [auth, organizations]
      summary: Where the provider sends the user back to, for an organization
      description: |
        The address a manager registers with the provider (`redirect_uri` of the connection, which
        names the organization by its id). It works as `GET /_auth/oauth/{provider}/callback` and
        answers `302` to the app with `backd_code`, `backd_linked` or `backd_error`, which adds
        `not_allowed`: the person is not of the Google Workspace domain or the Microsoft tenant the
        connection admits (or not of its `email_domains`), and nothing was created. A `state` that
        belongs to another organization, or to the realm's providers, is a state that leads nowhere:
        the `400` page.
      operationId: orgOAuthCallback
      parameters:
        - { name: state, in: query, schema: { type: string } }
        - { name: code, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
      responses:
        "302": { $ref: "#/components/responses/BackToApp" }
        "400": { $ref: "#/components/responses/HostedPage" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [auth, organizations]
      summary: The provider's callback as a form post, for an organization
      description: The same, for a provider that answers with a form post.
      operationId: orgOAuthCallbackForm
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                state: { type: string }
                code: { type: string }
                error: { type: string }
      responses:
        "303": { $ref: "#/components/responses/BackToApp" }
        "400": { $ref: "#/components/responses/HostedPage" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_auth/orgs/{org}/oauth/{provider}/id-token:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/orgSignIn" }
      - { $ref: "#/components/parameters/oauthProvider" }
    post:
      tags: [auth, organizations]
      summary: Sign in through an organization's connection with an ID token the app holds
      description: |
        As `POST /_auth/oauth/{provider}/id-token`, for the connection of one organization: the token's
        audience is the connection's `client_id` or one of its `native_client_ids`, and the same
        restriction applies. A person the connection does not admit is `403 not_allowed`.
      operationId: orgOAuthIDToken
      security: [{}, { session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [id_token, nonce]
              properties:
                id_token: { type: string }
                nonce: { type: string }
                intent: { type: string, enum: [signin, link], default: signin }
                invitation: { type: string }
                consents: { $ref: "#/components/schemas/ConsentsGiven" }
                locale: { type: string }
                cookie: { type: boolean }
      responses:
        "200":
          description: "A session (as a login's), or `{\"linked\": \"<provider>\"}` for `intent: link`."
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/ProviderSession" }
                  - { $ref: "#/components/schemas/MFAChallenge" }
                  - { $ref: "#/components/schemas/MFAEnrollmentChallenge" }
                  - { $ref: "#/components/schemas/ConsentChallenge" }
                  - type: object
                    additionalProperties: false
                    required: [linked]
                    properties:
                      linked: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403":
          description: "`not_allowed` (the person is not of the organization the connection admits), or the errors of the realm's flow."
          headers: { X-Request-ID: { $ref: "#/components/headers/RequestID" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_auth/oauth/{provider}/id-token:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/oauthProvider" }
    post:
      tags: [auth]
      summary: Sign in with the ID token a mobile app already holds
      description: |
        For apps that sign in with the platform (Sign in with Apple, Google Sign-In,
        MSAL): the app sends the provider's ID token and the nonce it started the
        sign-in with, and gets a session at once, under the same rules as the redirect
        flow (linking by verified address, the sign-up modes, disabled users and
        networks). backd verifies the token's signature, issuer, audience (the web
        client and the `native_client_ids`, for Apple the `bundle_ids`), expiry and nonce:
        the app sends the raw nonce, and the token may carry it raw or as its SHA-256
        (hex or base64url), as the SDKs do. With `"intent": "link"` and the session in
        `Authorization`, the provider account is added to the signed-in user instead
        (`{"linked": "<provider>"}`). At most 30 a minute per address.
        For Apple (unless the provider sets `revoke_on_delete: false`) the app also sends the
        `authorization_code` the Apple SDK gave with the token: backd trades it, as the app,
        for Apple's refresh token and keeps it sealed, to revoke it when the account is
        erased or Apple is unlinked. A code that is not of the same person and app as the
        token is `401 invalid_token`; a missing one is `400`.
      operationId: oauthIDToken
      security: [{}, { session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [id_token, nonce]
              properties:
                id_token: { type: string }
                nonce: { type: string, description: The raw nonce the sign-in was started with. }
                authorization_code: { type: string, description: "Apple only, required unless `revoke_on_delete: false`: the authorization code that came with the ID token." }
                intent: { type: string, enum: [signin, link], default: signin }
                invitation: { type: string, description: "An invitation token, for realms with `signup: invite`." }
                consents: { $ref: "#/components/schemas/ConsentsGiven" }
                locale: { type: string }
                cookie: { type: boolean, description: "As in `POST /_auth/login`." }
      responses:
        "200":
          description: "A session (as a login's, with `new_user` and, for a new user, `profile`), or `{\"linked\": \"<provider>\"}` for `intent: link`."
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/ProviderSession" }
                  - { $ref: "#/components/schemas/MFAChallenge" }
                  - { $ref: "#/components/schemas/MFAEnrollmentChallenge" }
                  - { $ref: "#/components/schemas/ConsentChallenge" }
                  - type: object
                    additionalProperties: false
                    required: [linked]
                    properties:
                      linked: { type: string }
        "400":
          description: "An invalid body, `invitation_invalid` (sign-up needs a valid invitation) or `email_required` (the provider gave no address)."
          headers: { X-Request-ID: { $ref: "#/components/headers/RequestID" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: "`invalid_token`: the ID token does not verify; or no session for `intent: link`."
          headers: { X-Request-ID: { $ref: "#/components/headers/RequestID" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: "`signup_closed`, `email_not_verified` or `signin_refused` (the account can't sign in), or a cookie session from an origin that isn't allowed."
          headers: { X-Request-ID: { $ref: "#/components/headers/RequestID" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: "`account_exists`: an account has the address and can't be linked automatically (sign in another way and link from there); or `link_conflict`."
          headers: { X-Request-ID: { $ref: "#/components/headers/RequestID" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503":
          description: "`provider_unavailable`: the provider's keys could not be fetched."
          headers: { X-Request-ID: { $ref: "#/components/headers/RequestID" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_auth/token:
    parameters: [{ $ref: "#/components/parameters/realm" }]
    post:
      tags: [auth]
      summary: Redeem a login code for a session
      description: |
        Trades the one-time `code` (`backd_code`) a sign-in ended with, and the PKCE `code_verifier` the
        app's `code_challenge` came from, for a session, like a login. The code is used up
        even when the verifier is wrong, so a stolen code can't be tried again; an unknown,
        expired, used or wrongly verified code and a user who can no longer sign in are all
        `401 invalid_credentials`. At most 30 a minute per address.
      operationId: redeemLoginCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code, code_verifier]
              properties:
                code: { type: string }
                code_verifier: { type: string }
                cookie: { type: boolean, description: "As in `POST /_auth/login`." }
      responses:
        "200": { $ref: "#/components/responses/SignInResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_auth/consents/{name}:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { name: name, in: path, required: true, schema: { type: string } }
    delete:
      tags: [auth]
      summary: Withdraw an optional consent
      description: |
        Records the withdrawal (method `api`) and removes the consent from the user. As easy as
        giving it, and idempotent. A required consent answers `409 consent_required_for_account`:
        without it the account can't be used, so the way out is deleting the account.
      operationId: withdrawConsent
      security: [{ session: [] }]
      responses:
        "200":
          description: The user's consents after the withdrawal.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsentState" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_auth/consents/accept:
    parameters: [{ $ref: "#/components/parameters/realm" }]
    post:
      tags: [auth]
      summary: Accept the consents a sign-in is waiting for
      description: |
        Trades the `challenge` of a `consent_required` sign-in and the consents accepted for
        the session. Every consent the challenge named must be there at its current version;
        optional ones may come along. A request that leaves one out is `400 consent_required`
        and the challenge stays valid. The records get the method `prompt`.
      operationId: acceptConsentsChallenge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [challenge, consents]
              properties:
                challenge: { type: string }
                consents: { $ref: "#/components/schemas/ConsentsGiven" }
                cookie: { type: boolean, description: "Keep the session in an HttpOnly cookie, as for login." }
      responses:
        "200": { $ref: "#/components/responses/SignInResult" }
        "400": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_auth/consents:
    parameters: [{ $ref: "#/components/parameters/realm" }]
    get:
      tags: [auth]
      summary: The user's consents and history
      description: |
        What the signed-in user holds, the required consents still to accept, and their
        history (oldest first): what they accepted or withdrew, when and how. It stays open
        past a `reaccept_by` date.
      operationId: getConsents
      security: [{ session: [] }]
      responses:
        "200":
          description: The consents.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/ConsentState" }
                  - type: object
                    required: [history]
                    properties:
                      history:
                        type: array
                        items:
                          type: object
                          additionalProperties: false
                          required: [consent, version, action, method, locale, at]
                          properties:
                            consent: { type: string }
                            version: { type: string }
                            action: { type: string, enum: [accepted, withdrawn] }
                            method: { type: string, enum: [signup, prompt, api, admin] }
                            locale: { type: string }
                            at: { $ref: "#/components/schemas/Timestamp" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [auth]
      summary: Accept consents
      description: |
        A signed-in user accepts consents: the version an app just showed them, or an optional
        consent. It works for a user who is refused with `403 consent_required` because the
        `reaccept_by` date of a version has passed, which is how they get back in. The records
        get the method `api`. Answers what the user holds and what is still to accept.
      operationId: acceptConsents
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [consents]
              properties:
                consents: { $ref: "#/components/schemas/ConsentsGiven" }
      responses:
        "200":
          description: The user's consents.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsentState" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_auth/mfa/verify:
    parameters: [{ $ref: "#/components/parameters/realm" }]
    post:
      tags: [auth]
      summary: Finish a sign-in with a second factor
      description: |
        Trades the `challenge` a first factor answered with and a code of the user's second
        factor (`method`: `totp`, or `recovery_code`) for the session the first factor was
        waiting for. The answer is the first factor's own (a provider's includes `new_user` and
        `profile`); a recovery code adds `recovery_codes_left`.

        A wrong code is `400 invalid_code` with the attempts left in `details`; a challenge
        allows 5 attempts and lives 5 minutes, after which (and for an unknown or used one) the
        answer is `400 invalid_challenge`, the same for all of them. Too many wrong codes for
        one user in an hour, across challenges, is `429 mfa_locked` for 15 minutes. A time step
        of a TOTP code is accepted once.
      operationId: verifyMFA
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [challenge, method, code]
              properties:
                challenge: { type: string }
                method: { type: string, enum: [totp, recovery_code] }
                code: { type: string, description: "The 6 digits of the authenticator app, or a recovery code (`xxxxx-xxxxx`)." }
                cookie: { type: boolean, description: "As in `POST /_auth/login`." }
      responses:
        "200": { $ref: "#/components/responses/SignInResult" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_auth/mfa:
    parameters: [{ $ref: "#/components/parameters/realm" }]
    get:
      tags: [auth]
      summary: The signed-in user's second-factor state
      operationId: getMFA
      security: [{ session: [] }]
      responses:
        "200":
          description: >-
            `enabled` says the user has a second factor; `available` that the realm lets users turn
            one on; `required` that a role of the user requires one.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [available, enabled, methods, recovery_codes_left, required]
                properties:
                  available: { type: boolean, description: "The realm lets users turn a second factor on and the instance has a secrets key." }
                  enabled: { type: boolean }
                  methods: { type: array, items: { type: string, enum: [totp, recovery_code] } }
                  recovery_codes_left: { type: integer }
                  required: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_auth/mfa/totp/setup:
    parameters: [{ $ref: "#/components/parameters/realm" }]
    post:
      tags: [auth]
      summary: Start setting up an authenticator app
      description: |
        Makes a TOTP secret (SHA-1, 6 digits, 30 seconds: what every authenticator app supports) and
        holds it for 15 minutes until `POST /_auth/mfa/totp/confirm` proves the app received it. A new
        setup replaces a pending one. The secret is shown here and in the QR code only.

        It acts on the session of the request or, in a sign-in that answered
        `mfa_enrollment_required`, on that `challenge` (no session yet).
      operationId: setupTOTP
      security: [{ session: [] }, {}]
      parameters: [{ $ref: "#/components/parameters/reauth" }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                challenge: { type: string, description: "The challenge of a sign-in that must set a second factor up." }
      responses:
        "200":
          description: The secret, as text, as an `otpauth://` URI and as a QR image.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [setup_id, secret, otpauth_uri, qr, expires_at]
                properties:
                  setup_id: { type: string }
                  secret: { type: string, description: "Base32, to type into an app." }
                  otpauth_uri: { type: string }
                  qr: { type: string, description: "A PNG as a `data:image/png;base64,…` URI of the `otpauth_uri`." }
                  expires_at: { $ref: "#/components/schemas/Timestamp" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: "`mfa_disabled`: the realm doesn't let users turn MFA on (`mfa.enabled: false`)."
          headers: { X-Request-ID: { $ref: "#/components/headers/RequestID" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: "`mfa_already_enabled`."
          headers: { X-Request-ID: { $ref: "#/components/headers/RequestID" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: "`mfa_unavailable`: the instance has no secrets key (`BACKD_SECRETS_KEY`) to encrypt the secret with."
          headers: { X-Request-ID: { $ref: "#/components/headers/RequestID" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_auth/mfa/totp/confirm:
    parameters: [{ $ref: "#/components/parameters/realm" }]
    post:
      tags: [auth]
      summary: Turn TOTP on with its first code
      description: |
        Checks the first code of the app against the pending secret, turns TOTP on and answers with
        the 10 recovery codes, **once**: they are kept only as keyed hashes. The user's other sessions
        end, so a session from before can't pass a rule that requires `user.mfa`, and a
        `security-notice` email says what happened. A wrong code is `400 invalid_code`; five end the setup.

        With the `challenge` of a sign-in that answered `mfa_enrollment_required` it also ends that
        sign-in: the answer then carries the session too (its `methods` include `totp`).
      operationId: confirmTOTP
      security: [{ session: [] }, {}]
      parameters: [{ $ref: "#/components/parameters/reauth" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [setup_id, code]
              properties:
                setup_id: { type: string }
                code: { type: string }
                challenge: { type: string, description: "The challenge of a sign-in that must set a second factor up." }
                cookie: { type: boolean, description: "With a `challenge`: as in `POST /_auth/login`." }
      responses:
        "200":
          description: TOTP is on, and, with a `challenge`, the session of the sign-in.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [recovery_codes]
                properties:
                  recovery_codes: { type: array, items: { type: string, description: "`xxxxx-xxxxx`" } }
                  token: { type: string, pattern: "^bds_" }
                  token_type: { const: Bearer }
                  session_id: { type: string }
                  expires_at: { $ref: "#/components/schemas/Timestamp" }
                  user: { $ref: "#/components/schemas/User" }
                  new_user: { type: boolean, description: "With a challenge from a provider sign-in: whether it made the user." }
                  profile: { type: object, description: "With `new_user`: what the provider said of the person." }
                  consent_required: { const: true, description: "Instead of the session, when the user has consents to accept: the sign-in goes on at `POST /_auth/consents/accept` with `challenge`. The recovery codes are in this answer all the same." }
                  challenge: { type: string }
                  consents:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [name, version]
                      properties:
                        name: { type: string }
                        version: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_auth/mfa/totp:
    parameters: [{ $ref: "#/components/parameters/realm" }]
    delete:
      tags: [auth]
      summary: Turn the second factor off
      description: |
        Removes the user's TOTP secret and recovery codes. Refused with `403 mfa_required_by_role`
        while a role of the user requires MFA. A `security-notice` email says what happened.
      operationId: disableTOTP
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/reauth" }]
      responses:
        "204": { description: MFA is off. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_auth/mfa/recovery-codes:
    parameters: [{ $ref: "#/components/parameters/realm" }]
    post:
      tags: [auth]
      summary: Replace the recovery codes
      description: >-
        Replaces every recovery code with 10 new ones, shown once; the old ones stop working.
        `409 mfa_not_enabled` for a user without a second factor.
      operationId: regenerateRecoveryCodes
      security: [{ session: [] }]
      parameters: [{ $ref: "#/components/parameters/reauth" }]
      responses:
        "200":
          description: The new codes.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [recovery_codes]
                properties:
                  recovery_codes: { type: array, items: { type: string } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_auth/reauth:
    parameters: [{ $ref: "#/components/parameters/realm" }]
    post:
      tags: [auth]
      summary: Prove who you are again, before a sensitive action
      description: |
        Gives a token for the `X-Backd-Reauth` header of sensitive requests: changing or removing
        the password or the address, deleting the account, unlinking a sign-in method, turning the
        second factor on or off or replacing its recovery codes, and creating an API key as an
        administrator signed in with a session.

        The proof is the strongest the user has (`reauth_methods` of `GET /_auth/me`): `totp` or
        `recovery_code` with a second factor (a password alone is not enough then), `password`
        without one, `email_code` (a code sent by `POST /_auth/reauth/email-code`) for a user with
        neither. The token is bound to the session, stored only as a hash, and works for the
        realm's `reauth.ttl` and any number of actions in it. Wrong proofs count against the same
        limits as signing in. A correct but expired password (`password_expired` at sign-in) is
        refused with `401 password_expired`: the user resets it first.
      operationId: reauth
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [method]
              properties:
                method: { type: string, enum: [totp, recovery_code, password, email_code] }
                code: { type: string, description: "For `totp`, `recovery_code` and `email_code`." }
                password: { type: string, description: "For `password`." }
      responses:
        "200":
          description: The token.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [reauth_token, expires_at]
                properties:
                  reauth_token: { type: string }
                  expires_at: { $ref: "#/components/schemas/Timestamp" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_auth/reauth/email-code:
    parameters: [{ $ref: "#/components/parameters/realm" }]
    post:
      tags: [auth]
      summary: Email a code to prove who you are
      description: |
        For a user with no password and no second factor: a 6-digit code is emailed (the
        `reauth-code` message), good for 10 minutes and 5 attempts, to give to `POST /_auth/reauth`
        with `method: email_code`. A new request replaces the earlier code. `400` for a user whose
        proof is another one; `429` when an email limit is reached.
      operationId: requestReauthCode
      security: [{ session: [] }]
      responses:
        "202":
          description: Accepted.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status: { type: string, enum: [accepted] }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_auth/magic-link:
    parameters: [{ $ref: "#/components/parameters/realm" }]
    post:
      tags: [auth]
      summary: Ask for a link and a code to sign in with, or use the link
      description: |
        With a JSON body: asks for an email with **a link** (opened on the same device, which ends at
        `redirect_to` with a one-time login code in `backd_code`, to redeem at `POST /_auth/token`)
        and **a 6-digit code** (typed in the app that asked, with `POST /_auth/magic-link/verify`),
        both good for 10 minutes and once. Redeeming one uses up the other. The answer is the same
        `202` for every address: a registered one gets the message, one with no account gets a
        `no-account` message (or, with `magic_link.signup` and the realm's sign-up open, the same
        message: the account is made, verified, when the link or code is used), one that can't sign in
        gets nothing. Email limits that are reached are not told either. `redirect_to` is within the
        realm's `sign_in.allowed_redirects` (or `email.allowed_redirects`); without it the link goes to
        `sign_in.app_url`, and a realm with neither has the code only.

        With a form body (`application/x-www-form-urlencoded` with `token`): what the page's button
        posts: it signs in and answers `303` to the app with `backd_code` (or `backd_error`:
        `signin_refused`, `signup_closed`). A link with nowhere to go answers a page saying to type
        the code, and isn't used up.
      operationId: magicLink
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, code_challenge]
              properties:
                email: { type: string }
                code_challenge: { type: string, minLength: 43, maxLength: 43, description: "The S256 PKCE challenge of a verifier only the app holds." }
                redirect_to: { type: string }
                locale: { type: string }
                org: { type: string, description: "The organization the person comes from, an organization id. It is used only when the address belongs to one of its members (or has an invitation by email to it): the emails of the flow, and the pages of their links, then carry its context (`email.data_hook`, `pages.data_hook`). Anything else is ignored, with the same answer and work." }
                consents: { $ref: "#/components/schemas/ConsentsGiven" }
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "202":
          description: A request was made; the same for every address.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [request_id]
                properties:
                  request_id: { type: string, description: "Kept by the app, with its verifier, to redeem the code." }
        "200": { $ref: "#/components/responses/HostedPage" }
        "303": { $ref: "#/components/responses/BackToApp" }
        "400":
          description: >-
            An invalid body or `redirect_to` (JSON, `validation_error`, `invalid_redirect`), or, for the
            page's form, a link that is expired, used or unknown (the realm's `invalid-token` page).
          headers: { X-Request-ID: { $ref: "#/components/headers/RequestID" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
            text/html:
              schema: { type: string }
        "403":
          description: "`magic_link_disabled`: the realm doesn't have magic links."
          headers: { X-Request-ID: { $ref: "#/components/headers/RequestID" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/Error" }
    get:
      tags: [auth]
      summary: The page a sign-in link opens
      description: |
        The link in the `magic-link` message. Shows a page with a button; it never uses the link up, so
        mail scanners can't spoil it. The page is the realm's `pages/magic-link/<locale>.html` (the
        built-in one without it). A link that is expired, used or unknown shows the realm's
        `invalid-token` page (`400`).
      operationId: magicLinkPage
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
        - name: Accept-Language
          in: header
          schema: { type: string }
      responses:
        "200": { $ref: "#/components/responses/HostedPage" }
        "400": { $ref: "#/components/responses/HostedPage" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_auth/magic-link/verify:
    parameters: [{ $ref: "#/components/parameters/realm" }]
    post:
      tags: [auth]
      summary: Sign in with the code from the email
      description: |
        The 6-digit code, typed in the app that asked, with the `request_id` it got and the
        `code_verifier` of its PKCE challenge: the code works only in the app that made the request.
        The answer is the first factor's own: a session (with `new_user`, and the user's `profile`
        absent), or the [MFA challenge](#tag/auth) when the user has a second factor. Five wrong tries
        end the request (`400 invalid_code`, then `invalid_magic_link`); an unknown, used or expired
        request is `400 invalid_magic_link`.
      operationId: verifyMagicLinkCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [request_id, code, code_verifier]
              properties:
                request_id: { type: string }
                code: { type: string }
                code_verifier: { type: string }
                cookie: { type: boolean, description: "As in `POST /_auth/login`." }
      responses:
        "200": { $ref: "#/components/responses/SignInResult" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_auth/identities/{provider}:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - name: provider
        in: path
        required: true
        schema: { type: string, pattern: '^[a-z][a-z0-9-]{0,31}$' }
    delete:
      tags: [auth]
      summary: Remove one of the user's sign-in methods
      description: |
        Unlinks the user's sign-in method of that provider (`password` included); `org` selects
        the one that came through an organization's connection, absent means the realm's. Needs a fresh
        [re-authentication](#tag/auth) (`X-Backd-Reauth`). The last one can't be removed
        (`409 last_sign_in_method`), so a user can't lock themselves out. Audited as
        `identity.unlinked`.
      operationId: unlinkIdentity
      security: [{ session: [] }]
      parameters:
        - { $ref: "#/components/parameters/reauth" }
        - { name: org, in: query, description: "An organization's id: unlink the identity of that organization's connection.", schema: { type: string } }
      responses:
        "204": { description: Sign-in method removed. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  # ── /_admin ───────────────────────────────────────────────────────────
  /v1/{realm}/_admin/users:
    parameters: [{ $ref: "#/components/parameters/realm" }]
    get:
      tags: [admin]
      summary: List users, or find one by email
      operationId: adminListUsers
      security: [{ apiKey: [] }, { session: [] }]
      parameters:
        - name: email
          in: query
          description: Exact email (case-insensitive); returns zero or one user.
          schema: { type: string }
        - name: q
          in: query
          description: >-
            Users whose email contains this text (case-insensitive, plain text, not a
            pattern, at most 254 characters), paged in MongoDB with `limit` and `after` like
            the list. Can't be combined with `email`.
          schema: { type: string, maxLength: 254 }
        - { $ref: "#/components/parameters/limit" }
        - { $ref: "#/components/parameters/skip" }
        - { $ref: "#/components/parameters/deleted" }
        - name: after
          in: query
          description: >-
            The `next_cursor` of the previous page (the last email of it): lists
            the users whose email sorts after it. Can't be combined with `skip`.
          schema: { type: string }
      responses:
        "200":
          description: A page of users, sorted by email, read from the database one page at a time.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, limit, skip, has_more]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/AdminUser" } }
                  limit: { type: integer }
                  skip: { type: integer }
                  has_more: { type: boolean }
                  next_cursor: { type: string, description: "Present when `has_more` and the list isn't an exact `email` lookup: pass it as `after`." }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [admin]
      summary: Create a user
      operationId: adminCreateUser
      security: [{ apiKey: [] }, { session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8, maxLength: 128 }
      responses:
        "201":
          description: The user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/users/{id}:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/id" }
    get:
      tags: [admin]
      summary: Get a user
      operationId: adminGetUser
      security: [{ apiKey: [] }, { session: [] }]
      responses:
        "200": { $ref: "#/components/responses/AdminUser" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      tags: [admin]
      summary: Change a user's flags
      description: Only `email_verified` and `disabled`; emails can't be changed.
      operationId: adminUpdateUser
      security: [{ apiKey: [] }, { session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                email_verified: { type: boolean }
                disabled: { type: boolean }
      responses:
        "200": { $ref: "#/components/responses/AdminUser" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [admin]
      summary: Erase a user
      description: |
        **Irreversible.** The user becomes a tombstone at once: their id stays,
        their email becomes `erased-<id>@erased.invalid` (so the real address is
        free again), and their sessions, sign-in methods, email tokens and email
        jobs are deleted. A worker then applies the `collection.yaml` policy of
        every collection that declares one (deleting or anonymizing the documents
        the user owns, removing them from other documents' fields) and records the
        counts in the audit trail as `user.erased`. The answer is the erase job
        (`origin: backd:account.erase` in the jobs list). Repeating the call for a
        user whose erase job failed queues it again; for one still going it
        returns the job. Erasing a user is an administrator's action: deactivating
        (`PATCH` with `disabled`, or the user's own `DELETE /_auth/me`) keeps the
        data.
      operationId: adminDeleteUser
      security: [{ apiKey: [] }, { session: [] }]
      responses:
        "202":
          description: The erase job.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [id, status]
                properties:
                  id: { type: string, description: The erase job's id. }
                  status: { type: string, enum: [queued, running, done] }
        "409": { description: "`already_erased`: the user was erased and nothing is left to do.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/users/{id}/password:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/id" }
    post:
      tags: [admin]
      summary: Set a user's password
      description: Ends all of the user's sessions.
      operationId: adminSetPassword
      security: [{ apiKey: [] }, { session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password]
              properties:
                password: { type: string, minLength: 8, maxLength: 128 }
      responses:
        "204": { description: Password set. }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/passwords:
    parameters: [{ $ref: "#/components/parameters/realm" }]
    get:
      tags: [admin]
      summary: The realm's password epoch and how many accounts have a password
      description: |
        What `POST /_admin/passwords/expire` would affect: the number of accounts with a password,
        and the current epoch (null before any expiry): who set it, when, and the reason.
      operationId: adminPasswordState
      security: [{ apiKey: [] }, { session: [] }]
      responses:
        "200":
          description: The state.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [epoch, accounts]
                properties:
                  accounts: { type: integer }
                  epoch:
                    oneOf:
                      - type: "null"
                      - type: object
                        additionalProperties: false
                        required: [valid_after, set_by, set_at, reason]
                        properties:
                          valid_after: { $ref: "#/components/schemas/Timestamp" }
                          set_by: { type: string }
                          set_at: { $ref: "#/components/schemas/Timestamp" }
                          reason: { type: [string, "null"] }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/passwords/expire:
    parameters: [{ $ref: "#/components/parameters/realm" }]
    post:
      tags: [admin]
      summary: Expire every password of the realm
      description: |
        Moves the realm's password epoch to now: every password set before it stops opening its
        account (`401 password_expired` at sign-in, which queues a reset email), and, unless
        `keep_sessions`, every session ends. A restore of older data doesn't bring old passwords
        back, because the epoch is in the system database. The epoch only moves forward (`409`
        when one as late as now exists). Needs full admin access, and a session a fresh
        re-authentication. Audited as `password.expire` with the reason and the counts.
      operationId: adminExpirePasswords
      security: [{ apiKey: [] }, { session: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason: { type: string, maxLength: 500, description: "Why, for the audit trail." }
                keep_sessions: { type: boolean, description: "Keep the sessions: a planned rotation rather than a breach." }
                notify: { type: boolean, description: "Also start the job that emails every user a link to choose a new password (`409` before anything changes when the realm sends no email)." }
      responses:
        "200":
          description: The epoch and what it touched.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [valid_after, accounts, sessions]
                properties:
                  valid_after: { $ref: "#/components/schemas/Timestamp" }
                  accounts: { type: integer, description: "Accounts with a password." }
                  sessions: { type: integer, description: "Sessions ended." }
                  notify_job: { type: string, description: "The id of the notification job, with `notify`. Follow it with `GET /_admin/jobs/{id}`." }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/passwords/notify:
    parameters: [{ $ref: "#/components/parameters/realm" }]
    post:
      tags: [admin]
      summary: Tell the users whose password expired to choose a new one
      description: |
        Starts the job (origin `backd:password.notify`) that walks the users with a password, in id
        order, and queues the `password-expired` email, a reset link each, for those whose
        password was set before the realm's epoch: enabled, with a verified address, and not told
        already (after the epoch). It goes through the email queue, so the email limits apply:
        users they hold back are told after a wait, not failed. The job reports its progress as a
        step, can be cancelled with `POST /_admin/jobs/{id}/cancel`, and starting it again after a
        cancel or a failure goes on without writing to anyone twice. One at a time (`409` with the
        running job's id). `409` too without `email:` in `realm.yaml`, or before any password was
        expired. Needs full admin access and, for a session, a fresh re-authentication. Audited as
        `password.expire_notify` when it ends.
      operationId: adminNotifyExpiredPasswords
      security: [{ apiKey: [] }, { session: [] }]
      responses:
        "202":
          description: The job.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [id, status]
                properties:
                  id: { type: string }
                  status: { type: string }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/sessions:
    parameters: [{ $ref: "#/components/parameters/realm" }]
    delete:
      tags: [admin]
      summary: End every session of the realm
      description: |
        Revokes every session, and the push devices they registered, without touching any
        password. Needs full admin access, and a session a fresh re-authentication. Audited as
        `session.revoke_all`.
      operationId: adminRevokeAllSessions
      security: [{ apiKey: [] }, { session: [] }]
      responses:
        "200":
          description: How many sessions ended.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [sessions]
                properties:
                  sessions: { type: integer }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/users/{id}/reset-link:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/id" }
    post:
      tags: [admin]
      summary: Make a password reset link for a user
      description: |
        A one-time link to choose a new password, for a user the email can't reach (hand it over out
        of band). It is the link a reset email carries and works the same: it sets the password,
        ends the user's sessions and sends `password-changed`; unused, it expires like a reset
        token (`account.tokens.reset_password`). Nothing is sent, and the link is in this answer
        only. The realm needs `email:` (its pages serve the form) and a public address. Needs full
        admin access and, for a session, a fresh re-authentication; an administrator can't make
        one for a user with rights they lack. `409` for a disabled or erased user. Audited as
        `password.reset_link` (administrator and user, never the token).
      operationId: adminResetLink
      security: [{ apiKey: [] }, { session: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                redirect_to: { type: string, description: "Where the page sends the user afterwards; must be within `email.allowed_redirects`." }
      responses:
        "200":
          description: The link, once.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [link, expires_at]
                properties:
                  link: { type: string }
                  expires_at: { $ref: "#/components/schemas/Timestamp" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/users/{id}/expire-password:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/id" }
    post:
      tags: [admin]
      summary: Expire a user's password
      description: |
        The password stops opening the account (`401 password_expired` at sign-in, and at
        re-authentication with the password) until the user resets it or an administrator sets a
        new one. The user's sessions are left alone. Audited as `password.expire`.
      operationId: adminExpirePassword
      security: [{ apiKey: [] }, { session: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason: { type: string, maxLength: 500, description: "Why, for the audit trail." }
      responses:
        "204": { description: Password expired. }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/users/{id}/email:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/id" }
    post:
      tags: [admin]
      summary: Change a user's email address
      description: |
        Applies at once, in any realm with `email` (`404` without), whatever
        `account.allow_email_change` says: the administrator vouches for the
        address, so it counts as verified. Ends all of the user's sessions. The
        old address is sent `email-changed` with a link to undo it for 7 days,
        and the new one is told. Audited as `user.email_changed`.
      operationId: adminChangeEmail
      security: [{ apiKey: [] }, { session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email: { type: string }
      responses:
        "200": { $ref: "#/components/responses/AdminUser" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/users/{id}/owned:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/id" }
    get:
      tags: [admin]
      summary: What erasing a user would do
      description: |
        A preview for an erase, **only for the collections that declare a policy**
        (`collection.yaml`): the action, how many documents the user owns, and
        how many documents hold the user in a `pull` or `unset` field. The
        collections without a policy are listed by name and not counted: an erase
        leaves them alone. Counts come from the queries the erase uses; no
        document content is returned.
      operationId: adminOwned
      security: [{ apiKey: [] }, { session: [] }]
      responses:
        "200":
          description: The report.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OwnedReport" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/users/{id}/sessions:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/id" }
    get:
      tags: [admin]
      summary: A user's sessions
      description: The user's unexpired sessions, newest first. Never a token. Needs the `users` area.
      operationId: adminUserSessions
      security: [{ apiKey: [] }, { session: [] }]
      responses:
        "200":
          description: The sessions.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [id, created_at, last_used_at, expires_at]
                      properties:
                        id: { type: string }
                        created_at: { $ref: "#/components/schemas/Timestamp" }
                        last_used_at: { $ref: "#/components/schemas/Timestamp" }
                        expires_at: { $ref: "#/components/schemas/Timestamp" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/users/{id}/sessions/{session_id}:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/id" }
      - { name: session_id, in: path, required: true, schema: { type: string } }
    delete:
      tags: [admin]
      summary: End a user's session
      description: The token stops working at once. Audited as `session.revoke`. Needs the `users` area to change.
      operationId: adminRevokeUserSession
      security: [{ apiKey: [] }, { session: [] }]
      responses:
        "204":
          description: Session ended.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/push:
    parameters: [{ $ref: "#/components/parameters/realm" }]
    get:
      tags: [admin]
      summary: How the realm's push is configured
      description: |
        Whether the realm has a `push:` section, the platforms it enables with their provider, the
        realm secrets those providers need that are **not set** (pushes answer `503 push_unavailable`
        until they are), and the limits and retention. Never a secret's value. Needs the `functions`
        area (read).
      operationId: adminPushStatus
      security: [{ apiKey: [] }, { session: [] }]
      responses:
        "200":
          description: "The state: `enabled: false` is all there is for a realm without `push:`."
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [enabled]
                properties:
                  enabled: { type: boolean }
                  platforms:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [platform, provider]
                      properties:
                        platform: { type: string, enum: [android, ios, web] }
                        provider: { type: string, enum: [fcm, apns, webpush, capture] }
                  missing_secrets: { type: array, items: { type: string } }
                  limits:
                    type: object
                    additionalProperties: false
                    properties:
                      per_minute: { type: integer }
                      per_day: { type: integer }
                  devices:
                    type: object
                    additionalProperties: false
                    properties:
                      max_per_user: { type: integer }
                      stale_after: { type: string }
                  delivery:
                    type: object
                    additionalProperties: false
                    properties:
                      timeout: { type: string }
                      attempts: { type: integer }
                      parallelism: { type: integer }
                  send_retention: { type: string }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/push/sends:
    parameters: [{ $ref: "#/components/parameters/realm" }]
    get:
      tags: [admin]
      summary: The realm's push sends
      description: |
        One record per send, newest first: its totals (users queued, limited or with no device;
        devices sent, removed as dead or failed) and how far its batches and delivery units are.
        **Titles, bodies, data and tokens are never stored in a record**; it expires after
        `push.send_retention`. Needs the `functions` area (read).
      operationId: adminListPushSends
      security: [{ apiKey: [] }, { session: [] }]
      parameters:
        - { name: kind, in: query, schema: { type: string }, description: "A template kind, or `raw`." }
        - { name: function, in: query, schema: { type: string }, description: "`<database>/<name>` of the function that sent." }
        - { name: since, in: query, schema: { type: string, format: date-time } }
        - { name: until, in: query, schema: { type: string, format: date-time } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200 } }
        - { name: skip, in: query, schema: { type: integer, minimum: 0 } }
      responses:
        "200":
          description: The sends.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, limit, skip, has_more]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/PushSend" }
                  limit: { type: integer }
                  skip: { type: integer }
                  has_more: { type: boolean }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/push/sends/{id}:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/id" }
    get:
      tags: [admin]
      summary: One push send
      operationId: adminGetPushSend
      security: [{ apiKey: [] }, { session: [] }]
      responses:
        "200":
          description: The send.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PushSend" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/push/devices:
    parameters: [{ $ref: "#/components/parameters/realm" }]
    delete:
      tags: [admin]
      summary: Remove every device of a platform
      description: |
        Removes all the realm's devices of a platform at once. It is what rotating the VAPID key
        (`backd push web-keys --rotate`) does for `web`: browsers made their subscriptions under
        the old public key, so they are useless, and apps subscribe again at their next launch.
        Audited as `push.devices_removed`. Needs the `users` area.
      operationId: adminRemovePushDevices
      security: [{ apiKey: [] }, { session: [] }]
      parameters:
        - { name: platform, in: query, required: true, schema: { type: string, enum: [android, ios, web] } }
      responses:
        "200":
          description: How many devices went.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [platform, removed]
                properties:
                  platform: { type: string }
                  removed: { type: integer }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/push/test:
    parameters: [{ $ref: "#/components/parameters/realm" }]
    post:
      tags: [admin]
      summary: Send one user a test push
      description: |
        Sends a push to one user, the way a function would: rendered in every language and
        checked against the providers. It goes through the same limits as any push and **counts
        toward the user's**; it is audited as `push.test`. The record of the send names the
        administrator as its sender. Needs the `users` area.
      operationId: adminTestPush
      security: [{ apiKey: [] }, { session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                user: { type: string, description: "The user's id. Give this or `email`." }
                email: { type: string, format: email }
                kind: { type: string, description: "A template kind of the realm; without it, `title` and `body`." }
                title: { type: string }
                body: { type: string }
                link: { type: string }
                data: { type: object, additionalProperties: { type: string } }
                silent: { type: boolean }
                platform: { type: object, additionalProperties: { type: object } }
      responses:
        "202":
          description: "Planned: how many users were queued, limited or had no device."
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [send_id, users, queued, limited, no_devices]
                properties:
                  send_id: { type: string }
                  users: { type: integer }
                  queued: { type: integer }
                  limited: { type: integer }
                  no_devices: { type: integer }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/users/{id}/devices:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/id" }
    get:
      tags: [admin]
      summary: A user's registered devices
      description: The devices the user registered for push notifications, most recently seen first. Never a token. Needs the `users` area; `404 push_not_configured` in a realm without `push:`.
      operationId: adminUserDevices
      security: [{ apiKey: [] }, { session: [] }]
      responses:
        "200":
          description: The devices.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Device" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/users/{id}/devices/{device_id}:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/id" }
      - { name: device_id, in: path, required: true, schema: { type: string } }
    delete:
      tags: [admin]
      summary: Remove a user's device
      description: The device stops receiving pushes at once. Audited as `device.removed`. Needs the `users` area.
      operationId: adminRemoveUserDevice
      security: [{ apiKey: [] }, { session: [] }]
      responses:
        "204":
          description: Device removed.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/orgs:
    parameters: [{ $ref: "#/components/parameters/realm" }]
    get:
      tags: [admin]
      summary: List organizations
      description: Every organization of the realm, newest first, whatever its status. Needs the `users` area.
      operationId: adminListOrganizations
      security: [{ apiKey: [] }, { session: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [active, orphaned, deleted] } }
        - { name: q, in: query, description: Only organizations whose name or slug contains it (case-insensitive)., schema: { type: string } }
      responses:
        "200":
          description: The organizations, each with its number of members.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/OrganizationRecord" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [admin]
      summary: Create an organization for a user
      description: The owner holds the realm's `creator_roles`. Not limited by the create rule or `max_created_per_user`. Audited as `org.create`. Needs the `users` area.
      operationId: adminCreateOrganization
      security: [{ apiKey: [] }, { session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, owner]
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                slug: { type: string, maxLength: 63 }
                owner: { type: string, description: "A user id." }
      responses:
        "201":
          description: The organization.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/orgs/{org}:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/org" }
    get:
      tags: [admin]
      summary: One organization
      operationId: adminGetOrganization
      security: [{ apiKey: [] }, { session: [] }]
      responses:
        "200":
          description: The organization with its claims.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationRecord" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

    delete:
      tags: [admin]
      summary: Delete an organization
      description: |
        Like the member route, without the proof. Access ends at once and a job applies `on_org_delete`;
        see `GET .../owned` first. Audited as `org.delete` and, when the cleanup finishes, `org.deleted`
        with counts. Needs the `users` area with write access.
      operationId: adminDeleteOrganization
      security: [{ apiKey: [] }, { session: [] }]
      responses:
        "204":
          description: The organization was deleted.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/orgs/{org}/owned:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/org" }
    get:
      tags: [admin]
      summary: What deleting an organization would do
      description: The documents the organization holds in each collection that has organizations, and what its `on_org_delete` will do with them, counts only. Needs the `users` area.
      operationId: adminOrganizationOwned
      security: [{ apiKey: [] }, { session: [] }]
      responses:
        "200":
          description: The report.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationOwned" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/orgs/{org}/reactivate:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/org" }
    post:
      tags: [admin]
      summary: Bring a deleted organization back
      description: |
        Makes it `active` again **with no members**: assign an owner next (`POST .../owner`).
        Documents kept under `keep` are visible to members again; those under `delete` are gone.
        It takes its former slug back unless it is in use (`409 slug_taken`); `slug` picks another.
        Audited as `org.reactivate`. Needs the `users` area with write access.
      operationId: adminReactivateOrganization
      security: [{ apiKey: [] }, { session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                slug: { type: string, maxLength: 63 }
      responses:
        "200":
          description: The organization.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationRecord" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/orgs/{org}/members:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/org" }
    get:
      tags: [admin]
      summary: An organization's members, with emails
      operationId: adminListOrganizationMembers
      security: [{ apiKey: [] }, { session: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
        - { name: after, in: query, schema: { type: string } }
      responses:
        "200":
          description: A page of members.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationMembers" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [admin]
      summary: Add a member directly
      description: "Bypasses invitations: the user becomes a member (or gains the roles) at once. Audited as `org.member_add`. Needs the `users` area."
      operationId: adminAddOrganizationMember
      security: [{ apiKey: [] }, { session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [user]
              properties:
                user: { type: string, description: "A user id." }
                roles: { type: array, items: { type: string } }
      responses:
        "200":
          description: The member.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationMember" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/orgs/{org}/members/{user}:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/org" }
      - { name: user, in: path, required: true, schema: { type: string } }
    patch:
      tags: [admin]
      summary: Replace a member's direct roles
      operationId: adminSetOrganizationMemberRoles
      security: [{ apiKey: [] }, { session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [roles]
              properties:
                roles: { type: array, items: { type: string } }
      responses:
        "200":
          description: The member.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationMember" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [admin]
      summary: Remove a member
      description: "The last member who can manage the organization can't be removed (`409 last_org_manager`): assign another owner first."
      operationId: adminRemoveOrganizationMember
      security: [{ apiKey: [] }, { session: [] }]
      responses:
        "204":
          description: The member was removed.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/orgs/{org}/claims:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/org" }
    put:
      tags: [admin]
      summary: Replace an organization's claims
      description: |
        Claims are a JSON object of at most 1 KiB (typical: `plan`, `seats`, `features`) that members
        read and rules can use. Only realm administrators and functions write them. An empty object
        clears them. Audited as `org.claims` with the keys, never the values. Needs the `users` area.
      operationId: adminSetOrganizationClaims
      security: [{ apiKey: [] }, { session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: The organization.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationRecord" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/orgs/{org}/sso:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/org" }
    get:
      tags: [admin]
      summary: An organization's sign-in connections (administrator)
      description: |
        The providers the organization connected, with what a client needs to finish the setup:
        whether the client secret is stored (never its value) and the redirect address to register
        with each provider. `providers` and `max_connections` are the realm's `organizations.sso`
        limits. Needs the `users` area. With `organizations.sso` off in `realm.yaml` the whole surface answers `404`.
      operationId: adminListOrganizationConnections
      security: [{ apiKey: [] }, { session: [] }]
      responses:
        "200":
          description: The connections, sorted by provider.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationConnections" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/orgs/{org}/sso/{provider}:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/org" }
      - { $ref: "#/components/parameters/ssoProvider" }
    get:
      tags: [admin]
      summary: One sign-in connection (administrator)
      operationId: adminGetOrganizationConnection
      security: [{ apiKey: [] }, { session: [] }]
      responses:
        "200":
          description: The connection.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationConnection" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    put:
      tags: [admin]
      summary: Set an organization's sign-in connection (administrator)
      description: |
        Creates the connection or replaces every field of it. The client secret is **write-only**:
        sent here it is stored as an organization secret (sealed with the instance key, readable by
        nobody, not by functions), and left out it keeps the stored one (required the first time).
        Who may come in is the restriction: `hosted_domain` (Google Workspace) or `tenant` (a Microsoft
        tenant id; `common`, `organizations` and `consumers` are refused). `join_roles` follow the
        granting rules: an administrator may give any role.
        Audited as `org.sso.set`, without the secret.
      operationId: adminSetOrganizationConnection
      security: [{ apiKey: [] }, { session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrganizationConnectionInput" }
      responses:
        "200":
          description: The connection, without its secret.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationConnection" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [admin]
      summary: Remove an organization's sign-in connection (administrator)
      description: |
        Removes the connection and its client secret. Audited as `org.sso.deleted`.
      operationId: adminDeleteOrganizationConnection
      security: [{ apiKey: [] }, { session: [] }]
      responses:
        "204":
          description: Removed.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/orgs/{org}/owner:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/org" }
    post:
      tags: [admin]
      summary: Assign a manager
      description: Gives the user the realm's `creator_roles` in the organization, for one left without a manager (`orphaned`), which becomes `active` again. Audited as `org.owner_assign`. Needs the `users` area.
      operationId: adminAssignOrganizationOwner
      security: [{ apiKey: [] }, { session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [user]
              properties:
                user: { type: string, description: "A user id." }
      responses:
        "200":
          description: The member.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationMember" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/orgs/{org}/invitations:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/org" }
    get:
      tags: [admin]
      summary: An organization's invitations
      operationId: adminListOrganizationInvitations
      security: [{ apiKey: [] }, { session: [] }]
      responses:
        "200":
          description: The invitations, never tokens.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/OrganizationInvitation" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [admin]
      summary: Invite to an organization
      description: Like the member route, without the granting rules (an administrator may give any role). Audited as `org.invitation_create`. Needs the `users` area with write access.
      operationId: adminCreateOrganizationInvitation
      security: [{ apiKey: [] }, { session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrganizationInvitationInput" }
      responses:
        "201":
          description: The invitation, with its token and link.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationInvitationCreated" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/orgs/{org}/invitations/{id}:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/org" }
      - { $ref: "#/components/parameters/id" }
    delete:
      tags: [admin]
      summary: Revoke an invitation
      operationId: adminRevokeOrganizationInvitation
      security: [{ apiKey: [] }, { session: [] }]
      responses:
        "204":
          description: The invitation was revoked.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/orgs/{org}/invitations/{id}/link:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/org" }
      - { $ref: "#/components/parameters/id" }
    post:
      tags: [admin]
      summary: Issue a new link
      operationId: adminRenewOrganizationInvitationLink
      security: [{ apiKey: [] }, { session: [] }]
      responses:
        "200":
          description: The invitation with its new token and link.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationInvitationCreated" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/orgs/{org}/teams:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/org" }
    get:
      tags: [admin]
      summary: An organization's teams
      description: Groups of members that carry organization roles, sorted by name.
      operationId: adminListOrganizationTeams
      security: [{ apiKey: [] }, { session: [] }]
      responses:
        "200":
          description: The teams.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/OrganizationTeam" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [admin]
      summary: Create a team
      description: |
        A team carries organization roles, which its members hold in addition to their direct roles.
        `roles` follow the granting rules: only roles the caller could give themselves. Names are unique
        in the organization (`409 team_name_taken`), up to `max_teams_per_org` (`409 team_limit_reached`).
        Needs the `users` area with write access.
      operationId: adminCreateOrganizationTeam
      security: [{ apiKey: [] }, { session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 60 }
                roles: { type: array, items: { type: string } }
      responses:
        "201":
          description: The team.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationTeam" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/orgs/{org}/teams/{team}:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/org" }
      - { name: team, in: path, required: true, schema: { type: string } }
    patch:
      tags: [admin]
      summary: Rename a team or change its roles
      description: The roles it gains or loses follow the granting rules, and the organization keeps a member who can manage it (`409 last_org_manager`). Changes apply at the members' next request. Needs the `users` area with write access.
      operationId: adminUpdateOrganizationTeam
      security: [{ apiKey: [] }, { session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, minLength: 1, maxLength: 60 }
                roles: { type: array, items: { type: string } }
      responses:
        "200":
          description: The team.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationTeam" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [admin]
      summary: Delete a team
      description: It leaves every membership, and its roles go with it. Needs the `users` area with write access.
      operationId: adminDeleteOrganizationTeam
      security: [{ apiKey: [] }, { session: [] }]
      responses:
        "204":
          description: The team was deleted.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/orgs/{org}/teams/{team}/members:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/org" }
      - { name: team, in: path, required: true, schema: { type: string } }
    get:
      tags: [admin]
      summary: The members and role holders of a team
      description: |
        A page, sorted by user id, of the organization's members who belong to the team and of
        those who hold a team role in it, whether or not they belong. Grants outside their
        window are left out. With `role`, only the holders of that role. Emails appear according
        to the realm's `members_visible_to`. Needs the `users` area (write access to grant and revoke).
      operationId: adminListOrganizationTeamMembers
      security: [{ apiKey: [] }, { session: [] }]
      parameters:
        - { name: role, in: query, description: "A team role declared in `organizations.team_roles`.", schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
        - { name: after, in: query, description: "The `next` of the previous page.", schema: { type: string } }
      responses:
        "200":
          description: A page of members and holders.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationTeamMembers" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/orgs/{org}/teams/{team}/roles:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/org" }
      - { name: team, in: path, required: true, schema: { type: string } }
    post:
      tags: [admin]
      summary: Give a member a team role
      description: |
        The member must belong to the organization, not to the team: a team role can be held
        outside it. Granting what is already held changes nothing. At most 50 team role grants
        per member (`409 team_limit_reached`). Needs the `users` area (write access to grant and revoke).
      operationId: adminGrantOrganizationTeamRole
      security: [{ apiKey: [] }, { session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrganizationTeamRoleInput" }
      responses:
        "200":
          description: The member as seen from the team.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationTeamMember" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      tags: [admin]
      summary: Change the window of a team role grant
      description: |
        Replaces `from` and `until` of a grant the member holds (absent means open); `404` when
        the member doesn't hold the role in the team. Needs the `users` area with write access.
      operationId: adminChangeOrganizationTeamRoleWindow
      security: [{ apiKey: [] }, { session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrganizationTeamRoleInput" }
      responses:
        "200":
          description: The member as seen from the team.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationTeamMember" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [admin]
      summary: Take a team role from a member
      description: Access through the role ends at the member's next request. Needs the `users` area with write access.
      operationId: adminRevokeOrganizationTeamRole
      security: [{ apiKey: [] }, { session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrganizationTeamRoleRef" }
      responses:
        "200":
          description: The member as seen from the team.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationTeamMember" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/orgs/{org}/teams/{team}/members/{user}:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/org" }
      - { name: team, in: path, required: true, schema: { type: string } }
      - { name: user, in: path, required: true, schema: { type: string } }
    put:
      tags: [admin]
      summary: Put a member in a team
      description: The user must be a member of the organization. They gain the team's roles, which the caller must be able to give (`403 forbidden`). Up to `max_teams_per_member` (`409 team_limit_reached`). Needs the `users` area with write access.
      operationId: adminAddOrganizationTeamMember
      security: [{ apiKey: [] }, { session: [] }]
      responses:
        "200":
          description: The member.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationMember" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [admin]
      summary: Take a member out of a team
      description: They lose the team's roles at their next request, unless they hold them another way. The last member who can manage the organization stays (`409 last_org_manager`). Needs the `users` area with write access.
      operationId: adminRemoveOrganizationTeamMember
      security: [{ apiKey: [] }, { session: [] }]
      responses:
        "200":
          description: The member.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationMember" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/users/{id}/identities:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/id" }
    get:
      tags: [admin]
      summary: A user's sign-in methods
      description: |
        The user's ways to sign in, oldest first, as `GET /_auth/me` lists them for the user:
        a password and the providers they use, with the address each reported and when it was
        linked and last used. Never a provider's subject, a hash or a token. Needs the `users` area.
      operationId: adminUserIdentities
      security: [{ apiKey: [] }, { session: [] }]
      responses:
        "200":
          description: The sign-in methods.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Identity" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/users/{id}/consents:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/id" }
    get:
      tags: [admin]
      summary: A user's consents and their history
      description: |
        The version of each consent the user holds, and every record of their history, oldest
        first, with the hash of the text shown and the evidence of records made by an
        administrator. Needs the `users` area.
      operationId: adminUserConsents
      security: [{ apiKey: [] }, { session: [] }]
      responses:
        "200":
          description: The consents.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [consents, history]
                properties:
                  consents: { $ref: "#/components/schemas/ConsentsGiven" }
                  history:
                    type: array
                    items: { $ref: "#/components/schemas/AdminConsentRecord" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [admin]
      summary: Record a consent given or withdrawn outside the app
      description: |
        For consents given on paper or by phone: the record has the method `admin` and the
        `evidence` (a ticket, a form number), which is required, and is audited as
        `user.consent_recorded`. `version` is required for `accepted` and must be a version
        with a text. Needs the `users` area with write access.
      operationId: adminRecordConsent
      security: [{ apiKey: [] }, { session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [consent, action, evidence]
              properties:
                consent: { type: string }
                version: { type: string }
                action: { type: string, enum: [accepted, withdrawn] }
                evidence: { type: string, maxLength: 500 }
      responses:
        "201":
          description: The record.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [consent, version, action, method, evidence, at]
                properties:
                  consent: { type: string }
                  version: { type: string }
                  action: { type: string }
                  method: { const: admin }
                  evidence: { type: string }
                  at: { $ref: "#/components/schemas/Timestamp" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/users/{id}/export:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/id" }
    post:
      tags: [admin]
      summary: Export a user's personal data on their behalf
      description: |
        Produces, for a formal request, the same package the user can ask for themselves (see
        `POST /_auth/me/export`): the documents the erasure model finds for them, their files, the
        system data about them, a manifest and a `README.html`. The package goes to the administrator,
        who downloads it with `GET /_admin/users/{id}/exports/{export}/download`; it is deleted after
        `compliance.export_retention`.

        The user is told by email (`data-export-made`) unless `no_notify` is true, which needs a
        `reason` that is kept in the audit record: such exports are audited as
        `user.data_export_requested_silently`, apart from those the user was told about
        (`user.data_export_requested`). `ticket` is the reference of the request (a support ticket).

        Needs **full admin access** and, for a signed-in administrator, a fresh
        [re-authentication](#tag/auth) (`X-Backd-Reauth`). `404` when the realm does not export
        (`compliance.export`), `409` for an erased user, or while another export of the user is
        queued or running.
      operationId: adminExportUser
      security: [{ apiKey: [] }, { session: [] }]
      parameters: [{ $ref: "#/components/parameters/reauth" }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                ticket: { type: string, maxLength: 200 }
                no_notify: { type: boolean, description: "Do not tell the user. Requires `reason`." }
                reason: { type: string, maxLength: 500, description: "Why the user is not told; only with `no_notify`." }
      responses:
        "202":
          description: The export was queued.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminDataExport" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/users/{id}/exports:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/id" }
    get:
      tags: [admin]
      summary: A user's exports
      description: |
        All the exports of the user, newest first: those they asked for and those made for them, with
        who asked, whether the user was told and, for a silent one, the reason. Needs the `users` area.
      operationId: adminUserExports
      security: [{ apiKey: [] }, { session: [] }]
      responses:
        "200":
          description: Exports.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AdminDataExport" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/users/{id}/exports/{export}:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/id" }
      - { name: export, in: path, required: true, schema: { type: string } }
    get:
      tags: [admin]
      summary: One export, for a client that waits for it
      description: While it is queued or running, `step` names what it is doing. Needs the `users` area.
      operationId: adminUserExport
      security: [{ apiKey: [] }, { session: [] }]
      responses:
        "200":
          description: The export.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminDataExport" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/users/{id}/exports/{export}/download:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/id" }
      - { name: export, in: path, required: true, schema: { type: string } }
    get:
      tags: [admin]
      summary: Download an export made for the user
      description: |
        The zip, through the API (never a link to the storage). Needs **full admin access** and a fresh
        re-authentication, as making it did; audited as `user.data_export_downloaded` with who took it.
        Only the exports an administrator made: what the user asked for themselves is theirs to
        download (`403`). `409` until it is ready, `410` once it has expired.
      operationId: adminDownloadUserExport
      security: [{ apiKey: [] }, { session: [] }]
      parameters: [{ $ref: "#/components/parameters/reauth" }]
      responses:
        "200":
          description: The package.
          headers: { Content-Disposition: { schema: { type: string } } }
          content:
            application/zip:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/users/{id}/mfa:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/id" }
    get:
      tags: [admin]
      summary: A user's second-factor state
      description: |
        Whether the user has a second factor, which, and how many recovery codes are left, as
        `GET /_auth/mfa` shows it to the user. Never a secret or a code. Needs the `users` area.
      operationId: adminUserMFA
      security: [{ apiKey: [] }, { session: [] }]
      responses:
        "200":
          description: The state.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [available, enabled, methods, recovery_codes_left, required]
                properties:
                  available: { type: boolean }
                  enabled: { type: boolean }
                  methods: { type: array, items: { type: string, enum: [totp, recovery_code] } }
                  recovery_codes_left: { type: integer }
                  required: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/users/{id}/mfa/reset:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/id" }
    post:
      tags: [admin]
      summary: Remove a user's second factor
      description: |
        For a user who lost both their authenticator app and their recovery codes: removes the
        TOTP secret and the recovery codes and **ends every session** of the user, who is told by
        email (`mfa-reset`). A user in a role that requires MFA sets one up again at their next
        sign-in. Audited as `user.mfa_reset` with the administrator as the actor. Needs the `users`
        area, and an administrator can't reset their own second factor (`403
        self_reset_not_allowed`): ask another administrator, or an operator with
        `backd user mfa-reset --local`. There is no reset by email.
      operationId: adminResetUserMFA
      security: [{ apiKey: [] }, { session: [] }]
      responses:
        "204": { description: The second factor was removed. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: "`mfa_not_enabled`: the user has no second factor."
          headers: { X-Request-ID: { $ref: "#/components/headers/RequestID" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/mfa:
    parameters: [{ $ref: "#/components/parameters/realm" }]
    get:
      tags: [admin]
      summary: Who must set a second factor up
      description: |
        The roles the realm requires MFA for (`mfa.required_roles`) and the users of those roles
        who have none yet, up to 200 (`total_without_mfa` counts them all); disabled and erased
        users are not listed. Their next sign-in asks them to set one up. Needs the `users` area.
      operationId: adminMFAOverview
      security: [{ apiKey: [] }, { session: [] }]
      responses:
        "200":
          description: The overview.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [enabled, required_all, required_roles, users_without_mfa, total_without_mfa]
                properties:
                  enabled: { type: boolean, description: "`false` when the realm lets no user turn a second factor on." }
                  required_all: { type: boolean }
                  required_roles: { type: array, items: { type: string } }
                  users_without_mfa:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [id, email, roles]
                      properties:
                        id: { type: string }
                        email: { type: string }
                        roles: { type: array, items: { type: string } }
                  total_without_mfa: { type: integer }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/users/{id}/identities/{provider}:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/id" }
      - { $ref: "#/components/parameters/oauthProvider" }
    delete:
      tags: [admin]
      summary: Remove one of a user's sign-in methods
      description: |
        Unlinks the user's sign-in method of that provider (`password` included), for example to
        undo a link made by mistake. The last one can't be removed (`409 last_sign_in_method`),
        and a provider the user doesn't have is `404`. Audited as `identity.unlinked`, with the
        administrator as the actor. Removing Apple also revokes the user's Apple tokens.
        Needs the `users` area to change.
      operationId: adminUnlinkUserIdentity
      security: [{ apiKey: [] }, { session: [] }]
      parameters:
        - { name: org, in: query, description: "An organization's id: unlink the identity of that organization's connection.", schema: { type: string } }
      responses:
        "204":
          description: Sign-in method removed.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/users/{id}/roles/{role}:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/id" }
      - name: role
        in: path
        required: true
        description: A role declared in the realm's realm.yaml.
        schema: { type: string }
    put:
      tags: [admin]
      summary: Assign a role
      operationId: adminAddRole
      security: [{ apiKey: [] }, { session: [] }]
      responses:
        "200": { $ref: "#/components/responses/AdminUser" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [admin]
      summary: Take a role away
      operationId: adminRemoveRole
      security: [{ apiKey: [] }, { session: [] }]
      responses:
        "200": { $ref: "#/components/responses/AdminUser" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/users/{id}/networks:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/id" }
    put:
      tags: [admin]
      summary: Set a user's network restrictions
      description: >-
        Replaces the user's admin and login networks (IP addresses or CIDR
        networks). Empty lists remove the restrictions. Admin networks must
        lie within the realm's `admin.allowed_networks`. `realm.yaml`
        settings for the user win at the next startup.
      operationId: adminSetUserNetworks
      security: [{ apiKey: [] }, { session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [admin_networks, login_networks]
              properties:
                admin_networks: { type: array, items: { type: string } }
                login_networks: { type: array, items: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/AdminUser" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/apikeys:
    parameters: [{ $ref: "#/components/parameters/realm" }]
    get:
      tags: [admin]
      summary: List API keys
      operationId: adminListAPIKeys
      security: [{ apiKey: [] }, { session: [] }]
      responses:
        "200":
          description: The realm's API keys, by name; never the keys themselves.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/APIKey" } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [admin]
      summary: Create an API key
      description: >-
        An administrator signed in with a session (not an admin key) needs a fresh
        [re-authentication](#tag/auth) (`X-Backd-Reauth`): a key outlives the session and is not
        asked for a second factor. They also get a `security-notice` email that a key was created.
      operationId: adminCreateAPIKey
      security: [{ apiKey: [] }, { session: [] }]
      parameters: [{ $ref: "#/components/parameters/reauth" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, description: "Same rules as realm names; unique in the realm." }
                role: { enum: [data, admin], description: "Default data." }
                expires_in: { type: string, description: "Days (`90d`) or Go duration (`12h`); default: never.", examples: ["90d"] }
                networks: { type: array, items: { type: string }, description: "IP addresses or CIDR networks the key may be used from." }
                scopes:
                  type: array
                  maxItems: 32
                  items: { type: string, examples: ["read:blog/posts", "write:orders", "call:main/export"] }
                  description: >-
                    What a data key reaches; none means everything. Each grant is `read`, `write` or `call`,
                    optionally followed by `:<database>` or `:<database>/<collection or function>`. `write` means
                    create, update and delete (not read); `call` also lets the key read the jobs of the functions
                    it may call. Anything not granted answers `403`. Not for admin keys.
      responses:
        "201":
          description: The key, shown only here.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/APIKeyCreated" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/apikeys/{name}:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - name: name
        in: path
        required: true
        schema: { type: string }
    delete:
      tags: [admin]
      summary: Revoke an API key
      description: The key stops working at once.
      operationId: adminRevokeAPIKey
      security: [{ apiKey: [] }, { session: [] }]
      responses:
        "204": { description: Key revoked. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/secrets:
    parameters: [{ $ref: "#/components/parameters/realm" }]
    get:
      tags: [admin]
      summary: List secrets
      description: Metadata only — scope, name, type and who last changed it; for keys also the fingerprint and the fields using them. Values are write-only.
      operationId: adminListSecrets
      security: [{ apiKey: [] }, { session: [] }]
      responses:
        "200":
          description: The realm's secrets, by scope and name; never their values.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Secret" } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

    post:
      tags: [admin]
      summary: Create a field key
      description: |
        Creates a `key` secret for field encryption: 32 random bytes the server generates
        (`generate: true`) or a key you import (`value`, 32 bytes in base64url). **A generated key
        is in this answer and nowhere else, ever**: the developer keeps the only copy, and a lost
        key means the values encrypted with it are lost. Imported keys answer with the fingerprint
        alone. A name already taken, by a key or by a plain secret, is refused with `409`. Needs
        full admin access (every area) and a fresh re-authentication; audited as
        `secret.key.create` with the name and fingerprint, never the key. Values of plain secrets
        are set with `PUT /_admin/secrets/{name}`.
      operationId: adminCreateKey
      security: [{ apiKey: [] }, { session: [] }]
      parameters: [{ $ref: "#/components/parameters/reauth" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, type]
              properties:
                name: { type: string, description: "Upper-case letters, digits and _, starting with a letter." }
                type: { type: string, enum: [key] }
                generate: { type: boolean, description: "Make a new random key. Give exactly one of `generate` and `value`." }
                value: { type: string, description: "Import this key: 32 bytes in base64url." }
      responses:
        "201":
          description: The key was created. The response is never cached.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [name, type, fingerprint]
                properties:
                  name: { type: string }
                  type: { type: string, enum: [key] }
                  fingerprint: { type: string }
                  key: { type: string, description: "A generated key, base64url. Only this once." }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/secrets/{name}:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - name: name
        in: path
        required: true
        schema: { type: string, description: "Upper-case letters, digits and _, starting with a letter." }
    put:
      tags: [admin]
      summary: Set a secret's value
      description: |
        Creates the secret, or replaces its value: functions read it as
        `ctx.secrets`, decrypted, within about a minute of this call.
        Without `database` it's the realm scope (`realm.NAME` in
        function.yaml); with it, that database's scope (`NAME`, for
        functions of that database only — never another's). With `org`
        it is an organization's secret (the client secrets of its sign-in
        connections): sealed like the others, but no function can declare
        it and no endpoint returns it. Audited as `secret.set` with the
        organization, never the value.
      operationId: adminSetSecret
      security: [{ apiKey: [] }, { session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [value]
              properties:
                value: { type: string, description: "The secret's new value; must not be empty." }
                database: { type: string, description: "Scopes it to this database of the realm instead of the realm itself." }
                org: { type: string, description: "Scopes it to this organization (its id) instead; not together with `database`." }
      responses:
        "204": { description: Secret set. }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [admin]
      summary: Delete a secret
      description: |
        A function that declares it answers `secret_missing` again. Deleting a field key needs
        full admin access and a fresh re-authentication, and is refused with `409` while any field
        still names it; audited as `secret.key.delete`.
      operationId: adminDeleteSecret
      security: [{ apiKey: [] }, { session: [] }]
      parameters:
        - { $ref: "#/components/parameters/reauth" }
        - { name: database, in: query, description: "Its database scope; absent means the realm scope.", schema: { type: string } }
        - { name: org, in: query, description: "An organization's secret (its id), instead of `database`.", schema: { type: string } }
      responses:
        "204": { description: Secret deleted. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/secrets/{name}/rotate:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - name: name
        in: path
        required: true
        schema: { type: string, description: "The field key's name." }
    post:
      tags: [admin]
      summary: Rotate a field key
      description: |
        Gives a field key a new value and wraps every data key it protected again with it: no
        document is rewritten, so the change is instant. The new value is generated here and
        returned once (`generate: true`) or brought by the caller (`value`, 32 bytes in base64url).
        `resume: true` finishes a rotation that stopped before the end; until a rotation finishes
        the previous value is kept, so nothing becomes unreadable. Give exactly one of the three.
        Needs full admin access and a fresh re-authentication; audited as `secret.key.rotate` with
        the new and previous fingerprints. Keep your old copy of the key for backups made before.
      operationId: adminRotateKey
      security: [{ apiKey: [] }, { session: [] }]
      parameters: [{ $ref: "#/components/parameters/reauth" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                generate: { type: boolean }
                value: { type: string, description: "The new key: 32 bytes in base64url." }
                resume: { type: boolean }
      responses:
        "200":
          description: The key was rotated. The response is never cached.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [name, type, fingerprint, previous_fingerprint, version, rewrapped]
                properties:
                  name: { type: string }
                  type: { type: string, enum: [key] }
                  fingerprint: { type: string, description: "Of the new value." }
                  previous_fingerprint: { type: string }
                  version: { type: integer, description: "How many values the key has had." }
                  rewrapped: { type: integer, description: "Data keys wrapped again by this call." }
                  key: { type: string, description: "A generated key, base64url. Only this once." }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/encryption:
    parameters: [{ $ref: "#/components/parameters/realm" }]
    get:
      tags: [admin]
      summary: How encrypted fields are stored
      description: |
        For each collection that encrypts fields, or once did, and per field: how many documents
        hold the value in plaintext, encrypted, sealed with the current data key (`current`) and
        with an older one (`old`), how many have their blind index, the field key with its
        fingerprint, the generations of its data keys with how many values each seals, and the
        latest migration. A collection is `complete` when nothing is left to migrate. It counts
        documents, so on a big collection it takes a moment. Needs the `data` area (reading is
        enough).
      operationId: adminGetEncryption
      security: [{ apiKey: [] }, { session: [] }]
      parameters:
        - { name: database, in: query, schema: { type: string } }
        - { name: collection, in: query, description: "Needs `database`.", schema: { type: string } }
      responses:
        "200":
          description: The collections that encrypt, or once did.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [collections]
                properties:
                  collections:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [database, collection, fields, complete, migration]
                      properties:
                        database: { type: string }
                        collection: { type: string }
                        complete: { type: boolean }
                        fields:
                          type: array
                          items:
                            type: object
                            additionalProperties: false
                            required: [path, configured, search, plaintext, encrypted, current, old, complete, generations]
                            properties:
                              path: { type: string }
                              configured: { type: boolean, description: "False for a field the configuration no longer encrypts." }
                              key: { type: string }
                              fingerprint: { type: string }
                              search: { type: boolean }
                              plaintext: { type: integer }
                              encrypted: { type: integer }
                              current: { type: integer }
                              old: { type: integer }
                              indexed: { type: integer }
                              unindexed: { type: integer }
                              complete: { type: boolean }
                              generations:
                                type: array
                                items:
                                  type: object
                                  additionalProperties: false
                                  required: [kind, generation, status, key, wrap_version]
                                  properties:
                                    kind: { type: string, enum: [data, index] }
                                    generation: { type: integer }
                                    status: { type: string, enum: [active, decrypt_only, retired] }
                                    key: { type: string }
                                    wrap_version: { type: integer }
                                    values: { type: integer }
                        migration:
                          type: [object, "null"]
                          description: The latest migration job of the collection.
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/encryption/rekey:
    parameters: [{ $ref: "#/components/parameters/realm" }]
    post:
      tags: [admin]
      summary: Start a new generation of a field's data key
      description: |
        New values of the field are sealed with a fresh data key; the existing ones stay readable
        until a migration seals them again. For data keys that may have leaked; replacing the
        field key alone (`POST /_admin/secrets/{name}/rotate`) never needs it. Needs full admin
        access and a fresh re-authentication; audited as `encrypt.rekey`.
      operationId: adminRekeyField
      security: [{ apiKey: [] }, { session: [] }]
      parameters: [{ $ref: "#/components/parameters/reauth" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [database, collection, field]
              properties:
                database: { type: string }
                collection: { type: string }
                field: { type: string, description: "The encrypted field's path." }
      responses:
        "200":
          description: The new generation is active.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [database, collection, field, generation, status]
                properties:
                  database: { type: string }
                  collection: { type: string }
                  field: { type: string }
                  generation: { type: integer }
                  status: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/encryption/migrate:
    parameters: [{ $ref: "#/components/parameters/realm" }]
    post:
      tags: [admin]
      summary: Migrate a collection's documents to its encryption configuration
      description: |
        Queues a background job that reads the collection in id order (at most 1,000 documents a
        second) and rewrites only what differs: plaintext values are encrypted, values under an
        older data key or generation sealed again, blind indexes built or rebuilt, values of
        fields that are no longer encrypted opened. `_meta.version` never changes. It goes on
        from where it stopped if a worker dies, and at the end retires the data keys nothing
        uses. With `dry_run` it only counts. One migration per collection at a time (`409`).
        Needs full admin access and a fresh re-authentication; audited as `encrypt.start` and,
        by the job, `encrypt.migrate`. Follow it with `GET /_admin/jobs/{id}`.
      operationId: adminMigrateEncryption
      security: [{ apiKey: [] }, { session: [] }]
      parameters: [{ $ref: "#/components/parameters/reauth" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [database, collection]
              properties:
                database: { type: string }
                collection: { type: string }
                fields: { type: array, items: { type: string }, description: "Only these encrypted fields (fields no longer encrypted are always opened)." }
                dry_run: { type: boolean }
      responses:
        "202":
          description: The job is queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobSummary" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/config:
    parameters: [{ $ref: "#/components/parameters/realm" }]
    get:
      tags: [admin]
      summary: The realm's configuration, read-only
      description: |
        What this instance runs for the realm, from the files it loaded: realm settings
        (defaults applied; seeded user emails only for whoever may read users),
        every database's collections (schema, indexes, rules, `collection.yaml` policy) and
        functions (`function.yaml`, secrets by name only), the email templates and hosted
        pages found on disk, the configuration warnings and the config fingerprint. In dev
        mode (`BACKD_DEV`) the warnings include `reload_failed` entries: why the last change to the
        files was refused while the previous config keeps running. Each
        item carries the file it came from, relative to the config directory. Nothing here
        can be changed through the API: configuration is a reviewed, versioned artifact.
        Needs the `config` area (a read-only administrator reads it).
      operationId: adminConfig
      security: [{ apiKey: [] }, { session: [] }]
      responses:
        "200":
          description: The configuration.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema:
                type: object
                required: [realm, fingerprint, file, settings, databases, templates, warnings]
                properties:
                  realm: { type: string }
                  fingerprint: { type: string }
                  file: { type: string }
                  settings: { type: object }
                  databases: { type: object }
                  templates: { type: object }
                  warnings:
                    type: array
                    items:
                      type: object
                      required: [code, message]
                      properties:
                        code: { type: string }
                        message: { type: string }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/types:
    parameters: [{ $ref: "#/components/parameters/realm" }]
    get:
      tags: [admin]
      summary: The realm's TypeScript types
      description: |
        The TypeScript types of the config this instance runs: documents, `where` and `order_by`
        per collection, functions, app configuration, templates and roles, exactly what
        `backd types` writes from `CONFIG_DIR`. `info` is the `realm.json` that goes with them
        (the types' fingerprint and the type-level entries `backd types --diff` compares), and
        `warnings` lists what a schema says that TypeScript can't express. `db` limits it to one
        database. Needs the `config` area (a read-only administrator reads it).
      operationId: adminTypes
      security: [{ apiKey: [] }, { session: [] }]
      parameters:
        - { name: db, in: query, required: false, schema: { type: string }, description: Only this database. }
      responses:
        "200":
          description: The generated types.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema:
                type: object
                required: [types, info, warnings]
                properties:
                  types: { type: string, description: The contents of types.d.ts. }
                  info:
                    type: object
                    required: [generator, realm, fingerprint, entries]
                    properties:
                      generator: { type: string }
                      realm: { type: string }
                      fingerprint: { type: string }
                      config: { type: string }
                      entries: { type: object, additionalProperties: { type: string } }
                  warnings: { type: array, items: { type: string } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/openapi.json:
    parameters: [{ $ref: "#/components/parameters/realm" }]
    get:
      tags: [admin]
      summary: The realm's admin API as OpenAPI
      description: |
        An OpenAPI 3.1 document for internal tooling, generated from the realm's configuration:
        the administration routes (users, API keys, secrets, audit, jobs, configuration, and
        what the realm enables), the data routes past the collections' rules typed per
        collection, and **every function an administrator may run by hand, internal ones
        included**, with their input and output schemas. The client API's document is
        `/_openapi.json`. Needs the `config` area (a read-only administrator reads it).
        `backd openapi --admin` makes the same document from `CONFIG_DIR`.
      operationId: adminOpenAPI
      security: [{ apiKey: [] }, { session: [] }]
      parameters:
        - { $ref: "#/components/parameters/ifNoneMatch" }
      responses:
        "200":
          description: The document.
          headers:
            ETag: { schema: { type: string }, description: Identifies this document; send it back as `If-None-Match`. }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema:
                type: object
                required: [openapi, info, paths]
                additionalProperties: true
                properties:
                  openapi: { type: string }
                  info: { type: object }
                  paths: { type: object }
        "304":
          description: The copy the caller holds (`If-None-Match`) is current.
          headers:
            ETag: { schema: { type: string } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/whoami:
    parameters: [{ $ref: "#/components/parameters/realm" }]
    get:
      tags: [admin]
      summary: What the signed-in administrator may do
      description: |
        The level of the credential and the admin areas it may change and may read, so a
        client (the admin UI) offers only what the server would allow. Areas are `users`,
        `invitations`, `apikeys`, `secrets`, `audit`, `functions`, `data` and `config`; `all` stands
        for every one. An admin key is `full`; a user's `level` is `full` (`admin: true`),
        `read` (only `admin: read`) or `custom` (a list of areas, perhaps with `read`).
        `read_access` is what `admin.read_access` in `realm.yaml` grants read-only
        administrators beyond operations.
      operationId: adminWhoami
      security: [{ apiKey: [] }, { session: [] }]
      responses:
        "200":
          description: The caller's admin access.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [level, write, read, read_access]
                properties:
                  level: { type: string, enum: [full, read, custom] }
                  write: { type: array, items: { type: string }, description: "Areas it may change." }
                  read: { type: array, items: { type: string }, description: "Areas it may read, what read_access grants included." }
                  read_access:
                    type: object
                    additionalProperties: false
                    required: [users, data]
                    properties:
                      users: { type: boolean }
                      data: { type: boolean }
                  user:
                    type: object
                    additionalProperties: false
                    required: [id, email, roles]
                    properties:
                      id: { type: string }
                      email: { type: string }
                      roles: { type: array, items: { type: string } }
                  key: { type: string, description: "The admin API key's name." }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/audit:
    parameters: [{ $ref: "#/components/parameters/realm" }]
    get:
      tags: [admin]
      summary: Read the audit trail
      description: |
        Security-sensitive actions and events of the realm, newest first. The trail is
        append-only: no endpoint changes or deletes records, which expire after the
        realm's `audit.retention` (default 365 days).
      operationId: adminListAudit
      security: [{ apiKey: [] }, { session: [] }]
      parameters:
        - { name: action, in: query, description: "Only this action, such as `role.add`.", schema: { type: string } }
        - { name: actor, in: query, description: "Only this actor, such as `user:<id>` or `key:<name>`.", schema: { type: string } }
        - { name: target, in: query, description: "Only this target, such as `user:<id>`.", schema: { type: string } }
        - { name: since, in: query, description: "Records at or after this time.", schema: { type: string, format: date-time } }
        - { name: until, in: query, description: "Records before this time.", schema: { type: string, format: date-time } }
        - { $ref: "#/components/parameters/limit" }
        - { $ref: "#/components/parameters/skip" }
      responses:
        "200":
          description: A page of audit records, newest first.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, limit, skip, has_more]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/AuditRecord" } }
                  limit: { type: integer }
                  skip: { type: integer }
                  has_more: { type: boolean }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/invocations:
    parameters: [{ $ref: "#/components/parameters/realm" }]
    get:
      tags: [admin]
      summary: Read function invocation history
      description: |
        What functions did, newest first: never their input or output,
        only status, timing and their own console log lines (already
        masked of any declared secrets). Records expire after the
        realm's `functions.log_retention` (default 7 days; roadmap F10).
      operationId: adminListInvocations
      security: [{ apiKey: [] }, { session: [] }]
      parameters:
        - { name: function, in: query, description: "Only this function, as `<database>/<name>`.", schema: { type: string } }
        - { name: request_id, in: query, description: "Only the call with this request id.", schema: { type: string } }
        - { name: since, in: query, description: "Records at or after this time.", schema: { type: string, format: date-time } }
        - { name: until, in: query, description: "Records before this time.", schema: { type: string, format: date-time } }
        - { $ref: "#/components/parameters/limit" }
        - { $ref: "#/components/parameters/skip" }
      responses:
        "200":
          description: A page of invocation records, newest first.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, limit, skip, has_more]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/InvocationRecord" } }
                  limit: { type: integer }
                  skip: { type: integer }
                  has_more: { type: boolean }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/jobs:
    parameters: [{ $ref: "#/components/parameters/realm" }]
    get:
      tags: [admin]
      summary: List async and scheduled jobs
      description: |
        The realm's async function calls and cron runs, newest first: their
        state and how they ended, never their input or output (read one job
        in full at `GET /v1/{realm}/{database}/_jobs/{id}`, as its caller or
        with an API key). Jobs expire after `functions.job_retention` once
        done (roadmap F19).
      operationId: adminListJobs
      security: [{ apiKey: [] }, { session: [] }]
      parameters:
        - { name: function, in: query, description: "Only this function, as `<database>/<name>`.", schema: { type: string } }
        - { name: status, in: query, description: "Only jobs in this state.", schema: { type: string, enum: [queued, running, done] } }
        - { name: origin, in: query, description: "Only jobs with exactly this origin, such as `function:main/ship`: the emails that function sent (count them for its sending volume).", schema: { type: string } }
        - { name: scheduled, in: query, description: "`true`: only cron runs; `false`: only calls made by callers.", schema: { type: boolean } }
        - { name: since, in: query, description: "Jobs created at or after this time.", schema: { type: string, format: date-time } }
        - { name: until, in: query, description: "Jobs created before this time.", schema: { type: string, format: date-time } }
        - { $ref: "#/components/parameters/limit" }
        - { $ref: "#/components/parameters/skip" }
      responses:
        "200":
          description: A page of jobs, newest first.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, limit, skip, has_more]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/JobSummary" } }
                  limit: { type: integer }
                  skip: { type: integer }
                  has_more: { type: boolean }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/jobs/{id}:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/id" }
    get:
      tags: [admin]
      summary: Read a job with its steps
      description: |
        The job as the listing shows it (never its input or output), with every
        step the running or last attempt reported (`ctx.step`, `ctx.progress`).
        Needs the `functions` area (read is enough).
      operationId: adminGetJob
      security: [{ apiKey: [] }, { session: [] }]
      responses:
        "200":
          description: The job.
          headers:
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobSummary" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/config/check:
    parameters: [{ $ref: "#/components/parameters/realm" }]
    post:
      tags: [admin]
      summary: Check a change to the realm's configuration without applying it
      description: |
        Loads the realm's **whole** configuration as startup does (realm.yaml, every
        collection's schema, indexes, rules and policy, every function.yaml, the email
        templates and pages) with the draft `files` in place of, or beside, the ones on
        disk, and answers what it found. Every file of the realm is read and validated,
        not only the drafts, since a change can break another file (a schema that drops a
        field a rule names). `checked` is how many files the realm has with the drafts.
        Function bundles are built by `backd functions build` and are not part of it.
        It works on a copy: nothing on the server is changed or applied, and the
        configuration stays a file in a repository. Draft paths are relative to the realm's
        directory (`main/notes/collection.yaml`); a `null` content deletes the file. Needs the
        `config` area (a read-only administrator may check).
      operationId: adminCheckConfig
      security: [{ apiKey: [] }, { session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [files]
              properties:
                files:
                  type: object
                  description: "At most 50 files of at most 1 MiB, by path in the realm."
                  additionalProperties: { type: [string, "null"] }
      responses:
        "200":
          description: The result; `ok` is false when the configuration with the drafts would not load.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigCheck" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/export:
    parameters:
      - { $ref: "#/components/parameters/realm" }
    get:
      tags: [admin]
      summary: Export the realm as a package, part by part
      description: |
        The server side of `backd export`. Without `part` or `file` it starts an export: it takes the
        realm's export lease (one export of a realm runs at a time per instance, `409 export_running`;
        a lease that is silent for ten minutes expires, and the administrator who held one can take it
        over by sending it in `X-Backd-Export`) and answers the **plan**: the lease, the package's
        manifest as far as it is known before reading (document counts are estimates, checksums are
        the client's to add) and, per collection, the file fields to look in for the files to fetch.
        With `part` it streams one collection's documents as JSON Lines, every document once in `id`
        order, soft-deleted ones included, in the API representation with dates and binary values as
        MongoDB Extended JSON (relaxed). With `file` it streams a file's object through backd's
        storage client. Part and file requests carry the lease in `X-Backd-Export`. Memory does not
        grow with the size of the collection. **Encrypted fields are always sent as stored (ciphertext,
        BSON binary of subtype 6 as `{"$binary": {"base64": …, "subType": "06"}}`): the server never
        decrypts for an export.** The manifest lists each (`encrypted_fields`, with the field key's name
        and fingerprint), and `part=_system/data_keys.jsonl` streams their wrapped data and index keys
        (format: "Encrypted fields format" in the documentation), which only the holder of the field
        keys can open. Never exported: sessions, tokens, counters, jobs, history, secrets and the audit trail.
        Needs full admin access; a session also needs a fresh re-authentication on the plan request.
        Audited as `export` (the plan) and `export.done` (see `DELETE`), never with content.
      operationId: adminExport
      security: [{ apiKey: [] }, { session: [] }]
      parameters:
        - { $ref: "#/components/parameters/reauth" }
        - name: X-Backd-Export
          in: header
          required: false
          description: The lease the plan gave (required with `part` and `file`); on a plan request, the lease of an interrupted export to take over.
          schema: { type: string }
        - name: database
          in: query
          description: The plan covers only this database.
          schema: { type: string }
        - name: collection
          in: query
          description: The plan covers only these collections of `database` (repeatable).
          schema: { type: array, items: { type: string } }
          style: form
          explode: true
        - name: files
          in: query
          description: "`false` leaves the files out."
          schema: { type: string, enum: ["false"] }
        - name: fields
          in: query
          description: >-
            A reporting extract: comma-separated field paths (`name,address.city`, `_meta.owner`)
            to keep of every document, `id` always. The package is marked `partial`. A path that
            exists in none of the collections is `400`.
          schema: { type: string }
        - name: where
          in: query
          description: >-
            A reporting extract: only the documents matching this filter, in the syntax of the
            data API's `where`. Needs `database` and exactly one `collection`. Invalid filters are `400`.
          schema: { type: string }
        - name: include
          in: query
          description: >-
            `auth` adds the realm's authentication data: users, identities with their password
            hashes, organizations, memberships, teams, second-factor enrollments and push devices
            (parts `_system/auth/<collection>.jsonl`). Whole realm only: it can't be combined with
            `database`, `fields`, `where` or `format`. The fields the realm sealed with its secrets
            (TOTP secrets, device tokens, Apple refresh tokens) are opened by the server and sealed
            again under a **one-time export key**, which the plan returns once in `export_key`;
            recovery codes (keyed hashes) and the sessions devices belong to don't travel. Audited
            as `export.auth`.
          schema: { type: string, enum: [auth] }
        - name: format
          in: query
          description: >-
            `csv` marks the plan as a flat extract (no files, `flags.csv`); the client turns the
            streamed documents into one table per collection. `jsonl` is the default.
          schema: { type: string, enum: [jsonl, csv] }
        - name: part
          in: query
          description: "`<database>/<collection>.jsonl`: stream this collection's documents."
          schema: { type: string }
        - name: file
          in: query
          description: "`<database>/<collection>/<file id>`: stream this file's object."
          schema: { type: string }
      responses:
        "200":
          description: The plan, a collection's documents or a file's object.
          headers:
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExportPlan" }
            application/x-ndjson:
              schema: { type: string }
            application/octet-stream:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "400":
          description: An invalid `fields`, `where` or `format`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No such database, collection, part or file, or the realm has no storage.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: "`export_running` (another export holds the realm) or `export_lease` (the lease is missing, expired or another administrator's)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: "`storage_unavailable`: the files can't be read."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [admin]
      summary: Start an export with options that don't belong in a URL
      description: |
        Starts an export like `GET` without `part` or `file` (same query parameters, same plan) and
        takes a JSON body for the **anonymization** of a staging copy. With `anonymize` every
        collection's `on_owner_delete` `remove` and `replace` rules are applied to every exported
        document, whatever its owner; the addresses of users held in `pull` and `unset` fields that
        say `email` are rewritten like the users' own; files are left out (and the references to
        them removed) unless `anonymize_files` is `keep`; and with `include=auth` emails become
        `user-<id>@example.invalid`, identities of external providers stay behind, password hashes
        are dropped (or replaced by the hash of `staging_password`, one password for every user)
        and second factors and devices are not exported, so no export key is made. `anonymize_config`
        is a YAML file of per-collection `remove` and `replace` rules added on top of the policies,
        checked against the schemas like an erase policy is. The manifest is marked `anonymized`.
      operationId: adminExportStart
      security: [{ apiKey: [] }, { session: [] }]
      parameters:
        - { $ref: "#/components/parameters/reauth" }
        - name: X-Backd-Export
          in: header
          required: false
          description: The lease of an interrupted export to take over.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                anonymize: { type: boolean }
                anonymize_files: { type: string, enum: [keep] }
                anonymize_config: { type: string, description: "YAML: `collections: {<database>/<collection>: {remove: [...], replace: {...}}}`." }
                staging_password: { type: string, description: "With `include=auth`: the password every user gets. At least the realm's `password.min_length`." }
      responses:
        "200":
          description: The plan.
          headers:
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExportPlan" }
        "400":
          description: An option that makes no sense, or anonymization rules the schemas refuse; `details` name each problem.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "409":
          description: "`export_running`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [admin]
      summary: End an export
      description: |
        Releases the realm's export lease and writes the `export.done` audit record with what the
        export streamed (collections, documents, files, bytes; `complete` as the client says), and
        answers those totals. Needs
        full admin access and the lease in `X-Backd-Export`.
      operationId: adminExportDone
      security: [{ apiKey: [] }, { session: [] }]
      parameters:
        - name: X-Backd-Export
          in: header
          required: true
          schema: { type: string }
        - name: complete
          in: query
          description: "`true` when the client wrote the whole package."
          schema: { type: boolean }
      responses:
        "200":
          description: Released, with what the export streamed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  collections: { type: integer }
                  documents: { type: integer, format: int64 }
                  files: { type: integer, format: int64 }
                  bytes: { type: integer, format: int64 }
                  auth_unavailable: { type: integer, format: int64, description: Second factors and devices left behind because the realm's secrets key could not open them. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "409":
          description: "`export_lease`: the lease is missing, expired or another administrator's."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/import:
    parameters:
      - { $ref: "#/components/parameters/realm" }
    post:
      tags: [admin]
      summary: Start an import, or send a chunk of one
      description: |
        The server side of `backd import`. Without `phase` it **starts** an import: the body is the
        package's manifest (without checksums) and the options. It checks that the package can be
        read at all (the format, not a `partial` package, not a CSV extract, every collection configured
        in this realm), takes the realm's lease (one export or
        import of a realm runs at a time per instance, `409 export_running`) and answers it with the
        size of the chunks to send. With `phase=validate` or `phase=write` and `part`
        (`<database>/<collection>.jsonl`, or `_system/auth/<collection>.jsonl` for authentication
        data, whose documents the store checks as they are: ids, unique values such as emails, and
        the shape of its collections; its sealed fields arrive as `{"$plain": value}` and are sealed
        under this realm's key) the body is a chunk of whole JSON Lines of that part; every
        document in it is checked against **this** realm's configuration: its id, `_meta`, its fields
        against the collection's schema, its files against the file fields, the documents the target
        already holds (`create` refuses a different document with the same id, `skip` keeps the
        existing one, `replace` overwrites it; an identical one is `unchanged` in every mode) and the
        unique indexes. An encrypted field the package holds as ciphertext is opened by the target
        itself when it encrypts that field with the same key (same fingerprint): the CLI first sends
        the package's wrapped data keys (`phase=keys`, part `_system/data_keys.jsonl`), the values are
        opened with the target's copy of the key and sealed again under its own keys as they are
        written. A field nobody here can open is refused at the start (`422`, naming each; a dry run
        lists them in `needs_keys` instead): the importer opens it with the source key before sending
        and says so in the manifest (`form: plaintext`). `write` also writes the documents that pass, with their ids and `_meta` kept,
        counts their files in the storage usage and queues the image versions their files wait for.
        Writing is idempotent, so an interrupted import is finished by sending the same chunks again.
        Users and organizations the target doesn't have are counted, not refused. Needs full admin
        access; a session also needs a fresh re-authentication to start. Audited as `import` and
        `import.done`, never with content.
      operationId: adminImport
      security: [{ apiKey: [] }, { session: [] }]
      parameters:
        - { $ref: "#/components/parameters/reauth" }
        - name: X-Backd-Export
          in: header
          description: The lease (required with `phase`); on a start, the lease of an interrupted import to take over.
          schema: { type: string }
        - name: phase
          in: query
          schema: { type: string, enum: [validate, write, keys] }
        - name: part
          in: query
          description: "`<database>/<collection>.jsonl`, with `phase`; `_system/data_keys.jsonl` with `phase=keys`."
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [manifest]
              properties:
                manifest: { type: object, description: The package's manifest.json; checksums may be left out. }
                mode: { type: string, enum: [create, skip, replace], default: create }
                skip_invalid: { type: boolean }
                dry_run: { type: boolean, description: "Validate only; a chunk with `phase=write` is then refused." }
          application/x-ndjson:
            schema: { type: string, description: "Whole lines of one part, up to `max_chunk_bytes`." }
      responses:
        "200":
          description: The lease, or the result for the chunk.
          headers:
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportAnswer" }
        "400":
          description: An invalid body, mode or phase.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404":
          description: No such part in this realm.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: "`export_running` (another export or import holds the realm), `export_lease` (the lease is missing, expired, not an import's or another administrator's) or a write on a dry run."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: "`import_refused`: the package can't be imported into this realm; `details` name each collection this realm lacks."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/Error" }
    put:
      tags: [admin]
      summary: Store a file of an import
      description: |
        Stores the body under the key a document of `file` (`<database>/<collection>/<file id>`)
        expects, through backd's storage client, and verifies it against `X-Backd-Sha256` (hex): a
        file that arrives different is deleted. Send the files before the documents that reference
        them. The size limit is the file field's. Needs the import's lease.
      operationId: adminImportFile
      security: [{ apiKey: [] }, { session: [] }]
      parameters:
        - name: X-Backd-Export
          in: header
          required: true
          schema: { type: string }
        - name: X-Backd-Sha256
          in: header
          required: true
          schema: { type: string }
        - name: file
          in: query
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "204": { description: Stored. }
        "400":
          description: "A missing checksum, or `checksum_mismatch`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404":
          description: No such file field, or the realm has no storage.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: "`export_lease`, or a dry run."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: "`storage_unavailable`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [admin]
      summary: End an import
      description: Releases the lease and writes the `import.done` audit record with the counts by outcome. Needs full admin access and the import's lease.
      operationId: adminImportDone
      security: [{ apiKey: [] }, { session: [] }]
      parameters:
        - name: X-Backd-Export
          in: header
          required: true
          schema: { type: string }
        - name: complete
          in: query
          schema: { type: boolean }
      responses:
        "204": { description: Released. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "409":
          description: "`export_lease`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/storage/check:
    parameters:
      - { $ref: "#/components/parameters/realm" }
    post:
      tags: [admin]
      summary: Check the realm's object storage
      description: |
        Verifies the realm's storage the way files would use it: the bucket and
        the credentials, put, head, get, a range request and a listing on the
        realm's prefix, the signed SHA-256 (a wrong one must be rejected), signed
        download and upload links (when the links are for an address backd can
        reach), and, where the provider exposes them, the bucket's CORS rules and
        default encryption. It stores a few small objects under
        `<prefix>/<realm>/_check/` and deletes them again; it touches nothing else.
        Answers `200` with the report whatever it found: `ok` is false when a step
        failed (`level: fail`); `warn` steps are worth reading but don't fail it.
        Audited as `storage.check`. Needs the `config` area (read is enough).
      operationId: adminCheckStorage
      security: [{ apiKey: [] }, { session: [] }]
      responses:
        "200":
          description: The report.
          headers:
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorageCheck" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404":
          description: The realm has no `storage:` in `realm.yaml`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: "`storage_unavailable`: the realm's access keys can't be read (a secret is not set)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/storage:
    parameters:
      - { $ref: "#/components/parameters/realm" }
    get:
      tags: [admin]
      summary: The realm's object storage, what it holds and what waits
      description: |
        How the realm's storage is configured (the secrets by name, never their values),
        whether its access keys are set and the bucket answers, the running totals of
        bytes and files documents reference (for the realm, and for the 20 users holding
        the most), the objects queued for deletion, and the uploads left unfinished past
        their time. A realm without `storage:` answers `{"configured": false}`. Needs
        the `config` area (read is enough).
      operationId: adminStorageStatus
      security: [{ apiKey: [] }, { session: [] }]
      responses:
        "200":
          description: The status.
          headers:
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorageStatus" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_openapi.json:
    parameters: [{ $ref: "#/components/parameters/realm" }]
    get:
      tags: [documents]
      summary: The realm's client API as OpenAPI
      description: |
        An OpenAPI 3.1 document describing what a client of this realm can use, generated from
        its configuration: the collections clients can reach (a collection whose rules are all
        literally `false` is left out, and so is an operation whose rule is), with their schemas,
        `_meta` and the features they enable (files, soft delete, conditional reads); the
        sign-in methods the realm enables; its non-internal functions with their input and output
        schemas; its app configuration; batches and jobs. Internal functions, the admin API, rules
        and system collections are not in it (the admin document is `/_admin/openapi.json`).
        It is what generators of typed clients for other platforms read.

        Realm administrators (the `config` area) read it; `openapi.public: true` in `realm.yaml`
        makes it public, and a realm with `auth: disabled` serves it to everyone.
        `backd openapi --realm <realm>` makes the same document from `CONFIG_DIR`.
      operationId: realmOpenAPI
      security: [{}, { session: [] }, { apiKey: [] }]
      parameters:
        - { $ref: "#/components/parameters/ifNoneMatch" }
      responses:
        "200":
          description: The document.
          headers:
            ETag: { schema: { type: string }, description: Identifies this document; send it back as `If-None-Match`. }
            Cache-Control: { schema: { type: string }, description: "`public, max-age=60` when anyone may read it, `private, no-store` otherwise." }
          content:
            application/json:
              schema:
                type: object
                required: [openapi, info, paths]
                additionalProperties: true
                properties:
                  openapi: { type: string }
                  info: { type: object }
                  paths: { type: object }
        "304":
          description: The copy the caller holds (`If-None-Match`) is current.
          headers:
            ETag: { schema: { type: string } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_config:
    parameters:
      - { $ref: "#/components/parameters/realm" }
    get:
      tags: [documents]
      summary: Read the app configuration
      description: |
        The realm's app configuration (declared in `_realm/config/`) as the caller may read
        it: defaults filled in, and only the keys whose read rules allow it (the rule of
        a key is its own ANDed with every ancestor's; a key with no rule is hidden).
        Hidden keys are absent, with no error. `paths` selects groups or keys, and a
        path the schema doesn't declare is `400 invalid_path`. The `ETag` is weak and
        covers the returned values, so `If-None-Match` answers `304`. `cache_ttl` is how
        many seconds a client may use the copy without asking again
        (`app_config.cache_ttl` in `realm.yaml`, 300 by default). An anonymous request
        whose keys are all readable by a rule that is literally `true` is
        `Cache-Control: public, max-age=<cache_ttl>` (with `Vary: Authorization`), so a
        CDN may serve it; everything else is `private, no-cache`. Answers `404` when
        the realm declares no configuration.
      operationId: readAppConfig
      security: [{}, { session: [] }, { apiKey: [] }]
      parameters:
        - { name: paths, in: query, description: "Comma-separated key or group paths, in dot notation.", schema: { type: string } }
        - { $ref: "#/components/parameters/ifNoneMatch" }
      responses:
        "200":
          description: The readable configuration.
          headers:
            ETag: { schema: { type: string } }
            Vary: { $ref: "#/components/headers/DataVary" }
            Cache-Control: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [values, version, cache_ttl]
                properties:
                  values: { type: object, description: "The readable keys, nested like the schema." }
                  version: { type: string, description: "The configuration version, such as `c3`." }
                  cache_ttl: { type: integer, description: "Seconds the copy may be used without revalidating." }
        "304": { $ref: "#/components/responses/NotModified" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_realtime:
    parameters:
      - { $ref: "#/components/parameters/realm" }
    post:
      tags: [documents]
      summary: Subscribe to changes
      description: |
        Opens a stream (`text/event-stream`, read with `fetch` streaming) of the changes of
        one or more collections that declare `realtime: true`, limited to what the caller may
        read. A session or API key goes in `Authorization`, never in the URL. Subscriptions
        are validated before the stream starts; the stream then begins with `ready`.

        Events: `created`, `updated` (`data: {sub, doc}`; the document as a read returns it),
        `removed` (`{sub, id, version}`, also when an update made the document invisible to
        this caller), `reset` (`{subs, reason}`: reload those subscriptions; `reason` is
        `history_expired`, `access_changed`, `slow_consumer`, `preimage_missing` or
        `config_changed`, after which the subscription is gone and must be made again),
        `config_changed` (`{id, version, paths}`: on a `config` subscription, the keys of the
        app configuration whose value this caller reads differently now; an empty `paths`
        means read it all again; never resumed or replayed),
        `session_ended` (the session, user or key is gone) and `reauth` (the credential's
        lifetime is over), both followed by the stream closing, and comments (`: heartbeat`). Each change's last event carries an SSE `id`, a signed resume
        token bound to this realm and caller: send it as `resume_from` (or `Last-Event-ID`)
        to continue after it; events replayed are evaluated with the caller's current access.

        `where` may use only comparison, `$in`, `$nin`, `$between` and `$isNull` operators and
        their `$and`/`$or`; `$search`, `$like` and the text operators, `order_by`, `limit` and
        `expand` are not part of a stream. To start from a known state: open the stream, wait
        for `ready`, load the data with list calls and apply the events received meanwhile,
        ignoring those whose `_meta.version` is not newer than the document held.
      operationId: realtimeSubscribe
      security: [{ session: [] }, { apiKey: [] }, {}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [subscriptions]
              properties:
                subscriptions:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    additionalProperties: false
                    required: [id]
                    description: "Either `db` and `collection` (a collection that declares `realtime: true`) or `config` (the realm's app configuration), not both."
                    properties:
                      id: { type: string, maxLength: 64, description: "Names the subscription in events; unique in the request." }
                      db: { type: string }
                      collection: { type: string }
                      config:
                        type: object
                        additionalProperties: false
                        description: "Follow the realm's app configuration. At most one per stream; counts toward the subscription limit."
                        properties:
                          paths: { type: array, items: { type: string }, description: "Configuration keys or branches to follow; default everything the caller may read." }
                      where: { type: object, description: "A filter, as in a list's `where`, limited to the operators listed above." }
                      doc: { type: string, description: "Follow one document by id instead of a filter." }
                resume_from: { type: string, description: "A resume token from a previous stream." }
      responses:
        "200":
          description: The stream.
          headers:
            Cache-Control: { schema: { type: string } }
          content:
            text/event-stream:
              schema: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_consents:
    parameters:
      - { $ref: "#/components/parameters/realm" }
    get:
      tags: [auth]
      summary: The consents the realm asks for
      description: |
        The consents declared in `realm.yaml`, with the version in force of each, whether
        it is required, whether that version asks users to accept again (`reaccept`, with
        the date after which open sessions are refused) and the languages its text exists
        in. Public: a person reads the texts before they have an account. Needs a realm
        with authentication enabled.
      operationId: listConsents
      security: [{}]
      responses:
        "200":
          description: The consents.
          headers:
            Cache-Control: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [name, required, current, locales]
                      properties:
                        name: { type: string }
                        required: { type: boolean }
                        current:
                          type: object
                          additionalProperties: false
                          required: [version, reaccept]
                          properties:
                            version: { type: string }
                            reaccept: { type: boolean }
                            reaccept_by: { type: string, format: date }
                        locales: { type: array, items: { type: string } }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_consents/{name}/{version}:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { name: name, in: path, required: true, schema: { type: string } }
      - { name: version, in: path, required: true, schema: { type: string } }
    get:
      tags: [auth]
      summary: The exact text of a consent version
      description: |
        The text of one version in a language: the best match for `locale` among the
        realm's languages, else the realm's default. `hash` is the SHA-256 of the text,
        which consent records keep as proof of what was shown. Old versions stay
        available as long as their text is in the config.
      operationId: getConsentText
      security: [{}]
      parameters:
        - { name: locale, in: query, schema: { type: string } }
      responses:
        "200":
          description: The text.
          headers:
            Cache-Control: { schema: { type: string } }
            Content-Language: { schema: { type: string } }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [name, version, locale, text, hash, current]
                properties:
                  name: { type: string }
                  version: { type: string }
                  locale: { type: string }
                  text: { type: string, description: Markdown. }
                  hash: { type: string, pattern: "^[0-9a-f]{64}$" }
                  current: { type: boolean, description: The version in force. }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/consents/notify:
    parameters:
      - { $ref: "#/components/parameters/realm" }
    post:
      tags: [admin]
      summary: Ask users to review a new version of a consent
      description: |
        Queues the `consent-updated` email for every user who accepted an older version of
        the consent than the current one (and, for a required consent, who accepted none).
        Publishing a version never sends anything by itself. The email limits apply:
        `limited` counts the messages skipped, and running it again later asks the users
        who still hold an older version. Needs the `users` area with write access; audited
        as `consents.notify`.
      operationId: adminNotifyConsent
      security: [{ apiKey: [] }, { session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [consent]
              properties:
                consent: { type: string, description: The consent's name. }
      responses:
        "200":
          description: What the run did.
          headers:
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [consent, version, matched, queued, limited]
                properties:
                  consent: { type: string }
                  version: { type: string }
                  matched: { type: integer, description: Users who hold an older version. }
                  queued: { type: integer }
                  limited: { type: integer }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/compliance/scope:
    parameters:
      - { $ref: "#/components/parameters/realm" }
    get:
      tags: [admin]
      summary: What a user's data export takes from each collection
      description: |
        The personal data scope of the realm, as the export of a user's data builds it:
        per collection whether documents are included (the ones the user owns, those
        where they appear in a `pull` field of the erase policy, and the files they
        hold), the fields when only some are exported, and the reason for every
        exclusion or partial list (`personal_data` in `collection.yaml`), plus the
        system data an export adds and what it never holds. Needs the `config` area
        (read is enough).
      operationId: adminComplianceScope
      security: [{ apiKey: [] }, { session: [] }]
      responses:
        "200":
          description: The scope.
          headers:
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComplianceScope" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/app-config:
    parameters:
      - { $ref: "#/components/parameters/realm" }
    get:
      tags: [admin]
      summary: The app configuration with every value and its latest history
      description: |
        The realm's app configuration as it is now (declared in `_realm/config/`): every
        key with its effective value, including the keys clients can't read, the
        values that differ from the defaults, stored values that stopped validating
        after a deploy (they read as their defaults until fixed or reset), the declared
        keys with whether clients can read them, and the 20 latest versions. The
        `ETag` is the version, to send as `If-Match` with a change. Needs the `config`
        area (read is enough). Answers `404` when the realm declares no configuration.
      operationId: adminGetAppConfig
      security: [{ apiKey: [] }, { session: [] }]
      responses:
        "200":
          description: The configuration.
          headers:
            Cache-Control: { $ref: "#/components/headers/NoStore" }
            ETag: { description: "The configuration version, such as `\"c3\"`.", schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppConfig" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      tags: [admin]
      summary: Change app configuration values
      description: |
        Sets values and returns keys to their defaults, as one change: the result is
        validated as a whole against `_realm/config/schema.json` and applied atomically,
        or nothing is. `If-Match` carries the version the change is based on (`412`
        when it is stale, `428` when missing). A change that leaves every value as it
        was makes no new version (`changed: false`). `set` names keys (not groups of
        keys) by dot path; `reset` names keys or groups. Audited as `appconfig.change`
        with the paths, never the values. Needs the `config` area with write access.
      operationId: adminPatchAppConfig
      security: [{ apiKey: [] }, { session: [] }]
      parameters:
        - { name: If-Match, in: header, required: true, description: "The configuration version being changed, such as `\"c3\"`.", schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppConfigChange" }
      responses:
        "200":
          description: The new version, or the same one when nothing changed.
          headers:
            Cache-Control: { $ref: "#/components/headers/NoStore" }
            ETag: { description: "The configuration version.", schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppConfigResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "412": { $ref: "#/components/responses/VersionMismatch" }
        "428": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/app-config/history:
    parameters:
      - { $ref: "#/components/parameters/realm" }
    get:
      tags: [admin]
      summary: The app configuration's history
      description: |
        The versions of the configuration, newest first, with who made each change and
        the paths with their old and new values. The last 100 versions or 90 days are
        kept, whichever is longer.
      operationId: adminAppConfigHistory
      security: [{ apiKey: [] }, { session: [] }]
      parameters:
        - { name: limit, in: query, description: "How many versions, at most 100.", schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        "200":
          description: The history.
          headers:
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [history]
                properties:
                  history: { type: array, items: { $ref: "#/components/schemas/AppConfigEntry" } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/app-config/rollback:
    parameters:
      - { $ref: "#/components/parameters/realm" }
    post:
      tags: [admin]
      summary: Restore an earlier version of the app configuration
      description: |
        Restores the values a version had (0 is the defaults) as a new version, so the
        rollback is itself in the history. Validated against the schema as it is now:
        values an earlier version held that no longer fit are refused (`400`), and a
        version the history no longer holds answers `404`. `If-Match` is required as
        for a change.
      operationId: adminRollbackAppConfig
      security: [{ apiKey: [] }, { session: [] }]
      parameters:
        - { name: If-Match, in: header, required: true, description: "The configuration version being changed, such as `\"c3\"`.", schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [version]
              properties:
                version: { type: string, description: "The version to restore, such as `\"c2\"`; `\"c0\"` is the defaults." }
      responses:
        "200":
          description: The new version.
          headers:
            Cache-Control: { $ref: "#/components/headers/NoStore" }
            ETag: { description: "The configuration version.", schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppConfigResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "412": { $ref: "#/components/responses/VersionMismatch" }
        "428": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/files/versions/regenerate:
    parameters:
      - { $ref: "#/components/parameters/realm" }
    post:
      tags: [admin]
      summary: Make the stale image versions of a file field again
      description: |
        Queues a job that goes through every document of a file field and makes again, on a
        worker, the versions that no longer match the field's `versions:`: copies made with
        other parameters (the declaration changed), copies that failed or never finished, and
        versions added later that a file has no copy of. Copies a function generated with its
        own parameters (`custom`), versions only functions make and files that aren't pictures
        are left alone; `missing_only` makes only the copies that don't exist. The old copy is
        served until the new one is ready. The job makes at most `rate` files a second
        (default 10), keeps a lease and can be cancelled (`POST …/jobs/{id}/cancel`); running
        it again resumes, since what matches is skipped. Its progress is the job's steps. One
        job per field at a time (`409 regenerate_running`). Audited as
        `files.versions.regenerate`. Needs the `config` area with write access.
      operationId: adminRegenerateVersions
      security: [{ apiKey: [] }, { session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [database, collection, field]
              properties:
                database: { type: string }
                collection: { type: string }
                field: { type: string }
                version: { type: string, description: Only this version; default every version the field declares with parameters. }
                missing_only: { type: boolean, default: false }
                rate: { type: integer, minimum: 1, maximum: 1000, description: Files a second at most. }
      responses:
        "202":
          description: The job.
          headers:
            Location: { schema: { type: string } }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema:
                type: object
                required: [id, status, database, collection, field, version, missing_only, created_at]
                properties:
                  id: { type: string }
                  status: { type: string }
                  database: { type: string }
                  collection: { type: string }
                  field: { type: string }
                  version: { type: [string, "null"] }
                  missing_only: { type: boolean }
                  created_at: { $ref: "#/components/schemas/Timestamp" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/storage/reconcile:
    parameters:
      - { $ref: "#/components/parameters/realm" }
    post:
      tags: [admin]
      summary: Find, and optionally delete, objects no document references
      description: |
        Lists the realm's file objects (the only time backd lists the bucket) and
        reports those no declared file field of any document references, for use after
        restoring a database backup or removing a file field. It always skips objects
        younger than 24 hours, objects whose upload record isn't `failed` (uploads in
        flight, pending uploads not yet expired, files a document holds), and anything
        that isn't `<prefix>/<realm>/<database>/<collection>/<file id>`. With
        `delete: true` it removes exactly the objects reported. Audited as
        `storage.reconcile`. Needs the `config` area with write access.
      operationId: adminReconcileStorage
      security: [{ apiKey: [] }, { session: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                delete: { type: boolean, default: false }
      responses:
        "200":
          description: The report.
          headers:
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorageReconcile" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404":
          description: The realm has no `storage:` in `realm.yaml`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: "`storage_unavailable`: the access keys can't be read, or the bucket or the documents couldn't be read."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/data-checks:
    parameters:
      - { $ref: "#/components/parameters/realm" }
    get:
      tags: [admin]
      summary: The schema check running now and the latest report of every collection
      description: |
        `running` is the schema check queued or running now (the job, with the step
        it is at in `progress`), or null. `items` lists every collection of the
        realm with the summary of its latest report, or null when it was never
        checked. Needs the `data` area (read is enough; for the read-only level,
        `admin.read_access.data`).
      operationId: adminListDataChecks
      security: [{ apiKey: [] }, { session: [] }]
      responses:
        "200":
          description: The running check and the latest reports.
          headers:
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [running, items]
                properties:
                  running:
                    oneOf:
                      - type: "null"
                      - { $ref: "#/components/schemas/JobSummary" }
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [database, collection, report]
                      properties:
                        database: { type: string }
                        collection: { type: string }
                        report:
                          oneOf:
                            - type: "null"
                            - { $ref: "#/components/schemas/CheckReportSummary" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [admin]
      summary: Start a schema check
      description: |
        Queues a check of the documents that no longer match their collection's
        schema: `collection` (with `database`), a whole `database`, or, with no body, every
        collection of the realm. **A check reads every stored document, so on a
        big collection it takes a long time and loads MongoDB.** It runs in the
        background (a worker must be running) as a job, reporting one step per
        collection with a total of 100, advancing every 5 percent; follow it with
        `GET /jobs/{id}`, cancel it with `POST /jobs/{id}/cancel`. Each
        collection's report is stored when it is done, replacing the previous
        one. Only one check is queued or running per realm: another start answers
        `409 check_running` with that job's id in `details`. It never writes
        documents. Audited as `data.check`. Needs the `data` area (read is enough).
      operationId: adminStartDataCheck
      security: [{ apiKey: [] }, { session: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                database: { type: string }
                collection: { type: string, description: "Needs `database`." }
                limit: { type: integer, minimum: 1, maximum: 1000, description: "How many invalid documents to list per collection (default 100); the scan of a collection stops when it finds that many." }
      responses:
        "202":
          description: The check, queued.
          headers:
            Location: { schema: { type: string }, description: "`/v1/{realm}/_admin/jobs/{id}`." }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [id, status, scope, collections, limit, estimated_documents, created_at]
                properties:
                  id: { type: string, description: The job's id. }
                  status: { type: string }
                  scope: { type: string, description: "`<database>/<collection>`, `<database>` or `*`." }
                  collections: { type: array, items: { type: string }, description: "`<database>/<collection>` of each collection it will read." }
                  limit: { type: integer }
                  estimated_documents: { type: [integer, "null"], description: "About how many documents it will read, for the warning a client shows; null when the storage can't say." }
                  created_at: { $ref: "#/components/schemas/Timestamp" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: "`check_running`: another schema check is queued or running; its job id is in `details[0].reason`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/data-checks/{database}/{collection}:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/database" }
      - { name: collection, in: path, required: true, schema: { type: string } }
    get:
      tags: [admin]
      summary: The latest schema check report of a collection
      description: |
        The documents that failed the schema when the collection was last
        checked: for each, its id, whether it is soft-deleted, and up to 5
        problems (a JSON path and the rule that failed, never the value). Needs
        the `data` area (read is enough).
      operationId: adminGetDataCheck
      security: [{ apiKey: [] }, { session: [] }]
      responses:
        "200":
          description: The report.
          headers:
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckReport" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/jobs/{id}/cancel:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/id" }
    post:
      tags: [admin]
      summary: Cancel a job
      description: |
        Ends a queued, retry-waiting or running function job at once: it is `done`
        with the result `cancelled`, so no worker claims it, and a worker that is
        running it notices within a few seconds and stops the run (the executor kills
        the process). What the function already did stays done, as when a worker is
        lost. The job keeps its input, so it can be re-run. Audited as `job.cancel`
        (target `job:<id>`). Needs the `functions` area. backd's own jobs (emails,
        erasures) can't be cancelled.
      operationId: adminCancelJob
      security: [{ apiKey: [] }, { session: [] }]
      responses:
        "200":
          description: The job, now done and cancelled.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobSummary" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: The job has already finished, or isn't a function's.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/jobs/{id}/rerun:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/id" }
    post:
      tags: [admin]
      summary: Re-run a finished job
      description: |
        Queues a new job for a finished function job (any result, a cancelled one
        included): the same function, the same input and the same caller, so it
        behaves as the first run did (a scheduled run's re-run acts as the function,
        like the run). The new job has its own id, `origin: admin` and `rerun_of`
        naming the original, which keeps its own result. A worker must be running
        for it to run. Audited as `job.rerun` (target `job:<id>`, details
        `new_job`). Needs the `functions` area. backd's own jobs can't be re-run.
      operationId: adminRerunJob
      security: [{ apiKey: [] }, { session: [] }]
      responses:
        "202":
          description: The new job, queued.
          headers:
            Location: { schema: { type: string }, description: "`/v1/{realm}/{database}/_jobs/{id}` of the new job." }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobSummary" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: The job hasn't finished, isn't a function's, or its function no longer exists.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/schedules:
    parameters:
      - { $ref: "#/components/parameters/realm" }
    get:
      tags: [admin]
      summary: List the realm's schedules
      description: |
        Every scheduled function of the realm with its schedule, time zone and
        overlap setting, and whether an administrator paused it, sorted by
        function. Needs the `functions` area (read is enough).
      operationId: adminListSchedules
      security: [{ apiKey: [] }, { session: [] }]
      responses:
        "200":
          description: The schedules.
          headers:
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Schedule" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/triggers/status:
    parameters:
      - { $ref: "#/components/parameters/realm" }
    get:
      tags: [admin]
      summary: The trigger dispatcher's state and the realm's triggers
      description: |
        Whether an instance holds the dispatcher's lease and how old the position it stored is
        (what to alert on), the realm's triggers with their functions (each one runs with admin
        data access), the unfinished trigger jobs and the gaps not yet resolved. The lease
        holder's name is not part of the answer. `dispatcher`, `backlog` and `open_gaps` are
        null when this instance can't read them. Needs the `functions` area (read is enough).
      operationId: adminTriggersStatus
      security: [{ apiKey: [] }, { session: [] }]
      responses:
        "200":
          description: The state.
          headers:
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TriggersStatus" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/triggers/gaps:
    parameters:
      - { $ref: "#/components/parameters/realm" }
    get:
      tags: [admin]
      summary: List what the trigger dispatcher could not turn into jobs
      description: |
        The gaps the dispatcher recorded, newest first: `window` (it was away longer than
        MongoDB keeps history; the gap covers every collection), `preimage_missing` (a change's
        condition needed an image that was not there; `keys` lists the documents, at most
        1,000) and `backlog` (the realm was at its ceiling of unfinished trigger jobs). Open
        ones unless `all=true`. Needs the `functions` area (read is enough).
      operationId: adminListTriggerGaps
      security: [{ apiKey: [] }, { session: [] }]
      parameters:
        - { name: all, in: query, description: "`true` includes the resolved gaps.", schema: { type: boolean } }
        - { name: limit, in: query, description: "At most this many (1 to 500; default 100).", schema: { type: integer, minimum: 1, maximum: 500 } }
      responses:
        "200":
          description: The gaps.
          headers:
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/TriggerGap" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/triggers/gaps/{id}/resolve:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { name: id, in: path, required: true, description: The gap's id., schema: { type: string } }
    post:
      tags: [admin]
      summary: Mark a gap as dealt with
      description: |
        Closes an open gap: after a rescan of it, or when nothing that matters was lost. Audited
        as `triggers.gap_resolve` (target `trigger-gap:<id>`). Needs the `functions` area.
      operationId: adminResolveTriggerGap
      security: [{ apiKey: [] }, { session: [] }]
      responses:
        "200":
          description: The gap is resolved.
          headers:
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema:
                type: object
                required: [id, resolved_at]
                properties:
                  id: { type: string }
                  resolved_at: { $ref: "#/components/schemas/Timestamp" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/functions/{database}/{name}/pause:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/database" }
      - { name: name, in: path, required: true, description: The function's name., schema: { type: string } }
    post:
      tags: [admin]
      summary: Pause a function's schedule
      description: |
        A paused schedule creates no runs until it is resumed; runs already queued
        or running are not touched, and the function can still be called by hand.
        The state is stored in the realm's database, so it survives restarts and
        applies to every instance. Pausing a paused schedule changes nothing.
        Audited as `schedule.pause` (target `schedule:<database>/<function>`).
        Needs the `functions` area.
      operationId: adminPauseSchedule
      security: [{ apiKey: [] }, { session: [] }]
      responses:
        "200":
          description: The schedule, now paused.
          headers:
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Schedule" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: The function has no schedule.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/functions/{database}/{name}/resume:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/database" }
      - { name: name, in: path, required: true, description: The function's name., schema: { type: string } }
    post:
      tags: [admin]
      summary: Resume a function's schedule
      description: |
        Lets a paused schedule create runs again. The runs that fell due while it
        was paused are not made up: the next scheduled time after the resume runs.
        Resuming a schedule that isn't paused changes nothing. Audited as
        `schedule.resume`. Needs the `functions` area.
      operationId: adminResumeSchedule
      security: [{ apiKey: [] }, { session: [] }]
      responses:
        "200":
          description: The schedule, running.
          headers:
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Schedule" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: The function has no schedule.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/functions/{database}/{name}/invoke:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/database" }
      - name: name
        in: path
        required: true
        description: The function's name.
        schema: { type: string }
    post:
      tags: [admin]
      summary: Run a function by hand
      description: |
        Runs any function of the database, internal or public, on purpose:
        to re-run a clean-up that failed, or to test a scheduled function.
        The function's `invoke` rule is not evaluated (the credential is an
        admin one) and its `rate_limit` doesn't apply; its input schema and
        `idempotency: required` do. With `as`, the function runs with that
        user as `ctx.user` (their rules and ownership apply to `ctx.db`);
        without it there is no user. Answers like `_func`: the output for a
        `sync` function, `202` with a job for an `async` one. `webhook`
        functions can't be run this way. Every run is audited as
        `function.invoke_manual`, with the user's id, never their email.
      operationId: adminInvokeFunction
      security: [{ apiKey: [] }, { session: [] }]
      parameters:
        - name: Idempotency-Key
          in: header
          description: >-
            As on `_func`: 1-200 characters of letters, digits, `.`, `_`, `:` or `-`.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                input: { description: "The function's input, any JSON value (default `null`)." }
                as: { type: string, format: email, description: "Run as this user of the realm." }
      responses:
        "200":
          description: A `sync` function's output, any JSON value.
          headers:
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: {}
        "202":
          description: An `async` function was queued; poll `Location` for its result.
          headers:
            Location: { description: "`/v1/{realm}/{database}/_jobs/{id}`.", schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "4XX": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/invitations:
    parameters: [{ $ref: "#/components/parameters/realm" }]
    get:
      tags: [admin]
      summary: List unused, unexpired invitations
      operationId: adminListInvitations
      security: [{ apiKey: [] }, { session: [] }]
      responses:
        "200":
          description: Invitations, newest first; tokens are never listed.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Invitation" } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [admin]
      summary: Create an invitation
      operationId: adminCreateInvitation
      security: [{ apiKey: [] }, { session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                email: { type: string, format: email, description: "Only this email may use the invitation." }
                expires_in: { type: string, description: "Days (`7d`) or Go duration (`12h`); default 7d, at most 90d.", examples: ["7d"] }
                send: { type: boolean, description: "Email the invitation to `email` (required then) instead of returning a token to deliver yourself: needs `email` in `realm.yaml`, and the response has no `token`. The link opens the realm's `accept-invitation` page." }
                redirect_to: { type: string, description: "With `send`: where the page after accepting may send the user, within `email.allowed_redirects`." }
                locale: { type: string, description: "With `send`: the language of the email, such as `es`." }
      responses:
        "201":
          description: "The invitation, with its token (shown only here), or with `sent: true` and no token when it was emailed."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitationCreated" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/invitations/{id}:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/id" }
    delete:
      tags: [admin]
      summary: Revoke an invitation
      operationId: adminRevokeInvitation
      security: [{ apiKey: [] }, { session: [] }]
      responses:
        "204": { description: Invitation revoked. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  # ── documents ─────────────────────────────────────────────────────────
  /v1/{realm}/{database}/_func/{function}:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/database" }
      - { $ref: "#/components/parameters/function" }
    post:
      tags: [functions]
      summary: Call a function
      description: |
        Runs the database's function with the request body as its input
        (`ctx.input`), except for `webhook` functions, whose raw body
        and headers are passed through unparsed. In realms with `auth:
        enabled`, API keys may always call; other callers need the
        function's `invoke` rule to allow them (a `webhook` function's
        rule must allow anonymous callers, since the sender has neither
        a session nor a key). For `sync`, the input and output are
        checked against the function's `input.schema.json` and
        `output.schema.json`, when present; `webhook` and `async` skip
        the output check (a `webhook` function answers its sender
        directly; an `async` function has no response to check yet).

        A `sync` function runs immediately and returns its output. An
        `async` function (roadmap F11) is queued and answers 202 with a
        job id and a `Location` to poll for its result at
        `GET /v1/{realm}/{database}/_jobs/{id}`. A `webhook` function
        (roadmap F13) sets its own response — status, headers and body,
        not necessarily JSON — reflected as-is in this response.

        Errors the function raises with `ctx.error(status, code, message)`
        arrive with that 4xx status and code (for `async`, in the job's
        `result` once done, not in this response; `webhook` functions
        answer errors themselves, through their own response).

        `Idempotency-Key` (roadmap F12) reaches the function as
        `ctx.idempotencyKey`, and also makes repeated calls with the
        same key safe to retry: the same key with the same input
        replays the first call's response (for `async`, the same job);
        the same key with different input answers `422`; the same key
        while the first call is still running answers `409`. Scoped to
        the function and the caller, so two different callers can never
        collide on the same client-chosen key. `function.yaml`'s
        `idempotency: required` refuses calls with no key (`400`).

        `Prefer: respond-async` (RFC 7240) asks for a job instead of the
        answer: a `sync` function is queued like an `async` one and
        answers 202 with the job, and the response carries
        `Preference-Applied: respond-async`. The call is checked first
        (rule, scopes, input schema, idempotency, rate limit), runs once
        (no retries: `retry` is for `async` functions) and its result is
        the job's, with the `sync` function's own limits. A `webhook`
        function ignores it, and so does a realm without `auth: enabled`
        (there is nowhere to keep a job): the call is answered inline.
        With an `Idempotency-Key`, the key replays whatever the first
        call was, an answer or a job.

        A function with `internal: true` has no HTTP route: it answers
        `404`, like a function that doesn't exist, to every caller,
        whatever their credentials.
      operationId: callFunction
      security: [{}, { session: [] }, { apiKey: [] }]
      parameters:
        - name: Idempotency-Key
          in: header
          description: >-
            1-200 characters of letters, digits, `.`, `_`, `:` or `-`.
            Passed to the function as `ctx.idempotencyKey`.
          schema: { type: string }
        - name: Prefer
          in: header
          description: >-
            `respond-async` queues a `sync` function as a job and answers
            202 (see the description). Other preferences are ignored.
          schema: { type: string, example: respond-async }
      requestBody:
        description: The input, any JSON value (an empty body is `null`).
        content:
          application/json:
            schema: {}
      responses:
        "200":
          description: >-
            A `sync` function's output, any JSON value. For a `webhook`
            function, the response it set itself — status (reflected in
            this HTTP status), headers and body — which isn't
            necessarily JSON.
          headers:
            Cache-Control: { $ref: "#/components/headers/NoStore" }
            X-Backd-Dev-Duration-Ms: { $ref: "#/components/headers/DevDurationMs" }
            X-Backd-Dev-Logs: { $ref: "#/components/headers/DevLogs" }
          content:
            application/json:
              schema: {}
            "*/*":
              schema: {}
        "202":
          description: >-
            An `async` function was queued (roadmap F11), or a `sync` one
            because the call said `Prefer: respond-async`; poll `Location`
            for its result.
          headers:
            Location: { description: "`/v1/{realm}/{database}/_jobs/{id}`.", schema: { type: string } }
            Preference-Applied: { description: "`respond-async`, when the call asked for it.", schema: { type: string, enum: [respond-async] } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429":
          description: >-
            Either the function, or its realm, is at its concurrency
            limit on this instance (`function.yaml`'s `concurrency`, or
            `functions.max_concurrency` in `realm.yaml`; roadmap F8); or
            the caller is over the function's declared rate limit
            (`function.yaml`'s `rate_limit`, shared across instances;
            roadmap F9).
          headers:
            Retry-After: { $ref: "#/components/headers/RetryAfter" }
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "4XX": { $ref: "#/components/responses/Error" }
        "409":
          description: A call with this `Idempotency-Key` is still running (roadmap F12).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: This `Idempotency-Key` was already used with different input (roadmap F12).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "504": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/{database}/_jobs/{id}:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/database" }
      - { $ref: "#/components/parameters/id" }
    get:
      tags: [functions]
      summary: Read an async job's status and result
      description: |
        Readable only by the job's own caller (the signed-in user who
        enqueued it), by any API key, or by a user holding one of the
        realm's admin roles (roadmap F11), such as an administrator who
        started the job by hand. Anonymous callers
        get 401; any other caller that isn't the job's own owner gets
        404, the same as an unknown job id, so a job's existence isn't
        leaked to callers who aren't allowed to see it.
      operationId: getJob
      security: [{}, { session: [] }, { apiKey: [] }]
      responses:
        "200":
          description: The job's current status, and its result once done.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/{database}/_batch:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/database" }
    post:
      tags: [documents]
      summary: Write several documents atomically
      description: |
        Creates, replaces, patches and deletes documents across the
        database's collections in one MongoDB transaction: either every
        operation applies, or none does. Each operation is validated
        against its collection's schema.json and, for callers whose
        access rules apply (not API keys or admin functions), checked
        against the create/update/delete rule exactly like a single
        write. The first operation that fails aborts the whole batch;
        its index is in the error's `details` (e.g. `{"path": "1", ...}`).
      operationId: batchWrite
      security: [{}, { session: [] }, { apiKey: [] }]
      parameters:
        - $ref: "#/components/parameters/idempotencyKeyDocuments"
        - $ref: "#/components/parameters/orgQuery"
        - $ref: "#/components/parameters/teamQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BatchRequest" }
      responses:
        "200":
          description: One result per operation, in the same order (the remembered ones again for a replayed `Idempotency-Key`).
          headers:
            Cache-Control: { $ref: "#/components/headers/NoStore" }
            Idempotent-Replayed: { description: "`true` when this is the remembered answer of an earlier request with the same `Idempotency-Key`.", schema: { const: "true" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BatchResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "412": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/{database}/{collection}:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/database" }
      - { $ref: "#/components/parameters/collection" }
    get:
      tags: [documents]
      summary: List documents
      description: |
        In realms with `auth: enabled`, only documents the caller's access
        rules allow are listed and counted.
      operationId: listDocuments
      security: [{}, { session: [] }, { apiKey: [] }]
      parameters:
        - { $ref: "#/components/parameters/orgQuery" }
        - { $ref: "#/components/parameters/teamQuery" }
        - { $ref: "#/components/parameters/fileLinks" }
        - { $ref: "#/components/parameters/expand" }
        - { $ref: "#/components/parameters/language" }
        - { $ref: "#/components/parameters/ifNoneMatch" }
        - name: where
          in: query
          description: >-
            JSON filter, e.g. `{"price":{"$lt":20}}`. Keys combine with AND;
            `$or` and `$and` take an array of such objects, e.g.
            `{"$or":[{"title":{"$icontains":"go"}},{"body":{"$icontains":"go"}}]}`.
            `$search` at the top level searches the collection's text index (words,
            `"quoted phrases"` and `-excluded` words, at most 256 bytes and 10 terms), ANDed
            with the rest; it can't be inside `$or` or `$and`, and a collection without a
            text index answers `400 search_not_enabled`.
          schema: { type: string }
        - name: order_by
          in: query
          description: >-
            Comma-separated fields; `-` prefix for descending. Without it,
            documents are ordered by `_meta.created_at`, then `id`: ids chosen
            by clients have no order of their own. `id` is always the last
            tiebreaker. `_relevance` alone, with a `$search`, orders by the search's score
            (best first, ties by id) and puts it in each document's `_meta.score`; it pages
            by `skip` up to the first 1,000 results and can't use `after`.
          schema: { type: string }
        - { $ref: "#/components/parameters/limit" }
        - { $ref: "#/components/parameters/skip" }
        - name: after
          in: query
          description: >-
            The `next_cursor` of the previous page: continues the list after it,
            with the same `where` and `order_by`. Stable when documents change
            between requests and as fast on the last page as on the first, unlike
            `skip`. Can't be combined with `skip`. Treat it as opaque; with
            `order_by=id` alone it is the id of the last document you saw. Refused (`400 invalid_query`,
            on `after`) for another `order_by` than the cursor's, for a cursor
            that isn't one, and for an `order_by` on arrays, objects or fields of
            mixed types, which no cursor can follow.
          schema: { type: string, maxLength: 2048 }
        - name: count
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: A page of documents.
          headers:
            ETag: { $ref: "#/components/headers/ListETag" }
            Vary: { $ref: "#/components/headers/DataVary" }
            Cache-Control: { $ref: "#/components/headers/DataCacheControl" }
            X-Backd-Expand-Queries: { $ref: "#/components/headers/ExpandQueries" }
            X-Backd-Expand-Docs: { $ref: "#/components/headers/ExpandDocs" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentList" }
        "304": { $ref: "#/components/responses/NotModified" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422":
          description: >-
            `search_too_expensive`: a `$search` that needed more time than allowed
            (`BACKD_AGGREGATE_TIME`, 5 seconds by default): fewer or rarer words, or a narrower
            `where`.
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
        "503":
          description: >-
            `index_building`: a `$search` while the collection's text index is being rebuilt
            after its declaration changed. Try again after `Retry-After` seconds.
          headers:
            Retry-After: { $ref: "#/components/headers/RetryAfter" }
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [documents]
      summary: Create a document
      description: |
        The server generates the id, unless the collection declares `custom_id`
        in its collection.yaml: then the body's `id` is required and becomes the
        document's id. Checks run in this order: the id (`400 id_required`,
        `400 invalid_id`; `400 id_not_allowed` for an `id` sent to a collection
        that generates ids), the `create` rule, which sees `data.id` (`403`),
        and the insert, which never overwrites (`409 id_taken`). Repeated
        `id_taken` answers to one caller are limited per minute with
        `429` and `Retry-After`.
      operationId: createDocument
      security: [{}, { session: [] }, { apiKey: [] }]
      parameters:
        - $ref: "#/components/parameters/idempotencyKeyDocuments"
        - $ref: "#/components/parameters/orgQuery"
        - $ref: "#/components/parameters/teamQuery"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DocumentBody" }
      responses:
        "201":
          description: The created document (or, for a replayed `Idempotency-Key`, the document as it was created).
          headers:
            Idempotent-Replayed: { description: "`true` when this is the remembered answer of an earlier request with the same `Idempotency-Key`.", schema: { const: "true" } }
            ETag: { $ref: "#/components/headers/ETag" }
            Vary: { $ref: "#/components/headers/DataVary" }
            Cache-Control: { $ref: "#/components/headers/DataCacheControl" }
            Location:
              required: true
              description: Path of the new document.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/{database}/{collection}/_aggregate:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/database" }
      - { $ref: "#/components/parameters/collection" }
    get:
      tags: [documents]
      summary: Aggregate documents
      description: |
        Summarizes the documents the caller may read: counts and measures, grouped by fields the
        collection declares in `aggregate:` (collection.yaml). The read rule is applied before
        grouping, so a total never includes a document a list would hide. The pipeline is
        fixed; clients only choose declared fields, buckets and metrics.

        Without `group_by` the answer is one group with an empty key (a counter). A missing or
        null value forms its own `null` group; empty date buckets are not filled in.
        `sum` and `avg` are exact decimals returned as strings; `count` and `count_distinct`
        are integers; `min` and `max` are returned as stored. Result names are `<metric>_<field>`.
      operationId: aggregateDocuments
      security: [{}, { session: [] }, { apiKey: [] }]
      parameters:
        - { $ref: "#/components/parameters/orgQuery" }
        - { $ref: "#/components/parameters/teamQuery" }
        - { $ref: "#/components/parameters/language" }
        - { $ref: "#/components/parameters/ifNoneMatch" }
        - name: where
          in: query
          description: >-
            The same JSON filter as a list's, `$search` included, ANDed with the read rule before
            grouping.
          schema: { type: string }
        - name: group_by
          in: query
          description: >-
            Up to 3 fields declared in `aggregate.group_by`, separated by commas; a date field
            takes a bucket: `paid_at:month` (`day`, `week` (ISO, Monday first), `month`, `year`).
            Bucket keys are text: `2026-09-14`, `2026-W38`, `2026-09`, `2026`.
          schema: { type: string }
        - name: metrics
          in: query
          description: >-
            Separated by commas, at most 10; default `count`. `count`; `count_distinct:<field>`
            (a `group_by` field; exact, and above 10,000 distinct values `422`); `sum:<field>`
            and `avg:<field>` (numeric fields of `aggregate.metrics`; missing and null are
            ignored, the average of nothing is null); `min:<field>` and `max:<field>` (numbers
            and dates of `aggregate.metrics`).
          schema: { type: string }
        - name: tz
          in: query
          description: IANA time zone of the date buckets (`Europe/Madrid`); default `UTC`.
          schema: { type: string }
        - name: order_by
          in: query
          description: >-
            Group keys and result names, `-` for descending: `-count`, `sum_total`,
            `paid_at:month`. Default: the keys, ascending, null first.
          schema: { type: string }
        - name: limit
          in: query
          description: Groups returned, 1 to the collection's `max_groups` (1,000 by default); default 100.
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: The groups, and how many there were before `limit`.
          headers:
            ETag: { description: "A weak validator over the answer; send it in `If-None-Match`.", schema: { type: string, pattern: '^W/"[0-9a-f]{32}"$' } }
            Vary: { $ref: "#/components/headers/DataVary" }
            Cache-Control: { $ref: "#/components/headers/DataCacheControl" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AggregateResponse" }
        "304": { $ref: "#/components/responses/NotModified" }
        "400":
          description: >-
            `invalid_aggregate` (the details name each parameter and what is wrong),
            `aggregate_not_enabled` (the collection declares no `aggregate:`) or
            `invalid_query` for `?org=` and `?team=`.
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "422":
          description: >-
            `aggregate_too_expensive`: it needed more time, memory or distinct values than
            allowed. Narrow `where`, group by fewer fields, or add an index that starts with a
            `group_by` field.
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503":
          description: "`index_building`: a `$search` while the text index is being rebuilt."
          headers:
            Retry-After: { $ref: "#/components/headers/RetryAfter" }
          content:
            application/json: { schema: { $ref: "#/components/schemas/Error" } }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/{database}/{collection}/{id}:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/database" }
      - { $ref: "#/components/parameters/collection" }
      - { $ref: "#/components/parameters/id" }
    get:
      tags: [documents]
      summary: Get a document
      operationId: getDocument
      security: [{}, { session: [] }, { apiKey: [] }]
      parameters:
        - { $ref: "#/components/parameters/deleted" }
        - { $ref: "#/components/parameters/fileLinks" }
        - { $ref: "#/components/parameters/expand" }
        - { $ref: "#/components/parameters/ifNoneMatch" }
      responses:
        "200": { $ref: "#/components/responses/Document" }
        "304": { $ref: "#/components/responses/NotModified" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    put:
      tags: [documents]
      summary: Replace a document
      operationId: replaceDocument
      security: [{}, { session: [] }, { apiKey: [] }]
      parameters: [{ $ref: "#/components/parameters/ifMatch" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DocumentBody" }
      responses:
        "200": { $ref: "#/components/responses/Document" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "412": { $ref: "#/components/responses/VersionMismatch" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      tags: [documents]
      summary: Update a document (JSON Merge Patch)
      operationId: patchDocument
      security: [{}, { session: [] }, { apiKey: [] }]
      parameters: [{ $ref: "#/components/parameters/ifMatch" }]
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: "#/components/schemas/DocumentBody" }
      responses:
        "200": { $ref: "#/components/responses/Document" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "412": { $ref: "#/components/responses/VersionMismatch" }
        "415": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [documents]
      summary: Delete a document
      description: |
        In a collection with `soft_delete` (collection.yaml) the document is
        marked deleted instead of removed: no read, write or batch sees it, and
        it can be restored (`POST …/restore`) or, with `purge=true`, removed for
        good under the `purge` rule.
      operationId: deleteDocument
      security: [{}, { session: [] }, { apiKey: [] }]
      parameters:
        - { $ref: "#/components/parameters/ifMatch" }
        - name: purge
          in: query
          description: >-
            `true` removes the document for good, deleted or not, in a
            collection with `soft_delete`. Needs the `purge` rule.
          schema: { type: string, enum: ["true"] }
      responses:
        "204":
          description: Document deleted (or, in a collection with `soft_delete`, marked deleted).
          headers:
            Vary: { $ref: "#/components/headers/DataVary" }
            Cache-Control: { $ref: "#/components/headers/DataCacheControl" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "412": { $ref: "#/components/responses/VersionMismatch" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/{database}/{collection}/{id}/restore:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/database" }
      - { $ref: "#/components/parameters/collection" }
      - { $ref: "#/components/parameters/id" }
    post:
      tags: [documents]
      summary: Restore a soft-deleted document
      description: |
        Brings a deleted document back, as it was, at the next version. Only in
        a collection with `soft_delete`, and only for callers the `restore`
        rule lets see the document. The document must be valid against the
        schema as it is now (`400` otherwise), and its unique values must still
        be free (`409` otherwise).
      operationId: restoreDocument
      security: [{}, { session: [] }, { apiKey: [] }]
      parameters: [{ $ref: "#/components/parameters/ifMatch" }]
      responses:
        "200": { $ref: "#/components/responses/Document" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "412": { $ref: "#/components/responses/VersionMismatch" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/{database}/{collection}/_files/{field}:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/database" }
      - { $ref: "#/components/parameters/collection" }
      - { $ref: "#/components/parameters/fileField" }
    get:
      tags: [documents]
      summary: How a file field takes files
      description: |
        The field's configuration, nothing about any document: how it takes uploads
        (`proxy` or `direct`), how it serves downloads, whether it holds several files,
        and the limits a file is checked against. An app uses it to choose between a proxy
        and a direct upload and to refuse a file before sending it. `max_size` is the
        field's, and for a proxy field also within `BACKD_MAX_UPLOAD_BYTES`.
      operationId: getFileField
      security: [{}, { session: [] }, { apiKey: [] }]
      responses:
        "200":
          description: The field.
          headers:
            Cache-Control: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileFieldInfo" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/data/{database}/{collection}/_files/{field}:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/database" }
      - { $ref: "#/components/parameters/collection" }
      - { $ref: "#/components/parameters/fileField" }
    get:
      tags: [admin]
      summary: How a file field takes files
      description: |
        The field's configuration, nothing about any document: how it takes uploads
        (`proxy` or `direct`), how it serves downloads, whether it holds several files,
        and the limits a file is checked against. An app uses it to choose between a proxy
        and a direct upload and to refuse a file before sending it. `max_size` is the
        field's, and for a proxy field also within `BACKD_MAX_UPLOAD_BYTES`.
      operationId: adminGetFileField
      security: [{ apiKey: [] }, { session: [] }]
      responses:
        "200":
          description: The field.
          headers:
            Cache-Control: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileFieldInfo" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/{database}/{collection}/_files/{field}/uploads:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/database" }
      - { $ref: "#/components/parameters/collection" }
      - { $ref: "#/components/parameters/fileField" }
    post:
      tags: [documents]
      summary: Upload a file before its document exists
      description: |
        Stores the request body (the file's bytes, with its `Content-Type`) as a
        **pending upload** for this field and answers an `upload_id` and a secret
        `upload_token` (only its hash is kept). Naming them in the field of a later
        create, `PUT` or `PATCH`, `{"upload": "<id>", "token": "<token>"}`, writes the
        document with the file's details in the same write, under the `create` or
        `update` rule applied to the final document; so a required file field works.
        The upload is used once, by whoever holds the token (and, when a signed-in
        user made it, only by that user), and expires after `pending_ttl` of the
        realm's `storage:`; an unused one is deleted by the workers.

        Who may upload: a signed-in user needs the collection to have a `create`
        rule; an anonymous caller needs it to admit a document holding just this
        file. The same limits as any upload apply (`max_size`, `types`,
        `BACKD_MAX_UPLOAD_BYTES`), and a caller holds at most 20 unused uploads
        and starts a limited number per window (`429`).

        On a field with `upload: direct` the body is not the file but its declaration,
        `{"name", "size", "type", "sha256"}` as in `POST …/{id}/_files/{field}/uploads`,
        and the answer carries the signed link to send the file to; `…/uploads/{upload_id}/complete`
        then verifies it and makes the upload ready to be named in a write.
        A JPEG or PNG is stored without its metadata (EXIF with the GPS position, XMP,
        comments, PNG text and time), its pixels untouched and its orientation kept, unless
        the field sets `keep_metadata: true`; the file's `size` and `sha256` describe what
        is stored. A picture too damaged to be copied that way is `422 invalid_image`.
      operationId: startFileUpload
      security: [{}, { session: [] }, { apiKey: [] }]
      parameters:
        - name: name
          in: query
          description: The file's name; defaults to the `Content-Disposition` filename, then `file`.
          schema: { type: string }
      requestBody:
        required: true
        content:
          "*/*":
            schema: { type: string, format: binary }
      responses:
        "201":
          description: The pending upload (for a direct field, with the link to send the file to).
          headers:
            Cache-Control: { schema: { const: no-store } }
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/PendingUpload" }
                  - { $ref: "#/components/schemas/DirectUpload" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/{database}/{collection}/{id}/_files/{field}/uploads:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/database" }
      - { $ref: "#/components/parameters/collection" }
      - { $ref: "#/components/parameters/id" }
      - { $ref: "#/components/parameters/fileField" }
    post:
      tags: [documents]
      summary: Start a direct upload to a document
      description: |
        For a field with `upload: direct` (a proxy field answers `409 upload_mode_mismatch`).
        The body declares the file: `name`, `size`, `type` and `sha256` are all required
        and `size` can't exceed the field's `max_size`. The `update` rule is asked, as
        for any upload, about the document with the declared file in it, before anything
        is signed; `max_files` and `If-Match` are checked too.

        The answer is a signed `PUT` link to the bucket, with the headers to send (the
        content type and `x-amz-checksum-sha256` are signed in, and so is the length: the
        storage refuses a body that differs), an `upload_id` and a secret `upload_token`.
        After the `PUT`, `POST …/_files/{field}/uploads/{upload_id}/complete` with the
        token verifies the file and attaches it. The bucket needs CORS for the app's
        origins (`backd storage check` looks).

        Above the storage's single-`PUT` limit (5 GiB, `multipart_above` in the field's
        info) the file is sent in parts: instead of `sha256` the body carries
        `part_sha256`, the SHA-256 of each consecutive part of `part_size` bytes (the
        part size follows from the file's size: at least 64 MiB, a multiple of 16 MiB,
        at most 1000 parts; a body naming the wrong number of digests is `400` and says
        how many). The answer then has `multipart: true`, the `part_size` and a signed
        `PUT` link per part (`parts`, each with its own headers) instead of `url`. The
        links last at least a day. Completing assembles the parts, and the file's
        `sha256` is not that of its bytes but the digest of the parts' digests
        (`sha256` of the reply, checked by the storage). Uploads left unfinished are
        aborted by the worker.
      operationId: startDirectUpload
      security: [{}, { session: [] }, { apiKey: [] }]
      parameters: [{ $ref: "#/components/parameters/ifMatch" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DirectUploadStart" }
      responses:
        "201":
          description: The upload, started.
          headers:
            Cache-Control: { schema: { const: no-store } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DirectUpload" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "412": { $ref: "#/components/responses/VersionMismatch" }
        "415": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/{database}/{collection}/_files/{field}/uploads/{uploadID}/complete:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/database" }
      - { $ref: "#/components/parameters/collection" }
      - { $ref: "#/components/parameters/fileField" }
      - name: uploadID
        in: path
        required: true
        description: The `upload_id` of a started direct upload.
        schema: { type: string, pattern: '^fl_[0-9a-z]{20}$' }
    post:
      tags: [documents]
      summary: Complete a direct upload
      description: |
        Body `{"upload_token": "…"}`. Verifies what the client put in the bucket: one
        `HEAD` (the size, and the SHA-256 the storage computed, must be the declared
        ones; a missing checksum is a mismatch) and one range read of the first bytes,
        whatever the file's size, to detect its type. Any mismatch deletes the object:
        `422 upload_mismatch`, or `415 unsupported_file_type` when the content isn't a
        type of the field. Nothing uploaded yet is `409 file_not_uploaded`, and the
        completion can be tried again. A multipart upload lists its parts first (the
        sizes and digests must be the declared ones; parts still missing are `409
        file_not_uploaded` too), has the storage assemble them, and checks the composite
        checksum of the object against the declared parts. A JPEG or PNG sent in parts is
        refused (`422 invalid_image`) unless the field sets `keep_metadata: true`.

        An upload started for a document is then attached to it (`201` with the
        document, the update rule asked about the real details, `If-Match` accepted); a
        pending one becomes ready to be named in a write (`200`). A wrong, used or
        expired token, an upload of another field, or one another user started is
        `400`, without saying which.
      operationId: completeDirectUpload
      security: [{}, { session: [] }, { apiKey: [] }]
      parameters: [{ $ref: "#/components/parameters/ifMatch" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [upload_token]
              properties:
                upload_token: { type: string }
      responses:
        "200":
          description: A pending upload, ready to be attached by a write.
          headers:
            Cache-Control: { schema: { const: no-store } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompletedUpload" }
        "201":
          description: The document, with the file attached.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Location: { schema: { type: string }, description: "The file's URL." }
            Vary: { $ref: "#/components/headers/DataVary" }
            Cache-Control: { $ref: "#/components/headers/DataCacheControl" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "412": { $ref: "#/components/responses/VersionMismatch" }
        "415": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/{database}/{collection}/{id}/_files/{field}:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/database" }
      - { $ref: "#/components/parameters/collection" }
      - { $ref: "#/components/parameters/id" }
      - { $ref: "#/components/parameters/fileField" }
    post:
      tags: [documents]
      summary: Upload a file into a file field
      description: |
        The request body is the file's bytes, with its `Content-Type`. On a field that
        holds one file the upload replaces it; on a `multiple` field it is appended
        (`409 too_many_files` at `max_files`, before any byte is read). The file's
        name comes from `?name=` or the `Content-Disposition` filename, and is
        sanitized, never refused. The type is detected from the content: a file that
        isn't of one of the field's `types` is `415 unsupported_file_type`, one over
        `max_size` is `413`. The `update` rule is asked first, with the document as it
        would be after the change. Every upload is a change: it bumps the version and
        accepts `If-Match`. The document is answered with the new file's details, and
        `Location` is the file's URL. A field set to `upload: direct` answers
        `409 upload_mode_mismatch`.
        A JPEG or PNG is stored without its metadata (EXIF with the GPS position, XMP,
        comments, PNG text and time), its pixels untouched and its orientation kept, unless
        the field sets `keep_metadata: true`; the file's `size` and `sha256` describe what
        is stored. A picture too damaged to be copied that way is `422 invalid_image`.
      operationId: uploadFile
      security: [{}, { session: [] }, { apiKey: [] }]
      parameters:
        - { $ref: "#/components/parameters/ifMatch" }
        - name: name
          in: query
          description: The file's name; defaults to the `Content-Disposition` filename, then `file`.
          schema: { type: string }
      requestBody:
        required: true
        content:
          "*/*":
            schema: { type: string, format: binary }
      responses:
        "201":
          description: The document, with the file attached.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Location: { schema: { type: string }, description: "The file's URL." }
            Vary: { $ref: "#/components/headers/DataVary" }
            Cache-Control: { $ref: "#/components/headers/DataCacheControl" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "412": { $ref: "#/components/responses/VersionMismatch" }
        "422": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [documents]
      summary: Clear a file field
      description: |
        Removes every file of the field. The `update` rule is asked about the result;
        the objects are deleted afterwards by the workers.
      operationId: clearFiles
      security: [{}, { session: [] }, { apiKey: [] }]
      parameters: [{ $ref: "#/components/parameters/ifMatch" }]
      responses:
        "200": { $ref: "#/components/responses/Document" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "412": { $ref: "#/components/responses/VersionMismatch" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/{database}/{collection}/{id}/_files/{field}/{fileID}:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/database" }
      - { $ref: "#/components/parameters/collection" }
      - { $ref: "#/components/parameters/id" }
      - { $ref: "#/components/parameters/fileField" }
      - { $ref: "#/components/parameters/fileId" }
    get:
      tags: [documents]
      summary: Download a file
      description: |
        The `read` rule decides (a document the caller can't read is `404`). In
        `download: presigned` mode (the default) the answer is a `302` to a short-lived
        signed link of the storage, forcing a download; `?link=json` answers
        `{url, expires_at}` instead. In `download: proxy` mode backd streams the
        bytes: with `nosniff` and a sandbox CSP, one `Range` (`206`, `416`), a strong
        `ETag` from the file's sha256 (`If-None-Match` → `304`, `If-Range`), and
        public caching only for a document anyone may read. A signed backd link
        (`?exp=&sig=`, from `?link=json` or `?file_links=true`) is its own credential
        for this file until it expires (`403 invalid_file_link` otherwise).
        `404 file_missing` when the object is gone from storage.
      operationId: downloadFile
      security: [{}, { session: [] }, { apiKey: [] }]
      parameters:
        - name: link
          in: query
          description: "`json` answers the link instead of redirecting to it."
          schema: { type: string, enum: [json] }
        - name: exp
          in: query
          description: A backd link's expiry (Unix seconds).
          schema: { type: string }
        - name: sig
          in: query
          description: A backd link's signature.
          schema: { type: string }
        - name: version
          in: query
          description: |
            Serve this made version of an image (`versions:` in collection.yaml) instead of
            the original, with the same rules, links, caching and ranges. A backd link made
            for a version is bound to it. `404 version_unavailable` (with the version's
            `status` and `reason` in `details`) when it isn't `ready` or isn't declared.
          schema: { type: string }
        - name: Range
          in: header
          schema: { type: string }
        - name: If-Range
          in: header
          schema: { type: string }
        - name: If-None-Match
          in: header
          schema: { type: string }
      responses:
        "200":
          description: The file's bytes (proxy mode), or the link (`?link=json`).
          headers:
            ETag: { schema: { type: string } }
            Accept-Ranges: { schema: { const: bytes } }
            Content-Disposition: { schema: { type: string } }
            X-Content-Type-Options: { schema: { const: nosniff } }
            Content-Security-Policy: { schema: { type: string } }
            Cache-Control: { schema: { type: string } }
          content:
            "*/*":
              schema: { type: string, format: binary }
            application/json:
              schema: { $ref: "#/components/schemas/FileLink" }
        "206":
          description: The requested range of the file.
          headers:
            Content-Range: { schema: { type: string } }
            ETag: { schema: { type: string } }
          content:
            "*/*":
              schema: { type: string, format: binary }
        "302":
          description: Redirect to the storage's signed link.
          headers:
            Location: { schema: { type: string } }
            Cache-Control: { schema: { const: "private, no-store" } }
        "304": { description: The caller's copy is current. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "416":
          description: The range is outside the file.
          headers:
            Content-Range: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [documents]
      summary: Remove one file
      description: |
        Takes the file out of the document (a new version, `If-Match` accepted) and
        queues the object for deletion.
      operationId: deleteFile
      security: [{}, { session: [] }, { apiKey: [] }]
      parameters: [{ $ref: "#/components/parameters/ifMatch" }]
      responses:
        "200": { $ref: "#/components/responses/Document" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "412": { $ref: "#/components/responses/VersionMismatch" }
        default: { $ref: "#/components/responses/Error" }

  # The admin data route: the data routes' operations for administrators (the
  # `data` admin area), past the collections' rules. Writes are audited.

  /v1/{realm}/_admin/data/{database}/{collection}:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/database" }
      - { $ref: "#/components/parameters/collection" }
    get:
      tags: [admin]
      summary: Admin data, list documents
      description: |
        Every document of the collection, whatever its access rules say. A
        read-only administrator needs `admin.read_access.data`; `deleted=only|include`
        shows the trash of a collection with `soft_delete`.
      operationId: adminListDocuments
      security: [{ apiKey: [] }, { session: [] }]
      parameters:
        - { $ref: "#/components/parameters/fileLinks" }
        - { $ref: "#/components/parameters/ifNoneMatch" }
        - name: where
          in: query
          description: >-
            JSON filter, e.g. `{"price":{"$lt":20}}`. Keys combine with AND;
            `$or` and `$and` take an array of such objects, e.g.
            `{"$or":[{"title":{"$icontains":"go"}},{"body":{"$icontains":"go"}}]}`.
          schema: { type: string }
        - name: order_by
          in: query
          description: >-
            Comma-separated fields; `-` prefix for descending. Without it,
            documents are ordered by `_meta.created_at`, then `id`: ids chosen
            by clients have no order of their own. `id` is always the last
            tiebreaker.
          schema: { type: string }
        - { $ref: "#/components/parameters/limit" }
        - { $ref: "#/components/parameters/skip" }
        - name: after
          in: query
          description: >-
            The `next_cursor` of the previous page: continues the list after it,
            with the same `where` and `order_by`. Stable when documents change
            between requests and as fast on the last page as on the first, unlike
            `skip`. Can't be combined with `skip`. Treat it as opaque; with
            `order_by=id` alone it is the id of the last document you saw. Refused (`400 invalid_query`,
            on `after`) for another `order_by` than the cursor's, for a cursor
            that isn't one, and for an `order_by` on arrays, objects or fields of
            mixed types, which no cursor can follow.
          schema: { type: string, maxLength: 2048 }
        - name: count
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: A page of documents.
          headers:
            ETag: { $ref: "#/components/headers/ListETag" }
            Vary: { $ref: "#/components/headers/DataVary" }
            Cache-Control: { $ref: "#/components/headers/DataCacheControl" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentList" }
        "304": { $ref: "#/components/responses/NotModified" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [admin]
      summary: Admin data, create a document
      operationId: adminCreateDocument
      security: [{ apiKey: [] }, { session: [] }]
      parameters:
        - $ref: "#/components/parameters/idempotencyKeyDocuments"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DocumentBody" }
      responses:
        "201":
          description: The created document (or, for a replayed `Idempotency-Key`, the document as it was created).
          headers:
            Idempotent-Replayed: { description: "`true` when this is the remembered answer of an earlier request with the same `Idempotency-Key`.", schema: { const: "true" } }
            ETag: { $ref: "#/components/headers/ETag" }
            Vary: { $ref: "#/components/headers/DataVary" }
            Cache-Control: { $ref: "#/components/headers/DataCacheControl" }
            Location:
              required: true
              description: Path of the new document.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/{realm}/_admin/data/{database}/{collection}/{id}:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/database" }
      - { $ref: "#/components/parameters/collection" }
      - { $ref: "#/components/parameters/id" }
    get:
      tags: [admin]
      summary: Admin data, get a document
      operationId: adminGetDocument
      security: [{ apiKey: [] }, { session: [] }]
      parameters:
        - { $ref: "#/components/parameters/deleted" }
        - { $ref: "#/components/parameters/fileLinks" }
        - { $ref: "#/components/parameters/ifNoneMatch" }
      responses:
        "200": { $ref: "#/components/responses/Document" }
        "304": { $ref: "#/components/responses/NotModified" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    put:
      tags: [admin]
      summary: Admin data, replace a document
      operationId: adminReplaceDocument
      security: [{ apiKey: [] }, { session: [] }]
      parameters: [{ $ref: "#/components/parameters/ifMatch" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DocumentBody" }
      responses:
        "200": { $ref: "#/components/responses/Document" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "412": { $ref: "#/components/responses/VersionMismatch" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      tags: [admin]
      summary: Admin data, update a document (JSON Merge Patch)
      operationId: adminPatchDocument
      security: [{ apiKey: [] }, { session: [] }]
      parameters: [{ $ref: "#/components/parameters/ifMatch" }]
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: "#/components/schemas/DocumentBody" }
      responses:
        "200": { $ref: "#/components/responses/Document" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "412": { $ref: "#/components/responses/VersionMismatch" }
        "415": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [admin]
      summary: Admin data, delete a document
      description: |
        In a collection with `soft_delete` (collection.yaml) the document is
        marked deleted instead of removed: no read, write or batch sees it, and
        it can be restored (`POST …/restore`) or, with `purge=true`, removed for
        good under the `purge` rule.
      operationId: adminDeleteDocument
      security: [{ apiKey: [] }, { session: [] }]
      parameters:
        - { $ref: "#/components/parameters/ifMatch" }
        - name: purge
          in: query
          description: >-
            `true` removes the document for good, deleted or not, in a
            collection with `soft_delete`. Needs the `purge` rule.
          schema: { type: string, enum: ["true"] }
      responses:
        "204":
          description: Document deleted (or, in a collection with `soft_delete`, marked deleted).
          headers:
            Vary: { $ref: "#/components/headers/DataVary" }
            Cache-Control: { $ref: "#/components/headers/DataCacheControl" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "412": { $ref: "#/components/responses/VersionMismatch" }
        default: { $ref: "#/components/responses/Error" }
  /v1/{realm}/_admin/data/{database}/{collection}/{id}/restore:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/database" }
      - { $ref: "#/components/parameters/collection" }
      - { $ref: "#/components/parameters/id" }
    post:
      tags: [admin]
      summary: Admin data, restore a soft-deleted document
      description: |
        Brings a deleted document back, as it was, at the next version. Only in
        a collection with `soft_delete`, and only for callers the `restore`
        rule lets see the document. The document must be valid against the
        schema as it is now (`400` otherwise), and its unique values must still
        be free (`409` otherwise).
      operationId: adminRestoreDocument
      security: [{ apiKey: [] }, { session: [] }]
      parameters: [{ $ref: "#/components/parameters/ifMatch" }]
      responses:
        "200": { $ref: "#/components/responses/Document" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "412": { $ref: "#/components/responses/VersionMismatch" }
        default: { $ref: "#/components/responses/Error" }
  /v1/{realm}/_admin/data/{database}/{collection}/{id}/_transfer:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/database" }
      - { $ref: "#/components/parameters/collection" }
      - { $ref: "#/components/parameters/id" }
    post:
      tags: [admin]
      summary: Admin data, move a document to another organization
      description: |
        Moves a document to another organization, or out of its organization (`org: null`, when
        the collection's organization is `optional`). A document never moves through an update:
        this is a realm administrator's act. The target must exist and not be deleted
        (`409 org_not_active`); the version goes up, `If-Match` is honored (`412`) and the audit
        record `data.transfer` names both organizations, never content. Files and image versions
        travel with the document unchanged. In a collection with `team`, `team` names a team of
        the organization the document ends up in (`404` for an unknown one) or is null to take it
        out of its team (`400 team_required` where one is required); moving to another
        organization leaves the team, so a collection that requires one needs it named. A
        collection without teams answers `400 team_not_allowed`. Needs the `data` area with write
        access.
      operationId: adminTransferDocument
      security: [{ apiKey: [] }, { session: [] }]
      parameters: [{ $ref: "#/components/parameters/ifMatch" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [org]
              properties:
                org: { type: [string, "null"] }
                team: { type: [string, "null"] }
      responses:
        "200": { $ref: "#/components/responses/Document" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "412": { $ref: "#/components/responses/VersionMismatch" }
        default: { $ref: "#/components/responses/Error" }
  /v1/{realm}/_admin/data/{database}/{collection}/_assign_org:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/database" }
      - { $ref: "#/components/parameters/collection" }
    post:
      tags: [admin]
      summary: Admin data, give documents without one an organization
      description: |
        For a collection that adopted organizations after it had documents: those have none, and
        members can't see them. Queues a job (`202` with `job` and `matched`) that sets
        `_meta.org` on the documents **without one** that match `where` (the filter of a list),
        and never moves a document that has an organization. With `?dry_run=true` it answers
        `200` with `matched` and changes nothing. One assignment per collection at a time
        (`409 assign_running`); follow the job with the jobs routes. Audited as
        `data.assign_org`. Needs the `data` area with write access.
      operationId: adminAssignOrganization
      security: [{ apiKey: [] }, { session: [] }]
      parameters:
        - { name: dry_run, in: query, schema: { type: boolean } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [org]
              properties:
                org: { type: string }
                where: { type: object }
      responses:
        "200":
          description: "A dry run: how many documents the job would change."
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [matched]
                properties:
                  matched: { type: integer }
        "202":
          description: The job was queued.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [job, matched]
                properties:
                  job: { type: string }
                  matched: { type: integer }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/{realm}/_admin/data/{database}/{collection}/_files/{field}/uploads:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/database" }
      - { $ref: "#/components/parameters/collection" }
      - { $ref: "#/components/parameters/fileField" }
    post:
      tags: [admin]
      summary: Upload a file before its document exists
      description: |
        Stores the request body (the file's bytes, with its `Content-Type`) as a
        **pending upload** for this field and answers an `upload_id` and a secret
        `upload_token` (only its hash is kept). Naming them in the field of a later
        create, `PUT` or `PATCH`, `{"upload": "<id>", "token": "<token>"}`, writes the
        document with the file's details in the same write, under the `create` or
        `update` rule applied to the final document; so a required file field works.
        The upload is used once, by whoever holds the token (and, when a signed-in
        user made it, only by that user), and expires after `pending_ttl` of the
        realm's `storage:`; an unused one is deleted by the workers.

        Who may upload: a signed-in user needs the collection to have a `create`
        rule; an anonymous caller needs it to admit a document holding just this
        file. The same limits as any upload apply (`max_size`, `types`,
        `BACKD_MAX_UPLOAD_BYTES`), and a caller holds at most 20 unused uploads
        and starts a limited number per window (`429`).

        On a field with `upload: direct` the body is not the file but its declaration,
        `{"name", "size", "type", "sha256"}` as in `POST …/{id}/_files/{field}/uploads`,
        and the answer carries the signed link to send the file to; `…/uploads/{upload_id}/complete`
        then verifies it and makes the upload ready to be named in a write. Admin route: past the collection's rules.
        A JPEG or PNG is stored without its metadata unless the field sets
        `keep_metadata: true`; a picture too damaged to be copied that way is `422 invalid_image`.
      operationId: adminStartFileUpload
      security: [{ apiKey: [] }, { session: [] }]
      parameters:
        - name: name
          in: query
          description: The file's name; defaults to the `Content-Disposition` filename, then `file`.
          schema: { type: string }
      requestBody:
        required: true
        content:
          "*/*":
            schema: { type: string, format: binary }
      responses:
        "201":
          description: The pending upload (for a direct field, with the link to send the file to).
          headers:
            Cache-Control: { schema: { const: no-store } }
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/PendingUpload" }
                  - { $ref: "#/components/schemas/DirectUpload" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/data/{database}/{collection}/{id}/_files/{field}/uploads:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/database" }
      - { $ref: "#/components/parameters/collection" }
      - { $ref: "#/components/parameters/id" }
      - { $ref: "#/components/parameters/fileField" }
    post:
      tags: [admin]
      summary: Start a direct upload to a document
      description: |
        For a field with `upload: direct` (a proxy field answers `409 upload_mode_mismatch`).
        The body declares the file: `name`, `size`, `type` and `sha256` are all required
        and `size` can't exceed the field's `max_size`. The `update` rule is asked, as
        for any upload, about the document with the declared file in it, before anything
        is signed; `max_files` and `If-Match` are checked too.

        The answer is a signed `PUT` link to the bucket, with the headers to send (the
        content type and `x-amz-checksum-sha256` are signed in, and so is the length: the
        storage refuses a body that differs), an `upload_id` and a secret `upload_token`.
        After the `PUT`, `POST …/_files/{field}/uploads/{upload_id}/complete` with the
        token verifies the file and attaches it. The bucket needs CORS for the app's
        origins (`backd storage check` looks). Admin route: past the collection's rules.

        Above the storage's single-`PUT` limit (5 GiB, `multipart_above` in the field's
        info) the file is sent in parts: instead of `sha256` the body carries
        `part_sha256`, the SHA-256 of each consecutive part of `part_size` bytes (the
        part size follows from the file's size: at least 64 MiB, a multiple of 16 MiB,
        at most 1000 parts; a body naming the wrong number of digests is `400` and says
        how many). The answer then has `multipart: true`, the `part_size` and a signed
        `PUT` link per part (`parts`, each with its own headers) instead of `url`. The
        links last at least a day. Completing assembles the parts, and the file's
        `sha256` is not that of its bytes but the digest of the parts' digests
        (`sha256` of the reply, checked by the storage). Uploads left unfinished are
        aborted by the worker.
      operationId: adminStartDirectUpload
      security: [{ apiKey: [] }, { session: [] }]
      parameters: [{ $ref: "#/components/parameters/ifMatch" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DirectUploadStart" }
      responses:
        "201":
          description: The upload, started.
          headers:
            Cache-Control: { schema: { const: no-store } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DirectUpload" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "412": { $ref: "#/components/responses/VersionMismatch" }
        "415": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/data/{database}/{collection}/_files/{field}/uploads/{uploadID}/complete:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/database" }
      - { $ref: "#/components/parameters/collection" }
      - { $ref: "#/components/parameters/fileField" }
      - name: uploadID
        in: path
        required: true
        description: The `upload_id` of a started direct upload.
        schema: { type: string, pattern: '^fl_[0-9a-z]{20}$' }
    post:
      tags: [admin]
      summary: Complete a direct upload
      description: |
        Body `{"upload_token": "…"}`. Verifies what the client put in the bucket: one
        `HEAD` (the size, and the SHA-256 the storage computed, must be the declared
        ones; a missing checksum is a mismatch) and one range read of the first bytes,
        whatever the file's size, to detect its type. Any mismatch deletes the object:
        `422 upload_mismatch`, or `415 unsupported_file_type` when the content isn't a
        type of the field. Nothing uploaded yet is `409 file_not_uploaded`, and the
        completion can be tried again. A multipart upload lists its parts first (the
        sizes and digests must be the declared ones; parts still missing are `409
        file_not_uploaded` too), has the storage assemble them, and checks the composite
        checksum of the object against the declared parts. A JPEG or PNG sent in parts is
        refused (`422 invalid_image`) unless the field sets `keep_metadata: true`.

        An upload started for a document is then attached to it (`201` with the
        document, the update rule asked about the real details, `If-Match` accepted); a
        pending one becomes ready to be named in a write (`200`). A wrong, used or
        expired token, an upload of another field, or one another user started is
        `400`, without saying which. Admin route: past the collection's rules.
      operationId: adminCompleteDirectUpload
      security: [{ apiKey: [] }, { session: [] }]
      parameters: [{ $ref: "#/components/parameters/ifMatch" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [upload_token]
              properties:
                upload_token: { type: string }
      responses:
        "200":
          description: A pending upload, ready to be attached by a write.
          headers:
            Cache-Control: { schema: { const: no-store } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompletedUpload" }
        "201":
          description: The document, with the file attached.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Location: { schema: { type: string }, description: "The file's URL." }
            Vary: { $ref: "#/components/headers/DataVary" }
            Cache-Control: { $ref: "#/components/headers/DataCacheControl" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "412": { $ref: "#/components/responses/VersionMismatch" }
        "415": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/data/{database}/{collection}/{id}/_files/{field}:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/database" }
      - { $ref: "#/components/parameters/collection" }
      - { $ref: "#/components/parameters/id" }
      - { $ref: "#/components/parameters/fileField" }
    post:
      tags: [admin]
      summary: Upload a file into a file field, admin data
      description: |
        The request body is the file's bytes, with its `Content-Type`. On a field that
        holds one file the upload replaces it; on a `multiple` field it is appended
        (`409 too_many_files` at `max_files`, before any byte is read). The file's
        name comes from `?name=` or the `Content-Disposition` filename, and is
        sanitized, never refused. The type is detected from the content: a file that
        isn't of one of the field's `types` is `415 unsupported_file_type`, one over
        `max_size` is `413`. The `update` rule is asked first, with the document as it
        would be after the change. Every upload is a change: it bumps the version and
        accepts `If-Match`. The document is answered with the new file's details, and
        `Location` is the file's URL. A field set to `upload: direct` answers
        `409 upload_mode_mismatch`. Admin route: past the collection's rules.
        A JPEG or PNG is stored without its metadata (EXIF with the GPS position, XMP,
        comments, PNG text and time), its pixels untouched and its orientation kept, unless
        the field sets `keep_metadata: true`; the file's `size` and `sha256` describe what
        is stored. A picture too damaged to be copied that way is `422 invalid_image`.
      operationId: adminUploadFile
      security: [{ apiKey: [] }, { session: [] }]
      parameters:
        - { $ref: "#/components/parameters/ifMatch" }
        - name: name
          in: query
          description: The file's name; defaults to the `Content-Disposition` filename, then `file`.
          schema: { type: string }
      requestBody:
        required: true
        content:
          "*/*":
            schema: { type: string, format: binary }
      responses:
        "201":
          description: The document, with the file attached.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Location: { schema: { type: string }, description: "The file's URL." }
            Vary: { $ref: "#/components/headers/DataVary" }
            Cache-Control: { $ref: "#/components/headers/DataCacheControl" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "412": { $ref: "#/components/responses/VersionMismatch" }
        "422": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [admin]
      summary: Clear a file field, admin data
      description: |
        Removes every file of the field. The `update` rule is asked about the result;
        the objects are deleted afterwards by the workers. Admin route: past the collection's rules.
      operationId: adminClearFiles
      security: [{ apiKey: [] }, { session: [] }]
      parameters: [{ $ref: "#/components/parameters/ifMatch" }]
      responses:
        "200": { $ref: "#/components/responses/Document" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "412": { $ref: "#/components/responses/VersionMismatch" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/data/{database}/{collection}/{id}/_files/{field}/{fileID}:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/database" }
      - { $ref: "#/components/parameters/collection" }
      - { $ref: "#/components/parameters/id" }
      - { $ref: "#/components/parameters/fileField" }
      - { $ref: "#/components/parameters/fileId" }
    get:
      tags: [admin]
      summary: Download a file, admin data
      description: |
        The `read` rule decides (a document the caller can't read is `404`). In
        `download: presigned` mode (the default) the answer is a `302` to a short-lived
        signed link of the storage, forcing a download; `?link=json` answers
        `{url, expires_at}` instead. In `download: proxy` mode backd streams the
        bytes: with `nosniff` and a sandbox CSP, one `Range` (`206`, `416`), a strong
        `ETag` from the file's sha256 (`If-None-Match` → `304`, `If-Range`), and
        public caching only for a document anyone may read. A signed backd link
        (`?exp=&sig=`, from `?link=json` or `?file_links=true`) is its own credential
        for this file until it expires (`403 invalid_file_link` otherwise).
        `404 file_missing` when the object is gone from storage. Admin route: past the collection's rules.
      operationId: adminDownloadFile
      security: [{}, { session: [] }, { apiKey: [] }]
      parameters:
        - name: link
          in: query
          description: "`json` answers the link instead of redirecting to it."
          schema: { type: string, enum: [json] }
        - name: exp
          in: query
          description: A backd link's expiry (Unix seconds).
          schema: { type: string }
        - name: sig
          in: query
          description: A backd link's signature.
          schema: { type: string }
        - name: version
          in: query
          description: |
            Serve this made version of an image (`versions:` in collection.yaml) instead of
            the original, with the same rules, links, caching and ranges. A backd link made
            for a version is bound to it. `404 version_unavailable` (with the version's
            `status` and `reason` in `details`) when it isn't `ready` or isn't declared.
          schema: { type: string }
        - name: Range
          in: header
          schema: { type: string }
        - name: If-Range
          in: header
          schema: { type: string }
        - name: If-None-Match
          in: header
          schema: { type: string }
      responses:
        "200":
          description: The file's bytes (proxy mode), or the link (`?link=json`).
          headers:
            ETag: { schema: { type: string } }
            Accept-Ranges: { schema: { const: bytes } }
            Content-Disposition: { schema: { type: string } }
            X-Content-Type-Options: { schema: { const: nosniff } }
            Content-Security-Policy: { schema: { type: string } }
            Cache-Control: { schema: { type: string } }
          content:
            "*/*":
              schema: { type: string, format: binary }
            application/json:
              schema: { $ref: "#/components/schemas/FileLink" }
        "206":
          description: The requested range of the file.
          headers:
            Content-Range: { schema: { type: string } }
            ETag: { schema: { type: string } }
          content:
            "*/*":
              schema: { type: string, format: binary }
        "302":
          description: Redirect to the storage's signed link.
          headers:
            Location: { schema: { type: string } }
            Cache-Control: { schema: { const: "private, no-store" } }
        "304": { description: The caller's copy is current. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "416":
          description: The range is outside the file.
          headers:
            Content-Range: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [admin]
      summary: Remove one file, admin data
      description: |
        Takes the file out of the document (a new version, `If-Match` accepted) and
        queues the object for deletion. Admin route: past the collection's rules.
      operationId: adminDeleteFile
      security: [{ apiKey: [] }, { session: [] }]
      parameters: [{ $ref: "#/components/parameters/ifMatch" }]
      responses:
        "200": { $ref: "#/components/responses/Document" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "412": { $ref: "#/components/responses/VersionMismatch" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/data/{database}/_batch:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/database" }
    post:
      tags: [admin]
      summary: Admin data, write several documents atomically
      description: |
        Creates, replaces, patches and deletes documents across the
        database's collections in one MongoDB transaction: either every
        operation applies, or none does. Each operation is validated
        against its collection's schema.json and, for callers whose
        access rules apply (not API keys or admin functions), checked
        against the create/update/delete rule exactly like a single
        write. The first operation that fails aborts the whole batch;
        its index is in the error's `details` (e.g. `{"path": "1", ...}`).
      operationId: adminBatchWrite
      security: [{ apiKey: [] }, { session: [] }]
      parameters:
        - $ref: "#/components/parameters/idempotencyKeyDocuments"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BatchRequest" }
      responses:
        "200":
          description: One result per operation, in the same order (the remembered ones again for a replayed `Idempotency-Key`).
          headers:
            Cache-Control: { $ref: "#/components/headers/NoStore" }
            Idempotent-Replayed: { description: "`true` when this is the remembered answer of an earlier request with the same `Idempotency-Key`.", schema: { const: "true" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BatchResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "412": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/{database}/{collection}/{id}/_files/{field}/{fileID}/versions/{version}:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/database" }
      - { $ref: "#/components/parameters/collection" }
      - { $ref: "#/components/parameters/id" }
      - { $ref: "#/components/parameters/fileField" }
      - { $ref: "#/components/parameters/fileId" }
      - name: version
        in: path
        required: true
        description: The name of a version the field declares (`versions:` in collection.yaml).
        schema: { type: string }
    post:
      tags: [documents]
      summary: Make a version of an image again, or with other parameters
      description: |
        For functions (and anything else allowed to update the document): an empty body
        makes the version again with the parameters the field declares; a JSON object of
        parameters (`max_width`, `max_height`, `fit`, `quality`, `format`, `upscale`, checked
        like `collection.yaml`'s) generates it with those instead, which only a `writable`
        version allows (`403 version_not_writable`). The request waits for a worker to make
        it (up to five minutes: `504 version_timeout` when no worker did) and answers the
        version's new details, as in the document. The `update` rule is asked with the
        document as it is; an API key skips it. The document's version does not change.
        When the version can't be made the answer is `422` with the reason as its code:
        `not_an_image`, `unsupported_format`, `too_large`, `decode_error`, `timeout`.
      operationId: MakeVersion
      security: [{ session: [] }, { apiKey: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                max_width: { type: integer, minimum: 1, maximum: 16384 }
                max_height: { type: integer, minimum: 1, maximum: 16384 }
                fit: { type: string, enum: [contain, cover, stretch] }
                quality: { type: integer, minimum: 1, maximum: 100 }
                format: { type: string, enum: [jpeg, png] }
                upscale: { type: boolean }
      responses:
        "200":
          description: The version's details.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VersionState" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    delete:
      tags: [documents]
      summary: Delete a made version
      description: |
        Drops the made copy and sends the version back to what a new file's is: `pending`
        (a worker makes it again) when it has parameters, `empty` when only functions make
        it. Needs the same access as making it. The document's version does not change.
      operationId: DeleteVersion
      security: [{ session: [] }, { apiKey: [] }]
      responses:
        "200":
          description: The version's new state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VersionState" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/{realm}/_admin/data/{database}/{collection}/{id}/_files/{field}/{fileID}/versions/{version}:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/database" }
      - { $ref: "#/components/parameters/collection" }
      - { $ref: "#/components/parameters/id" }
      - { $ref: "#/components/parameters/fileField" }
      - { $ref: "#/components/parameters/fileId" }
      - name: version
        in: path
        required: true
        description: The name of a version the field declares (`versions:` in collection.yaml).
        schema: { type: string }
    post:
      tags: [admin]
      summary: Make a version of an image again, or with other parameters
      description: |
        For functions (and anything else allowed to update the document): an empty body
        makes the version again with the parameters the field declares; a JSON object of
        parameters (`max_width`, `max_height`, `fit`, `quality`, `format`, `upscale`, checked
        like `collection.yaml`'s) generates it with those instead, which only a `writable`
        version allows (`403 version_not_writable`). The request waits for a worker to make
        it (up to five minutes: `504 version_timeout` when no worker did) and answers the
        version's new details, as in the document. The `update` rule is asked with the
        document as it is; an API key skips it. The document's version does not change.
        When the version can't be made the answer is `422` with the reason as its code:
        `not_an_image`, `unsupported_format`, `too_large`, `decode_error`, `timeout`.
      operationId: adminMakeVersion
      security: [{ apiKey: [] }, { session: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                max_width: { type: integer, minimum: 1, maximum: 16384 }
                max_height: { type: integer, minimum: 1, maximum: 16384 }
                fit: { type: string, enum: [contain, cover, stretch] }
                quality: { type: integer, minimum: 1, maximum: 100 }
                format: { type: string, enum: [jpeg, png] }
                upscale: { type: boolean }
      responses:
        "200":
          description: The version's details.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VersionState" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    delete:
      tags: [admin]
      summary: Delete a made version
      description: |
        Drops the made copy and sends the version back to what a new file's is: `pending`
        (a worker makes it again) when it has parameters, `empty` when only functions make
        it. Needs the same access as making it. The document's version does not change.
      operationId: adminDeleteVersion
      security: [{ apiKey: [] }, { session: [] }]
      responses:
        "200":
          description: The version's new state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VersionState" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    session:
      type: http
      scheme: bearer
      description: A session token (`bds_…`) from signup or login.
    apiKey:
      type: http
      scheme: bearer
      description: >-
        An API key (`bdk_…`). Full access to the realm's data; the admin API
        (`/_admin`) needs a key with the `admin` role (a `data` key gets 403).
        Never use it in browsers.

  parameters:
    org:
      name: org
      in: path
      required: true
      description: An organization id.
      schema: { type: string }
    ssoProvider:
      name: provider
      in: path
      required: true
      description: A provider organizations may connect (`organizations.sso.providers`).
      schema: { type: string, enum: [google, microsoft] }
    orgQuery:
      name: org
      in: query
      description: |
        The organization (its id) of a collection with `organization` set. On a create it is
        where the document is created: the caller must be a member (`403 not_org_member`, the
        same for an unknown organization), and `required` collections answer `400 org_required`
        without it; a collection without organizations answers `400 org_not_allowed`. On a list
        it is a shorthand for `where` on `_meta.org`, ANDed with it: the read rule still
        decides what is seen. A batch takes it for all its creates. Fixed at creation: an
        update that names another organization answers `400 immutable_field`.
      schema: { type: string }
    language:
      name: language
      in: query
      description: |
        The language a `$search` is stemmed in: a locale code (`es`, `en-GB`, `pt_BR`) mapped to a
        language of the text index; one with no language of its own searches without stemming.
        Without it: the signed-in user's locale, then the first language of `Accept-Language`
        for callers without one, then the index's `default_language`. Only meaningful with
        `$search` in `where`.
      schema: { type: string, maxLength: 35 }
    expand:
      name: expand
      in: query
      description: |
        References to return next to the result, in `_expanded`: reference names declared in the
        collection's `collection.yaml`, separated by commas, each optionally followed by the
        fields to return in parentheses, and `name.nested` for a reference of the referenced
        collection: `expand=author(name,avatar),tags(name),author.company`. Nothing is expanded
        without it. Every expanded document passes its own collection's read rule with the
        caller's identity; a reference that is missing, unreadable or in another organization is
        `null`, the same in every case. Two levels, 5 entries, 100 ids per array and 2,000
        documents per response by default (`BACKD_EXPAND_MAX_*`): `400 invalid_expand` names the
        part that is wrong, `400 expand_too_large` is answered before any partial data. The
        response is `private, no-cache`, never `304`; on a document the `ETag` stays its own
        version. `where` and `order_by` can't use expanded fields. Ignored on writes.
      schema: { type: string, maxLength: 1024 }
    teamQuery:
      name: team
      in: query
      description: |
        The team (its id) of a collection with `team` set, within `?org=`. On a create it is the
        team the document belongs to: the caller must be a member of it or hold a team role in
        it (`403 not_team_member`, the same for an unknown team or one of another
        organization); `required` collections answer `400 team_required` without it, it needs
        `?org=` (`400`), and a collection without teams answers `400 team_not_allowed`. A batch
        takes it for all its creates. On a list it is a shorthand for `where` on `_meta.team`,
        ANDed with it: the read rule still decides what is seen. Fixed at creation: an update
        that names another team answers `400 immutable_field`; administrators move documents
        with the transfer.
      schema: { type: string }
    realm:
      name: realm
      in: path
      required: true
      schema: { type: string }
    reauth:
      name: X-Backd-Reauth
      in: header
      required: false
      description: >-
        The token `POST /_auth/reauth` gave: a fresh proof of identity, bound to the session and
        good for the realm's `reauth.ttl` (5 minutes by default), for as many requests as that
        covers. Without a good one the action answers `401 reauth_required`.
      schema: { type: string }
    database:
      name: database
      in: path
      required: true
      schema: { type: string }
    collection:
      name: collection
      in: path
      required: true
      schema: { type: string }
    function:
      name: function
      in: path
      required: true
      schema: { type: string }
    id:
      name: id
      in: path
      required: true
      schema: { type: string }
    limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    skip:
      name: skip
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    idempotencyKeyDocuments:
      name: Idempotency-Key
      in: header
      description: >-
        Makes a retried create safe: 1-200 characters of letters, digits, `.`, `_`, `:` or `-`. The first request
        with a key runs and its answer is remembered for 24 hours (only if it succeeds); the same key with the
        same body returns that answer again, with `Idempotent-Replayed: true`; with another body it answers
        `422 idempotency_key_reused`; while the first is still running, `409 request_in_progress`. Needs a signed-in
        user or an API key (`400` for anonymous callers) and a realm with authentication enabled.
      schema: { type: string }
    ifMatch:
      name: If-Match
      in: header
      description: '`"<version>"`, a list of them, or `*`. The write fails with 412 unless the current version matches.'
      schema: { type: string }
    ifNoneMatch:
      name: If-None-Match
      in: header
      description: >-
        The `ETag` of a copy you already hold (a list of them, or `*`; a `W/`
        prefix is ignored). When the document, as this caller may read it, still
        has that tag the answer is `304` with no body. Read rules run first: a
        document the caller can no longer read is still `404`.
      schema: { type: string }
    deleted:
      name: deleted
      in: query
      description: >-
        In a collection with `soft_delete`, `only` returns the deleted documents
        (the trash) and `include` both. It needs the `restore` rule, besides the
        `read` rule. Anything else is `400`, and so is any value on a collection
        that doesn't soft-delete.
      schema: { type: string, enum: [only, include] }

    fileLinks:
      name: file_links
      in: query
      description: >-
        `true` adds `url` and `expires_at` to every file of the documents read: a
        link for apps to show or download it. Never stored, and not part of the ETag.
      schema: { type: string, enum: ["true"] }
    orgSignIn:
      name: org
      in: path
      required: true
      description: >-
        An organization's id, or its slug (case and surrounding spaces do not matter). An id is tried
        first, and a slug may not look like an id. Whatever is given, an organization that can't be
        signed in to (not there, deleted) is answered like one the person does not belong to.
      schema: { type: string }
    orgCallback:
      name: org
      in: path
      required: true
      description: An organization's id (the redirect address of a connection always uses it).
      schema: { type: string }
    oauthProvider:
      name: provider
      in: path
      required: true
      description: A provider of the realm's `providers:` (`google`, `microsoft` or `apple`).
      schema: { type: string, pattern: '^[a-z][a-z0-9-]{0,31}$' }
    fileField:
      name: field
      in: path
      required: true
      description: The name of a file field, as declared under `files:` in collection.yaml.
      schema: { type: string }
    fileId:
      name: fileID
      in: path
      required: true
      description: The file's id (`fl_…`), from the document's file field.
      schema: { type: string, pattern: '^fl_[0-9a-z]{20}$' }

  headers:
    ETag:
      required: true
      description: >-
        `"<version>"`, the document''s `_meta.version`; a response that differs
        from the full document for the caller (hidden fields) adds `.r` and 8 hex
        characters, such as `"12.r1a2b3c4d"`. Send it back in `If-Match` to guard
        a write, or in `If-None-Match` to revalidate a read.
      schema: { type: string, pattern: '^"[0-9]+(\.r[0-9a-f]{8})?"$' }
    ListETag:
      description: >-
        A weak validator over the page: the id, version and tag of every
        returned document, `has_more`, the cursor and the total. Absent with
        `?file_links=true` and with `?expand`. Send it in `If-None-Match` to revalidate the page.
      schema: { type: string, pattern: '^W/"[0-9a-f]{32}"$' }
    NoStore:
      required: true
      schema: { const: no-store }
    DataVary:
      required: true
      description: >-
        Document responses depend on the caller and the origin, so caches
        must key them on both (and on the session cookie, in realms that use one).
      schema: { type: string, pattern: "Origin.*Authorization" }
    DataCacheControl:
      description: >-
        Shared caches must not store the response, and browsers must revalidate
        it (`no-store` with `?file_links=true`, whose links expire; never cached
        or `304` with `?expand`). Only a
        request without credentials, to a collection with `cache.public` in its
        `collection.yaml`, gets `public, max-age=<seconds>` (at most 3600).
      schema: { type: string, pattern: '^(private, no-cache|private, no-store|public, max-age=[0-9]+)$' }
    ExpandQueries:
      description: Queries the expansion made on referenced collections, one per path and level. Only on a read with `expand`.
      schema: { type: string, pattern: '^[0-9]+$' }
    ExpandDocs:
      description: Expanded documents in the response, counted once for each place they appear. Only on a read with `expand`.
      schema: { type: string, pattern: '^[0-9]+$' }
    RetryAfter:
      required: true
      description: Seconds to wait before retrying.
      schema: { type: string, pattern: '^[0-9]+$' }
    WWWAuthenticate:
      required: true
      schema: { type: string, pattern: '^Bearer realm="' }
    RequestID:
      required: true
      description: The request ID, echoed from the request or generated; also in the error body as `request_id`.
      schema: { type: string, minLength: 1 }
    DevDurationMs:
      description: >-
        The function's time inside the executor, in milliseconds. Only when
        the server runs with `BACKD_DEV=true` (never in production); read by
        `backd functions invoke`.
      schema: { type: string, pattern: '^[0-9]+$' }
    DevLogs:
      description: >-
        The function's console output as a JSON array of `{level, line}`,
        secrets masked. Only when the server runs with `BACKD_DEV=true`
        (never in production); read by `backd functions invoke`.
      schema: { type: string }

  responses:
    Error:
      description: An error.
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestID" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthenticated:
      description: Missing, invalid, expired or revoked credentials.
      headers:
        WWW-Authenticate: { $ref: "#/components/headers/WWWAuthenticate" }
        X-Request-ID: { $ref: "#/components/headers/RequestID" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: Too many failed attempts.
      headers:
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
        X-Request-ID: { $ref: "#/components/headers/RequestID" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    VersionMismatch:
      description: If-Match doesn't match the current version.
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestID" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BackToApp:
      description: Back to the app's `redirect_to`, with the outcome in its query.
      headers:
        Location: { schema: { type: string } }
        Cache-Control: { $ref: "#/components/headers/NoStore" }
        Referrer-Policy: { description: Always `no-referrer`., schema: { type: string } }
    HostedPage:
      description: A page of the realm's `pages/` folder, with no external resources.
      headers:
        Cache-Control: { $ref: "#/components/headers/NoStore" }
        Referrer-Policy: { description: Always `no-referrer`., schema: { type: string } }
        Content-Security-Policy: { description: A strict policy with `frame-ancestors 'none'`., schema: { type: string } }
      content:
        text/html:
          schema: { type: string }
    SignInResult:
      description: >-
        A session (a provider's also says whether it made the user), or the second step the user
        has to take: `mfa_required` to give a code, `mfa_enrollment_required` to set a second
        factor up, `consent_required` to accept consents. Never both: a challenge is not a session.
      headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
      content:
        application/json:
          schema:
            oneOf:
              - { $ref: "#/components/schemas/Session" }
              - { $ref: "#/components/schemas/ProviderSession" }
              - { $ref: "#/components/schemas/MFAChallenge" }
              - { $ref: "#/components/schemas/MFAEnrollmentChallenge" }
              - { $ref: "#/components/schemas/ConsentChallenge" }
    SessionCreated:
      description: The new user, signed in.
      headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Session" }
    AdminUser:
      description: The user.
      headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AdminUser" }
    Document:
      description: The document.
      headers:
        ETag: { $ref: "#/components/headers/ETag" }
        Vary: { $ref: "#/components/headers/DataVary" }
        Cache-Control: { $ref: "#/components/headers/DataCacheControl" }
        X-Backd-Expand-Queries: { $ref: "#/components/headers/ExpandQueries" }
        X-Backd-Expand-Docs: { $ref: "#/components/headers/ExpandDocs" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Document" }

    NotModified:
      description: >-
        The copy the caller holds (`If-None-Match`) is current. No body.
        Never sent with `?file_links=true`.
      headers:
        ETag: { schema: { type: string } }
        Vary: { $ref: "#/components/headers/DataVary" }
        Cache-Control: { $ref: "#/components/headers/DataCacheControl" }

  schemas:
    RoleOrigin:
      type: object
      additionalProperties: false
      required: [role, origin]
      properties:
        role: { type: string }
        origin:
          type: array
          description: "`direct`, `default` (the realm's `default_roles`) and the names of the teams that carry the role."
          items: { type: string }

    OrganizationRecord:
      type: object
      additionalProperties: false
      required: [id, name, slug, status, require_mfa, claims, created_at]
      properties:
        members: { type: integer, description: How many members it has; only in the administrators' list. }
        id: { type: string }
        name: { type: string }
        slug: { type: [string, "null"] }
        status: { type: string, enum: [active, orphaned, deleted] }
        require_mfa: { type: boolean }
        claims: { type: object, description: "Set by realm administrators and functions; at most 1 KiB." }
        created_at: { type: string, format: date-time }

    Organization:
      type: object
      description: An organization as a member sees it.
      additionalProperties: false
      required: [id, name, slug, status, require_mfa, mfa_met, claims, created_at, roles, effective_roles, teams, team_roles]
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: [string, "null"] }
        status: { type: string, enum: [active, orphaned, deleted] }
        require_mfa: { type: boolean }
        mfa_met: { type: boolean, description: "False when the organization requires a second factor and this session used none: the app asks for one. Such a session answers `403 org_requires_mfa` on the organization's routes, except leaving." }
        session:
          type: object
          description: "Only in the answer to creating the organization: a new session scoped to it, for the app to keep beside the caller's own."
          additionalProperties: false
          required: [token, expires_at, org]
          properties:
            token: { type: string, pattern: "^bds_" }
            expires_at: { $ref: "#/components/schemas/Timestamp" }
            org: { type: string }
        claims: { type: object, description: "Set by realm administrators and functions; at most 1 KiB." }
        created_at: { type: string, format: date-time }
        roles: { type: array, items: { type: string }, description: "The member's effective role names." }
        effective_roles: { type: array, items: { $ref: "#/components/schemas/RoleOrigin" } }
        teams: { type: array, items: { type: string } }
        team_roles:
          type: object
          additionalProperties: { type: array, items: { type: string } }
          description: "The team roles the member holds now, by team id: roles held within a team, which don't need membership of it."

    OrganizationInvitationInput:
      type: object
      additionalProperties: false
      required: [binding]
      properties:
        binding: { type: string, enum: [user, email, none] }
        user: { type: string, description: "A user id; for `user`." }
        email: { type: string, description: "For `email`." }
        roles: { type: array, items: { type: string } }
        teams: { type: array, items: { type: string }, description: "Team ids of the organization." }
        send: { type: boolean, description: "Also email it; only for `email`." }
        expires_in: { type: string, description: "A duration such as `2d` (default `7d`, at most `30d`)." }
        max_uses: { type: integer, minimum: 1, maximum: 1000, description: "For `none`; default 1." }

    OrganizationInvitation:
      type: object
      additionalProperties: false
      required: [id, binding, status, roles, teams, max_uses, uses, created_at, expires_at]
      properties:
        id: { type: string }
        binding: { type: string, enum: [user, email, none] }
        status: { type: string, enum: [pending, used, revoked, expired] }
        user: { type: string }
        email: { type: string }
        roles: { type: array, items: { type: string } }
        teams: { type: array, items: { type: string } }
        max_uses: { type: integer }
        uses: { type: integer }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }

    OrganizationInvitationCreated:
      type: object
      description: An invitation with the token and link, shown only when it is made or renewed.
      additionalProperties: false
      required: [id, binding, status, roles, teams, max_uses, uses, created_at, expires_at, token, link]
      properties:
        id: { type: string }
        binding: { type: string, enum: [user, email, none] }
        status: { type: string, enum: [pending, used, revoked, expired] }
        user: { type: string }
        email: { type: string }
        roles: { type: array, items: { type: string } }
        teams: { type: array, items: { type: string } }
        max_uses: { type: integer }
        uses: { type: integer }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        token: { type: string }
        link: { type: [string, "null"], description: "The realm's `invitation_link` with the token; null when it sets none." }

    OrganizationInvitationPreview:
      type: object
      additionalProperties: false
      required: [org, roles, teams, binding, expires_at]
      properties:
        org:
          type: object
          additionalProperties: false
          required: [id, name]
          properties:
            id: { type: string }
            name: { type: string }
        roles: { type: array, items: { type: string } }
        teams:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, name]
            properties:
              id: { type: string }
              name: { type: string }
        binding: { type: string, enum: [user, email, none] }
        expires_at: { type: string, format: date-time }

    OrganizationTeam:
      type: object
      additionalProperties: false
      required: [id, name, roles, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        roles: { type: array, items: { type: string }, description: "Organization roles every member of the team holds." }
        created_at: { type: string, format: date-time }

    OrganizationOwned:
      type: object
      additionalProperties: false
      required: [org, collections, to_delete, to_keep]
      properties:
        org: { $ref: "#/components/schemas/OrganizationRecord" }
        collections:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [database, collection, documents, on_org_delete]
            properties:
              database: { type: string }
              collection: { type: string }
              documents: { type: integer }
              on_org_delete: { type: string, enum: [delete, keep] }
        to_delete: { type: integer, description: "Documents a deletion removes." }
        to_keep: { type: integer, description: "Documents a deletion leaves, readable only by realm administrators." }

    OrganizationMember:
      type: object
      additionalProperties: false
      required: [user, roles, teams, team_roles, effective_roles, overlap, joined_at]
      properties:
        user: { type: string, description: "The user's id." }
        email: { type: string, description: "Present according to the realm's `members_visible_to`." }
        roles: { type: array, items: { type: string }, description: "Direct roles." }
        teams: { type: array, items: { type: string } }
        team_roles: { type: array, items: { $ref: "#/components/schemas/TeamRoleGrant" }, description: "The team roles the member holds, in force or not." }
        effective_roles: { type: array, items: { $ref: "#/components/schemas/RoleOrigin" } }
        overlap: { type: array, items: { type: string }, description: "Roles held directly and also through a team or by default." }
        mfa: { type: boolean, description: "Whether the member has a second factor. Only for members who manage the organization." }
        mfa_roles: { type: array, items: { type: string }, description: "The roles the member holds now, organization roles and team roles, that require a second factor. Only for members who manage the organization; with `mfa: false` these are the people to nudge." }
        joined_at: { type: string, format: date-time }
        invited_by: { type: string }

    TeamRoleGrant:
      type: object
      additionalProperties: false
      required: [team, role, granted_at, active]
      properties:
        team: { type: string, description: "A team id." }
        role: { type: string, description: "A team role declared in `organizations.team_roles`." }
        from: { type: string, format: date-time, description: "The grant counts from then; always when absent." }
        until: { type: string, format: date-time, description: "...and until then; for ever when absent." }
        granted_by: { type: string, description: "A user id; absent when an administrator or a function granted it." }
        granted_at: { type: string, format: date-time }
        active: { type: boolean, description: "Whether it counts now." }

    OrganizationTeamMember:
      type: object
      additionalProperties: false
      description: A member of the organization seen from one of its teams.
      required: [user, roles, teams, team_roles, effective_roles, overlap, joined_at, in_team, roles_in_team]
      properties:
        user: { type: string }
        email: { type: string, description: "Present according to the realm's `members_visible_to`." }
        roles: { type: array, items: { type: string } }
        teams: { type: array, items: { type: string } }
        team_roles: { type: array, items: { $ref: "#/components/schemas/TeamRoleGrant" } }
        effective_roles: { type: array, items: { $ref: "#/components/schemas/RoleOrigin" } }
        overlap: { type: array, items: { type: string } }
        mfa: { type: boolean }
        mfa_roles: { type: array, items: { type: string } }
        joined_at: { type: string, format: date-time }
        invited_by: { type: string }
        in_team: { type: boolean, description: "Whether they belong to the team (a role holder needs not)." }
        roles_in_team: { type: array, items: { type: string }, description: "The team roles they hold in this team now." }

    OrganizationTeamMembers:
      type: object
      additionalProperties: false
      required: [items, has_more]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/OrganizationTeamMember" } }
        has_more: { type: boolean }
        next: { type: string, description: "Pass as `after` for the next page." }

    OrganizationTeamRoleRef:
      type: object
      additionalProperties: false
      required: [user, role]
      properties:
        user: { type: string, description: "A member of the organization." }
        role: { type: string, description: "A team role declared in `organizations.team_roles`." }

    OrganizationTeamRoleInput:
      type: object
      additionalProperties: false
      required: [user, role]
      properties:
        user: { type: string, description: "A member of the organization." }
        role: { type: string, description: "A team role declared in `organizations.team_roles`." }
        from: { type: string, format: date-time, description: "The grant counts from then; from now when absent." }
        until: { type: string, format: date-time, description: "...until then, to the second; for ever when absent. After `from`." }

    OrganizationTemplateInput:
      type: object
      additionalProperties: false
      required: [subject, text, html]
      properties:
        subject: { type: string, maxLength: 65536 }
        text: { type: string, maxLength: 65536 }
        html: { type: string, maxLength: 65536 }

    OrganizationTemplateDraft:
      type: object
      additionalProperties: false
      description: A draft with all three parts, or an empty object for the saved version.
      properties:
        subject: { type: string }
        text: { type: string }
        html: { type: string }

    OrganizationTemplatePreviewInput:
      type: object
      additionalProperties: false
      properties:
        subject: { type: string }
        text: { type: string }
        html: { type: string }
        data: { type: string, enum: [sample, real], default: sample }

    OrganizationTemplatePreview:
      type: object
      additionalProperties: false
      required: [subject, text, html, removed]
      properties:
        subject: { type: string }
        text: { type: string }
        html: { type: string, description: "Already sanitized." }
        removed: { type: array, items: { type: string }, description: "What the sanitizer dropped." }

    OrganizationTemplateVersion:
      type: object
      additionalProperties: false
      required: [version, at]
      properties:
        version: { type: integer }
        at: { type: string, format: date-time }
        by: { type: string, description: "The user who wrote it." }
        subject: { type: string }
        text: { type: string }
        html: { type: string }

    OrganizationTemplate:
      type: object
      additionalProperties: false
      required: [kind, locale, version, updated_at, versions]
      properties:
        kind: { type: string }
        locale: { type: string }
        version: { type: integer }
        updated_at: { type: string, format: date-time }
        updated_by: { type: string }
        subject: { type: string }
        text: { type: string }
        html: { type: string }
        versions: { type: array, items: { $ref: "#/components/schemas/OrganizationTemplateVersion" } }
        removed: { type: array, items: { type: string }, description: "Only in the answer to a save: what the sanitizer would drop from the sample render." }

    OrganizationTemplates:
      type: object
      additionalProperties: false
      required: [customizable, items]
      properties:
        customizable:
          type: object
          description: The kinds companies may customize, by name, with the placeholders each must print.
          additionalProperties:
            type: object
            additionalProperties: false
            required: [required]
            properties:
              required: { type: array, items: { type: string } }
        items: { type: array, items: { $ref: "#/components/schemas/OrganizationTemplate" } }

    OrganizationMembers:
      type: object
      additionalProperties: false
      required: [items, has_more]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/OrganizationMember" } }
        has_more: { type: boolean }
        next: { type: string, description: "Pass as `after` for the next page." }

    Timestamp:
      type: string
      format: date-time
      description: RFC3339 in UTC with millisecond precision.

    ComplianceScope:
      type: object
      additionalProperties: false
      required: [realm, auth, collections, system]
      properties:
        realm: { type: string }
        auth: { type: boolean, description: "Whether the realm has users; without them there is nothing to export." }
        collections:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [database, collection, export, owned, pull, files, declared]
            properties:
              database: { type: string }
              collection: { type: string }
              export: { type: string, enum: [include, exclude] }
              owned: { type: boolean, description: "The documents whose `_meta.owner` is the user are exported." }
              fields:
                type: array
                items: { type: string }
                description: "Only these fields (plus `id` and `_meta`) are exported; absent means whole documents."
              pull: { type: array, items: { type: string }, description: "Arrays that hold the user: documents where they appear are exported whoever owns them." }
              files: { type: array, items: { type: string }, description: "File fields whose files are exported with their documents." }
              reason: { type: string, description: "Why the collection is excluded or exported in part." }
              declared: { type: boolean, description: "`personal_data` is in the collection's `collection.yaml`." }
              organization: { type: boolean, description: "Present (true) when the documents belong to organizations and are exported whole: they may hold colleagues' data. Narrow them with `personal_data.fields`, or accept it." }
        system:
          type: object
          additionalProperties: false
          required: [included, excluded]
          properties:
            included: { type: array, items: { type: string } }
            excluded: { type: array, items: { type: string } }

    AppConfig:
      type: object
      additionalProperties: false
      required: [version, values, overrides, invalid, keys, history]
      properties:
        version: { type: string, description: "The configuration version, such as `c3`; `c0` before any change." }
        values: { type: object, description: "Every key with its effective value, nested like the schema." }
        overrides: { type: object, description: "The values that differ from their defaults." }
        invalid:
          type: array
          description: "Stored values that no longer satisfy the schema: they read as their defaults until fixed or reset."
          items:
            type: object
            additionalProperties: false
            required: [path, reason]
            properties:
              path: { type: string }
              reason: { type: string }
        keys:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [path, leaf, readable, public]
            properties:
              path: { type: string }
              leaf: { type: boolean, description: "A value (true) or a group of keys." }
              description: { type: string }
              readable: { type: boolean, description: "Some rule on the path or an ancestor lets clients read it." }
              public: { type: boolean, description: "Every rule on the way is literally `true`: anyone, without a session." }
        history: { type: array, items: { $ref: "#/components/schemas/AppConfigEntry" } }
        updated_at: { type: string, format: date-time }
        updated_by: { type: string }

    AppConfigChange:
      type: object
      additionalProperties: false
      properties:
        set: { type: object, description: "Key path (dot notation) to value." }
        reset:
          type: array
          items: { type: string }
          description: "Key or group paths to return to their defaults."

    AppConfigResult:
      type: object
      additionalProperties: false
      required: [version, changed, changes]
      properties:
        version: { type: string }
        changed: { type: boolean }
        changes: { type: array, items: { $ref: "#/components/schemas/AppConfigValueChange" } }

    AppConfigValueChange:
      type: object
      additionalProperties: false
      required: [path, old, new]
      properties:
        path: { type: string }
        old: { description: "The effective value before." }
        new: { description: "The effective value after." }

    AppConfigEntry:
      type: object
      additionalProperties: false
      required: [version, at, actor, kind, changes]
      properties:
        version: { type: string }
        at: { type: string, format: date-time }
        actor: { type: string, description: "`user:<id>`, `key:<name>` or `function:<database>/<name>`." }
        kind: { type: string, enum: [set, rollback] }
        rolled_back_to: { type: string, description: "For a rollback: the version restored." }
        changes: { type: array, items: { $ref: "#/components/schemas/AppConfigValueChange" } }

    Status:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [ok, ready] }
        config:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: "Readiness only: the fingerprint of the config this instance runs (`backd config fingerprint`), to check that every instance runs the same one."

    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, request_id]
          properties:
            code:
              type: string
              pattern: "^[a-z][a-z0-9_]{0,63}$"
              description: |
                backd's codes: invalid_json, validation_error, invalid_query, invalid_path,
                invalid_header, precondition_required, invalid_expand, expand_too_large,
                invalid_aggregate, aggregate_not_enabled, aggregate_too_expensive,
                search_not_enabled, search_too_expensive, index_building, unauthenticated,
                invalid_credentials, password_expired, forbidden,
                not_found, method_not_allowed, conflict, email_taken,
                write_conflict, version_mismatch, id_required, invalid_id,
                id_not_allowed, id_taken, payload_too_large,
                unsupported_media_type, too_many_requests, internal_error,
                unavailable, field_encrypted (a `where` or `order_by` names an encrypted
                field, or does more with one than equality through its blind index); for function calls also function_failed,
                function_timeout, invalid_output, secret_missing,
                idempotency_key_required, idempotency_key_reused and
                request_in_progress. A function's own errors (`ctx.error`)
                carry the code it chose.
            message: { type: string }
            details:
              type: array
              minItems: 1
              items:
                type: object
                additionalProperties: false
                required: [path, reason]
                properties:
                  path: { type: string }
                  reason: { type: string }
                  code: { type: string, description: "Set when the problem has a code of its own, such as `field_encrypted`." }
            request_id: { type: string, minLength: 1 }

    User:
      type: object
      additionalProperties: false
      required: [id, email, email_verified, roles, locale, created_at]
      properties:
        id: { type: string }
        email: { type: string }
        email_verified: { type: boolean }
        roles: { type: array, items: { type: string } }
        locale: { type: string, description: "The user's language: one the realm lists (`locales` in `realm.yaml`; English only when it lists none). Used for the emails they get." }
        created_at: { $ref: "#/components/schemas/Timestamp" }

    Me:
      type: object
      additionalProperties: false
      required: [id, email, email_verified, roles, locale, created_at, identities, reauth_methods, sign_in_methods]
      properties:
        id: { type: string }
        email: { type: string }
        email_verified: { type: boolean }
        roles: { type: array, items: { type: string } }
        locale: { type: string, description: "The user's language: one the realm lists (`locales` in `realm.yaml`; English only when it lists none). Used for the emails they get." }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        sign_in_methods:
          type: array
          description: >-
            The ways the user can sign in now, for an account settings page: `password`,
            `magic_link` (the realm has them and the address is verified) and the providers
            they use.
          items: { type: string }
        reauth_methods:
          type: array
          description: >-
            The proofs `POST /_auth/reauth` takes from this user: `totp` and `recovery_code` with a
            second factor, else `password`, else `email_code`. Empty when the user has no way to give
            one (no password, no second factor, a realm that sends no email): sensitive actions then
            don't ask.
          items: { type: string, enum: [totp, recovery_code, password, email_code] }
        identities:
          type: array
          description: The user's sign-in methods, oldest first.
          items: { $ref: "#/components/schemas/Identity" }
        consents: { $ref: "#/components/schemas/ConsentsGiven" }
        to_accept:
          type: array
          description: "With consents declared in the realm: the required consents the user has to accept (again)."
          items:
            type: object
            additionalProperties: false
            required: [name, version]
            properties:
              name: { type: string }
              version: { type: string }

    Identity:
      type: object
      additionalProperties: false
      required: [provider, email, email_verified, created_at, last_used_at]
      properties:
        provider: { type: string, description: "`password`, `google`, `microsoft`, `apple` or the name of a configured provider." }
        org: { type: string, description: "Present when the identity came through an organization's connection: the organization's id. A user holds one identity per provider per organization." }
        email: { type: string, description: "The address the provider reported at the last sign-in; for `password`, the user's own." }
        email_verified: { type: boolean }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        last_used_at: { oneOf: [{ $ref: "#/components/schemas/Timestamp" }, { type: "null" }] }

    AdminUser:
      type: object
      additionalProperties: false
      required: [id, email, email_verified, roles, locale, disabled, admin_networks, login_networks, created_at, updated_at, erased_at, password_expired_at]
      properties:
        password_expired: { type: boolean, description: "Whether the password is expired now (an expiry of this user or the realm's epoch). Only in the answer of `GET /_admin/users/{id}`; lists leave it out." }
        password_expired_at: { oneOf: [{ $ref: "#/components/schemas/Timestamp" }, { type: "null" }], description: "When an administrator expired this user's password (`POST /_admin/users/{id}/expire-password`): a password set before it no longer opens the account. Null when none did; a realm-wide epoch is not shown here." }
        erased_at: { oneOf: [{ $ref: "#/components/schemas/Timestamp" }, { type: "null" }], description: "When the user was erased; a tombstone has no email of its own, no roles and can't be enabled." }
        id: { type: string }
        email: { type: string }
        email_verified: { type: boolean }
        roles: { type: array, items: { type: string } }
        locale: { type: string, description: "The user's language: one the realm lists (`locales` in `realm.yaml`; English only when it lists none). Used for the emails they get." }
        disabled: { type: boolean }
        admin_networks:
          description: CIDR networks this user's admin API requests must come from; empty means no restriction of their own.
          type: array
          items: { type: string }
        login_networks:
          description: CIDR networks this user's login and session must be used from; empty means anywhere.
          type: array
          items: { type: string }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }

    APIKey:
      type: object
      additionalProperties: false
      required: [name, role, prefix, networks, scopes, created_at, last_used_at, expires_at]
      properties:
        name: { type: string }
        role: { enum: [data, admin] }
        prefix: { type: string, description: "The first characters of the key, to recognize it.", pattern: "^bdk_" }
        networks: { type: array, items: { type: string }, description: "Where the key may be used from; empty means anywhere." }
        scopes: { type: array, items: { type: string }, description: "What the key reaches (see the create request); empty means everything." }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        last_used_at: { oneOf: [{ $ref: "#/components/schemas/Timestamp" }, { type: "null" }] }
        expires_at: { oneOf: [{ $ref: "#/components/schemas/Timestamp" }, { type: "null" }] }

    APIKeyCreated:
      description: An API key as listed, plus the key itself, shown only here.
      type: object
      additionalProperties: false
      required: [name, role, prefix, networks, scopes, created_at, last_used_at, expires_at, key]
      properties:
        name: { type: string }
        role: { enum: [data, admin] }
        prefix: { type: string, pattern: "^bdk_" }
        networks: { type: array, items: { type: string } }
        scopes: { type: array, items: { type: string } }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        last_used_at: { oneOf: [{ $ref: "#/components/schemas/Timestamp" }, { type: "null" }] }
        expires_at: { oneOf: [{ $ref: "#/components/schemas/Timestamp" }, { type: "null" }] }
        key: { type: string, pattern: "^bdk_" }

    ProviderNames:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, items: { type: string }, description: "Provider names, sorted." }
        methods: { type: array, items: { type: string, enum: [password, magic_link] }, description: "The other ways of signing in to the organization (only in the answer for an organization): `password` always, `magic_link` when the realm has them." }

    OrganizationConnection:
      description: |
        An organization's sign-in provider. Signing in through it uses the same redirect flow as the
        realm's providers; who may come in is limited by `hosted_domain` or `tenant`. The client
        secret is never returned.
      type: object
      additionalProperties: false
      required: [provider, client_id, enabled, client_secret_set, email_domains, native_client_ids, join_roles, redirect_path, created_at, updated_at]
      properties:
        provider: { type: string, enum: [google, microsoft] }
        client_id: { type: string, description: "The organization's application with the provider." }
        tenant: { type: string, description: "Microsoft: the organization's tenant id." }
        hosted_domain: { type: string, description: "Google: the Workspace domain." }
        email_domains: { type: array, items: { type: string }, description: "When set, the verified email's domain must also be one of these." }
        native_client_ids: { type: array, items: { type: string }, description: "Extra client ids the id-token endpoint accepts (mobile apps)." }
        join_roles: { type: array, items: { type: string }, description: "Organization roles given to people who join through it." }
        enabled: { type: boolean, description: "A disabled connection refuses sign-ins." }
        client_secret_set: { type: boolean, description: "Whether the client secret is stored. Without it the connection is unavailable." }
        redirect_uri: { type: string, description: "The address to register with the provider, when backd knows its public address (`email.public_url` or `BACKD_URL`)." }
        redirect_path: { type: string, description: "The same address without backd's public address." }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }

    OrganizationConnections:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/OrganizationConnection" } }
        providers: { type: array, items: { type: string }, description: "The providers the realm lets organizations connect." }
        max_connections: { type: integer, description: "The most connections one organization may have." }

    OrganizationConnectionInput:
      type: object
      additionalProperties: false
      required: [client_id]
      properties:
        client_id: { type: string }
        client_secret: { type: string, maxLength: 1024, description: "Write-only. Required the first time; left out, the stored secret is kept." }
        tenant: { type: string, description: "Microsoft: required, a tenant id (GUID). `common`, `organizations` and `consumers` are refused." }
        hosted_domain: { type: string, description: "Google: required, the Workspace domain (lower case)." }
        email_domains: { type: array, maxItems: 20, items: { type: string } }
        native_client_ids: { type: array, maxItems: 10, items: { type: string } }
        join_roles: { type: array, items: { type: string } }
        enabled: { type: boolean, description: "Defaults to true for a new connection and keeps the stored value on a replace." }

    Secret:
      description: A secret's metadata, as listed — never its value.
      type: object
      additionalProperties: false
      required: [database, name, type, created_at, updated_at, updated_by]
      properties:
        database: { type: string, description: "Its database scope; empty means the realm scope (or an organization's, when `org` is set)." }
        org: { type: string, description: "Present on an organization's secrets: the organization id. Those hold an organization's sign-in client secrets; nothing reads them back, functions included." }
        name: { type: string }
        type:
          type: string
          enum: [secret, key]
          description: "A `key` is a field-encryption key (`POST /_admin/secrets`); only field encryption reads it, no function or provider does."
        fingerprint: { type: string, description: "Keys only: the first 8 hex characters of SHA-256 over a fixed label and the key. It identifies a saved copy; the key itself is never shown again." }
        used_by:
          type: array
          items: { type: string }
          description: "Keys only: the fields that name this key, as `database/collection.path`."
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
        updated_by: { type: string, description: "Who last set it, e.g. `user:<id>` or `key:<name>`." }

    AuditRecord:
      description: |
        One entry of the audit trail. Users are named by id, keys by name, invitations by id.
        Records never hold passwords or hashes, tokens, keys, emails or request bodies.
      type: object
      additionalProperties: false
      required: [id, at, action, actor, target, details, request_id, client_ip]
      properties:
        id: { type: string }
        at: { $ref: "#/components/schemas/Timestamp" }
        action:
          type: string
          description: "For example `user.create`, `role.add`, `apikey.create`, `admin.login`, `admin.refused`."
          examples: [role.add]
        actor: { type: string, description: "`user:<id>`, `key:<name>`, `anonymous`, `config:realm.yaml` or `cli:bootstrap`." }
        target: { type: [string, "null"], description: "`user:<id>`, `key:<name>`, `invitation:<id>`, or null." }
        details: { type: object, description: "Non-secret facts about the action, such as the role assigned." }
        request_id: { type: [string, "null"] }
        client_ip: { type: [string, "null"], description: "The client's address, following TRUSTED_PROXIES." }

    InvocationRecord:
      description: |
        One function call. Never its input or output — only what
        happened and its own console log lines (roadmap F10).
      type: object
      additionalProperties: false
      required: [id, at, function, actor, mode, status, duration_ms, request_id, job_id, parent_id, origin, event_id, logs, steps, steps_omitted]
      properties:
        id: { type: string }
        at: { $ref: "#/components/schemas/Timestamp" }
        function: { type: string, description: "`<database>/<name>`." }
        actor: { type: string, description: "`user:<id>`, `key:<name>`, `anonymous`, or `func:<name> as ...` for an admin function calling back." }
        mode: { type: string, description: "`sync` or `async`; `webhook` planned." }
        status:
          type: string
          description: "`ok`, `function_error`, `timeout`, `memory`, `cpu`, `crash`, `output_too_large`, `busy`, `bundle` or `cancelled` (the job was cancelled while the attempt ran)."
          examples: [ok]
        code: { type: [string, "null"], description: "The function's own error code, when status is `function_error`." }
        duration_ms: { type: integer }
        request_id: { type: [string, "null"] }
        job_id: { type: [string, "null"], description: "The async job this call ran for (roadmap F11); null for sync calls." }
        parent_id: { type: [string, "null"], description: "The invocation that called this one with `ctx.call`; null otherwise." }
        origin: { type: [string, "null"], description: "What started the call: `http`, `function` (`ctx.call`), `cron`, `admin`, `trigger:<database>/<collection>/<trigger>` (a trigger of a collection), `on_complete:<database>/<name>` (the notification of that function's job ending), or `backd:<event>`. Null for records made before origins were recorded." }
        event_id: { type: [string, "null"], description: "For a trigger run, the change it was made for: the same on every replay of that change, and the id functions deduplicate on. Null otherwise." }
        logs:
          type: array
          description: "The function's captured console output, already masked of any declared secrets."
          items:
            type: object
            additionalProperties: false
            required: [level, line]
            properties:
              level: { type: string }
              line: { type: string }
        steps:
          type: array
          description: "What the call reported with `ctx.step()`, closed when it ended; at most 100 (the first 50 and the latest 50)."
          items: { $ref: "#/components/schemas/Step" }
        steps_omitted: { type: integer, description: "How many steps were left out of the middle when there were more than 100." }

    ConfigCheck:
      type: object
      additionalProperties: false
      required: [ok, realm, checked, changed, problems]
      properties:
        ok: { type: boolean }
        realm: { type: string }
        checked: { type: integer, description: "How many files of the realm were loaded and validated, drafts included." }
        changed: { type: array, items: { type: string }, description: "The draft files, sorted." }
        problems:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [message]
            properties:
              file: { type: string, description: "The file the message is about, relative to the realm, when it names one." }
              message: { type: string }

    ImportAnswer:
      type: object
      description: The start of an import (`lease` and the rest of the first group), or the result for one chunk.
      properties:
        lease: { type: string }
        expires_in: { type: integer }
        max_chunk_bytes: { type: integer, format: int64, description: The largest chunk to send. }
        warnings: { type: array, items: { type: string } }
        needs_keys:
          type: array
          description: On a dry run, the encrypted fields of the package nobody here can open, and why. Refused with `422` otherwise.
          items:
            type: object
            properties:
              path: { type: string, description: "`<database>/<collection>.<field>`." }
              reason: { type: string }
        keys_needed: { type: boolean, description: The target opens some ciphertext itself and wants the package's wrapped keys (`phase=keys`). }
        file_fields:
          type: object
          additionalProperties: { type: array, items: { type: string } }
        documents: { type: integer, description: Documents in the chunk. }
        counts:
          type: object
          description: "Documents by outcome: created, replaced, skipped, unchanged, conflict, invalid. In `validate` they say what `write` would do."
          additionalProperties: { type: integer }
        problems:
          type: array
          description: The first documents that are invalid or conflict, with their line in the chunk.
          items:
            type: object
            properties:
              id: { type: string }
              line: { type: integer }
              outcome: { type: string, enum: [invalid, conflict] }
              problems:
                type: array
                items:
                  type: object
                  properties:
                    path: { type: string }
                    reason: { type: string }
        missing_owners: { type: integer, description: Documents whose owner doesn't exist in this realm. }
        missing_orgs: { type: integer, description: Documents whose organization doesn't exist in this realm. }
    ExportPlan:
      type: object
      required: [lease, expires_in, manifest, file_fields]
      properties:
        lease: { type: string, description: "Send it in `X-Backd-Export` on every part, file and end request." }
        expires_in: { type: integer, description: Seconds a silent export keeps its lease. }
        export_key: { type: string, description: "With `include=auth`: the one-time key the package's sealed authentication fields are sealed under. Shown in this answer only." }
        manifest:
          type: object
          description: The package's `manifest.json` without checksums; document counts are estimates until the parts are read.
          required: [format, backd_version, realm, created_at, operator, config_fingerprint, flags, databases, encrypted_fields]
          properties:
            format: { type: integer }
            backd_version: { type: string }
            realm: { type: string }
            created_at: { type: string, format: date-time }
            operator: { type: string }
            config_fingerprint: { type: string }
            flags:
              type: object
              properties:
                partial: { type: boolean }
                anonymized: { type: boolean }
                auth: { type: boolean }
                no_files: { type: boolean }
                csv: { type: boolean, description: A flat reporting extract; never importable. }
            databases:
              type: array
              items:
                type: object
                properties:
                  name: { type: string }
                  collections:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        documents: { type: integer, format: int64 }
                        part: { type: string, description: The `part` that streams it. }
            encrypted_fields:
              type: array
              items:
                type: object
                properties:
                  database: { type: string }
                  collection: { type: string }
                  path: { type: string }
                  key: { type: string, description: "The field key's name." }
                  fingerprint: { type: string, description: "The field key's fingerprint, to check a key against." }
                  form: { type: string, enum: [ciphertext, plaintext], description: "ciphertext: the documents hold the values as stored; plaintext: someone opened them with the key." }
            files: { type: integer, format: int64 }
            checksums: { type: object, additionalProperties: { type: string } }
            auth:
              type: array
              description: With `include=auth`, the authentication data parts.
              items:
                type: object
                properties:
                  name: { type: string }
                  documents: { type: integer, format: int64 }
                  part: { type: string }
            auth_key_fingerprint: { type: string, description: "The fingerprint of the export key, which an import checks the key it is given against." }
        file_fields:
          type: object
          description: "`<database>/<collection>` to its file fields, which hold the ids of the files to fetch."
          additionalProperties: { type: array, items: { type: string } }
    StorageCheck:
      type: object
      additionalProperties: false
      required: [ok, provider, endpoint, public_endpoint, bucket, prefix, steps, checksum_sha256, encryption, cors, link_host]
      properties:
        ok: { type: boolean, description: "False when a step failed." }
        provider: { type: string, enum: [aws, minio, r2, digitalocean] }
        endpoint: { type: string, description: What backd connects to. }
        public_endpoint: { type: [string, "null"], description: "The address signed links use, when it differs (never connected to)." }
        bucket: { type: string }
        prefix: { type: string }
        steps:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, level, detail]
            properties:
              name: { type: string, description: "`bucket`, `write`, `head`, `read`, `range`, `list`, `checksum`, `stored checksum`, `download link`, `upload link`, `cors` or `encryption`." }
              level: { type: string, enum: [ok, warn, fail, skipped] }
              detail: { type: string }
        checksum_sha256: { type: string, enum: [verified, ignored, not tested], description: "What the storage does with a signed `x-amz-checksum-sha256`: `verified` rejects content that differs." }
        encryption: { type: string, description: "The bucket's default encryption algorithm, `none`, or `unknown` when the provider doesn't expose it." }
        cors:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [origins, methods, headers]
            properties:
              origins: { type: array, items: { type: string } }
              methods: { type: array, items: { type: string } }
              headers: { type: array, items: { type: string } }
        link_host: { type: string, description: The host a signed link is for. }

    CheckReportSummary:
      description: What a schema check found in one collection, without the documents.
      type: object
      additionalProperties: false
      required: [database, collection, job_id, started_at, finished_at, scanned, invalid, complete, stopped_by, limit, schema_hash]
      properties:
        database: { type: string }
        collection: { type: string }
        job_id: { type: string, description: The check job that made it. }
        started_at: { $ref: "#/components/schemas/Timestamp" }
        finished_at: { $ref: "#/components/schemas/Timestamp" }
        scanned: { type: integer, format: int64, description: How many documents it read. }
        invalid: { type: integer, format: int64, description: How many did not match the schema (up to `limit`). }
        complete: { type: boolean, description: "False when the scan stopped before the end." }
        stopped_by: { type: [string, "null"], enum: [limit, time, null], description: "Why it stopped early: `limit` (it found `limit` invalid documents) or `time` (the 6-hour limit of an attempt)." }
        limit: { type: integer }
        schema_hash: { type: string, description: Identifies the schema the documents were checked against. }

    CheckReport:
      description: A collection's latest schema check report, with the invalid documents.
      type: object
      additionalProperties: false
      required: [database, collection, job_id, started_at, finished_at, scanned, invalid, complete, stopped_by, limit, schema_hash, documents]
      properties:
        database: { type: string }
        collection: { type: string }
        job_id: { type: string, description: The check job that made it. }
        started_at: { $ref: "#/components/schemas/Timestamp" }
        finished_at: { $ref: "#/components/schemas/Timestamp" }
        scanned: { type: integer, format: int64, description: How many documents it read. }
        invalid: { type: integer, format: int64, description: How many did not match the schema (up to `limit`). }
        complete: { type: boolean, description: "False when the scan stopped before the end." }
        stopped_by: { type: [string, "null"], enum: [limit, time, null], description: "Why it stopped early: `limit` (it found `limit` invalid documents) or `time` (the 6-hour limit of an attempt)." }
        limit: { type: integer }
        schema_hash: { type: string, description: Identifies the schema the documents were checked against. }
        documents:
          type: array
          description: The documents that failed, in id order, up to `limit`.
          items:
            type: object
            additionalProperties: false
            required: [id, deleted, problems, more_problems]
            properties:
              id: { type: string }
              deleted: { type: boolean, description: "True for a soft-deleted document (in the trash)." }
              problems:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [path, reason]
                  properties:
                    path: { type: string, description: "A JSON path, dots between names (`items.2.price`); empty for the document itself. A name can come from the document." }
                    reason: { type: string, description: "The rule that failed (`is required`, `got string, want number`...), never the value." }
              more_problems: { type: integer, description: How many more problems were left out past 5. }

    Step:
      description: |
        One step a function reported with `ctx.step()`, and how far it got with
        `ctx.progress()`. A new step closes the previous one; when an attempt
        ends, the step still running is closed as `done`, `failed`, `timed_out`
        or `cancelled`.
      type: object
      additionalProperties: false
      required: [n, name, status, started_at, ended_at, duration_ms, current, total, message, updated_at]
      properties:
        n: { type: integer, description: "1 for the first step the attempt started; counts steps left out too." }
        name: { type: string }
        status: { type: string, enum: [running, done, failed, timed_out, cancelled] }
        started_at: { $ref: "#/components/schemas/Timestamp" }
        ended_at: { oneOf: [{ $ref: "#/components/schemas/Timestamp" }, { type: "null" }], description: "Null while running." }
        duration_ms: { type: [integer, "null"], description: "Null while running." }
        current: { type: number, description: "How far the step got (`ctx.progress`)." }
        total: { type: [number, "null"], description: "How much there is to do, when the function said (`ctx.step`'s `total`)." }
        message: { type: [string, "null"] }
        updated_at: { $ref: "#/components/schemas/Timestamp" }

    TriggersStatus:
      type: object
      additionalProperties: false
      required: [dispatcher, triggers, backlog, open_gaps]
      properties:
        dispatcher:
          description: "The deployment's dispatcher; null when this instance can't read its state."
          oneOf:
            - type: "null"
            - type: object
              additionalProperties: false
              required: [started, held, epoch, watermark_at, watermark_age_seconds, lease_expires_at]
              properties:
                started: { type: boolean, description: "False before any instance has held the lease." }
                held: { type: boolean, description: "Whether some instance holds the lease right now." }
                epoch: { type: integer, description: "How many times the lease was taken." }
                watermark_at: { oneOf: [{ $ref: "#/components/schemas/Timestamp" }, { type: "null" }], description: "When the position was last stored." }
                watermark_age_seconds: { type: [number, "null"], description: "How long ago; what to alert on while the lease is held." }
                lease_expires_at: { oneOf: [{ $ref: "#/components/schemas/Timestamp" }, { type: "null" }] }
        triggers:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [database, collection, name, events, when, function, fields, session, ordered, runs_with_admin_access]
            properties:
              database: { type: string }
              collection: { type: string }
              name: { type: string }
              events: { type: array, items: { type: string, enum: [created, updated, removed] } }
              when: { type: [string, "null"], description: "The condition's source; null fires on every listed event." }
              function: { type: string, description: "`<database>/<function>`." }
              fields: { type: [array, "null"], items: { type: string }, description: "What rides in the job; null is ids only." }
              session: { type: boolean }
              ordered: { type: boolean }
              runs_with_admin_access: { type: boolean, description: "Always true: a trigger's function has `ctx.admin.db`." }
        backlog: { type: [integer, "null"], description: "Unfinished (queued, waiting or running) trigger jobs of the realm." }
        open_gaps: { type: [integer, "null"], description: "Gaps not yet resolved." }

    TriggerGap:
      type: object
      additionalProperties: false
      required: [id, reason, realm, collection, trigger, from, to, count, keys, recorded_at, resolved_at]
      properties:
        id: { type: string }
        reason: { type: string, enum: [window, preimage_missing, backlog] }
        realm: { type: [string, "null"], description: "Null for a window gap, which covers every realm." }
        collection: { type: [string, "null"] }
        trigger: { type: [string, "null"] }
        from: { $ref: "#/components/schemas/Timestamp" }
        to: { $ref: "#/components/schemas/Timestamp" }
        count: { type: integer, description: "How many changes it stands for." }
        keys: { type: array, items: { type: string }, description: "Ids of the documents, at most 1,000." }
        recorded_at: { $ref: "#/components/schemas/Timestamp" }
        resolved_at: { oneOf: [{ $ref: "#/components/schemas/Timestamp" }, { type: "null" }] }

    Schedule:
      type: object
      required: [function, schedule, timezone, overlap, paused, changed_at, changed_by]
      properties:
        function: { type: string, description: "`<database>/<name>`." }
        schedule: { type: string, description: The cron expression. }
        timezone: { type: string, description: "The IANA time zone it is read in (`UTC` by default)." }
        overlap: { type: string, enum: [allow, skip] }
        paused: { type: boolean }
        changed_at: { type: [string, "null"], format: date-time, description: When it was last paused or resumed; null if never. }
        changed_by: { type: [string, "null"], description: "The actor that did (`key:<name>` or `user:<id>`); null if never." }

    JobSummary:
      description: |
        A job as the admin listing shows it (roadmap F19): state and outcome,
        never the input or the output.
      type: object
      additionalProperties: false
      required: [id, function, status, scheduled, origin, email_kind, rerun_of, attempts, next_attempt_at, created_at, completed_at, result, progress]
      properties:
        origin: { type: string, description: "Where the job came from: `http`, `function` (a `ctx.call`), `cron`, `admin`, `on_complete:<database>/<name>` (the notification a function's `on_complete` queues when its job ends), `backd:email.<kind>` (an email backd sends itself), `backd:schema.check` (a schema check) or `function:<database>/<name>` (an email that function sent with `ctx.email.send`)." }
        email_kind: { type: [string, "null"], description: "The kind of an email job (never its recipients or text); null for other jobs." }
        rerun_of: { type: [string, "null"], description: "The finished job an administrator re-ran to make this one; null otherwise." }
        steps:
          type: array
          description: "Only in the job's own detail (GET /jobs/{id}): what the running or last attempt reported, the last entry being the current step; at most 100."
          items: { $ref: "#/components/schemas/Step" }
        collections: { type: array, items: { type: string }, description: "Only in `running` of the schema checks listing: the `<database>/<collection>` the check reads." }
        limit: { type: integer, description: "Only there too: how many invalid documents it lists per collection." }
        steps_omitted: { type: integer, description: "Only in the detail: how many steps were left out of the middle when there were more than 100." }
        progress:
          description: "The current (latest) step of the running or last attempt, or null when the function reported none. The job's detail has every step."
          oneOf:
            - type: "null"
            - type: object
              additionalProperties: false
              required: [step, name, status, current, total, message, updated_at]
              properties:
                step: { type: integer }
                name: { type: string }
                status: { type: string, enum: [running, done, failed, timed_out, cancelled] }
                current: { type: number }
                total: { type: [number, "null"] }
                message: { type: [string, "null"] }
                updated_at: { $ref: "#/components/schemas/Timestamp" }
        id: { type: string, description: "For cron runs, `cron_<database>_<function>_<yyyymmddhhmm>` (UTC)." }
        function: { type: string, description: "`<database>/<name>`." }
        status: { type: string, description: "`queued`, `running` or `done`." }
        scheduled: { type: boolean, description: "True for a cron run." }
        attempts: { type: integer, description: "How many times a worker started it (more than 1 after a lost worker or a retry)." }
        next_attempt_at: { type: [string, "null"], format: date-time, description: "When a failed attempt will be retried (the function's `retry` policy); null otherwise." }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        completed_at: { oneOf: [{ $ref: "#/components/schemas/Timestamp" }, { type: "null" }] }
        result:
          description: "Null until `status` is `done`."
          oneOf:
            - type: "null"
            - type: object
              additionalProperties: false
              required: [status, code, duration_ms]
              properties:
                status: { type: string, description: "`ok`, `function_error`, `timeout`, `output_too_large`, `error`, `cancelled` (an administrator cancelled the job) or `skipped` (a scheduled run that did not happen because the previous one had not finished)." }
                code: { type: [string, "null"], description: "The error code, when the job did not end `ok`." }
                duration_ms: { type: integer }
    Job:
      description: |
        An async function call (roadmap F11): its status, and once
        `status` is `done`, its result. Never its input.
      type: object
      additionalProperties: false
      required: [id, function, status, created_at, attempts, next_attempt_at, result, steps, steps_omitted]
      properties:
        id: { type: string }
        function: { type: string, description: "`<database>/<name>`." }
        steps:
          type: array
          description: "What the running (or last) attempt reported, the last entry being the current step; at most 100 (the first 50 and the latest 50). A new attempt starts with none."
          items: { $ref: "#/components/schemas/Step" }
        steps_omitted: { type: integer, description: "How many steps were left out of the middle when there were more than 100." }
        status: { type: string, description: "`queued`, `running` or `done`. A job waiting to be retried is `queued`, with `next_attempt_at` set." }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        attempts: { type: integer, description: "How many times a worker has started it." }
        next_attempt_at: { type: [string, "null"], format: date-time, description: "When a failed attempt will be retried (the function's `retry` policy); null otherwise." }
        result:
          description: "Null until `status` is `done`."
          type: [object, "null"]
          additionalProperties: false
          required: [status, duration_ms]
          properties:
            status:
              type: string
              description: "`ok`, `function_error`, `timeout`, `memory`, `cpu`, `crash`, `output_too_large`, `bundle` or `cancelled`."
            output: { description: "The function's output, when status is `ok`." }
            http_status:
              type: integer
              description: >-
                The status a `sync` call would have answered with for
                this same outcome; absent only when status is `ok`.
            code:
              type: string
              description: >-
                The function's own error code when status is
                `function_error`; one of backd's own (`function_timeout`,
                `invalid_output`, `function_failed`) otherwise. Absent
                only when status is `ok`.
            message: { type: string, description: "Absent only when status is `ok`." }
            details:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [path, reason]
                properties:
                  path: { type: string }
                  reason: { type: string }
            duration_ms: { type: integer }

    Session:
      type: object
      additionalProperties: false
      required: [session_id, expires_at, user]
      description: >-
        `token` and `token_type` are absent when the session went into a cookie
        (the request asked for `cookie: true`).
      properties:
        token: { type: string, pattern: "^bds_" }
        token_type: { const: Bearer }
        session_id: { type: string }
        expires_at: { $ref: "#/components/schemas/Timestamp" }
        user: { $ref: "#/components/schemas/User" }
        org: { type: string, description: "The organization the session is scoped to, when it was opened by signing in to one (`/_auth/orgs/{org}/…`)." }
        recovery_codes_left: { type: integer, description: "Only when a recovery code ended the sign-in: how many remain." }

    OrganizationSession:
      description: >-
        A session scoped to a new organization, with the organization (as its creator sees it).
      type: object
      additionalProperties: false
      required: [session_id, expires_at, user, org, organization]
      properties:
        token: { type: string, pattern: "^bds_" }
        token_type: { const: Bearer }
        session_id: { type: string }
        expires_at: { $ref: "#/components/schemas/Timestamp" }
        user: { $ref: "#/components/schemas/User" }
        org: { type: string }
        organization: { $ref: "#/components/schemas/Organization" }

    MFAChallenge:
      type: object
      additionalProperties: false
      required: [mfa_required, challenge, methods]
      description: >-
        The first factor was right and the user has a second one: send the `challenge` with
        a code to `POST /_auth/mfa/verify`. It lives 5 minutes and allows 5 attempts.
      properties:
        mfa_required: { const: true }
        challenge: { type: string }
        methods: { type: array, items: { type: string, enum: [totp, recovery_code] } }

    ConsentsGiven:
      type: object
      description: >-
        Consents accepted: the consent's name to the version, from `GET /_consents`. A required
        consent must be there at its current version.
      additionalProperties: { type: string }

    ConsentChallenge:
      type: object
      additionalProperties: false
      required: [consent_required, challenge, consents]
      description: >-
        The sign-in is done but the user has consents to accept (a new version asks for
        re-acceptance, or they never accepted a required one): send the `challenge` with
        `consents` to `POST /_auth/consents/accept`. It lives 5 minutes.
      properties:
        consent_required: { const: true }
        challenge: { type: string }
        consents:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, version]
            properties:
              name: { type: string }
              version: { type: string }

    AdminConsentRecord:
      type: object
      additionalProperties: false
      required: [consent, version, action, method, locale, text_hash, at]
      properties:
        consent: { type: string }
        version: { type: string }
        action: { type: string, enum: [accepted, withdrawn] }
        method: { type: string, enum: [signup, prompt, api, admin] }
        locale: { type: string }
        text_hash: { type: string, description: "SHA-256 of the text shown; empty for a withdrawal." }
        evidence: { type: string }
        at: { $ref: "#/components/schemas/Timestamp" }

    ConsentState:
      type: object
      required: [consents, to_accept]
      properties:
        consents: { $ref: "#/components/schemas/ConsentsGiven" }
        to_accept:
          type: array
          description: Required consents the user has to accept (again) at the version shown.
          items:
            type: object
            additionalProperties: false
            required: [name, version]
            properties:
              name: { type: string }
              version: { type: string }

    MFAEnrollmentChallenge:
      type: object
      additionalProperties: false
      required: [mfa_enrollment_required, challenge]
      description: >-
        The user's role requires a second factor and they have none yet: the challenge only
        allows setting TOTP up and completes the sign-in when it is confirmed.
      properties:
        mfa_enrollment_required: { const: true }
        challenge: { type: string }

    ProviderSession:
      type: object
      additionalProperties: false
      required: [session_id, expires_at, user, new_user]
      description: >-
        A login's answer, from a sign-in with a provider. `new_user` says whether the sign-in
        made the user; only then `profile` is present, with what the provider said of the
        person (fields it did not give are left out). It is handed over once and kept nowhere:
        use `account.on_signup` to create the app's profile document without depending on the client.
      properties:
        token: { type: string, pattern: "^bds_" }
        token_type: { const: Bearer }
        session_id: { type: string }
        expires_at: { $ref: "#/components/schemas/Timestamp" }
        user: { $ref: "#/components/schemas/User" }
        org: { type: string, description: "The organization the session is scoped to, when the sign-in was to one." }
        new_user: { type: boolean }
        recovery_codes_left: { type: integer, description: "Only when a recovery code ended the sign-in: how many remain." }
        profile:
          type: object
          additionalProperties: false
          properties:
            name: { type: string }
            given_name: { type: string }
            family_name: { type: string }
            picture: { type: string, description: A URL. }

    DataExport:
      type: object
      required: [id, status, created_at]
      properties:
        id: { type: string }
        status:
          type: string
          enum: [queued, running, ready, failed, expired]
          description: "`ready` can be downloaded until `expires_at`; `failed` may be asked for again at once."
        created_at: { $ref: "#/components/schemas/Timestamp" }
        finished_at: { $ref: "#/components/schemas/Timestamp" }
        expires_at: { $ref: "#/components/schemas/Timestamp", description: "When the package is deleted (ready only)." }
        size: { type: integer, description: "Bytes of the zip (ready only)." }
        counts:
          type: object
          additionalProperties: { type: integer }
          description: "What the package holds (ready only): records per part, and `files`."
        step: { type: string, description: "What it is doing now (queued or running only, on `GET /_auth/me/exports/{id}`)." }

    AdminDataExport:
      description: A data export as an administrator sees it.
      allOf:
        - { $ref: "#/components/schemas/DataExport" }
        - type: object
          required: [user, requested_by, downloads]
          properties:
            user: { type: string }
            requested_by: { type: string, description: "`user`, or the administrator who made it." }
            downloads: { type: integer }
            ticket: { type: string }
            silent: { type: boolean, description: "The user was not told." }
            reason: { type: string, description: "Why the user was not told (silent only)." }
            error: { type: string, description: "Why it failed (failed only)." }
            notified: { type: boolean, description: "On creation: the user was sent `data-export-made`." }
            notify_error: { type: string, description: "On creation: why the email could not be queued." }

    SessionInfo:
      type: object
      additionalProperties: false
      required: [id, created_at, last_used_at, expires_at, current]
      properties:
        id: { type: string }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        last_used_at: { $ref: "#/components/schemas/Timestamp" }
        expires_at: { $ref: "#/components/schemas/Timestamp" }
        current: { type: boolean }

    PushSend:
      type: object
      additionalProperties: false
      required: [id, kind, sender, created_at, users, planned, batches, batches_done, units, units_done, queued, limited, no_devices, no_consent, sent, invalid, failed, completed, completed_at]
      properties:
        id: { type: string }
        kind: { type: string, description: "The template kind, or `raw`." }
        sender: { type: string, description: "`function:<database>/<name>` or `admin:<actor>`." }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        users: { type: [integer, "null"], description: "Users named; null for an audience." }
        planned: { type: boolean, description: "Every batch exists." }
        batches: { type: integer }
        batches_done: { type: integer }
        units: { type: integer }
        units_done: { type: integer }
        queued: { type: integer, description: Users handed to delivery. }
        limited: { type: integer, description: Users over their per-user limit. }
        no_devices: { type: integer, description: Users with no device to reach. }
        no_consent: { type: integer, description: "Users who don't hold the consent the send requires (`requires_consent`)." }
        sent: { type: integer, description: Devices the provider accepted. }
        invalid: { type: integer, description: Devices removed as dead. }
        failed: { type: integer, description: Devices not delivered to. }
        completed: { type: boolean }
        completed_at: { oneOf: [{ $ref: "#/components/schemas/Timestamp" }, { type: "null" }] }

    Device:
      type: object
      additionalProperties: false
      required: [id, platform, name, created_at, last_seen]
      properties:
        id: { type: string }
        platform: { type: string, enum: [android, ios, web] }
        name: { type: [string, "null"] }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        last_seen: { $ref: "#/components/schemas/Timestamp" }

    OwnedReport:
      type: object
      additionalProperties: false
      required: [user, collections, without_policy, organizations, kept_in_organizations]
      properties:
        organizations:
          type: array
          description: "The organizations the user can manage, and whether they are the only one: an erase leaves those organizations `orphaned`."
          items:
            type: object
            additionalProperties: false
            required: [id, name, last_manager]
            properties:
              id: { type: string }
              name: { type: string }
              last_manager: { type: boolean }
        kept_in_organizations:
          type: array
          description: "The documents the user owns that belong to an organization, per collection: they stay with it, with the owner cleared, unless the collection says `in_org: apply`."
          items:
            type: object
            additionalProperties: false
            required: [database, collection, documents]
            properties:
              database: { type: string }
              collection: { type: string }
              documents: { type: integer }
        user:
          type: object
          additionalProperties: false
          required: [id, status]
          properties:
            id: { type: string }
            status: { type: string, enum: [active, deactivated, erased] }
        collections:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [database, collection, action, owned]
            properties:
              database: { type: string }
              collection: { type: string }
              action: { type: [string, "null"], enum: [delete, anonymize, null], description: "What happens to the documents the user owns; null keeps them (the policy only cleans up references)." }
              owned: { type: integer, description: "Documents whose `_meta.owner` is the user (0 without an action)." }
              remove: { type: array, items: { type: string }, description: "With `anonymize`: the fields removed." }
              replace: { type: array, items: { type: string }, description: "With `anonymize`: the fields set to a fixed value." }
              pull: { type: object, additionalProperties: { type: integer }, description: "Documents, per array field, that hold the user." }
              unset: { type: object, additionalProperties: { type: integer }, description: "Documents, per field, where it holds the user." }
        without_policy:
          type: array
          items: { type: string }
          description: "`<database>.<collection>` of the collections an erase leaves alone."

    Invitation:
      type: object
      additionalProperties: false
      required: [id, email, created_by, created_at, expires_at]
      properties:
        id: { type: string }
        email: { type: [string, "null"] }
        created_by: { type: string }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        expires_at: { $ref: "#/components/schemas/Timestamp" }

    InvitationCreated:
      type: object
      additionalProperties: false
      required: [id, email, created_by, created_at, expires_at]
      properties:
        id: { type: string }
        token: { type: string, pattern: "^bdi_", description: Only when the invitation wasn't emailed. }
        sent: { type: boolean, description: True when the invitation was emailed. }
        email: { type: [string, "null"] }
        created_by: { type: string }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        expires_at: { $ref: "#/components/schemas/Timestamp" }

    Meta:
      type: object
      additionalProperties: false
      required: [created_at, updated_at]
      description: |
        Server-owned. `version` is missing only on documents stored before
        versioning existed. The ownership fields exist in realms with
        `auth: enabled`, and not on documents stored before them.
      properties:
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
        version: { type: integer, minimum: 1 }
        owner: { type: [string, "null"] }
        created_by: { type: string }
        updated_by: { type: string }
        org: { type: string, description: "The organization the document belongs to. Only in collections with `organization` set, and set at creation (`?org=`)." }
        team: { type: string, description: "The team of the organization the document belongs to. Only in collections with `team` set, and set at creation (`?team=`)." }
        score: { type: number, description: "The relevance of the document to a `$search`, in a list sorted with `order_by=_relevance`. Never stored." }
        deleted_at:
          allOf: [{ $ref: "#/components/schemas/Timestamp" }]
          description: When a soft-deleted document was deleted. Only in the trash (`deleted=only|include`) of a collection with `soft_delete`.
        deleted_by: { type: string, description: "Who deleted it, e.g. `user:<id>` or `key:<name>`." }
        purge_at:
          allOf: [{ $ref: "#/components/schemas/Timestamp" }]
          description: When a soft-deleted document is removed for good (`soft_delete.retention`).
        redacted:
          type: array
          items: { type: string }
          description: |
            The encrypted fields (dot paths) the caller may not see, by the field's `reveal` rule:
            they come back `null`, so a `null` of one of these is hidden, not empty. Absent when
            nothing is hidden. A conditional GET's ETag carries a suffix (`"12.r3f9a1c2b"`) when it
            is present.
        chain:
          type: object
          additionalProperties: false
          required: [root, depth]
          description: |
            Set only on a write made by a trigger run (or by a function it called): `root` is the
            id of the change that started the chain and `depth` how many trigger runs deep this
            write is. The dispatcher reads it to bound chains; clients can't set it.
          properties:
            root: { type: string }
            depth: { type: integer, minimum: 0 }

    Document:
      type: object
      required: [id, _meta]
      description: |
        A stored document. Other fields follow the collection's schema.json.
        A file field (`files:` in collection.yaml) holds backd's file details, an
        object `{id, name, size, type, sha256, uploaded_at}` (an array of them on a
        `multiple` field), which only uploads write. An image also has `width` and
        `height` (as a viewer sees it, with the EXIF orientation applied), and a field
        that declares `versions:` has `versions`: an object by version name whose value
        is `{status}` with `pending` (a worker will make it), `ready` (made; with `id`,
        `size`, `type`, `width`, `height`, `params`, `fingerprint` and `generated_at`),
        `empty` (only functions make it, none has yet), `skipped` (`reason`:
        `not_an_image` or `unsupported_format`) or `failed` (`reason`: `too_large` or
        `decode_error`). With `?file_links=true` each also carries `url` and `expires_at`.
      properties:
        id: { type: string }
        _meta: { $ref: "#/components/schemas/Meta" }
        _expanded:
          type: object
          description: |
            Only on a read with `expand`, and never stored: ignored on writes. One entry per
            requested reference, keyed by its name.
          additionalProperties: { $ref: "#/components/schemas/Expanded" }
      additionalProperties: true

    Expanded:
      description: |
        What a reference expanded to: the referenced document (the selected fields and `id`, or
        all of it; a second level is in its own `_expanded`), `null` when it is missing,
        unreadable or in another organization, an array of those for a `many` reference
        (positions kept), or `{items, truncated: true}` when the array was longer than the
        limit.
      oneOf:
        - { type: "null" }
        - { type: object, additionalProperties: true }
        - { type: array, items: { oneOf: [{ type: "null" }, { type: object, additionalProperties: true }] } }
        - type: object
          required: [items, truncated]
          properties:
            items: { type: array, items: { oneOf: [{ type: "null" }, { type: object, additionalProperties: true }] } }
            truncated: { const: true }

    PendingUpload:
      type: object
      additionalProperties: false
      required: [upload_id, upload_token, expires_at, file]
      properties:
        upload_id: { type: string, pattern: '^fl_[0-9a-z]{20}$' }
        upload_token: { type: string, description: "Secret, shown once. Only its hash is kept." }
        expires_at: { $ref: "#/components/schemas/Timestamp" }
        file:
          type: object
          additionalProperties: false
          required: [name, size, type, sha256]
          properties:
            name: { type: string }
            size: { type: integer, minimum: 0 }
            type: { type: string, description: Detected from the content. }
            sha256: { type: string, pattern: '^[0-9a-f]{64}$' }

    StorageStatus:
      type: object
      required: [configured]
      properties:
        configured: { type: boolean }
        provider: { type: string }
        endpoint: { type: string }
        public_endpoint: { type: [string, "null"] }
        region: { type: string }
        bucket: { type: string }
        prefix: { type: string }
        access_key: { type: string, description: "`secret:NAME`: the secret's name, never its value." }
        secret_key: { type: string }
        download: { type: string }
        presigned_ttl: { type: string }
        pending_ttl: { type: string }
        keys:
          type: object
          required: [ok]
          properties:
            ok: { type: boolean }
            error: { type: string }
        reachable:
          type: object
          required: [ok]
          properties:
            ok: { type: boolean }
            error: { type: string }
        usage:
          type: object
          required: [bytes, files, users]
          properties:
            bytes: { type: integer }
            files: { type: integer }
            users:
              type: array
              items:
                type: object
                required: [user_id, bytes, files]
                properties:
                  user_id: { type: string }
                  bytes: { type: integer }
                  files: { type: integer }
        deletions:
          type: object
          required: [queued, retrying, oldest]
          properties:
            queued: { type: integer }
            retrying: { type: integer }
            oldest: { oneOf: [{ $ref: "#/components/schemas/Timestamp" }, { type: "null" }] }
        quota:
          type: object
          required: [realm, user]
          description: "The limits usage is held to (`storage.quota` in realm.yaml), in bytes; null: none."
          properties:
            realm: { type: [integer, "null"] }
            user: { type: [integer, "null"] }
        stale_uploads: { type: integer }

    StorageReconcile:
      type: object
      additionalProperties: false
      required: [delete, scanned, referenced, skipped_recent, skipped_in_journal, ignored, orphans, orphan_bytes, deleted, failed]
      properties:
        delete: { type: boolean }
        scanned: { type: integer }
        referenced: { type: integer }
        skipped_recent: { type: integer }
        skipped_in_journal: { type: integer }
        ignored: { type: integer }
        orphans:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [key, database, collection, file_id, size, last_modified]
            properties:
              key: { type: string }
              database: { type: string }
              collection: { type: string }
              file_id: { type: string }
              size: { type: integer }
              last_modified: { $ref: "#/components/schemas/Timestamp" }
        orphan_bytes: { type: integer }
        deleted: { type: integer }
        failed: { type: array, items: { type: string } }

    FileFieldInfo:
      type: object
      additionalProperties: false
      required: [name, upload, download, multiple, max_files, max_size, types]
      properties:
        name: { type: string }
        upload: { type: string, enum: [proxy, direct] }
        download: { type: string, enum: [presigned, proxy] }
        multiple: { type: boolean }
        max_files: { type: integer, minimum: 1, description: "1 for a field that holds one file." }
        max_size: { type: integer, description: Bytes per file. }
        types: { type: array, items: { type: string }, description: "Allowed content types; empty allows any." }
        multipart_above: { type: integer, description: "Direct fields only, when the field can hold more: files above this many bytes are sent in parts." }

    DirectUploadStart:
      type: object
      additionalProperties: false
      required: [name, size, type]
      properties:
        name: { type: string }
        size: { type: integer, minimum: 1, description: "The file's size in bytes, at most the field's `max_size`." }
        type: { type: string, description: The file's content type; signed into the link. }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$', description: "The file's SHA-256: signed into the link and verified by the storage. Required, except for a file sent in parts." }
        part_sha256:
          type: array
          items: { type: string, pattern: '^[0-9a-f]{64}$' }
          description: "For a file above the field's `multipart_above`: the SHA-256 of each consecutive part (required there, refused below)."

    DirectUpload:
      type: object
      additionalProperties: false
      required: [upload_id, upload_token, expires_at, url_expires_at]
      properties:
        upload_id: { type: string, pattern: '^fl_[0-9a-z]{20}$' }
        upload_token: { type: string, description: "Secret, shown once. Only its hash is kept." }
        expires_at: { $ref: "#/components/schemas/Timestamp" }
        method: { const: PUT, description: Not in the reply to a multipart upload. }
        url: { type: string, description: The signed link to the bucket (a file sent in one piece). }
        headers:
          type: object
          additionalProperties: { type: string }
          description: "Headers the PUT must send, exactly (content type and checksum are signed in)."
        url_expires_at: { $ref: "#/components/schemas/Timestamp" }
        multipart: { const: true, description: The file is sent in parts. }
        part_size: { type: integer, description: "Bytes per part; the last one may be shorter." }
        sha256: { type: string, description: "A multipart upload: the digest the file will be recorded with (of the parts' digests)." }
        parts:
          type: array
          description: "A multipart upload: one signed PUT link per part."
          items:
            type: object
            additionalProperties: false
            required: [number, url, headers, size]
            properties:
              number: { type: integer, minimum: 1 }
              url: { type: string }
              headers: { type: object, additionalProperties: { type: string } }
              size: { type: integer }

    CompletedUpload:
      type: object
      additionalProperties: false
      required: [upload_id, file]
      properties:
        upload_id: { type: string }
        file:
          type: object
          additionalProperties: false
          required: [name, size, type, sha256]
          properties:
            name: { type: string }
            size: { type: integer }
            type: { type: string }
            sha256: { type: string }

    VersionState:
      type: object
      required: [status]
      description: |
        One version of an image file, as the file's details record it: `pending` (a worker
        will make it), `ready` (made), `empty` (only functions make it, none has yet),
        `skipped` (`reason`: `not_an_image` or `unsupported_format`) or `failed` (`reason`:
        `too_large`, `decode_error`, `timeout` or `storage_error`).
      properties:
        status: { type: string, enum: [pending, ready, empty, skipped, failed] }
        reason: { type: string }
        id: { type: string, pattern: '^fv_[0-9a-z]{20}$' }
        size: { type: integer }
        type: { type: string }
        width: { type: integer }
        height: { type: integer }
        params: { type: object, additionalProperties: true }
        fingerprint: { type: string }
        custom: { type: boolean, description: "Made with parameters a function gave, not the declared ones." }
        generated_at: { $ref: "#/components/schemas/Timestamp" }
        url: { type: string, description: "With `?file_links=true`, a ready version's link." }
        expires_at: { $ref: "#/components/schemas/Timestamp" }

    FileLink:
      type: object
      additionalProperties: false
      required: [url, expires_at]
      properties:
        url: { type: string }
        expires_at: { $ref: "#/components/schemas/Timestamp" }

    DocumentBody:
      type: object
      description: |
        The document's fields, validated against the collection's
        schema.json. `_id` and `_meta` are ignored, and so is `id` on `PUT` and
        `PATCH`. On a create, `id` is the document's id in a collection that
        declares `custom_id` (required there), and `400 id_not_allowed` in one
        that generates ids. File fields are ignored too,
        except for a reference to a pending upload, `{"upload": "<id>", "token":
        "<token>"}` (a list of them on a `multiple` field), which attaches the
        file in this write (`POST …/_files/{field}/uploads`). On a `PUT` or `PATCH`
        a single field's file is replaced and a `multiple` field's is added to;
        a reference that is wrong, used or expired is `400 validation_error`.
      additionalProperties: true

    AggregateResponse:
      type: object
      additionalProperties: false
      required: [groups, total_groups]
      properties:
        groups:
          type: array
          items:
            type: object
            required: [key]
            description: |
              `key` has one entry per `group_by` field (`null` for missing or null values);
              the other members are the requested metrics by result name, e.g. `count`,
              `sum_total`. Sums and averages are exact decimal strings.
            properties:
              key: { type: object, additionalProperties: true }
            additionalProperties: true
        total_groups:
          type: integer
          description: How many groups there were before `limit`.

    DocumentList:
      type: object
      additionalProperties: false
      required: [items, limit, skip, has_more]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Document" } }
        limit: { type: integer }
        skip: { type: integer }
        has_more: { type: boolean }
        next_cursor:
          type: string
          description: >-
            Present when `has_more` is true: pass it as `after` to get the next
            page. Absent when the `order_by` can't be followed by a cursor
            (arrays, objects, mixed types): use `skip` then.
        total:
          type: integer
          description: Present when `count=true`. Counts the whole list, not what is after `after`.

    BatchOperation:
      type: object
      required: [op, collection]
      description: |
        One write, applied atomically with the batch's other operations.
        `create` and `replace` need `document`; `patch` needs `patch` (a
        JSON Merge Patch). `replace`, `patch` and `delete` need `id`; a
        `create` takes one for a collection with `custom_id` (required there, the same
        checks as a `POST`), and
        accept `if_match`: the version expected, as returned in `ETag`
        (e.g. `"3"`), or `"*"` for any existing document.
      properties:
        op: { type: string, enum: [create, replace, patch, delete] }
        collection: { type: string }
        id: { type: string }
        document: { type: object, additionalProperties: true }
        patch: { type: object, additionalProperties: true }
        if_match: { type: string }

    BatchRequest:
      type: object
      additionalProperties: false
      required: [operations]
      properties:
        operations:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: "#/components/schemas/BatchOperation" }

    BatchResult:
      type: object
      required: [id]
      description: The written document for create, replace and patch; just its id for delete.
      properties:
        id: { type: string }
      additionalProperties: true

    BatchResponse:
      type: object
      additionalProperties: false
      required: [results]
      properties:
        results:
          type: array
          items: { $ref: "#/components/schemas/BatchResult" }
