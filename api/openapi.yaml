openapi: 3.1.0
info:
  title: backd HTTP API
  version: 0.8.1
  summary: Config-driven, schema-validated REST API over MongoDB.
  description: |
    The contract of backd's HTTP API. Collections and their document fields
    are defined per deployment (CONFIG_DIR), so documents appear here as
    open objects; their system fields (`id`, `_meta`) are described exactly.

    Every error response uses the `Error` envelope. `default` responses list
    errors that can happen on any operation (for example `413`, `415`, `500`,
    `503`, or `404` for an unknown realm).
  license:
    name: MIT
    identifier: MIT

servers:
  - url: "{baseUrl}"
    description: Your backd deployment.
    variables:
      baseUrl:
        default: https://localhost:8443

tags:
  - name: health
    description: Liveness and readiness probes, outside the /v1 prefix.
  - name: auth
    description: "Sign-up, login and sessions of a realm with `auth: enabled`."
  - name: admin
    description: >-
      User, role and invitation management with an API key, or the session of a
      user whose admin role opens the area (users, invitations, apikeys,
      secrets, audit, functions, data, config). A request for an area the roles don't open
      answers 403 naming it. The admin data route (`/_admin/data/…`) serves the
      data operations past the collections' rules to the `data` area. A read-only level (`admin: read`) reads every area,
      users and data only when `admin.read_access` grants them, and every change
      answers 403.
  - name: documents
    description: CRUD and queries on any configured collection.
  - name: functions
    description: Calls to a database's server-side functions (preview).

security: []

paths:
  /healthz:
    get:
      tags: [health]
      summary: Liveness probe
      operationId: healthz
      responses:
        "200":
          description: The process is running.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }

  /readyz:
    get:
      tags: [health]
      summary: Readiness probe
      operationId: readyz
      responses:
        "200":
          description: MongoDB is reachable. Includes the fingerprint of the config this instance runs.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Status" }
        "503":
          $ref: "#/components/responses/Error"

  # ── /_auth ────────────────────────────────────────────────────────────
  /v1/{realm}/_auth/signup:
    parameters: [{ $ref: "#/components/parameters/realm" }]
    post:
      tags: [auth]
      summary: Create an account and sign in
      description: |
        Realms with `signup: open` accept anyone; `signup: invite` needs a
        valid `invitation`; `signup: closed` refuses.

        The new user's `locale` is the best language the realm lists for
        what was asked: the request's `locale`, else `Accept-Language` (by
        quality), matched exactly (`es-MX`), then by language (`es`), else the
        realm's `default_locale`. It never fails: an unlisted language is
        replaced by the default.

        In a realm with `email`, sign-up also asks for the `verify-email`
        message. With `account.require_verified_email: true` there is no
        session until the address is verified: the answer is `202` and the
        user signs in after following the link. In that mode an already
        registered address gets the same `202` (and the owner an
        `account-exists` email), so the answer doesn't reveal who is
        registered; the password is hashed either way, so the time taken
        doesn't either. Where a session is issued at sign-up, a registered
        address answers `409 email_taken`: such a realm can't hide who is
        registered.
      operationId: signup
      parameters:
        - name: Accept-Language
          in: header
          description: The browser's languages, used when the body has no `locale`.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8, maxLength: 128 }
                invitation: { type: string, description: "Invitation token (`bdi_…`), for `signup: invite`." }
                locale: { type: string, description: "The language to use for the user, such as `es` or `es-MX`; mapped silently to one the realm lists." }
                redirect_to: { type: string, description: "Where the page after the verification link may send the user: an absolute URL within the realm's `email.allowed_redirects` (`400 invalid_redirect` otherwise)." }
                cookie: { type: boolean, description: "Keep the session in an HttpOnly cookie, as for login." }
      responses:
        "201": { $ref: "#/components/responses/SessionCreated" }
        "202":
          description: >-
            The account exists but has no session: the realm requires the
            address to be verified first (`account.require_verified_email`).
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [verification_required] }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_auth/login:
    parameters: [{ $ref: "#/components/parameters/realm" }]
    post:
      tags: [auth]
      summary: Sign in with email and password
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
                cookie:
                  type: boolean
                  description: >-
                    Keep the session in an HttpOnly cookie (`__Secure-backd_session`, path `/v1/{realm}`) instead of
                    returning the token. Only in realms with `sessions.cookie.enabled`, and only from this API's own
                    origin or one of the realm's `cors.origins` (`403` otherwise). The response then has no `token`.
      responses:
        "200": { $ref: "#/components/responses/Session" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403":
          description: >-
            `email_not_verified`: the password is right, but the realm
            requires a verified address (`account.require_verified_email`).
            Only answered after the password was checked.
          headers: { X-Request-ID: { $ref: "#/components/headers/RequestID" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_auth/verify-email:
    parameters: [{ $ref: "#/components/parameters/realm" }]
    get:
      tags: [auth]
      summary: The page the verification link opens
      description: |
        The link in the `verify-email` message. Shows a page with a button;
        it never uses the token up, so mail scanners that open links can't
        spoil it. The page is the realm's `pages/verify-email/<locale>.html`,
        in the language of `Accept-Language`, and is sent with
        `Cache-Control: no-store`, `Referrer-Policy: no-referrer`, a strict
        `Content-Security-Policy` and `frame-ancestors 'none'`. A token that
        is expired, used or unknown shows the same error page (`400`).
      operationId: verifyEmailPage
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
        - name: Accept-Language
          in: header
          schema: { type: string }
      responses:
        "200": { $ref: "#/components/responses/HostedPage" }
        "400": { $ref: "#/components/responses/HostedPage" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [auth]
      summary: Verify an email address
      description: |
        Uses the token: the address becomes verified (and the `welcome`
        message is sent when `account.welcome_email` is on). No session is
        issued. The hosted page posts its form here
        (`application/x-www-form-urlencoded`, answered with a page); an app
        with its own pages posts JSON. A token that is expired, used,
        unknown or for another purpose is `400 invalid_token`.
      operationId: verifyEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token: { type: string }
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200": { $ref: "#/components/responses/HostedPage" }
        "204": { description: The address is verified. }
        "400":
          description: Invalid, expired or used token (`invalid_token`), or an invalid body.
          headers: { X-Request-ID: { $ref: "#/components/headers/RequestID" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
            text/html:
              schema: { type: string }
        "404": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_auth/verify-email/resend:
    parameters: [{ $ref: "#/components/parameters/realm" }]
    post:
      tags: [auth]
      summary: Ask for the verification email again
      description: |
        Answers `202` whether or not the address belongs to an account, or is
        already verified, so it can't be used to find out who is registered.
        The email limits apply (and are counted the same in every case);
        reaching one doesn't change the answer. `404` in a realm without
        `email`.
      operationId: resendVerification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email: { type: string }
                redirect_to: { type: string, description: "Within the realm's `email.allowed_redirects`." }
      responses:
        "202":
          description: Accepted.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [accepted] }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_auth/reset-password/request:
    parameters: [{ $ref: "#/components/parameters/realm" }]
    post:
      tags: [auth]
      summary: Ask for a password reset email
      description: |
        Answers `202` whether or not the address belongs to an account (a
        disabled account gets no message either), so it can't be used to find
        out who is registered. Requests are counted per address and per client
        address, for every address alike: past the limit the answer is `429`
        with `Retry-After`. The email limits apply on top and are silent.
        `404` in a realm without `email`.
      operationId: requestPasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email: { type: string }
                redirect_to: { type: string, description: "Where the page after the reset may send the user: within the realm's `email.allowed_redirects`." }
      responses:
        "202":
          description: Accepted.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [accepted] }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_auth/reset-password:
    parameters: [{ $ref: "#/components/parameters/realm" }]
    get:
      tags: [auth]
      summary: The form the reset link opens
      description: |
        The link in the `reset-password` message: a form for the new password
        (twice). Opening it never uses the token up. The page is the realm's
        `pages/reset-password/<locale>.html`; an expired, used or unknown
        token shows the same error page (`400`).
      operationId: resetPasswordPage
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
        - name: Accept-Language
          in: header
          schema: { type: string }
      responses:
        "200": { $ref: "#/components/responses/HostedPage" }
        "400": { $ref: "#/components/responses/HostedPage" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [auth]
      summary: Set a new password with a reset token
      description: |
        Applies the realm's password policy first: a refused password leaves the
        token usable (`400 validation_error`, or the form again with the
        reason). On success the password is set, **every session of the user
        ends**, the address is marked verified (the token proves the person
        reads that mailbox) and `password-changed` is sent. No session is
        issued. The hosted form posts here
        (`application/x-www-form-urlencoded`, answered with a page); an app with
        its own pages posts JSON. A token that is expired, used, unknown or for
        another purpose is `400 invalid_token`.
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string }
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [token, password, password_confirm]
              properties:
                token: { type: string }
                password: { type: string }
                password_confirm: { type: string }
      responses:
        "200": { $ref: "#/components/responses/HostedPage" }
        "204": { description: The password is set and the user's sessions have ended. }
        "400":
          description: Invalid, expired or used token (`invalid_token`), a password the policy refuses, or an invalid body.
          headers: { X-Request-ID: { $ref: "#/components/headers/RequestID" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
            text/html:
              schema: { type: string }
        "404": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_auth/email:
    parameters: [{ $ref: "#/components/parameters/realm" }]
    post:
      tags: [auth]
      summary: Ask to change the email address
      description: |
        Needs the session **and** the current password. The change applies only
        when the new address confirms it with the link sent there; the answer is
        `202` whether or not the address is free, so it can't be used to find
        out who is registered. Only in a realm with `account.allow_email_change`
        (`404` otherwise: the route doesn't exist). `429` when an email limit is
        reached.
      operationId: requestEmailChange
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [new_email, password]
              properties:
                new_email: { type: string }
                password: { type: string, description: The current password. }
                redirect_to: { type: string, description: "Within the realm's `email.allowed_redirects`." }
      responses:
        "202":
          description: Accepted.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [accepted] }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_auth/confirm-email-change:
    parameters: [{ $ref: "#/components/parameters/realm" }]
    get:
      tags: [auth]
      summary: The page the email change confirmation link opens
      description: |
        The link sent to the **new** address. Shows a button naming it; opening the link never uses the token up.
        Only in a realm with `account.allow_email_change` (`404` otherwise).
      operationId: confirmEmailChangePage
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
        - name: Accept-Language
          in: header
          schema: { type: string }
      responses:
        "200": { $ref: "#/components/responses/HostedPage" }
        "400": { $ref: "#/components/responses/HostedPage" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [auth]
      summary: Confirm the new email address
      description: |
        Uses the token: the address changes and counts as verified, **every session of the user ends**, and the old address is sent `email-changed` with a link to undo it for 7 days. No session is issued. The address having been registered meanwhile, or a later request having replaced this one, is `400 invalid_token`.
      operationId: confirmEmailChange
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token: { type: string }
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200": { $ref: "#/components/responses/HostedPage" }
        "204": { description: The address changed. }
        "400":
          description: Invalid, expired or used token (`invalid_token`), or an invalid body.
          headers: { X-Request-ID: { $ref: "#/components/headers/RequestID" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
            text/html:
              schema: { type: string }
        "404": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_auth/revert-email-change:
    parameters: [{ $ref: "#/components/parameters/realm" }]
    get:
      tags: [auth]
      summary: The page the undo link opens
      description: |
        The link sent to the **old** address after a change. Shows a button; opening it never uses the token up.
      operationId: revertEmailChangePage
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
        - name: Accept-Language
          in: header
          schema: { type: string }
      responses:
        "200": { $ref: "#/components/responses/HostedPage" }
        "400": { $ref: "#/components/responses/HostedPage" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [auth]
      summary: Undo an email change
      description: |
        Uses the token: restores the previous address, ends every session, makes the current password unusable (whoever changed the address may know it) and sends a `reset-password` email to the restored address. No session is issued.
      operationId: revertEmailChange
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token: { type: string }
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200": { $ref: "#/components/responses/HostedPage" }
        "204": { description: The previous address is back. }
        "400":
          description: Invalid, expired or used token (`invalid_token`), or an invalid body.
          headers: { X-Request-ID: { $ref: "#/components/headers/RequestID" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
            text/html:
              schema: { type: string }
        "404": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_auth/accept-invitation:
    parameters: [{ $ref: "#/components/parameters/realm" }]
    get:
      tags: [auth]
      summary: The page the invitation link opens
      description: |
        The link in an `invitation` email: a form to choose a password, showing the invited address. Opening it never uses the token up.
      operationId: acceptInvitationPage
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
        - name: Accept-Language
          in: header
          schema: { type: string }
      responses:
        "200": { $ref: "#/components/responses/HostedPage" }
        "400": { $ref: "#/components/responses/HostedPage" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [auth]
      summary: Accept an invitation
      description: |
        Creates the account for the invited address with the chosen password, **already verified** (only its owner received the link), and uses up the invitation. No session is issued: the user logs in. A revoked or expired invitation, or an address registered meanwhile, is `400 invalid_token`; a password the policy refuses leaves the link usable.
      operationId: acceptInvitation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string }
                locale: { type: string, description: "The user's language, such as `es`; mapped to one the realm lists." }
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [token, password, password_confirm]
              properties:
                token: { type: string }
                password: { type: string }
                password_confirm: { type: string }
      responses:
        "200": { $ref: "#/components/responses/HostedPage" }
        "204": { description: The account exists. }
        "400":
          description: Invalid, expired or used token (`invalid_token`), or an invalid body.
          headers: { X-Request-ID: { $ref: "#/components/headers/RequestID" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
            text/html:
              schema: { type: string }
        "404": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_auth/logout:
    parameters: [{ $ref: "#/components/parameters/realm" }]
    post:
      tags: [auth]
      summary: End the current session
      operationId: logout
      security: [{ session: [] }]
      responses:
        "204": { description: Session ended. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_auth/logout-all:
    parameters: [{ $ref: "#/components/parameters/realm" }]
    post:
      tags: [auth]
      summary: End every session of the user
      operationId: logoutAll
      security: [{ session: [] }]
      responses:
        "204": { description: All sessions ended. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_auth/me:
    parameters: [{ $ref: "#/components/parameters/realm" }]
    get:
      tags: [auth]
      summary: The signed-in user
      operationId: me
      security: [{ session: [] }]
      responses:
        "200":
          description: The user.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      tags: [auth]
      summary: Change the user's own settings
      description: |
        Today the language: `locale` must be one the realm lists
        (case ignored); any other value answers `400 invalid_locale` with
        the allowed ones in `details`. Unlike at sign-up, an explicit change
        is never mapped silently.
      operationId: updateMe
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                locale: { type: string, description: "One of the realm's `email.locales`." }
      responses:
        "200":
          description: The updated user.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [auth]
      summary: Delete the account (deactivates it)
      description: |
        Needs the current password. The account is **deactivated**: it is
        disabled and every session ends, and all data is kept (an administrator
        can reactivate it). Deactivating is not erasing: erasing a user's data is an
        administrator's action (`DELETE /_admin/users/{id}`).
      operationId: deleteMe
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password]
              properties:
                password: { type: string }
      responses:
        "204": { description: Account deactivated. }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_auth/password:
    parameters: [{ $ref: "#/components/parameters/realm" }]
    post:
      tags: [auth]
      summary: Change the password
      description: The current session stays valid; every other session ends.
      operationId: changePassword
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string, minLength: 8, maxLength: 128 }
      responses:
        "204": { description: Password changed. }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_auth/sessions:
    parameters: [{ $ref: "#/components/parameters/realm" }]
    get:
      tags: [auth]
      summary: The user's active sessions
      operationId: listSessions
      security: [{ session: [] }]
      responses:
        "200":
          description: Sessions, newest first.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/SessionInfo" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_auth/sessions/{id}:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/id" }
    delete:
      tags: [auth]
      summary: End one of the user's sessions
      operationId: revokeSession
      security: [{ session: [] }]
      responses:
        "204": { description: Session ended. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  # ── /_admin ───────────────────────────────────────────────────────────
  /v1/{realm}/_admin/users:
    parameters: [{ $ref: "#/components/parameters/realm" }]
    get:
      tags: [admin]
      summary: List users, or find one by email
      operationId: adminListUsers
      security: [{ apiKey: [] }, { session: [] }]
      parameters:
        - name: email
          in: query
          description: Exact email (case-insensitive); returns zero or one user.
          schema: { type: string }
        - name: q
          in: query
          description: >-
            Users whose email contains this text (case-insensitive, plain text, not a
            pattern, at most 254 characters), paged in MongoDB with `limit` and `after` like
            the list. Can't be combined with `email`.
          schema: { type: string, maxLength: 254 }
        - { $ref: "#/components/parameters/limit" }
        - { $ref: "#/components/parameters/skip" }
        - { $ref: "#/components/parameters/deleted" }
        - name: after
          in: query
          description: >-
            The `next_cursor` of the previous page (the last email of it): lists
            the users whose email sorts after it. Can't be combined with `skip`.
          schema: { type: string }
      responses:
        "200":
          description: A page of users, sorted by email, read from the database one page at a time.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, limit, skip, has_more]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/AdminUser" } }
                  limit: { type: integer }
                  skip: { type: integer }
                  has_more: { type: boolean }
                  next_cursor: { type: string, description: "Present when `has_more` and the list isn't an exact `email` lookup: pass it as `after`." }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [admin]
      summary: Create a user
      operationId: adminCreateUser
      security: [{ apiKey: [] }, { session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8, maxLength: 128 }
      responses:
        "201":
          description: The user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/users/{id}:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/id" }
    get:
      tags: [admin]
      summary: Get a user
      operationId: adminGetUser
      security: [{ apiKey: [] }, { session: [] }]
      responses:
        "200": { $ref: "#/components/responses/AdminUser" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      tags: [admin]
      summary: Change a user's flags
      description: Only `email_verified` and `disabled`; emails can't be changed.
      operationId: adminUpdateUser
      security: [{ apiKey: [] }, { session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                email_verified: { type: boolean }
                disabled: { type: boolean }
      responses:
        "200": { $ref: "#/components/responses/AdminUser" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [admin]
      summary: Erase a user
      description: |
        **Irreversible.** The user becomes a tombstone at once: their id stays,
        their email becomes `erased-<id>@erased.invalid` (so the real address is
        free again), and their sessions, sign-in methods, email tokens and email
        jobs are deleted. A worker then applies the `collection.yaml` policy of
        every collection that declares one (deleting or anonymizing the documents
        the user owns, removing them from other documents' fields) and records the
        counts in the audit trail as `user.erased`. The answer is the erase job
        (`origin: backd:account.erase` in the jobs list). Repeating the call for a
        user whose erase job failed queues it again; for one still going it
        returns the job. Erasing a user is an administrator's action: deactivating
        (`PATCH` with `disabled`, or the user's own `DELETE /_auth/me`) keeps the
        data.
      operationId: adminDeleteUser
      security: [{ apiKey: [] }, { session: [] }]
      responses:
        "202":
          description: The erase job.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [id, status]
                properties:
                  id: { type: string, description: The erase job's id. }
                  status: { type: string, enum: [queued, running, done] }
        "409": { description: "`already_erased`: the user was erased and nothing is left to do.", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/users/{id}/password:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/id" }
    post:
      tags: [admin]
      summary: Set a user's password
      description: Ends all of the user's sessions.
      operationId: adminSetPassword
      security: [{ apiKey: [] }, { session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password]
              properties:
                password: { type: string, minLength: 8, maxLength: 128 }
      responses:
        "204": { description: Password set. }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/users/{id}/email:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/id" }
    post:
      tags: [admin]
      summary: Change a user's email address
      description: |
        Applies at once, in any realm with `email` (`404` without), whatever
        `account.allow_email_change` says: the administrator vouches for the
        address, so it counts as verified. Ends all of the user's sessions. The
        old address is sent `email-changed` with a link to undo it for 7 days,
        and the new one is told. Audited as `user.email_changed`.
      operationId: adminChangeEmail
      security: [{ apiKey: [] }, { session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email: { type: string }
      responses:
        "200": { $ref: "#/components/responses/AdminUser" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/users/{id}/owned:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/id" }
    get:
      tags: [admin]
      summary: What erasing a user would do
      description: |
        A preview for an erase, **only for the collections that declare a policy**
        (`collection.yaml`): the action, how many documents the user owns, and
        how many documents hold the user in a `pull` or `unset` field. The
        collections without a policy are listed by name and not counted: an erase
        leaves them alone. Counts come from the queries the erase uses; no
        document content is returned.
      operationId: adminOwned
      security: [{ apiKey: [] }, { session: [] }]
      responses:
        "200":
          description: The report.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OwnedReport" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/users/{id}/sessions:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/id" }
    get:
      tags: [admin]
      summary: A user's sessions
      description: The user's unexpired sessions, newest first. Never a token. Needs the `users` area.
      operationId: adminUserSessions
      security: [{ apiKey: [] }, { session: [] }]
      responses:
        "200":
          description: The sessions.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [id, created_at, last_used_at, expires_at]
                      properties:
                        id: { type: string }
                        created_at: { $ref: "#/components/schemas/Timestamp" }
                        last_used_at: { $ref: "#/components/schemas/Timestamp" }
                        expires_at: { $ref: "#/components/schemas/Timestamp" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/users/{id}/sessions/{session_id}:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/id" }
      - { name: session_id, in: path, required: true, schema: { type: string } }
    delete:
      tags: [admin]
      summary: End a user's session
      description: The token stops working at once. Audited as `session.revoke`. Needs the `users` area to change.
      operationId: adminRevokeUserSession
      security: [{ apiKey: [] }, { session: [] }]
      responses:
        "204":
          description: Session ended.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/users/{id}/roles/{role}:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/id" }
      - name: role
        in: path
        required: true
        description: A role declared in the realm's realm.yaml.
        schema: { type: string }
    put:
      tags: [admin]
      summary: Assign a role
      operationId: adminAddRole
      security: [{ apiKey: [] }, { session: [] }]
      responses:
        "200": { $ref: "#/components/responses/AdminUser" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [admin]
      summary: Take a role away
      operationId: adminRemoveRole
      security: [{ apiKey: [] }, { session: [] }]
      responses:
        "200": { $ref: "#/components/responses/AdminUser" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/users/{id}/networks:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/id" }
    put:
      tags: [admin]
      summary: Set a user's network restrictions
      description: >-
        Replaces the user's admin and login networks (IP addresses or CIDR
        networks). Empty lists remove the restrictions. Admin networks must
        lie within the realm's `admin.allowed_networks`. `realm.yaml`
        settings for the user win at the next startup.
      operationId: adminSetUserNetworks
      security: [{ apiKey: [] }, { session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [admin_networks, login_networks]
              properties:
                admin_networks: { type: array, items: { type: string } }
                login_networks: { type: array, items: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/AdminUser" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/apikeys:
    parameters: [{ $ref: "#/components/parameters/realm" }]
    get:
      tags: [admin]
      summary: List API keys
      operationId: adminListAPIKeys
      security: [{ apiKey: [] }, { session: [] }]
      responses:
        "200":
          description: The realm's API keys, by name; never the keys themselves.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/APIKey" } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [admin]
      summary: Create an API key
      operationId: adminCreateAPIKey
      security: [{ apiKey: [] }, { session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, description: "Same rules as realm names; unique in the realm." }
                role: { enum: [data, admin], description: "Default data." }
                expires_in: { type: string, description: "Days (`90d`) or Go duration (`12h`); default: never.", examples: ["90d"] }
                networks: { type: array, items: { type: string }, description: "IP addresses or CIDR networks the key may be used from." }
                scopes:
                  type: array
                  maxItems: 32
                  items: { type: string, examples: ["read:blog/posts", "write:orders", "call:main/export"] }
                  description: >-
                    What a data key reaches; none means everything. Each grant is `read`, `write` or `call`,
                    optionally followed by `:<database>` or `:<database>/<collection or function>`. `write` means
                    create, update and delete (not read); `call` also lets the key read the jobs of the functions
                    it may call. Anything not granted answers `403`. Not for admin keys.
      responses:
        "201":
          description: The key, shown only here.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/APIKeyCreated" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/apikeys/{name}:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - name: name
        in: path
        required: true
        schema: { type: string }
    delete:
      tags: [admin]
      summary: Revoke an API key
      description: The key stops working at once.
      operationId: adminRevokeAPIKey
      security: [{ apiKey: [] }, { session: [] }]
      responses:
        "204": { description: Key revoked. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/secrets:
    parameters: [{ $ref: "#/components/parameters/realm" }]
    get:
      tags: [admin]
      summary: List secrets
      description: Metadata only — scope, name and who last changed it. Values are write-only.
      operationId: adminListSecrets
      security: [{ apiKey: [] }, { session: [] }]
      responses:
        "200":
          description: The realm's secrets, by scope and name; never their values.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Secret" } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/secrets/{name}:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - name: name
        in: path
        required: true
        schema: { type: string, description: "Upper-case letters, digits and _, starting with a letter." }
    put:
      tags: [admin]
      summary: Set a secret's value
      description: |
        Creates the secret, or replaces its value: functions read it as
        `ctx.secrets`, decrypted, within about a minute of this call.
        Without `database` it's the realm scope (`realm.NAME` in
        function.yaml); with it, that database's scope (`NAME`, for
        functions of that database only — never another's).
      operationId: adminSetSecret
      security: [{ apiKey: [] }, { session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [value]
              properties:
                value: { type: string, description: "The secret's new value; must not be empty." }
                database: { type: string, description: "Scopes it to this database of the realm instead of the realm itself." }
      responses:
        "204": { description: Secret set. }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [admin]
      summary: Delete a secret
      description: A function that declares it answers `secret_missing` again.
      operationId: adminDeleteSecret
      security: [{ apiKey: [] }, { session: [] }]
      parameters:
        - { name: database, in: query, description: "Its database scope; absent means the realm scope.", schema: { type: string } }
      responses:
        "204": { description: Secret deleted. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/config:
    parameters: [{ $ref: "#/components/parameters/realm" }]
    get:
      tags: [admin]
      summary: The realm's configuration, read-only
      description: |
        What this instance runs for the realm, from the files it loaded: realm settings
        (defaults applied; seeded user emails only for whoever may read users),
        every database's collections (schema, indexes, rules, `collection.yaml` policy) and
        functions (`function.yaml`, secrets by name only), the email templates and hosted
        pages found on disk, the configuration warnings and the config fingerprint. Each
        item carries the file it came from, relative to the config directory. Nothing here
        can be changed through the API: configuration is a reviewed, versioned artifact.
        Needs the `config` area (a read-only administrator reads it).
      operationId: adminConfig
      security: [{ apiKey: [] }, { session: [] }]
      responses:
        "200":
          description: The configuration.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema:
                type: object
                required: [realm, fingerprint, file, settings, databases, templates, warnings]
                properties:
                  realm: { type: string }
                  fingerprint: { type: string }
                  file: { type: string }
                  settings: { type: object }
                  databases: { type: object }
                  templates: { type: object }
                  warnings:
                    type: array
                    items:
                      type: object
                      required: [code, message]
                      properties:
                        code: { type: string }
                        message: { type: string }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/whoami:
    parameters: [{ $ref: "#/components/parameters/realm" }]
    get:
      tags: [admin]
      summary: What the signed-in administrator may do
      description: |
        The level of the credential and the admin areas it may change and may read, so a
        client (the admin UI) offers only what the server would allow. Areas are `users`,
        `invitations`, `apikeys`, `secrets`, `audit`, `functions`, `data` and `config`; `all` stands
        for every one. An admin key is `full`; a user's `level` is `full` (`admin: true`),
        `read` (only `admin: read`) or `custom` (a list of areas, perhaps with `read`).
        `read_access` is what `admin.read_access` in `realm.yaml` grants read-only
        administrators beyond operations.
      operationId: adminWhoami
      security: [{ apiKey: [] }, { session: [] }]
      responses:
        "200":
          description: The caller's admin access.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [level, write, read, read_access]
                properties:
                  level: { type: string, enum: [full, read, custom] }
                  write: { type: array, items: { type: string }, description: "Areas it may change." }
                  read: { type: array, items: { type: string }, description: "Areas it may read, what read_access grants included." }
                  read_access:
                    type: object
                    additionalProperties: false
                    required: [users, data]
                    properties:
                      users: { type: boolean }
                      data: { type: boolean }
                  user:
                    type: object
                    additionalProperties: false
                    required: [id, email, roles]
                    properties:
                      id: { type: string }
                      email: { type: string }
                      roles: { type: array, items: { type: string } }
                  key: { type: string, description: "The admin API key's name." }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/audit:
    parameters: [{ $ref: "#/components/parameters/realm" }]
    get:
      tags: [admin]
      summary: Read the audit trail
      description: |
        Security-sensitive actions and events of the realm, newest first. The trail is
        append-only: no endpoint changes or deletes records, which expire after the
        realm's `audit.retention` (default 365 days).
      operationId: adminListAudit
      security: [{ apiKey: [] }, { session: [] }]
      parameters:
        - { name: action, in: query, description: "Only this action, such as `role.add`.", schema: { type: string } }
        - { name: actor, in: query, description: "Only this actor, such as `user:<id>` or `key:<name>`.", schema: { type: string } }
        - { name: target, in: query, description: "Only this target, such as `user:<id>`.", schema: { type: string } }
        - { name: since, in: query, description: "Records at or after this time.", schema: { type: string, format: date-time } }
        - { name: until, in: query, description: "Records before this time.", schema: { type: string, format: date-time } }
        - { $ref: "#/components/parameters/limit" }
        - { $ref: "#/components/parameters/skip" }
      responses:
        "200":
          description: A page of audit records, newest first.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, limit, skip, has_more]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/AuditRecord" } }
                  limit: { type: integer }
                  skip: { type: integer }
                  has_more: { type: boolean }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/invocations:
    parameters: [{ $ref: "#/components/parameters/realm" }]
    get:
      tags: [admin]
      summary: Read function invocation history
      description: |
        What functions did, newest first: never their input or output,
        only status, timing and their own console log lines (already
        masked of any declared secrets). Records expire after the
        realm's `functions.log_retention` (default 7 days; roadmap F10).
      operationId: adminListInvocations
      security: [{ apiKey: [] }, { session: [] }]
      parameters:
        - { name: function, in: query, description: "Only this function, as `<database>/<name>`.", schema: { type: string } }
        - { name: request_id, in: query, description: "Only the call with this request id.", schema: { type: string } }
        - { name: since, in: query, description: "Records at or after this time.", schema: { type: string, format: date-time } }
        - { name: until, in: query, description: "Records before this time.", schema: { type: string, format: date-time } }
        - { $ref: "#/components/parameters/limit" }
        - { $ref: "#/components/parameters/skip" }
      responses:
        "200":
          description: A page of invocation records, newest first.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, limit, skip, has_more]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/InvocationRecord" } }
                  limit: { type: integer }
                  skip: { type: integer }
                  has_more: { type: boolean }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/jobs:
    parameters: [{ $ref: "#/components/parameters/realm" }]
    get:
      tags: [admin]
      summary: List async and scheduled jobs
      description: |
        The realm's async function calls and cron runs, newest first: their
        state and how they ended, never their input or output (read one job
        in full at `GET /v1/{realm}/{database}/_jobs/{id}`, as its caller or
        with an API key). Jobs expire after `functions.job_retention` once
        done (roadmap F19).
      operationId: adminListJobs
      security: [{ apiKey: [] }, { session: [] }]
      parameters:
        - { name: function, in: query, description: "Only this function, as `<database>/<name>`.", schema: { type: string } }
        - { name: status, in: query, description: "Only jobs in this state.", schema: { type: string, enum: [queued, running, done] } }
        - { name: origin, in: query, description: "Only jobs with exactly this origin, such as `function:main/ship`: the emails that function sent (count them for its sending volume).", schema: { type: string } }
        - { name: scheduled, in: query, description: "`true`: only cron runs; `false`: only calls made by callers.", schema: { type: boolean } }
        - { name: since, in: query, description: "Jobs created at or after this time.", schema: { type: string, format: date-time } }
        - { name: until, in: query, description: "Jobs created before this time.", schema: { type: string, format: date-time } }
        - { $ref: "#/components/parameters/limit" }
        - { $ref: "#/components/parameters/skip" }
      responses:
        "200":
          description: A page of jobs, newest first.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items, limit, skip, has_more]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/JobSummary" } }
                  limit: { type: integer }
                  skip: { type: integer }
                  has_more: { type: boolean }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/jobs/{id}:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/id" }
    get:
      tags: [admin]
      summary: Read a job with its steps
      description: |
        The job as the listing shows it (never its input or output), with every
        step the running or last attempt reported (`ctx.step`, `ctx.progress`).
        Needs the `functions` area (read is enough).
      operationId: adminGetJob
      security: [{ apiKey: [] }, { session: [] }]
      responses:
        "200":
          description: The job.
          headers:
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobSummary" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/config/check:
    parameters: [{ $ref: "#/components/parameters/realm" }]
    post:
      tags: [admin]
      summary: Check a change to the realm's configuration without applying it
      description: |
        Loads the realm's **whole** configuration as startup does (realm.yaml, every
        collection's schema, indexes, rules and policy, every function.yaml, the email
        templates and pages) with the draft `files` in place of, or beside, the ones on
        disk, and answers what it found. Every file of the realm is read and validated,
        not only the drafts, since a change can break another file (a schema that drops a
        field a rule names). `checked` is how many files the realm has with the drafts.
        Function bundles are built by `backd functions build` and are not part of it.
        It works on a copy: nothing on the server is changed or applied, and the
        configuration stays a file in a repository. Draft paths are relative to the realm's
        directory (`main/notes/collection.yaml`); a `null` content deletes the file. Needs the
        `config` area (a read-only administrator may check).
      operationId: adminCheckConfig
      security: [{ apiKey: [] }, { session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [files]
              properties:
                files:
                  type: object
                  description: "At most 50 files of at most 1 MiB, by path in the realm."
                  additionalProperties: { type: [string, "null"] }
      responses:
        "200":
          description: The result; `ok` is false when the configuration with the drafts would not load.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigCheck" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/storage/check:
    parameters:
      - { $ref: "#/components/parameters/realm" }
    post:
      tags: [admin]
      summary: Check the realm's object storage
      description: |
        Verifies the realm's storage the way files would use it: the bucket and
        the credentials, put, head, get, a range request and a listing on the
        realm's prefix, the signed SHA-256 (a wrong one must be rejected), signed
        download and upload links (when the links are for an address backd can
        reach), and, where the provider exposes them, the bucket's CORS rules and
        default encryption. It stores a few small objects under
        `<prefix>/<realm>/_check/` and deletes them again; it touches nothing else.
        Answers `200` with the report whatever it found: `ok` is false when a step
        failed (`level: fail`); `warn` steps are worth reading but don't fail it.
        Audited as `storage.check`. Needs the `config` area (read is enough).
      operationId: adminCheckStorage
      security: [{ apiKey: [] }, { session: [] }]
      responses:
        "200":
          description: The report.
          headers:
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorageCheck" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404":
          description: The realm has no `storage:` in `realm.yaml`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: "`storage_unavailable`: the realm's access keys can't be read (a secret is not set)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/storage:
    parameters:
      - { $ref: "#/components/parameters/realm" }
    get:
      tags: [admin]
      summary: The realm's object storage, what it holds and what waits
      description: |
        How the realm's storage is configured (the secrets by name, never their values),
        whether its access keys are set and the bucket answers, the running totals of
        bytes and files documents reference (for the realm, and for the 20 users holding
        the most), the objects queued for deletion, and the uploads left unfinished past
        their time. A realm without `storage:` answers `{"configured": false}`. Needs
        the `config` area (read is enough).
      operationId: adminStorageStatus
      security: [{ apiKey: [] }, { session: [] }]
      responses:
        "200":
          description: The status.
          headers:
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorageStatus" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/files/versions/regenerate:
    parameters:
      - { $ref: "#/components/parameters/realm" }
    post:
      tags: [admin]
      summary: Make the stale image versions of a file field again
      description: |
        Queues a job that goes through every document of a file field and makes again, on a
        worker, the versions that no longer match the field's `versions:`: copies made with
        other parameters (the declaration changed), copies that failed or never finished, and
        versions added later that a file has no copy of. Copies a function generated with its
        own parameters (`custom`), versions only functions make and files that aren't pictures
        are left alone; `missing_only` makes only the copies that don't exist. The old copy is
        served until the new one is ready. The job makes at most `rate` files a second
        (default 10), keeps a lease and can be cancelled (`POST …/jobs/{id}/cancel`); running
        it again resumes, since what matches is skipped. Its progress is the job's steps. One
        job per field at a time (`409 regenerate_running`). Audited as
        `files.versions.regenerate`. Needs the `config` area with write access.
      operationId: adminRegenerateVersions
      security: [{ apiKey: [] }, { session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [database, collection, field]
              properties:
                database: { type: string }
                collection: { type: string }
                field: { type: string }
                version: { type: string, description: Only this version; default every version the field declares with parameters. }
                missing_only: { type: boolean, default: false }
                rate: { type: integer, minimum: 1, maximum: 1000, description: Files a second at most. }
      responses:
        "202":
          description: The job.
          headers:
            Location: { schema: { type: string } }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema:
                type: object
                required: [id, status, database, collection, field, version, missing_only, created_at]
                properties:
                  id: { type: string }
                  status: { type: string }
                  database: { type: string }
                  collection: { type: string }
                  field: { type: string }
                  version: { type: [string, "null"] }
                  missing_only: { type: boolean }
                  created_at: { $ref: "#/components/schemas/Timestamp" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/storage/reconcile:
    parameters:
      - { $ref: "#/components/parameters/realm" }
    post:
      tags: [admin]
      summary: Find, and optionally delete, objects no document references
      description: |
        Lists the realm's file objects (the only time backd lists the bucket) and
        reports those no declared file field of any document references, for use after
        restoring a database backup or removing a file field. It always skips objects
        younger than 24 hours, objects whose upload record isn't `failed` (uploads in
        flight, pending uploads not yet expired, files a document holds), and anything
        that isn't `<prefix>/<realm>/<database>/<collection>/<file id>`. With
        `delete: true` it removes exactly the objects reported. Audited as
        `storage.reconcile`. Needs the `config` area with write access.
      operationId: adminReconcileStorage
      security: [{ apiKey: [] }, { session: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                delete: { type: boolean, default: false }
      responses:
        "200":
          description: The report.
          headers:
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StorageReconcile" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404":
          description: The realm has no `storage:` in `realm.yaml`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: "`storage_unavailable`: the access keys can't be read, or the bucket or the documents couldn't be read."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/data-checks:
    parameters:
      - { $ref: "#/components/parameters/realm" }
    get:
      tags: [admin]
      summary: The schema check running now and the latest report of every collection
      description: |
        `running` is the schema check queued or running now (the job, with the step
        it is at in `progress`), or null. `items` lists every collection of the
        realm with the summary of its latest report, or null when it was never
        checked. Needs the `data` area (read is enough; for the read-only level,
        `admin.read_access.data`).
      operationId: adminListDataChecks
      security: [{ apiKey: [] }, { session: [] }]
      responses:
        "200":
          description: The running check and the latest reports.
          headers:
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [running, items]
                properties:
                  running:
                    oneOf:
                      - type: "null"
                      - { $ref: "#/components/schemas/JobSummary" }
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [database, collection, report]
                      properties:
                        database: { type: string }
                        collection: { type: string }
                        report:
                          oneOf:
                            - type: "null"
                            - { $ref: "#/components/schemas/CheckReportSummary" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [admin]
      summary: Start a schema check
      description: |
        Queues a check of the documents that no longer match their collection's
        schema: `collection` (with `database`), a whole `database`, or, with no body, every
        collection of the realm. **A check reads every stored document, so on a
        big collection it takes a long time and loads MongoDB.** It runs in the
        background (a worker must be running) as a job, reporting one step per
        collection with a total of 100, advancing every 5 percent; follow it with
        `GET /jobs/{id}`, cancel it with `POST /jobs/{id}/cancel`. Each
        collection's report is stored when it is done, replacing the previous
        one. Only one check is queued or running per realm: another start answers
        `409 check_running` with that job's id in `details`. It never writes
        documents. Audited as `data.check`. Needs the `data` area (read is enough).
      operationId: adminStartDataCheck
      security: [{ apiKey: [] }, { session: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                database: { type: string }
                collection: { type: string, description: "Needs `database`." }
                limit: { type: integer, minimum: 1, maximum: 1000, description: "How many invalid documents to list per collection (default 100); the scan of a collection stops when it finds that many." }
      responses:
        "202":
          description: The check, queued.
          headers:
            Location: { schema: { type: string }, description: "`/v1/{realm}/_admin/jobs/{id}`." }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [id, status, scope, collections, limit, estimated_documents, created_at]
                properties:
                  id: { type: string, description: The job's id. }
                  status: { type: string }
                  scope: { type: string, description: "`<database>/<collection>`, `<database>` or `*`." }
                  collections: { type: array, items: { type: string }, description: "`<database>/<collection>` of each collection it will read." }
                  limit: { type: integer }
                  estimated_documents: { type: [integer, "null"], description: "About how many documents it will read, for the warning a client shows; null when the storage can't say." }
                  created_at: { $ref: "#/components/schemas/Timestamp" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: "`check_running`: another schema check is queued or running; its job id is in `details[0].reason`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/data-checks/{database}/{collection}:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/database" }
      - { name: collection, in: path, required: true, schema: { type: string } }
    get:
      tags: [admin]
      summary: The latest schema check report of a collection
      description: |
        The documents that failed the schema when the collection was last
        checked: for each, its id, whether it is soft-deleted, and up to 5
        problems (a JSON path and the rule that failed, never the value). Needs
        the `data` area (read is enough).
      operationId: adminGetDataCheck
      security: [{ apiKey: [] }, { session: [] }]
      responses:
        "200":
          description: The report.
          headers:
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckReport" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/jobs/{id}/cancel:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/id" }
    post:
      tags: [admin]
      summary: Cancel a job
      description: |
        Ends a queued, retry-waiting or running function job at once: it is `done`
        with the result `cancelled`, so no worker claims it, and a worker that is
        running it notices within a few seconds and stops the run (the executor kills
        the process). What the function already did stays done, as when a worker is
        lost. The job keeps its input, so it can be re-run. Audited as `job.cancel`
        (target `job:<id>`). Needs the `functions` area. backd's own jobs (emails,
        erasures) can't be cancelled.
      operationId: adminCancelJob
      security: [{ apiKey: [] }, { session: [] }]
      responses:
        "200":
          description: The job, now done and cancelled.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobSummary" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: The job has already finished, or isn't a function's.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/jobs/{id}/rerun:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/id" }
    post:
      tags: [admin]
      summary: Re-run a finished job
      description: |
        Queues a new job for a finished function job (any result, a cancelled one
        included): the same function, the same input and the same caller, so it
        behaves as the first run did (a scheduled run's re-run acts as the function,
        like the run). The new job has its own id, `origin: admin` and `rerun_of`
        naming the original, which keeps its own result. A worker must be running
        for it to run. Audited as `job.rerun` (target `job:<id>`, details
        `new_job`). Needs the `functions` area. backd's own jobs can't be re-run.
      operationId: adminRerunJob
      security: [{ apiKey: [] }, { session: [] }]
      responses:
        "202":
          description: The new job, queued.
          headers:
            Location: { schema: { type: string }, description: "`/v1/{realm}/{database}/_jobs/{id}` of the new job." }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobSummary" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: The job hasn't finished, isn't a function's, or its function no longer exists.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/schedules:
    parameters:
      - { $ref: "#/components/parameters/realm" }
    get:
      tags: [admin]
      summary: List the realm's schedules
      description: |
        Every scheduled function of the realm with its schedule, time zone and
        overlap setting, and whether an administrator paused it, sorted by
        function. Needs the `functions` area (read is enough).
      operationId: adminListSchedules
      security: [{ apiKey: [] }, { session: [] }]
      responses:
        "200":
          description: The schedules.
          headers:
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Schedule" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/functions/{database}/{name}/pause:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/database" }
      - { name: name, in: path, required: true, description: The function's name., schema: { type: string } }
    post:
      tags: [admin]
      summary: Pause a function's schedule
      description: |
        A paused schedule creates no runs until it is resumed; runs already queued
        or running are not touched, and the function can still be called by hand.
        The state is stored in the realm's database, so it survives restarts and
        applies to every instance. Pausing a paused schedule changes nothing.
        Audited as `schedule.pause` (target `schedule:<database>/<function>`).
        Needs the `functions` area.
      operationId: adminPauseSchedule
      security: [{ apiKey: [] }, { session: [] }]
      responses:
        "200":
          description: The schedule, now paused.
          headers:
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Schedule" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: The function has no schedule.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/functions/{database}/{name}/resume:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/database" }
      - { name: name, in: path, required: true, description: The function's name., schema: { type: string } }
    post:
      tags: [admin]
      summary: Resume a function's schedule
      description: |
        Lets a paused schedule create runs again. The runs that fell due while it
        was paused are not made up: the next scheduled time after the resume runs.
        Resuming a schedule that isn't paused changes nothing. Audited as
        `schedule.resume`. Needs the `functions` area.
      operationId: adminResumeSchedule
      security: [{ apiKey: [] }, { session: [] }]
      responses:
        "200":
          description: The schedule, running.
          headers:
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Schedule" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409":
          description: The function has no schedule.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/functions/{database}/{name}/invoke:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/database" }
      - name: name
        in: path
        required: true
        description: The function's name.
        schema: { type: string }
    post:
      tags: [admin]
      summary: Run a function by hand
      description: |
        Runs any function of the database, internal or public, on purpose:
        to re-run a clean-up that failed, or to test a scheduled function.
        The function's `invoke` rule is not evaluated (the credential is an
        admin one) and its `rate_limit` doesn't apply; its input schema and
        `idempotency: required` do. With `as`, the function runs with that
        user as `ctx.user` (their rules and ownership apply to `ctx.db`);
        without it there is no user. Answers like `_func`: the output for a
        `sync` function, `202` with a job for an `async` one. `webhook`
        functions can't be run this way. Every run is audited as
        `function.invoke_manual`, with the user's id, never their email.
      operationId: adminInvokeFunction
      security: [{ apiKey: [] }, { session: [] }]
      parameters:
        - name: Idempotency-Key
          in: header
          description: >-
            As on `_func`: 1-200 characters of letters, digits, `.`, `_`, `:` or `-`.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                input: { description: "The function's input, any JSON value (default `null`)." }
                as: { type: string, format: email, description: "Run as this user of the realm." }
      responses:
        "200":
          description: A `sync` function's output, any JSON value.
          headers:
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: {}
        "202":
          description: An `async` function was queued; poll `Location` for its result.
          headers:
            Location: { description: "`/v1/{realm}/{database}/_jobs/{id}`.", schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "4XX": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/invitations:
    parameters: [{ $ref: "#/components/parameters/realm" }]
    get:
      tags: [admin]
      summary: List unused, unexpired invitations
      operationId: adminListInvitations
      security: [{ apiKey: [] }, { session: [] }]
      responses:
        "200":
          description: Invitations, newest first; tokens are never listed.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Invitation" } }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [admin]
      summary: Create an invitation
      operationId: adminCreateInvitation
      security: [{ apiKey: [] }, { session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                email: { type: string, format: email, description: "Only this email may use the invitation." }
                expires_in: { type: string, description: "Days (`7d`) or Go duration (`12h`); default 7d, at most 90d.", examples: ["7d"] }
                send: { type: boolean, description: "Email the invitation to `email` (required then) instead of returning a token to deliver yourself: needs `email` in `realm.yaml`, and the response has no `token`. The link opens the realm's `accept-invitation` page." }
                redirect_to: { type: string, description: "With `send`: where the page after accepting may send the user, within `email.allowed_redirects`." }
                locale: { type: string, description: "With `send`: the language of the email, such as `es`." }
      responses:
        "201":
          description: "The invitation, with its token (shown only here), or with `sent: true` and no token when it was emailed."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitationCreated" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/invitations/{id}:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/id" }
    delete:
      tags: [admin]
      summary: Revoke an invitation
      operationId: adminRevokeInvitation
      security: [{ apiKey: [] }, { session: [] }]
      responses:
        "204": { description: Invitation revoked. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  # ── documents ─────────────────────────────────────────────────────────
  /v1/{realm}/{database}/_func/{function}:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/database" }
      - { $ref: "#/components/parameters/function" }
    post:
      tags: [functions]
      summary: Call a function
      description: |
        Runs the database's function with the request body as its input
        (`ctx.input`), except for `webhook` functions, whose raw body
        and headers are passed through unparsed. In realms with `auth:
        enabled`, API keys may always call; other callers need the
        function's `invoke` rule to allow them (a `webhook` function's
        rule must allow anonymous callers, since the sender has neither
        a session nor a key). For `sync`, the input and output are
        checked against the function's `input.schema.json` and
        `output.schema.json`, when present; `webhook` and `async` skip
        the output check (a `webhook` function answers its sender
        directly; an `async` function has no response to check yet).

        A `sync` function runs immediately and returns its output. An
        `async` function (roadmap F11) is queued and answers 202 with a
        job id and a `Location` to poll for its result at
        `GET /v1/{realm}/{database}/_jobs/{id}`. A `webhook` function
        (roadmap F13) sets its own response — status, headers and body,
        not necessarily JSON — reflected as-is in this response.

        Errors the function raises with `ctx.error(status, code, message)`
        arrive with that 4xx status and code (for `async`, in the job's
        `result` once done, not in this response; `webhook` functions
        answer errors themselves, through their own response).

        `Idempotency-Key` (roadmap F12) reaches the function as
        `ctx.idempotencyKey`, and also makes repeated calls with the
        same key safe to retry: the same key with the same input
        replays the first call's response (for `async`, the same job);
        the same key with different input answers `422`; the same key
        while the first call is still running answers `409`. Scoped to
        the function and the caller, so two different callers can never
        collide on the same client-chosen key. `function.yaml`'s
        `idempotency: required` refuses calls with no key (`400`).

        `Prefer: respond-async` (RFC 7240) asks for a job instead of the
        answer: a `sync` function is queued like an `async` one and
        answers 202 with the job, and the response carries
        `Preference-Applied: respond-async`. The call is checked first
        (rule, scopes, input schema, idempotency, rate limit), runs once
        (no retries: `retry` is for `async` functions) and its result is
        the job's, with the `sync` function's own limits. A `webhook`
        function ignores it, and so does a realm without `auth: enabled`
        (there is nowhere to keep a job): the call is answered inline.
        With an `Idempotency-Key`, the key replays whatever the first
        call was, an answer or a job.

        A function with `internal: true` has no HTTP route: it answers
        `404`, like a function that doesn't exist, to every caller,
        whatever their credentials.
      operationId: callFunction
      security: [{}, { session: [] }, { apiKey: [] }]
      parameters:
        - name: Idempotency-Key
          in: header
          description: >-
            1-200 characters of letters, digits, `.`, `_`, `:` or `-`.
            Passed to the function as `ctx.idempotencyKey`.
          schema: { type: string }
        - name: Prefer
          in: header
          description: >-
            `respond-async` queues a `sync` function as a job and answers
            202 (see the description). Other preferences are ignored.
          schema: { type: string, example: respond-async }
      requestBody:
        description: The input, any JSON value (an empty body is `null`).
        content:
          application/json:
            schema: {}
      responses:
        "200":
          description: >-
            A `sync` function's output, any JSON value. For a `webhook`
            function, the response it set itself — status (reflected in
            this HTTP status), headers and body — which isn't
            necessarily JSON.
          headers:
            Cache-Control: { $ref: "#/components/headers/NoStore" }
            X-Backd-Dev-Duration-Ms: { $ref: "#/components/headers/DevDurationMs" }
            X-Backd-Dev-Logs: { $ref: "#/components/headers/DevLogs" }
          content:
            application/json:
              schema: {}
            "*/*":
              schema: {}
        "202":
          description: >-
            An `async` function was queued (roadmap F11), or a `sync` one
            because the call said `Prefer: respond-async`; poll `Location`
            for its result.
          headers:
            Location: { description: "`/v1/{realm}/{database}/_jobs/{id}`.", schema: { type: string } }
            Preference-Applied: { description: "`respond-async`, when the call asked for it.", schema: { type: string, enum: [respond-async] } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429":
          description: >-
            Either the function, or its realm, is at its concurrency
            limit on this instance (`function.yaml`'s `concurrency`, or
            `functions.max_concurrency` in `realm.yaml`; roadmap F8); or
            the caller is over the function's declared rate limit
            (`function.yaml`'s `rate_limit`, shared across instances;
            roadmap F9).
          headers:
            Retry-After: { $ref: "#/components/headers/RetryAfter" }
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "4XX": { $ref: "#/components/responses/Error" }
        "409":
          description: A call with this `Idempotency-Key` is still running (roadmap F12).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: This `Idempotency-Key` was already used with different input (roadmap F12).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "504": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/{database}/_jobs/{id}:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/database" }
      - { $ref: "#/components/parameters/id" }
    get:
      tags: [functions]
      summary: Read an async job's status and result
      description: |
        Readable only by the job's own caller (the signed-in user who
        enqueued it), by any API key, or by a user holding one of the
        realm's admin roles (roadmap F11), such as an administrator who
        started the job by hand. Anonymous callers
        get 401; any other caller that isn't the job's own owner gets
        404, the same as an unknown job id, so a job's existence isn't
        leaked to callers who aren't allowed to see it.
      operationId: getJob
      security: [{}, { session: [] }, { apiKey: [] }]
      responses:
        "200":
          description: The job's current status, and its result once done.
          headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/{database}/_batch:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/database" }
    post:
      tags: [documents]
      summary: Write several documents atomically
      description: |
        Creates, replaces, patches and deletes documents across the
        database's collections in one MongoDB transaction: either every
        operation applies, or none does. Each operation is validated
        against its collection's schema.json and, for callers whose
        access rules apply (not API keys or admin functions), checked
        against the create/update/delete rule exactly like a single
        write. The first operation that fails aborts the whole batch;
        its index is in the error's `details` (e.g. `{"path": "1", ...}`).
      operationId: batchWrite
      security: [{}, { session: [] }, { apiKey: [] }]
      parameters:
        - $ref: "#/components/parameters/idempotencyKeyDocuments"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BatchRequest" }
      responses:
        "200":
          description: One result per operation, in the same order (the remembered ones again for a replayed `Idempotency-Key`).
          headers:
            Cache-Control: { $ref: "#/components/headers/NoStore" }
            Idempotent-Replayed: { description: "`true` when this is the remembered answer of an earlier request with the same `Idempotency-Key`.", schema: { const: "true" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BatchResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "412": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/{database}/{collection}:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/database" }
      - { $ref: "#/components/parameters/collection" }
    get:
      tags: [documents]
      summary: List documents
      description: |
        In realms with `auth: enabled`, only documents the caller's access
        rules allow are listed and counted.
      operationId: listDocuments
      security: [{}, { session: [] }, { apiKey: [] }]
      parameters:
        - { $ref: "#/components/parameters/fileLinks" }
        - name: where
          in: query
          description: >-
            JSON filter, e.g. `{"price":{"$lt":20}}`. Keys combine with AND;
            `$or` and `$and` take an array of such objects, e.g.
            `{"$or":[{"title":{"$icontains":"go"}},{"body":{"$icontains":"go"}}]}`.
          schema: { type: string }
        - name: order_by
          in: query
          description: Comma-separated fields; `-` prefix for descending.
          schema: { type: string }
        - { $ref: "#/components/parameters/limit" }
        - { $ref: "#/components/parameters/skip" }
        - name: after
          in: query
          description: >-
            The `next_cursor` of the previous page: continues the list after it,
            with the same `where` and `order_by`. Stable when documents change
            between requests and as fast on the last page as on the first, unlike
            `skip`. Can't be combined with `skip`. For the default order it is
            the id of the last document you saw. Refused (`400 invalid_query`,
            on `after`) for another `order_by` than the cursor's, for a cursor
            that isn't one, and for an `order_by` on arrays, objects or fields of
            mixed types, which no cursor can follow.
          schema: { type: string, maxLength: 2048 }
        - name: count
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: A page of documents.
          headers:
            Vary: { $ref: "#/components/headers/DataVary" }
            Cache-Control: { $ref: "#/components/headers/DataCacheControl" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentList" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [documents]
      summary: Create a document
      operationId: createDocument
      security: [{}, { session: [] }, { apiKey: [] }]
      parameters:
        - $ref: "#/components/parameters/idempotencyKeyDocuments"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DocumentBody" }
      responses:
        "201":
          description: The created document (or, for a replayed `Idempotency-Key`, the document as it was created).
          headers:
            Idempotent-Replayed: { description: "`true` when this is the remembered answer of an earlier request with the same `Idempotency-Key`.", schema: { const: "true" } }
            ETag: { $ref: "#/components/headers/ETag" }
            Vary: { $ref: "#/components/headers/DataVary" }
            Cache-Control: { $ref: "#/components/headers/DataCacheControl" }
            Location:
              required: true
              description: Path of the new document.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/{database}/{collection}/{id}:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/database" }
      - { $ref: "#/components/parameters/collection" }
      - { $ref: "#/components/parameters/id" }
    get:
      tags: [documents]
      summary: Get a document
      operationId: getDocument
      security: [{}, { session: [] }, { apiKey: [] }]
      parameters:
        - { $ref: "#/components/parameters/deleted" }
        - { $ref: "#/components/parameters/fileLinks" }
      responses:
        "200": { $ref: "#/components/responses/Document" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    put:
      tags: [documents]
      summary: Replace a document
      operationId: replaceDocument
      security: [{}, { session: [] }, { apiKey: [] }]
      parameters: [{ $ref: "#/components/parameters/ifMatch" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DocumentBody" }
      responses:
        "200": { $ref: "#/components/responses/Document" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "412": { $ref: "#/components/responses/VersionMismatch" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      tags: [documents]
      summary: Update a document (JSON Merge Patch)
      operationId: patchDocument
      security: [{}, { session: [] }, { apiKey: [] }]
      parameters: [{ $ref: "#/components/parameters/ifMatch" }]
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: "#/components/schemas/DocumentBody" }
      responses:
        "200": { $ref: "#/components/responses/Document" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "412": { $ref: "#/components/responses/VersionMismatch" }
        "415": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [documents]
      summary: Delete a document
      description: |
        In a collection with `soft_delete` (collection.yaml) the document is
        marked deleted instead of removed: no read, write or batch sees it, and
        it can be restored (`POST …/restore`) or, with `purge=true`, removed for
        good under the `purge` rule.
      operationId: deleteDocument
      security: [{}, { session: [] }, { apiKey: [] }]
      parameters:
        - { $ref: "#/components/parameters/ifMatch" }
        - name: purge
          in: query
          description: >-
            `true` removes the document for good, deleted or not, in a
            collection with `soft_delete`. Needs the `purge` rule.
          schema: { type: string, enum: ["true"] }
      responses:
        "204":
          description: Document deleted (or, in a collection with `soft_delete`, marked deleted).
          headers:
            Vary: { $ref: "#/components/headers/DataVary" }
            Cache-Control: { $ref: "#/components/headers/DataCacheControl" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "412": { $ref: "#/components/responses/VersionMismatch" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/{database}/{collection}/{id}/restore:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/database" }
      - { $ref: "#/components/parameters/collection" }
      - { $ref: "#/components/parameters/id" }
    post:
      tags: [documents]
      summary: Restore a soft-deleted document
      description: |
        Brings a deleted document back, as it was, at the next version. Only in
        a collection with `soft_delete`, and only for callers the `restore`
        rule lets see the document. The document must be valid against the
        schema as it is now (`400` otherwise), and its unique values must still
        be free (`409` otherwise).
      operationId: restoreDocument
      security: [{}, { session: [] }, { apiKey: [] }]
      parameters: [{ $ref: "#/components/parameters/ifMatch" }]
      responses:
        "200": { $ref: "#/components/responses/Document" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "412": { $ref: "#/components/responses/VersionMismatch" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/{database}/{collection}/_files/{field}:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/database" }
      - { $ref: "#/components/parameters/collection" }
      - { $ref: "#/components/parameters/fileField" }
    get:
      tags: [documents]
      summary: How a file field takes files
      description: |
        The field's configuration, nothing about any document: how it takes uploads
        (`proxy` or `direct`), how it serves downloads, whether it holds several files,
        and the limits a file is checked against. An app uses it to choose between a proxy
        and a direct upload and to refuse a file before sending it. `max_size` is the
        field's, and for a proxy field also within `BACKD_MAX_UPLOAD_BYTES`.
      operationId: getFileField
      security: [{}, { session: [] }, { apiKey: [] }]
      responses:
        "200":
          description: The field.
          headers:
            Cache-Control: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileFieldInfo" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/data/{database}/{collection}/_files/{field}:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/database" }
      - { $ref: "#/components/parameters/collection" }
      - { $ref: "#/components/parameters/fileField" }
    get:
      tags: [admin]
      summary: How a file field takes files
      description: |
        The field's configuration, nothing about any document: how it takes uploads
        (`proxy` or `direct`), how it serves downloads, whether it holds several files,
        and the limits a file is checked against. An app uses it to choose between a proxy
        and a direct upload and to refuse a file before sending it. `max_size` is the
        field's, and for a proxy field also within `BACKD_MAX_UPLOAD_BYTES`.
      operationId: adminGetFileField
      security: [{ apiKey: [] }, { session: [] }]
      responses:
        "200":
          description: The field.
          headers:
            Cache-Control: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileFieldInfo" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/{database}/{collection}/_files/{field}/uploads:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/database" }
      - { $ref: "#/components/parameters/collection" }
      - { $ref: "#/components/parameters/fileField" }
    post:
      tags: [documents]
      summary: Upload a file before its document exists
      description: |
        Stores the request body (the file's bytes, with its `Content-Type`) as a
        **pending upload** for this field and answers an `upload_id` and a secret
        `upload_token` (only its hash is kept). Naming them in the field of a later
        create, `PUT` or `PATCH`, `{"upload": "<id>", "token": "<token>"}`, writes the
        document with the file's details in the same write, under the `create` or
        `update` rule applied to the final document; so a required file field works.
        The upload is used once, by whoever holds the token (and, when a signed-in
        user made it, only by that user), and expires after `pending_ttl` of the
        realm's `storage:`; an unused one is deleted by the workers.

        Who may upload: a signed-in user needs the collection to have a `create`
        rule; an anonymous caller needs it to admit a document holding just this
        file. The same limits as any upload apply (`max_size`, `types`,
        `BACKD_MAX_UPLOAD_BYTES`), and a caller holds at most 20 unused uploads
        and starts a limited number per window (`429`).

        On a field with `upload: direct` the body is not the file but its declaration,
        `{"name", "size", "type", "sha256"}` as in `POST …/{id}/_files/{field}/uploads`,
        and the answer carries the signed link to send the file to; `…/uploads/{upload_id}/complete`
        then verifies it and makes the upload ready to be named in a write.
        A JPEG or PNG is stored without its metadata (EXIF with the GPS position, XMP,
        comments, PNG text and time), its pixels untouched and its orientation kept, unless
        the field sets `keep_metadata: true`; the file's `size` and `sha256` describe what
        is stored. A picture too damaged to be copied that way is `422 invalid_image`.
      operationId: startFileUpload
      security: [{}, { session: [] }, { apiKey: [] }]
      parameters:
        - name: name
          in: query
          description: The file's name; defaults to the `Content-Disposition` filename, then `file`.
          schema: { type: string }
      requestBody:
        required: true
        content:
          "*/*":
            schema: { type: string, format: binary }
      responses:
        "201":
          description: The pending upload (for a direct field, with the link to send the file to).
          headers:
            Cache-Control: { schema: { const: no-store } }
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/PendingUpload" }
                  - { $ref: "#/components/schemas/DirectUpload" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/{database}/{collection}/{id}/_files/{field}/uploads:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/database" }
      - { $ref: "#/components/parameters/collection" }
      - { $ref: "#/components/parameters/id" }
      - { $ref: "#/components/parameters/fileField" }
    post:
      tags: [documents]
      summary: Start a direct upload to a document
      description: |
        For a field with `upload: direct` (a proxy field answers `409 upload_mode_mismatch`).
        The body declares the file: `name`, `size`, `type` and `sha256` are all required
        and `size` can't exceed the field's `max_size`. The `update` rule is asked, as
        for any upload, about the document with the declared file in it, before anything
        is signed; `max_files` and `If-Match` are checked too.

        The answer is a signed `PUT` link to the bucket, with the headers to send (the
        content type and `x-amz-checksum-sha256` are signed in, and so is the length: the
        storage refuses a body that differs), an `upload_id` and a secret `upload_token`.
        After the `PUT`, `POST …/_files/{field}/uploads/{upload_id}/complete` with the
        token verifies the file and attaches it. The bucket needs CORS for the app's
        origins (`backd storage check` looks).

        Above the storage's single-`PUT` limit (5 GiB, `multipart_above` in the field's
        info) the file is sent in parts: instead of `sha256` the body carries
        `part_sha256`, the SHA-256 of each consecutive part of `part_size` bytes (the
        part size follows from the file's size: at least 64 MiB, a multiple of 16 MiB,
        at most 1000 parts; a body naming the wrong number of digests is `400` and says
        how many). The answer then has `multipart: true`, the `part_size` and a signed
        `PUT` link per part (`parts`, each with its own headers) instead of `url`. The
        links last at least a day. Completing assembles the parts, and the file's
        `sha256` is not that of its bytes but the digest of the parts' digests
        (`sha256` of the reply, checked by the storage). Uploads left unfinished are
        aborted by the worker.
      operationId: startDirectUpload
      security: [{}, { session: [] }, { apiKey: [] }]
      parameters: [{ $ref: "#/components/parameters/ifMatch" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DirectUploadStart" }
      responses:
        "201":
          description: The upload, started.
          headers:
            Cache-Control: { schema: { const: no-store } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DirectUpload" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "412": { $ref: "#/components/responses/VersionMismatch" }
        "415": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/{database}/{collection}/_files/{field}/uploads/{uploadID}/complete:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/database" }
      - { $ref: "#/components/parameters/collection" }
      - { $ref: "#/components/parameters/fileField" }
      - name: uploadID
        in: path
        required: true
        description: The `upload_id` of a started direct upload.
        schema: { type: string, pattern: '^fl_[0-9a-z]{20}$' }
    post:
      tags: [documents]
      summary: Complete a direct upload
      description: |
        Body `{"upload_token": "…"}`. Verifies what the client put in the bucket: one
        `HEAD` (the size, and the SHA-256 the storage computed, must be the declared
        ones; a missing checksum is a mismatch) and one range read of the first bytes,
        whatever the file's size, to detect its type. Any mismatch deletes the object:
        `422 upload_mismatch`, or `415 unsupported_file_type` when the content isn't a
        type of the field. Nothing uploaded yet is `409 file_not_uploaded`, and the
        completion can be tried again. A multipart upload lists its parts first (the
        sizes and digests must be the declared ones; parts still missing are `409
        file_not_uploaded` too), has the storage assemble them, and checks the composite
        checksum of the object against the declared parts. A JPEG or PNG sent in parts is
        refused (`422 invalid_image`) unless the field sets `keep_metadata: true`.

        An upload started for a document is then attached to it (`201` with the
        document, the update rule asked about the real details, `If-Match` accepted); a
        pending one becomes ready to be named in a write (`200`). A wrong, used or
        expired token, an upload of another field, or one another user started is
        `400`, without saying which.
      operationId: completeDirectUpload
      security: [{}, { session: [] }, { apiKey: [] }]
      parameters: [{ $ref: "#/components/parameters/ifMatch" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [upload_token]
              properties:
                upload_token: { type: string }
      responses:
        "200":
          description: A pending upload, ready to be attached by a write.
          headers:
            Cache-Control: { schema: { const: no-store } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompletedUpload" }
        "201":
          description: The document, with the file attached.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Location: { schema: { type: string }, description: "The file's URL." }
            Vary: { $ref: "#/components/headers/DataVary" }
            Cache-Control: { $ref: "#/components/headers/DataCacheControl" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "412": { $ref: "#/components/responses/VersionMismatch" }
        "415": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/{database}/{collection}/{id}/_files/{field}:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/database" }
      - { $ref: "#/components/parameters/collection" }
      - { $ref: "#/components/parameters/id" }
      - { $ref: "#/components/parameters/fileField" }
    post:
      tags: [documents]
      summary: Upload a file into a file field
      description: |
        The request body is the file's bytes, with its `Content-Type`. On a field that
        holds one file the upload replaces it; on a `multiple` field it is appended
        (`409 too_many_files` at `max_files`, before any byte is read). The file's
        name comes from `?name=` or the `Content-Disposition` filename, and is
        sanitized, never refused. The type is detected from the content: a file that
        isn't of one of the field's `types` is `415 unsupported_file_type`, one over
        `max_size` is `413`. The `update` rule is asked first, with the document as it
        would be after the change. Every upload is a change: it bumps the version and
        accepts `If-Match`. The document is answered with the new file's details, and
        `Location` is the file's URL. A field set to `upload: direct` answers
        `409 upload_mode_mismatch`.
        A JPEG or PNG is stored without its metadata (EXIF with the GPS position, XMP,
        comments, PNG text and time), its pixels untouched and its orientation kept, unless
        the field sets `keep_metadata: true`; the file's `size` and `sha256` describe what
        is stored. A picture too damaged to be copied that way is `422 invalid_image`.
      operationId: uploadFile
      security: [{}, { session: [] }, { apiKey: [] }]
      parameters:
        - { $ref: "#/components/parameters/ifMatch" }
        - name: name
          in: query
          description: The file's name; defaults to the `Content-Disposition` filename, then `file`.
          schema: { type: string }
      requestBody:
        required: true
        content:
          "*/*":
            schema: { type: string, format: binary }
      responses:
        "201":
          description: The document, with the file attached.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Location: { schema: { type: string }, description: "The file's URL." }
            Vary: { $ref: "#/components/headers/DataVary" }
            Cache-Control: { $ref: "#/components/headers/DataCacheControl" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "412": { $ref: "#/components/responses/VersionMismatch" }
        "422": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [documents]
      summary: Clear a file field
      description: |
        Removes every file of the field. The `update` rule is asked about the result;
        the objects are deleted afterwards by the workers.
      operationId: clearFiles
      security: [{}, { session: [] }, { apiKey: [] }]
      parameters: [{ $ref: "#/components/parameters/ifMatch" }]
      responses:
        "200": { $ref: "#/components/responses/Document" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "412": { $ref: "#/components/responses/VersionMismatch" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/{database}/{collection}/{id}/_files/{field}/{fileID}:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/database" }
      - { $ref: "#/components/parameters/collection" }
      - { $ref: "#/components/parameters/id" }
      - { $ref: "#/components/parameters/fileField" }
      - { $ref: "#/components/parameters/fileId" }
    get:
      tags: [documents]
      summary: Download a file
      description: |
        The `read` rule decides (a document the caller can't read is `404`). In
        `download: presigned` mode (the default) the answer is a `302` to a short-lived
        signed link of the storage, forcing a download; `?link=json` answers
        `{url, expires_at}` instead. In `download: proxy` mode backd streams the
        bytes: with `nosniff` and a sandbox CSP, one `Range` (`206`, `416`), a strong
        `ETag` from the file's sha256 (`If-None-Match` → `304`, `If-Range`), and
        public caching only for a document anyone may read. A signed backd link
        (`?exp=&sig=`, from `?link=json` or `?file_links=true`) is its own credential
        for this file until it expires (`403 invalid_file_link` otherwise).
        `404 file_missing` when the object is gone from storage.
      operationId: downloadFile
      security: [{}, { session: [] }, { apiKey: [] }]
      parameters:
        - name: link
          in: query
          description: "`json` answers the link instead of redirecting to it."
          schema: { type: string, enum: [json] }
        - name: exp
          in: query
          description: A backd link's expiry (Unix seconds).
          schema: { type: string }
        - name: sig
          in: query
          description: A backd link's signature.
          schema: { type: string }
        - name: version
          in: query
          description: |
            Serve this made version of an image (`versions:` in collection.yaml) instead of
            the original, with the same rules, links, caching and ranges. A backd link made
            for a version is bound to it. `404 version_unavailable` (with the version's
            `status` and `reason` in `details`) when it isn't `ready` or isn't declared.
          schema: { type: string }
        - name: Range
          in: header
          schema: { type: string }
        - name: If-Range
          in: header
          schema: { type: string }
        - name: If-None-Match
          in: header
          schema: { type: string }
      responses:
        "200":
          description: The file's bytes (proxy mode), or the link (`?link=json`).
          headers:
            ETag: { schema: { type: string } }
            Accept-Ranges: { schema: { const: bytes } }
            Content-Disposition: { schema: { type: string } }
            X-Content-Type-Options: { schema: { const: nosniff } }
            Content-Security-Policy: { schema: { type: string } }
            Cache-Control: { schema: { type: string } }
          content:
            "*/*":
              schema: { type: string, format: binary }
            application/json:
              schema: { $ref: "#/components/schemas/FileLink" }
        "206":
          description: The requested range of the file.
          headers:
            Content-Range: { schema: { type: string } }
            ETag: { schema: { type: string } }
          content:
            "*/*":
              schema: { type: string, format: binary }
        "302":
          description: Redirect to the storage's signed link.
          headers:
            Location: { schema: { type: string } }
            Cache-Control: { schema: { const: "private, no-store" } }
        "304": { description: The caller's copy is current. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "416":
          description: The range is outside the file.
          headers:
            Content-Range: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [documents]
      summary: Remove one file
      description: |
        Takes the file out of the document (a new version, `If-Match` accepted) and
        queues the object for deletion.
      operationId: deleteFile
      security: [{}, { session: [] }, { apiKey: [] }]
      parameters: [{ $ref: "#/components/parameters/ifMatch" }]
      responses:
        "200": { $ref: "#/components/responses/Document" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "412": { $ref: "#/components/responses/VersionMismatch" }
        default: { $ref: "#/components/responses/Error" }

  # The admin data route: the data routes' operations for administrators (the
  # `data` admin area), past the collections' rules. Writes are audited.

  /v1/{realm}/_admin/data/{database}/{collection}:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/database" }
      - { $ref: "#/components/parameters/collection" }
    get:
      tags: [admin]
      summary: Admin data, list documents
      description: |
        Every document of the collection, whatever its access rules say. A
        read-only administrator needs `admin.read_access.data`; `deleted=only|include`
        shows the trash of a collection with `soft_delete`.
      operationId: adminListDocuments
      security: [{ apiKey: [] }, { session: [] }]
      parameters:
        - { $ref: "#/components/parameters/fileLinks" }
        - name: where
          in: query
          description: >-
            JSON filter, e.g. `{"price":{"$lt":20}}`. Keys combine with AND;
            `$or` and `$and` take an array of such objects, e.g.
            `{"$or":[{"title":{"$icontains":"go"}},{"body":{"$icontains":"go"}}]}`.
          schema: { type: string }
        - name: order_by
          in: query
          description: Comma-separated fields; `-` prefix for descending.
          schema: { type: string }
        - { $ref: "#/components/parameters/limit" }
        - { $ref: "#/components/parameters/skip" }
        - name: after
          in: query
          description: >-
            The `next_cursor` of the previous page: continues the list after it,
            with the same `where` and `order_by`. Stable when documents change
            between requests and as fast on the last page as on the first, unlike
            `skip`. Can't be combined with `skip`. For the default order it is
            the id of the last document you saw. Refused (`400 invalid_query`,
            on `after`) for another `order_by` than the cursor's, for a cursor
            that isn't one, and for an `order_by` on arrays, objects or fields of
            mixed types, which no cursor can follow.
          schema: { type: string, maxLength: 2048 }
        - name: count
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: A page of documents.
          headers:
            Vary: { $ref: "#/components/headers/DataVary" }
            Cache-Control: { $ref: "#/components/headers/DataCacheControl" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentList" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [admin]
      summary: Admin data, create a document
      operationId: adminCreateDocument
      security: [{ apiKey: [] }, { session: [] }]
      parameters:
        - $ref: "#/components/parameters/idempotencyKeyDocuments"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DocumentBody" }
      responses:
        "201":
          description: The created document (or, for a replayed `Idempotency-Key`, the document as it was created).
          headers:
            Idempotent-Replayed: { description: "`true` when this is the remembered answer of an earlier request with the same `Idempotency-Key`.", schema: { const: "true" } }
            ETag: { $ref: "#/components/headers/ETag" }
            Vary: { $ref: "#/components/headers/DataVary" }
            Cache-Control: { $ref: "#/components/headers/DataCacheControl" }
            Location:
              required: true
              description: Path of the new document.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
  /v1/{realm}/_admin/data/{database}/{collection}/{id}:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/database" }
      - { $ref: "#/components/parameters/collection" }
      - { $ref: "#/components/parameters/id" }
    get:
      tags: [admin]
      summary: Admin data, get a document
      operationId: adminGetDocument
      security: [{ apiKey: [] }, { session: [] }]
      parameters:
        - { $ref: "#/components/parameters/deleted" }
        - { $ref: "#/components/parameters/fileLinks" }
      responses:
        "200": { $ref: "#/components/responses/Document" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    put:
      tags: [admin]
      summary: Admin data, replace a document
      operationId: adminReplaceDocument
      security: [{ apiKey: [] }, { session: [] }]
      parameters: [{ $ref: "#/components/parameters/ifMatch" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DocumentBody" }
      responses:
        "200": { $ref: "#/components/responses/Document" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "412": { $ref: "#/components/responses/VersionMismatch" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      tags: [admin]
      summary: Admin data, update a document (JSON Merge Patch)
      operationId: adminPatchDocument
      security: [{ apiKey: [] }, { session: [] }]
      parameters: [{ $ref: "#/components/parameters/ifMatch" }]
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: "#/components/schemas/DocumentBody" }
      responses:
        "200": { $ref: "#/components/responses/Document" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "412": { $ref: "#/components/responses/VersionMismatch" }
        "415": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [admin]
      summary: Admin data, delete a document
      description: |
        In a collection with `soft_delete` (collection.yaml) the document is
        marked deleted instead of removed: no read, write or batch sees it, and
        it can be restored (`POST …/restore`) or, with `purge=true`, removed for
        good under the `purge` rule.
      operationId: adminDeleteDocument
      security: [{ apiKey: [] }, { session: [] }]
      parameters:
        - { $ref: "#/components/parameters/ifMatch" }
        - name: purge
          in: query
          description: >-
            `true` removes the document for good, deleted or not, in a
            collection with `soft_delete`. Needs the `purge` rule.
          schema: { type: string, enum: ["true"] }
      responses:
        "204":
          description: Document deleted (or, in a collection with `soft_delete`, marked deleted).
          headers:
            Vary: { $ref: "#/components/headers/DataVary" }
            Cache-Control: { $ref: "#/components/headers/DataCacheControl" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "412": { $ref: "#/components/responses/VersionMismatch" }
        default: { $ref: "#/components/responses/Error" }
  /v1/{realm}/_admin/data/{database}/{collection}/{id}/restore:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/database" }
      - { $ref: "#/components/parameters/collection" }
      - { $ref: "#/components/parameters/id" }
    post:
      tags: [admin]
      summary: Admin data, restore a soft-deleted document
      description: |
        Brings a deleted document back, as it was, at the next version. Only in
        a collection with `soft_delete`, and only for callers the `restore`
        rule lets see the document. The document must be valid against the
        schema as it is now (`400` otherwise), and its unique values must still
        be free (`409` otherwise).
      operationId: adminRestoreDocument
      security: [{ apiKey: [] }, { session: [] }]
      parameters: [{ $ref: "#/components/parameters/ifMatch" }]
      responses:
        "200": { $ref: "#/components/responses/Document" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "412": { $ref: "#/components/responses/VersionMismatch" }
        default: { $ref: "#/components/responses/Error" }
  /v1/{realm}/_admin/data/{database}/{collection}/_files/{field}/uploads:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/database" }
      - { $ref: "#/components/parameters/collection" }
      - { $ref: "#/components/parameters/fileField" }
    post:
      tags: [admin]
      summary: Upload a file before its document exists
      description: |
        Stores the request body (the file's bytes, with its `Content-Type`) as a
        **pending upload** for this field and answers an `upload_id` and a secret
        `upload_token` (only its hash is kept). Naming them in the field of a later
        create, `PUT` or `PATCH`, `{"upload": "<id>", "token": "<token>"}`, writes the
        document with the file's details in the same write, under the `create` or
        `update` rule applied to the final document; so a required file field works.
        The upload is used once, by whoever holds the token (and, when a signed-in
        user made it, only by that user), and expires after `pending_ttl` of the
        realm's `storage:`; an unused one is deleted by the workers.

        Who may upload: a signed-in user needs the collection to have a `create`
        rule; an anonymous caller needs it to admit a document holding just this
        file. The same limits as any upload apply (`max_size`, `types`,
        `BACKD_MAX_UPLOAD_BYTES`), and a caller holds at most 20 unused uploads
        and starts a limited number per window (`429`).

        On a field with `upload: direct` the body is not the file but its declaration,
        `{"name", "size", "type", "sha256"}` as in `POST …/{id}/_files/{field}/uploads`,
        and the answer carries the signed link to send the file to; `…/uploads/{upload_id}/complete`
        then verifies it and makes the upload ready to be named in a write. Admin route: past the collection's rules.
        A JPEG or PNG is stored without its metadata unless the field sets
        `keep_metadata: true`; a picture too damaged to be copied that way is `422 invalid_image`.
      operationId: adminStartFileUpload
      security: [{ apiKey: [] }, { session: [] }]
      parameters:
        - name: name
          in: query
          description: The file's name; defaults to the `Content-Disposition` filename, then `file`.
          schema: { type: string }
      requestBody:
        required: true
        content:
          "*/*":
            schema: { type: string, format: binary }
      responses:
        "201":
          description: The pending upload (for a direct field, with the link to send the file to).
          headers:
            Cache-Control: { schema: { const: no-store } }
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/PendingUpload" }
                  - { $ref: "#/components/schemas/DirectUpload" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/data/{database}/{collection}/{id}/_files/{field}/uploads:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/database" }
      - { $ref: "#/components/parameters/collection" }
      - { $ref: "#/components/parameters/id" }
      - { $ref: "#/components/parameters/fileField" }
    post:
      tags: [admin]
      summary: Start a direct upload to a document
      description: |
        For a field with `upload: direct` (a proxy field answers `409 upload_mode_mismatch`).
        The body declares the file: `name`, `size`, `type` and `sha256` are all required
        and `size` can't exceed the field's `max_size`. The `update` rule is asked, as
        for any upload, about the document with the declared file in it, before anything
        is signed; `max_files` and `If-Match` are checked too.

        The answer is a signed `PUT` link to the bucket, with the headers to send (the
        content type and `x-amz-checksum-sha256` are signed in, and so is the length: the
        storage refuses a body that differs), an `upload_id` and a secret `upload_token`.
        After the `PUT`, `POST …/_files/{field}/uploads/{upload_id}/complete` with the
        token verifies the file and attaches it. The bucket needs CORS for the app's
        origins (`backd storage check` looks). Admin route: past the collection's rules.

        Above the storage's single-`PUT` limit (5 GiB, `multipart_above` in the field's
        info) the file is sent in parts: instead of `sha256` the body carries
        `part_sha256`, the SHA-256 of each consecutive part of `part_size` bytes (the
        part size follows from the file's size: at least 64 MiB, a multiple of 16 MiB,
        at most 1000 parts; a body naming the wrong number of digests is `400` and says
        how many). The answer then has `multipart: true`, the `part_size` and a signed
        `PUT` link per part (`parts`, each with its own headers) instead of `url`. The
        links last at least a day. Completing assembles the parts, and the file's
        `sha256` is not that of its bytes but the digest of the parts' digests
        (`sha256` of the reply, checked by the storage). Uploads left unfinished are
        aborted by the worker.
      operationId: adminStartDirectUpload
      security: [{ apiKey: [] }, { session: [] }]
      parameters: [{ $ref: "#/components/parameters/ifMatch" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DirectUploadStart" }
      responses:
        "201":
          description: The upload, started.
          headers:
            Cache-Control: { schema: { const: no-store } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DirectUpload" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "412": { $ref: "#/components/responses/VersionMismatch" }
        "415": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/data/{database}/{collection}/_files/{field}/uploads/{uploadID}/complete:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/database" }
      - { $ref: "#/components/parameters/collection" }
      - { $ref: "#/components/parameters/fileField" }
      - name: uploadID
        in: path
        required: true
        description: The `upload_id` of a started direct upload.
        schema: { type: string, pattern: '^fl_[0-9a-z]{20}$' }
    post:
      tags: [admin]
      summary: Complete a direct upload
      description: |
        Body `{"upload_token": "…"}`. Verifies what the client put in the bucket: one
        `HEAD` (the size, and the SHA-256 the storage computed, must be the declared
        ones; a missing checksum is a mismatch) and one range read of the first bytes,
        whatever the file's size, to detect its type. Any mismatch deletes the object:
        `422 upload_mismatch`, or `415 unsupported_file_type` when the content isn't a
        type of the field. Nothing uploaded yet is `409 file_not_uploaded`, and the
        completion can be tried again. A multipart upload lists its parts first (the
        sizes and digests must be the declared ones; parts still missing are `409
        file_not_uploaded` too), has the storage assemble them, and checks the composite
        checksum of the object against the declared parts. A JPEG or PNG sent in parts is
        refused (`422 invalid_image`) unless the field sets `keep_metadata: true`.

        An upload started for a document is then attached to it (`201` with the
        document, the update rule asked about the real details, `If-Match` accepted); a
        pending one becomes ready to be named in a write (`200`). A wrong, used or
        expired token, an upload of another field, or one another user started is
        `400`, without saying which. Admin route: past the collection's rules.
      operationId: adminCompleteDirectUpload
      security: [{ apiKey: [] }, { session: [] }]
      parameters: [{ $ref: "#/components/parameters/ifMatch" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [upload_token]
              properties:
                upload_token: { type: string }
      responses:
        "200":
          description: A pending upload, ready to be attached by a write.
          headers:
            Cache-Control: { schema: { const: no-store } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompletedUpload" }
        "201":
          description: The document, with the file attached.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Location: { schema: { type: string }, description: "The file's URL." }
            Vary: { $ref: "#/components/headers/DataVary" }
            Cache-Control: { $ref: "#/components/headers/DataCacheControl" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "412": { $ref: "#/components/responses/VersionMismatch" }
        "415": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/data/{database}/{collection}/{id}/_files/{field}:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/database" }
      - { $ref: "#/components/parameters/collection" }
      - { $ref: "#/components/parameters/id" }
      - { $ref: "#/components/parameters/fileField" }
    post:
      tags: [admin]
      summary: Upload a file into a file field, admin data
      description: |
        The request body is the file's bytes, with its `Content-Type`. On a field that
        holds one file the upload replaces it; on a `multiple` field it is appended
        (`409 too_many_files` at `max_files`, before any byte is read). The file's
        name comes from `?name=` or the `Content-Disposition` filename, and is
        sanitized, never refused. The type is detected from the content: a file that
        isn't of one of the field's `types` is `415 unsupported_file_type`, one over
        `max_size` is `413`. The `update` rule is asked first, with the document as it
        would be after the change. Every upload is a change: it bumps the version and
        accepts `If-Match`. The document is answered with the new file's details, and
        `Location` is the file's URL. A field set to `upload: direct` answers
        `409 upload_mode_mismatch`. Admin route: past the collection's rules.
        A JPEG or PNG is stored without its metadata (EXIF with the GPS position, XMP,
        comments, PNG text and time), its pixels untouched and its orientation kept, unless
        the field sets `keep_metadata: true`; the file's `size` and `sha256` describe what
        is stored. A picture too damaged to be copied that way is `422 invalid_image`.
      operationId: adminUploadFile
      security: [{ apiKey: [] }, { session: [] }]
      parameters:
        - { $ref: "#/components/parameters/ifMatch" }
        - name: name
          in: query
          description: The file's name; defaults to the `Content-Disposition` filename, then `file`.
          schema: { type: string }
      requestBody:
        required: true
        content:
          "*/*":
            schema: { type: string, format: binary }
      responses:
        "201":
          description: The document, with the file attached.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Location: { schema: { type: string }, description: "The file's URL." }
            Vary: { $ref: "#/components/headers/DataVary" }
            Cache-Control: { $ref: "#/components/headers/DataCacheControl" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Document" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "412": { $ref: "#/components/responses/VersionMismatch" }
        "422": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [admin]
      summary: Clear a file field, admin data
      description: |
        Removes every file of the field. The `update` rule is asked about the result;
        the objects are deleted afterwards by the workers. Admin route: past the collection's rules.
      operationId: adminClearFiles
      security: [{ apiKey: [] }, { session: [] }]
      parameters: [{ $ref: "#/components/parameters/ifMatch" }]
      responses:
        "200": { $ref: "#/components/responses/Document" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "412": { $ref: "#/components/responses/VersionMismatch" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/data/{database}/{collection}/{id}/_files/{field}/{fileID}:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/database" }
      - { $ref: "#/components/parameters/collection" }
      - { $ref: "#/components/parameters/id" }
      - { $ref: "#/components/parameters/fileField" }
      - { $ref: "#/components/parameters/fileId" }
    get:
      tags: [admin]
      summary: Download a file, admin data
      description: |
        The `read` rule decides (a document the caller can't read is `404`). In
        `download: presigned` mode (the default) the answer is a `302` to a short-lived
        signed link of the storage, forcing a download; `?link=json` answers
        `{url, expires_at}` instead. In `download: proxy` mode backd streams the
        bytes: with `nosniff` and a sandbox CSP, one `Range` (`206`, `416`), a strong
        `ETag` from the file's sha256 (`If-None-Match` → `304`, `If-Range`), and
        public caching only for a document anyone may read. A signed backd link
        (`?exp=&sig=`, from `?link=json` or `?file_links=true`) is its own credential
        for this file until it expires (`403 invalid_file_link` otherwise).
        `404 file_missing` when the object is gone from storage. Admin route: past the collection's rules.
      operationId: adminDownloadFile
      security: [{}, { session: [] }, { apiKey: [] }]
      parameters:
        - name: link
          in: query
          description: "`json` answers the link instead of redirecting to it."
          schema: { type: string, enum: [json] }
        - name: exp
          in: query
          description: A backd link's expiry (Unix seconds).
          schema: { type: string }
        - name: sig
          in: query
          description: A backd link's signature.
          schema: { type: string }
        - name: version
          in: query
          description: |
            Serve this made version of an image (`versions:` in collection.yaml) instead of
            the original, with the same rules, links, caching and ranges. A backd link made
            for a version is bound to it. `404 version_unavailable` (with the version's
            `status` and `reason` in `details`) when it isn't `ready` or isn't declared.
          schema: { type: string }
        - name: Range
          in: header
          schema: { type: string }
        - name: If-Range
          in: header
          schema: { type: string }
        - name: If-None-Match
          in: header
          schema: { type: string }
      responses:
        "200":
          description: The file's bytes (proxy mode), or the link (`?link=json`).
          headers:
            ETag: { schema: { type: string } }
            Accept-Ranges: { schema: { const: bytes } }
            Content-Disposition: { schema: { type: string } }
            X-Content-Type-Options: { schema: { const: nosniff } }
            Content-Security-Policy: { schema: { type: string } }
            Cache-Control: { schema: { type: string } }
          content:
            "*/*":
              schema: { type: string, format: binary }
            application/json:
              schema: { $ref: "#/components/schemas/FileLink" }
        "206":
          description: The requested range of the file.
          headers:
            Content-Range: { schema: { type: string } }
            ETag: { schema: { type: string } }
          content:
            "*/*":
              schema: { type: string, format: binary }
        "302":
          description: Redirect to the storage's signed link.
          headers:
            Location: { schema: { type: string } }
            Cache-Control: { schema: { const: "private, no-store" } }
        "304": { description: The caller's copy is current. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "416":
          description: The range is outside the file.
          headers:
            Content-Range: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      tags: [admin]
      summary: Remove one file, admin data
      description: |
        Takes the file out of the document (a new version, `If-Match` accepted) and
        queues the object for deletion. Admin route: past the collection's rules.
      operationId: adminDeleteFile
      security: [{ apiKey: [] }, { session: [] }]
      parameters: [{ $ref: "#/components/parameters/ifMatch" }]
      responses:
        "200": { $ref: "#/components/responses/Document" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "412": { $ref: "#/components/responses/VersionMismatch" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/_admin/data/{database}/_batch:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/database" }
    post:
      tags: [admin]
      summary: Admin data, write several documents atomically
      description: |
        Creates, replaces, patches and deletes documents across the
        database's collections in one MongoDB transaction: either every
        operation applies, or none does. Each operation is validated
        against its collection's schema.json and, for callers whose
        access rules apply (not API keys or admin functions), checked
        against the create/update/delete rule exactly like a single
        write. The first operation that fails aborts the whole batch;
        its index is in the error's `details` (e.g. `{"path": "1", ...}`).
      operationId: adminBatchWrite
      security: [{ apiKey: [] }, { session: [] }]
      parameters:
        - $ref: "#/components/parameters/idempotencyKeyDocuments"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BatchRequest" }
      responses:
        "200":
          description: One result per operation, in the same order (the remembered ones again for a replayed `Idempotency-Key`).
          headers:
            Cache-Control: { $ref: "#/components/headers/NoStore" }
            Idempotent-Replayed: { description: "`true` when this is the remembered answer of an earlier request with the same `Idempotency-Key`.", schema: { const: "true" } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BatchResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "412": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        default: { $ref: "#/components/responses/Error" }

  /v1/{realm}/{database}/{collection}/{id}/_files/{field}/{fileID}/versions/{version}:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/database" }
      - { $ref: "#/components/parameters/collection" }
      - { $ref: "#/components/parameters/id" }
      - { $ref: "#/components/parameters/fileField" }
      - { $ref: "#/components/parameters/fileId" }
      - name: version
        in: path
        required: true
        description: The name of a version the field declares (`versions:` in collection.yaml).
        schema: { type: string }
    post:
      tags: [documents]
      summary: Make a version of an image again, or with other parameters
      description: |
        For functions (and anything else allowed to update the document): an empty body
        makes the version again with the parameters the field declares; a JSON object of
        parameters (`max_width`, `max_height`, `fit`, `quality`, `format`, `upscale`, checked
        like `collection.yaml`'s) generates it with those instead, which only a `writable`
        version allows (`403 version_not_writable`). The request waits for a worker to make
        it (up to five minutes: `504 version_timeout` when no worker did) and answers the
        version's new details, as in the document. The `update` rule is asked with the
        document as it is; an API key skips it. The document's version does not change.
        When the version can't be made the answer is `422` with the reason as its code:
        `not_an_image`, `unsupported_format`, `too_large`, `decode_error`, `timeout`.
      operationId: MakeVersion
      security: [{ session: [] }, { apiKey: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                max_width: { type: integer, minimum: 1, maximum: 16384 }
                max_height: { type: integer, minimum: 1, maximum: 16384 }
                fit: { type: string, enum: [contain, cover, stretch] }
                quality: { type: integer, minimum: 1, maximum: 100 }
                format: { type: string, enum: [jpeg, png] }
                upscale: { type: boolean }
      responses:
        "200":
          description: The version's details.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VersionState" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    delete:
      tags: [documents]
      summary: Delete a made version
      description: |
        Drops the made copy and sends the version back to what a new file's is: `pending`
        (a worker makes it again) when it has parameters, `empty` when only functions make
        it. Needs the same access as making it. The document's version does not change.
      operationId: DeleteVersion
      security: [{ session: [] }, { apiKey: [] }]
      responses:
        "200":
          description: The version's new state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VersionState" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/{realm}/_admin/data/{database}/{collection}/{id}/_files/{field}/{fileID}/versions/{version}:
    parameters:
      - { $ref: "#/components/parameters/realm" }
      - { $ref: "#/components/parameters/database" }
      - { $ref: "#/components/parameters/collection" }
      - { $ref: "#/components/parameters/id" }
      - { $ref: "#/components/parameters/fileField" }
      - { $ref: "#/components/parameters/fileId" }
      - name: version
        in: path
        required: true
        description: The name of a version the field declares (`versions:` in collection.yaml).
        schema: { type: string }
    post:
      tags: [admin]
      summary: Make a version of an image again, or with other parameters
      description: |
        For functions (and anything else allowed to update the document): an empty body
        makes the version again with the parameters the field declares; a JSON object of
        parameters (`max_width`, `max_height`, `fit`, `quality`, `format`, `upscale`, checked
        like `collection.yaml`'s) generates it with those instead, which only a `writable`
        version allows (`403 version_not_writable`). The request waits for a worker to make
        it (up to five minutes: `504 version_timeout` when no worker did) and answers the
        version's new details, as in the document. The `update` rule is asked with the
        document as it is; an API key skips it. The document's version does not change.
        When the version can't be made the answer is `422` with the reason as its code:
        `not_an_image`, `unsupported_format`, `too_large`, `decode_error`, `timeout`.
      operationId: adminMakeVersion
      security: [{ apiKey: [] }, { session: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                max_width: { type: integer, minimum: 1, maximum: 16384 }
                max_height: { type: integer, minimum: 1, maximum: 16384 }
                fit: { type: string, enum: [contain, cover, stretch] }
                quality: { type: integer, minimum: 1, maximum: 100 }
                format: { type: string, enum: [jpeg, png] }
                upscale: { type: boolean }
      responses:
        "200":
          description: The version's details.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VersionState" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    delete:
      tags: [admin]
      summary: Delete a made version
      description: |
        Drops the made copy and sends the version back to what a new file's is: `pending`
        (a worker makes it again) when it has parameters, `empty` when only functions make
        it. Needs the same access as making it. The document's version does not change.
      operationId: adminDeleteVersion
      security: [{ apiKey: [] }, { session: [] }]
      responses:
        "200":
          description: The version's new state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VersionState" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    session:
      type: http
      scheme: bearer
      description: A session token (`bds_…`) from signup or login.
    apiKey:
      type: http
      scheme: bearer
      description: >-
        An API key (`bdk_…`). Full access to the realm's data; the admin API
        (`/_admin`) needs a key with the `admin` role (a `data` key gets 403).
        Never use it in browsers.

  parameters:
    realm:
      name: realm
      in: path
      required: true
      schema: { type: string }
    database:
      name: database
      in: path
      required: true
      schema: { type: string }
    collection:
      name: collection
      in: path
      required: true
      schema: { type: string }
    function:
      name: function
      in: path
      required: true
      schema: { type: string }
    id:
      name: id
      in: path
      required: true
      schema: { type: string }
    limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    skip:
      name: skip
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    idempotencyKeyDocuments:
      name: Idempotency-Key
      in: header
      description: >-
        Makes a retried create safe: 1-200 characters of letters, digits, `.`, `_`, `:` or `-`. The first request
        with a key runs and its answer is remembered for 24 hours (only if it succeeds); the same key with the
        same body returns that answer again, with `Idempotent-Replayed: true`; with another body it answers
        `422 idempotency_key_reused`; while the first is still running, `409 request_in_progress`. Needs a signed-in
        user or an API key (`400` for anonymous callers) and a realm with authentication enabled.
      schema: { type: string }
    ifMatch:
      name: If-Match
      in: header
      description: '`"<version>"`, a list of them, or `*`. The write fails with 412 unless the current version matches.'
      schema: { type: string }
    deleted:
      name: deleted
      in: query
      description: >-
        In a collection with `soft_delete`, `only` returns the deleted documents
        (the trash) and `include` both. It needs the `restore` rule, besides the
        `read` rule. Anything else is `400`, and so is any value on a collection
        that doesn't soft-delete.
      schema: { type: string, enum: [only, include] }

    fileLinks:
      name: file_links
      in: query
      description: >-
        `true` adds `url` and `expires_at` to every file of the documents read: a
        link for apps to show or download it. Never stored, and not part of the ETag.
      schema: { type: string, enum: ["true"] }
    fileField:
      name: field
      in: path
      required: true
      description: The name of a file field, as declared under `files:` in collection.yaml.
      schema: { type: string }
    fileId:
      name: fileID
      in: path
      required: true
      description: The file's id (`fl_…`), from the document's file field.
      schema: { type: string, pattern: '^fl_[0-9a-z]{20}$' }

  headers:
    ETag:
      required: true
      description: '`"<version>"`, the document''s `_meta.version`.'
      schema: { type: string, pattern: '^"[0-9]+"$' }
    NoStore:
      required: true
      schema: { const: no-store }
    DataVary:
      required: true
      description: >-
        Document responses depend on the caller and the origin, so caches
        must key them on both (and on the session cookie, in realms that use one).
      schema: { type: string, pattern: "Origin.*Authorization" }
    DataCacheControl:
      description: >-
        Sent when the request carries credentials: shared caches must not
        store the response, and browsers must revalidate it.
      schema: { const: "private, no-cache" }
    RetryAfter:
      required: true
      description: Seconds to wait before retrying.
      schema: { type: string, pattern: '^[0-9]+$' }
    WWWAuthenticate:
      required: true
      schema: { type: string, pattern: '^Bearer realm="' }
    RequestID:
      required: true
      description: The request ID, echoed from the request or generated; also in the error body as `request_id`.
      schema: { type: string, minLength: 1 }
    DevDurationMs:
      description: >-
        The function's time inside the executor, in milliseconds. Only when
        the server runs with `BACKD_DEV=true` (never in production); read by
        `backd functions invoke`.
      schema: { type: string, pattern: '^[0-9]+$' }
    DevLogs:
      description: >-
        The function's console output as a JSON array of `{level, line}`,
        secrets masked. Only when the server runs with `BACKD_DEV=true`
        (never in production); read by `backd functions invoke`.
      schema: { type: string }

  responses:
    Error:
      description: An error.
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestID" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthenticated:
      description: Missing, invalid, expired or revoked credentials.
      headers:
        WWW-Authenticate: { $ref: "#/components/headers/WWWAuthenticate" }
        X-Request-ID: { $ref: "#/components/headers/RequestID" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: Too many failed attempts.
      headers:
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
        X-Request-ID: { $ref: "#/components/headers/RequestID" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    VersionMismatch:
      description: If-Match doesn't match the current version.
      headers:
        X-Request-ID: { $ref: "#/components/headers/RequestID" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    HostedPage:
      description: A page of the realm's `pages/` folder, with no external resources.
      headers:
        Cache-Control: { $ref: "#/components/headers/NoStore" }
        Referrer-Policy: { description: Always `no-referrer`., schema: { type: string } }
        Content-Security-Policy: { description: A strict policy with `frame-ancestors 'none'`., schema: { type: string } }
      content:
        text/html:
          schema: { type: string }
    Session:
      description: A new session.
      headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Session" }
    SessionCreated:
      description: The new user, signed in.
      headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Session" }
    AdminUser:
      description: The user.
      headers: { Cache-Control: { $ref: "#/components/headers/NoStore" } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AdminUser" }
    Document:
      description: The document.
      headers:
        ETag: { $ref: "#/components/headers/ETag" }
        Vary: { $ref: "#/components/headers/DataVary" }
        Cache-Control: { $ref: "#/components/headers/DataCacheControl" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Document" }

  schemas:
    Timestamp:
      type: string
      format: date-time
      description: RFC3339 in UTC with millisecond precision.

    Status:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [ok, ready] }
        config:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: "Readiness only: the fingerprint of the config this instance runs (`backd config fingerprint`), to check that every instance runs the same one."

    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, request_id]
          properties:
            code:
              type: string
              pattern: "^[a-z][a-z0-9_]{0,63}$"
              description: |
                backd's codes: invalid_json, validation_error, invalid_query,
                invalid_header, unauthenticated, invalid_credentials, forbidden,
                not_found, method_not_allowed, conflict, email_taken,
                write_conflict, version_mismatch, payload_too_large,
                unsupported_media_type, too_many_requests, internal_error,
                unavailable; for function calls also function_failed,
                function_timeout, invalid_output, secret_missing,
                idempotency_key_required, idempotency_key_reused and
                request_in_progress. A function's own errors (`ctx.error`)
                carry the code it chose.
            message: { type: string }
            details:
              type: array
              minItems: 1
              items:
                type: object
                additionalProperties: false
                required: [path, reason]
                properties:
                  path: { type: string }
                  reason: { type: string }
            request_id: { type: string, minLength: 1 }

    User:
      type: object
      additionalProperties: false
      required: [id, email, email_verified, roles, locale, created_at]
      properties:
        id: { type: string }
        email: { type: string }
        email_verified: { type: boolean }
        roles: { type: array, items: { type: string } }
        locale: { type: string, description: "The user's language: one the realm lists (`email.locales`; English only without email). Used for the emails they get." }
        created_at: { $ref: "#/components/schemas/Timestamp" }

    AdminUser:
      type: object
      additionalProperties: false
      required: [id, email, email_verified, roles, locale, disabled, admin_networks, login_networks, created_at, updated_at, erased_at]
      properties:
        erased_at: { oneOf: [{ $ref: "#/components/schemas/Timestamp" }, { type: "null" }], description: "When the user was erased; a tombstone has no email of its own, no roles and can't be enabled." }
        id: { type: string }
        email: { type: string }
        email_verified: { type: boolean }
        roles: { type: array, items: { type: string } }
        locale: { type: string, description: "The user's language: one the realm lists (`email.locales`; English only without email). Used for the emails they get." }
        disabled: { type: boolean }
        admin_networks:
          description: CIDR networks this user's admin API requests must come from; empty means no restriction of their own.
          type: array
          items: { type: string }
        login_networks:
          description: CIDR networks this user's login and session must be used from; empty means anywhere.
          type: array
          items: { type: string }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }

    APIKey:
      type: object
      additionalProperties: false
      required: [name, role, prefix, networks, scopes, created_at, last_used_at, expires_at]
      properties:
        name: { type: string }
        role: { enum: [data, admin] }
        prefix: { type: string, description: "The first characters of the key, to recognize it.", pattern: "^bdk_" }
        networks: { type: array, items: { type: string }, description: "Where the key may be used from; empty means anywhere." }
        scopes: { type: array, items: { type: string }, description: "What the key reaches (see the create request); empty means everything." }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        last_used_at: { oneOf: [{ $ref: "#/components/schemas/Timestamp" }, { type: "null" }] }
        expires_at: { oneOf: [{ $ref: "#/components/schemas/Timestamp" }, { type: "null" }] }

    APIKeyCreated:
      description: An API key as listed, plus the key itself, shown only here.
      type: object
      additionalProperties: false
      required: [name, role, prefix, networks, scopes, created_at, last_used_at, expires_at, key]
      properties:
        name: { type: string }
        role: { enum: [data, admin] }
        prefix: { type: string, pattern: "^bdk_" }
        networks: { type: array, items: { type: string } }
        scopes: { type: array, items: { type: string } }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        last_used_at: { oneOf: [{ $ref: "#/components/schemas/Timestamp" }, { type: "null" }] }
        expires_at: { oneOf: [{ $ref: "#/components/schemas/Timestamp" }, { type: "null" }] }
        key: { type: string, pattern: "^bdk_" }

    Secret:
      description: A secret's metadata, as listed — never its value.
      type: object
      additionalProperties: false
      required: [database, name, created_at, updated_at, updated_by]
      properties:
        database: { type: string, description: "Its database scope; empty means the realm scope." }
        name: { type: string }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
        updated_by: { type: string, description: "Who last set it, e.g. `user:<id>` or `key:<name>`." }

    AuditRecord:
      description: |
        One entry of the audit trail. Users are named by id, keys by name, invitations by id.
        Records never hold passwords or hashes, tokens, keys, emails or request bodies.
      type: object
      additionalProperties: false
      required: [id, at, action, actor, target, details, request_id, client_ip]
      properties:
        id: { type: string }
        at: { $ref: "#/components/schemas/Timestamp" }
        action:
          type: string
          description: "For example `user.create`, `role.add`, `apikey.create`, `admin.login`, `admin.refused`."
          examples: [role.add]
        actor: { type: string, description: "`user:<id>`, `key:<name>`, `anonymous`, `config:realm.yaml` or `cli:bootstrap`." }
        target: { type: [string, "null"], description: "`user:<id>`, `key:<name>`, `invitation:<id>`, or null." }
        details: { type: object, description: "Non-secret facts about the action, such as the role assigned." }
        request_id: { type: [string, "null"] }
        client_ip: { type: [string, "null"], description: "The client's address, following TRUSTED_PROXIES." }

    InvocationRecord:
      description: |
        One function call. Never its input or output — only what
        happened and its own console log lines (roadmap F10).
      type: object
      additionalProperties: false
      required: [id, at, function, actor, mode, status, duration_ms, request_id, job_id, parent_id, origin, logs, steps, steps_omitted]
      properties:
        id: { type: string }
        at: { $ref: "#/components/schemas/Timestamp" }
        function: { type: string, description: "`<database>/<name>`." }
        actor: { type: string, description: "`user:<id>`, `key:<name>`, `anonymous`, or `func:<name> as ...` for an admin function calling back." }
        mode: { type: string, description: "`sync` or `async`; `webhook` planned." }
        status:
          type: string
          description: "`ok`, `function_error`, `timeout`, `memory`, `cpu`, `crash`, `output_too_large`, `busy`, `bundle` or `cancelled` (the job was cancelled while the attempt ran)."
          examples: [ok]
        code: { type: [string, "null"], description: "The function's own error code, when status is `function_error`." }
        duration_ms: { type: integer }
        request_id: { type: [string, "null"] }
        job_id: { type: [string, "null"], description: "The async job this call ran for (roadmap F11); null for sync calls." }
        parent_id: { type: [string, "null"], description: "The invocation that called this one with `ctx.call`; null otherwise." }
        origin: { type: [string, "null"], description: "What started the call: `http`, `function` (`ctx.call`), `cron`, `admin`, `on_complete:<database>/<name>` (the notification of that function's job ending), or `backd:<event>`. Null for records made before origins were recorded." }
        logs:
          type: array
          description: "The function's captured console output, already masked of any declared secrets."
          items:
            type: object
            additionalProperties: false
            required: [level, line]
            properties:
              level: { type: string }
              line: { type: string }
        steps:
          type: array
          description: "What the call reported with `ctx.step()`, closed when it ended; at most 100 (the first 50 and the latest 50)."
          items: { $ref: "#/components/schemas/Step" }
        steps_omitted: { type: integer, description: "How many steps were left out of the middle when there were more than 100." }

    ConfigCheck:
      type: object
      additionalProperties: false
      required: [ok, realm, checked, changed, problems]
      properties:
        ok: { type: boolean }
        realm: { type: string }
        checked: { type: integer, description: "How many files of the realm were loaded and validated, drafts included." }
        changed: { type: array, items: { type: string }, description: "The draft files, sorted." }
        problems:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [message]
            properties:
              file: { type: string, description: "The file the message is about, relative to the realm, when it names one." }
              message: { type: string }

    StorageCheck:
      type: object
      additionalProperties: false
      required: [ok, provider, endpoint, public_endpoint, bucket, prefix, steps, checksum_sha256, encryption, cors, link_host]
      properties:
        ok: { type: boolean, description: "False when a step failed." }
        provider: { type: string, enum: [aws, minio, r2, digitalocean] }
        endpoint: { type: string, description: What backd connects to. }
        public_endpoint: { type: [string, "null"], description: "The address signed links use, when it differs (never connected to)." }
        bucket: { type: string }
        prefix: { type: string }
        steps:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, level, detail]
            properties:
              name: { type: string, description: "`bucket`, `write`, `head`, `read`, `range`, `list`, `checksum`, `stored checksum`, `download link`, `upload link`, `cors` or `encryption`." }
              level: { type: string, enum: [ok, warn, fail, skipped] }
              detail: { type: string }
        checksum_sha256: { type: string, enum: [verified, ignored, not tested], description: "What the storage does with a signed `x-amz-checksum-sha256`: `verified` rejects content that differs." }
        encryption: { type: string, description: "The bucket's default encryption algorithm, `none`, or `unknown` when the provider doesn't expose it." }
        cors:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [origins, methods, headers]
            properties:
              origins: { type: array, items: { type: string } }
              methods: { type: array, items: { type: string } }
              headers: { type: array, items: { type: string } }
        link_host: { type: string, description: The host a signed link is for. }

    CheckReportSummary:
      description: What a schema check found in one collection, without the documents.
      type: object
      additionalProperties: false
      required: [database, collection, job_id, started_at, finished_at, scanned, invalid, complete, stopped_by, limit, schema_hash]
      properties:
        database: { type: string }
        collection: { type: string }
        job_id: { type: string, description: The check job that made it. }
        started_at: { $ref: "#/components/schemas/Timestamp" }
        finished_at: { $ref: "#/components/schemas/Timestamp" }
        scanned: { type: integer, format: int64, description: How many documents it read. }
        invalid: { type: integer, format: int64, description: How many did not match the schema (up to `limit`). }
        complete: { type: boolean, description: "False when the scan stopped before the end." }
        stopped_by: { type: [string, "null"], enum: [limit, time, null], description: "Why it stopped early: `limit` (it found `limit` invalid documents) or `time` (the 6-hour limit of an attempt)." }
        limit: { type: integer }
        schema_hash: { type: string, description: Identifies the schema the documents were checked against. }

    CheckReport:
      description: A collection's latest schema check report, with the invalid documents.
      type: object
      additionalProperties: false
      required: [database, collection, job_id, started_at, finished_at, scanned, invalid, complete, stopped_by, limit, schema_hash, documents]
      properties:
        database: { type: string }
        collection: { type: string }
        job_id: { type: string, description: The check job that made it. }
        started_at: { $ref: "#/components/schemas/Timestamp" }
        finished_at: { $ref: "#/components/schemas/Timestamp" }
        scanned: { type: integer, format: int64, description: How many documents it read. }
        invalid: { type: integer, format: int64, description: How many did not match the schema (up to `limit`). }
        complete: { type: boolean, description: "False when the scan stopped before the end." }
        stopped_by: { type: [string, "null"], enum: [limit, time, null], description: "Why it stopped early: `limit` (it found `limit` invalid documents) or `time` (the 6-hour limit of an attempt)." }
        limit: { type: integer }
        schema_hash: { type: string, description: Identifies the schema the documents were checked against. }
        documents:
          type: array
          description: The documents that failed, in id order, up to `limit`.
          items:
            type: object
            additionalProperties: false
            required: [id, deleted, problems, more_problems]
            properties:
              id: { type: string }
              deleted: { type: boolean, description: "True for a soft-deleted document (in the trash)." }
              problems:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [path, reason]
                  properties:
                    path: { type: string, description: "A JSON path, dots between names (`items.2.price`); empty for the document itself. A name can come from the document." }
                    reason: { type: string, description: "The rule that failed (`is required`, `got string, want number`...), never the value." }
              more_problems: { type: integer, description: How many more problems were left out past 5. }

    Step:
      description: |
        One step a function reported with `ctx.step()`, and how far it got with
        `ctx.progress()`. A new step closes the previous one; when an attempt
        ends, the step still running is closed as `done`, `failed`, `timed_out`
        or `cancelled`.
      type: object
      additionalProperties: false
      required: [n, name, status, started_at, ended_at, duration_ms, current, total, message, updated_at]
      properties:
        n: { type: integer, description: "1 for the first step the attempt started; counts steps left out too." }
        name: { type: string }
        status: { type: string, enum: [running, done, failed, timed_out, cancelled] }
        started_at: { $ref: "#/components/schemas/Timestamp" }
        ended_at: { oneOf: [{ $ref: "#/components/schemas/Timestamp" }, { type: "null" }], description: "Null while running." }
        duration_ms: { type: [integer, "null"], description: "Null while running." }
        current: { type: number, description: "How far the step got (`ctx.progress`)." }
        total: { type: [number, "null"], description: "How much there is to do, when the function said (`ctx.step`'s `total`)." }
        message: { type: [string, "null"] }
        updated_at: { $ref: "#/components/schemas/Timestamp" }

    Schedule:
      type: object
      required: [function, schedule, timezone, overlap, paused, changed_at, changed_by]
      properties:
        function: { type: string, description: "`<database>/<name>`." }
        schedule: { type: string, description: The cron expression. }
        timezone: { type: string, description: "The IANA time zone it is read in (`UTC` by default)." }
        overlap: { type: string, enum: [allow, skip] }
        paused: { type: boolean }
        changed_at: { type: [string, "null"], format: date-time, description: When it was last paused or resumed; null if never. }
        changed_by: { type: [string, "null"], description: "The actor that did (`key:<name>` or `user:<id>`); null if never." }

    JobSummary:
      description: |
        A job as the admin listing shows it (roadmap F19): state and outcome,
        never the input or the output.
      type: object
      additionalProperties: false
      required: [id, function, status, scheduled, origin, email_kind, rerun_of, attempts, next_attempt_at, created_at, completed_at, result, progress]
      properties:
        origin: { type: string, description: "Where the job came from: `http`, `function` (a `ctx.call`), `cron`, `admin`, `on_complete:<database>/<name>` (the notification a function's `on_complete` queues when its job ends), `backd:email.<kind>` (an email backd sends itself), `backd:schema.check` (a schema check) or `function:<database>/<name>` (an email that function sent with `ctx.email.send`)." }
        email_kind: { type: [string, "null"], description: "The kind of an email job (never its recipients or text); null for other jobs." }
        rerun_of: { type: [string, "null"], description: "The finished job an administrator re-ran to make this one; null otherwise." }
        steps:
          type: array
          description: "Only in the job's own detail (GET /jobs/{id}): what the running or last attempt reported, the last entry being the current step; at most 100."
          items: { $ref: "#/components/schemas/Step" }
        collections: { type: array, items: { type: string }, description: "Only in `running` of the schema checks listing: the `<database>/<collection>` the check reads." }
        limit: { type: integer, description: "Only there too: how many invalid documents it lists per collection." }
        steps_omitted: { type: integer, description: "Only in the detail: how many steps were left out of the middle when there were more than 100." }
        progress:
          description: "The current (latest) step of the running or last attempt, or null when the function reported none. The job's detail has every step."
          oneOf:
            - type: "null"
            - type: object
              additionalProperties: false
              required: [step, name, status, current, total, message, updated_at]
              properties:
                step: { type: integer }
                name: { type: string }
                status: { type: string, enum: [running, done, failed, timed_out, cancelled] }
                current: { type: number }
                total: { type: [number, "null"] }
                message: { type: [string, "null"] }
                updated_at: { $ref: "#/components/schemas/Timestamp" }
        id: { type: string, description: "For cron runs, `cron_<database>_<function>_<yyyymmddhhmm>` (UTC)." }
        function: { type: string, description: "`<database>/<name>`." }
        status: { type: string, description: "`queued`, `running` or `done`." }
        scheduled: { type: boolean, description: "True for a cron run." }
        attempts: { type: integer, description: "How many times a worker started it (more than 1 after a lost worker or a retry)." }
        next_attempt_at: { type: [string, "null"], format: date-time, description: "When a failed attempt will be retried (the function's `retry` policy); null otherwise." }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        completed_at: { oneOf: [{ $ref: "#/components/schemas/Timestamp" }, { type: "null" }] }
        result:
          description: "Null until `status` is `done`."
          oneOf:
            - type: "null"
            - type: object
              additionalProperties: false
              required: [status, code, duration_ms]
              properties:
                status: { type: string, description: "`ok`, `function_error`, `timeout`, `output_too_large`, `error`, `cancelled` (an administrator cancelled the job) or `skipped` (a scheduled run that did not happen because the previous one had not finished)." }
                code: { type: [string, "null"], description: "The error code, when the job did not end `ok`." }
                duration_ms: { type: integer }
    Job:
      description: |
        An async function call (roadmap F11): its status, and once
        `status` is `done`, its result. Never its input.
      type: object
      additionalProperties: false
      required: [id, function, status, created_at, attempts, next_attempt_at, result, steps, steps_omitted]
      properties:
        id: { type: string }
        function: { type: string, description: "`<database>/<name>`." }
        steps:
          type: array
          description: "What the running (or last) attempt reported, the last entry being the current step; at most 100 (the first 50 and the latest 50). A new attempt starts with none."
          items: { $ref: "#/components/schemas/Step" }
        steps_omitted: { type: integer, description: "How many steps were left out of the middle when there were more than 100." }
        status: { type: string, description: "`queued`, `running` or `done`. A job waiting to be retried is `queued`, with `next_attempt_at` set." }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        attempts: { type: integer, description: "How many times a worker has started it." }
        next_attempt_at: { type: [string, "null"], format: date-time, description: "When a failed attempt will be retried (the function's `retry` policy); null otherwise." }
        result:
          description: "Null until `status` is `done`."
          type: [object, "null"]
          additionalProperties: false
          required: [status, duration_ms]
          properties:
            status:
              type: string
              description: "`ok`, `function_error`, `timeout`, `memory`, `cpu`, `crash`, `output_too_large`, `bundle` or `cancelled`."
            output: { description: "The function's output, when status is `ok`." }
            http_status:
              type: integer
              description: >-
                The status a `sync` call would have answered with for
                this same outcome; absent only when status is `ok`.
            code:
              type: string
              description: >-
                The function's own error code when status is
                `function_error`; one of backd's own (`function_timeout`,
                `invalid_output`, `function_failed`) otherwise. Absent
                only when status is `ok`.
            message: { type: string, description: "Absent only when status is `ok`." }
            details:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [path, reason]
                properties:
                  path: { type: string }
                  reason: { type: string }
            duration_ms: { type: integer }

    Session:
      type: object
      additionalProperties: false
      required: [session_id, expires_at, user]
      description: >-
        `token` and `token_type` are absent when the session went into a cookie
        (the request asked for `cookie: true`).
      properties:
        token: { type: string, pattern: "^bds_" }
        token_type: { const: Bearer }
        session_id: { type: string }
        expires_at: { $ref: "#/components/schemas/Timestamp" }
        user: { $ref: "#/components/schemas/User" }

    SessionInfo:
      type: object
      additionalProperties: false
      required: [id, created_at, last_used_at, expires_at, current]
      properties:
        id: { type: string }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        last_used_at: { $ref: "#/components/schemas/Timestamp" }
        expires_at: { $ref: "#/components/schemas/Timestamp" }
        current: { type: boolean }

    OwnedReport:
      type: object
      additionalProperties: false
      required: [user, collections, without_policy]
      properties:
        user:
          type: object
          additionalProperties: false
          required: [id, status]
          properties:
            id: { type: string }
            status: { type: string, enum: [active, deactivated, erased] }
        collections:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [database, collection, action, owned]
            properties:
              database: { type: string }
              collection: { type: string }
              action: { type: [string, "null"], enum: [delete, anonymize, null], description: "What happens to the documents the user owns; null keeps them (the policy only cleans up references)." }
              owned: { type: integer, description: "Documents whose `_meta.owner` is the user (0 without an action)." }
              remove: { type: array, items: { type: string }, description: "With `anonymize`: the fields removed." }
              replace: { type: array, items: { type: string }, description: "With `anonymize`: the fields set to a fixed value." }
              pull: { type: object, additionalProperties: { type: integer }, description: "Documents, per array field, that hold the user." }
              unset: { type: object, additionalProperties: { type: integer }, description: "Documents, per field, where it holds the user." }
        without_policy:
          type: array
          items: { type: string }
          description: "`<database>.<collection>` of the collections an erase leaves alone."

    Invitation:
      type: object
      additionalProperties: false
      required: [id, email, created_by, created_at, expires_at]
      properties:
        id: { type: string }
        email: { type: [string, "null"] }
        created_by: { type: string }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        expires_at: { $ref: "#/components/schemas/Timestamp" }

    InvitationCreated:
      type: object
      additionalProperties: false
      required: [id, email, created_by, created_at, expires_at]
      properties:
        id: { type: string }
        token: { type: string, pattern: "^bdi_", description: Only when the invitation wasn't emailed. }
        sent: { type: boolean, description: True when the invitation was emailed. }
        email: { type: [string, "null"] }
        created_by: { type: string }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        expires_at: { $ref: "#/components/schemas/Timestamp" }

    Meta:
      type: object
      additionalProperties: false
      required: [created_at, updated_at]
      description: |
        Server-owned. `version` is missing only on documents stored before
        versioning existed. The ownership fields exist in realms with
        `auth: enabled`, and not on documents stored before them.
      properties:
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
        version: { type: integer, minimum: 1 }
        owner: { type: [string, "null"] }
        created_by: { type: string }
        updated_by: { type: string }
        deleted_at:
          allOf: [{ $ref: "#/components/schemas/Timestamp" }]
          description: When a soft-deleted document was deleted. Only in the trash (`deleted=only|include`) of a collection with `soft_delete`.
        deleted_by: { type: string, description: "Who deleted it, e.g. `user:<id>` or `key:<name>`." }
        purge_at:
          allOf: [{ $ref: "#/components/schemas/Timestamp" }]
          description: When a soft-deleted document is removed for good (`soft_delete.retention`).

    Document:
      type: object
      required: [id, _meta]
      description: |
        A stored document. Other fields follow the collection's schema.json.
        A file field (`files:` in collection.yaml) holds backd's file details, an
        object `{id, name, size, type, sha256, uploaded_at}` (an array of them on a
        `multiple` field), which only uploads write. An image also has `width` and
        `height` (as a viewer sees it, with the EXIF orientation applied), and a field
        that declares `versions:` has `versions`: an object by version name whose value
        is `{status}` with `pending` (a worker will make it), `ready` (made; with `id`,
        `size`, `type`, `width`, `height`, `params`, `fingerprint` and `generated_at`),
        `empty` (only functions make it, none has yet), `skipped` (`reason`:
        `not_an_image` or `unsupported_format`) or `failed` (`reason`: `too_large` or
        `decode_error`). With `?file_links=true` each also carries `url` and `expires_at`.
      properties:
        id: { type: string }
        _meta: { $ref: "#/components/schemas/Meta" }
      additionalProperties: true

    PendingUpload:
      type: object
      additionalProperties: false
      required: [upload_id, upload_token, expires_at, file]
      properties:
        upload_id: { type: string, pattern: '^fl_[0-9a-z]{20}$' }
        upload_token: { type: string, description: "Secret, shown once. Only its hash is kept." }
        expires_at: { $ref: "#/components/schemas/Timestamp" }
        file:
          type: object
          additionalProperties: false
          required: [name, size, type, sha256]
          properties:
            name: { type: string }
            size: { type: integer, minimum: 0 }
            type: { type: string, description: Detected from the content. }
            sha256: { type: string, pattern: '^[0-9a-f]{64}$' }

    StorageStatus:
      type: object
      required: [configured]
      properties:
        configured: { type: boolean }
        provider: { type: string }
        endpoint: { type: string }
        public_endpoint: { type: [string, "null"] }
        region: { type: string }
        bucket: { type: string }
        prefix: { type: string }
        access_key: { type: string, description: "`secret:NAME`: the secret's name, never its value." }
        secret_key: { type: string }
        download: { type: string }
        presigned_ttl: { type: string }
        pending_ttl: { type: string }
        keys:
          type: object
          required: [ok]
          properties:
            ok: { type: boolean }
            error: { type: string }
        reachable:
          type: object
          required: [ok]
          properties:
            ok: { type: boolean }
            error: { type: string }
        usage:
          type: object
          required: [bytes, files, users]
          properties:
            bytes: { type: integer }
            files: { type: integer }
            users:
              type: array
              items:
                type: object
                required: [user_id, bytes, files]
                properties:
                  user_id: { type: string }
                  bytes: { type: integer }
                  files: { type: integer }
        deletions:
          type: object
          required: [queued, retrying, oldest]
          properties:
            queued: { type: integer }
            retrying: { type: integer }
            oldest: { oneOf: [{ $ref: "#/components/schemas/Timestamp" }, { type: "null" }] }
        quota:
          type: object
          required: [realm, user]
          description: "The limits usage is held to (`storage.quota` in realm.yaml), in bytes; null: none."
          properties:
            realm: { type: [integer, "null"] }
            user: { type: [integer, "null"] }
        stale_uploads: { type: integer }

    StorageReconcile:
      type: object
      additionalProperties: false
      required: [delete, scanned, referenced, skipped_recent, skipped_in_journal, ignored, orphans, orphan_bytes, deleted, failed]
      properties:
        delete: { type: boolean }
        scanned: { type: integer }
        referenced: { type: integer }
        skipped_recent: { type: integer }
        skipped_in_journal: { type: integer }
        ignored: { type: integer }
        orphans:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [key, database, collection, file_id, size, last_modified]
            properties:
              key: { type: string }
              database: { type: string }
              collection: { type: string }
              file_id: { type: string }
              size: { type: integer }
              last_modified: { $ref: "#/components/schemas/Timestamp" }
        orphan_bytes: { type: integer }
        deleted: { type: integer }
        failed: { type: array, items: { type: string } }

    FileFieldInfo:
      type: object
      additionalProperties: false
      required: [name, upload, download, multiple, max_files, max_size, types]
      properties:
        name: { type: string }
        upload: { type: string, enum: [proxy, direct] }
        download: { type: string, enum: [presigned, proxy] }
        multiple: { type: boolean }
        max_files: { type: integer, minimum: 1, description: "1 for a field that holds one file." }
        max_size: { type: integer, description: Bytes per file. }
        types: { type: array, items: { type: string }, description: "Allowed content types; empty allows any." }
        multipart_above: { type: integer, description: "Direct fields only, when the field can hold more: files above this many bytes are sent in parts." }

    DirectUploadStart:
      type: object
      additionalProperties: false
      required: [name, size, type]
      properties:
        name: { type: string }
        size: { type: integer, minimum: 1, description: "The file's size in bytes, at most the field's `max_size`." }
        type: { type: string, description: The file's content type; signed into the link. }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$', description: "The file's SHA-256: signed into the link and verified by the storage. Required, except for a file sent in parts." }
        part_sha256:
          type: array
          items: { type: string, pattern: '^[0-9a-f]{64}$' }
          description: "For a file above the field's `multipart_above`: the SHA-256 of each consecutive part (required there, refused below)."

    DirectUpload:
      type: object
      additionalProperties: false
      required: [upload_id, upload_token, expires_at, url_expires_at]
      properties:
        upload_id: { type: string, pattern: '^fl_[0-9a-z]{20}$' }
        upload_token: { type: string, description: "Secret, shown once. Only its hash is kept." }
        expires_at: { $ref: "#/components/schemas/Timestamp" }
        method: { const: PUT, description: Not in the reply to a multipart upload. }
        url: { type: string, description: The signed link to the bucket (a file sent in one piece). }
        headers:
          type: object
          additionalProperties: { type: string }
          description: "Headers the PUT must send, exactly (content type and checksum are signed in)."
        url_expires_at: { $ref: "#/components/schemas/Timestamp" }
        multipart: { const: true, description: The file is sent in parts. }
        part_size: { type: integer, description: "Bytes per part; the last one may be shorter." }
        sha256: { type: string, description: "A multipart upload: the digest the file will be recorded with (of the parts' digests)." }
        parts:
          type: array
          description: "A multipart upload: one signed PUT link per part."
          items:
            type: object
            additionalProperties: false
            required: [number, url, headers, size]
            properties:
              number: { type: integer, minimum: 1 }
              url: { type: string }
              headers: { type: object, additionalProperties: { type: string } }
              size: { type: integer }

    CompletedUpload:
      type: object
      additionalProperties: false
      required: [upload_id, file]
      properties:
        upload_id: { type: string }
        file:
          type: object
          additionalProperties: false
          required: [name, size, type, sha256]
          properties:
            name: { type: string }
            size: { type: integer }
            type: { type: string }
            sha256: { type: string }

    VersionState:
      type: object
      required: [status]
      description: |
        One version of an image file, as the file's details record it: `pending` (a worker
        will make it), `ready` (made), `empty` (only functions make it, none has yet),
        `skipped` (`reason`: `not_an_image` or `unsupported_format`) or `failed` (`reason`:
        `too_large`, `decode_error`, `timeout` or `storage_error`).
      properties:
        status: { type: string, enum: [pending, ready, empty, skipped, failed] }
        reason: { type: string }
        id: { type: string, pattern: '^fv_[0-9a-z]{20}$' }
        size: { type: integer }
        type: { type: string }
        width: { type: integer }
        height: { type: integer }
        params: { type: object, additionalProperties: true }
        fingerprint: { type: string }
        custom: { type: boolean, description: "Made with parameters a function gave, not the declared ones." }
        generated_at: { $ref: "#/components/schemas/Timestamp" }
        url: { type: string, description: "With `?file_links=true`, a ready version's link." }
        expires_at: { $ref: "#/components/schemas/Timestamp" }

    FileLink:
      type: object
      additionalProperties: false
      required: [url, expires_at]
      properties:
        url: { type: string }
        expires_at: { $ref: "#/components/schemas/Timestamp" }

    DocumentBody:
      type: object
      description: |
        The document's fields, validated against the collection's
        schema.json. `id`, `_id` and `_meta` are ignored. So are file fields,
        except for a reference to a pending upload, `{"upload": "<id>", "token":
        "<token>"}` (a list of them on a `multiple` field), which attaches the
        file in this write (`POST …/_files/{field}/uploads`). On a `PUT` or `PATCH`
        a single field's file is replaced and a `multiple` field's is added to;
        a reference that is wrong, used or expired is `400 validation_error`.
      additionalProperties: true

    DocumentList:
      type: object
      additionalProperties: false
      required: [items, limit, skip, has_more]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Document" } }
        limit: { type: integer }
        skip: { type: integer }
        has_more: { type: boolean }
        next_cursor:
          type: string
          description: >-
            Present when `has_more` is true: pass it as `after` to get the next
            page. Absent when the `order_by` can't be followed by a cursor
            (arrays, objects, mixed types): use `skip` then.
        total:
          type: integer
          description: Present when `count=true`. Counts the whole list, not what is after `after`.

    BatchOperation:
      type: object
      required: [op, collection]
      description: |
        One write, applied atomically with the batch's other operations.
        `create` and `replace` need `document`; `patch` needs `patch` (a
        JSON Merge Patch). `replace`, `patch` and `delete` need `id`, and
        accept `if_match`: the version expected, as returned in `ETag`
        (e.g. `"3"`), or `"*"` for any existing document.
      properties:
        op: { type: string, enum: [create, replace, patch, delete] }
        collection: { type: string }
        id: { type: string }
        document: { type: object, additionalProperties: true }
        patch: { type: object, additionalProperties: true }
        if_match: { type: string }

    BatchRequest:
      type: object
      additionalProperties: false
      required: [operations]
      properties:
        operations:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: "#/components/schemas/BatchOperation" }

    BatchResult:
      type: object
      required: [id]
      description: The written document for create, replace and patch; just its id for delete.
      properties:
        id: { type: string }
      additionalProperties: true

    BatchResponse:
      type: object
      additionalProperties: false
      required: [results]
      properties:
        results:
          type: array
          items: { $ref: "#/components/schemas/BatchResult" }
