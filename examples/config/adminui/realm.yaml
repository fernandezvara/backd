# The admin UI's own test realm: Playwright (ui/admin/e2e) signs in to it at
# /_ui/r/adminui/ with one user per admin level. Local stacks and CI only:
# the passwords are the documented development one.
auth:
  strategies:
    password: [password]
    sso: [sso]
    passkey: [passkey]
  signup: open
  # Passkeys are bound to the origin the local stack's nginx serves the interface on.
  sign_in:
    app_url: https://localhost:8443/
    allowed_redirects: [https://localhost:8443]
  passkeys:
    enabled: true

# Read-only administrators may read users too (they never get a control that
# changes anything).
admin:
  read_access:
    users: true
    data: true

roles:
  editor:
    description: A plain role, for the role picker
  admin:
    description: Full administrator
    admin: true
    users:
      - admin@adminui.example
  viewer:
    description: Read-only administrator (operations only)
    admin: read
    users:
      - viewer@adminui.example
  support:
    description: Manages users and invitations, reads nothing else
    admin: [users, invitations]
    users:
      - support@adminui.example

# Organizations, for the admin UI's Organizations pages.
organizations:
  # Organizations may sign in with their own Google Workspace or Microsoft tenant (the Sign-in section).
  sso:
    providers: [google, microsoft, oidc]
    oidc: { issuers: ["https://login.acme.example"] }
  domains: { max_per_org: 5 }
  roles:
    owner: { description: Runs the organization, manage: [org, members, roles, teams, sso, domains] }
    editor: { description: Edits }
  default_roles: [editor]
  # Roles within a team, for the admin UI's team pages (manager needs a second factor).
  team_roles:
    manager: { description: Runs the team, grants: [delegate], require_mfa: true }
    delegate: { description: Covers the manager }

# Files (the data browser's file controls): the local stack's MinIO. The keys are
# realm secrets, set by the e2e global setup (backd secret set, in a real stack).
storage:
  provider: minio
  endpoint: http://minio:9000
  public_endpoint: http://localhost:9000
  bucket: backd-files
  prefix: adminui
  access_key: secret:STORAGE_ACCESS_KEY
  secret_key: secret:STORAGE_SECRET_KEY
  # Limits, for the Storage page and the tests: 10 MiB for the realm, 5 MiB for one user.
  quota:
    realm: 10MiB
    user: 5MiB

# Push notifications, for the admin UI's Push view and the user page's devices (the
# `capture` provider stores deliveries instead of sending: development only).
push:
  android:
    provider: capture
