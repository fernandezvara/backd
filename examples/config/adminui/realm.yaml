# The admin UI's own test realm: Playwright (ui/admin/e2e) signs in to it at
# /_ui/r/adminui/ with one user per admin level. Local stacks and CI only:
# the passwords are the documented development one.
auth: enabled
signup: open

# Read-only administrators may read users too (they never get a control that
# changes anything).
admin:
  read_access:
    users: true
    data: true

roles:
  editor:
    description: A plain role, for the role picker
  admin:
    description: Full administrator
    admin: true
    users:
      - admin@adminui.example
  viewer:
    description: Read-only administrator (operations only)
    admin: read
    users:
      - viewer@adminui.example
  support:
    description: Manages users and invitations, reads nothing else
    admin: [users, invitations]
    users:
      - support@adminui.example

# Files (the data browser's file controls): the local stack's MinIO. The keys are
# realm secrets, set by the e2e global setup (backd secret set, in a real stack).
storage:
  provider: minio
  endpoint: http://minio:9000
  public_endpoint: http://localhost:9000
  bucket: backd-files
  prefix: adminui
  access_key: secret:STORAGE_ACCESS_KEY
  secret_key: secret:STORAGE_SECRET_KEY
