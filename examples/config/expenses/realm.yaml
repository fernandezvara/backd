# The "expenses without functions" example: a small tricount-like app
# (clients/js/examples/expenses-without-functions). Groups share expenses
# and compute who owes whom. The rules here are as strict as backd's rules
# can be today, and the app still has known holes that only server-side
# functions (planned) can close: see the docs page "Expenses without
# functions" and the hack script next to the app.
#
# Anyone can sign up. Access is by email: a group lists its members'
# emails, and rules compare them with the signed-in user's email.
auth: enabled
signup: open

# Access is by email, so the address must be the user's own: the realm
# requires it to be verified before any session (and the rules check
# user.email_verified too). Without that, whoever signs up first as an
# invited email would get its group. Verification emails go through the
# development function `notifications/email-capture`, which only stores them
# in the `outbox` collection: read them in the Mailbox of the local stack
# (https://localhost:8443/example/mailbox/?realm=expenses). It is dev_only, so
# the local stack runs backd in dev mode; for real mail, replace it with your
# provider's function (docs: Functions -> Email).
email:
  function: notifications/email-capture
  from: "Expenses <no-reply@expenses.example>"
  # Links point at BACKD_URL, which the local stack sets to https://localhost:8443.
  allowed_redirects: [https://localhost:8443]
  redirects:
    verify_email: https://localhost:8443/example/expenses-without-functions/
    reset_password: https://localhost:8443/example/expenses-without-functions/
account:
  require_verified_email: true

# The realm's administrators: `backd bootstrap --realm expenses --email <email>` creates the
# first one; they manage users and API keys through the admin API.
roles:
  admin:
    description: Manages users, invitations and API keys
    admin: true
