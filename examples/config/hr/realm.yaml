# The HR absence module of docs/organizations/team-access-recipes: one company per
# organization, departments as teams, managers per department, delegation with dates.
auth: enabled
signup: open

organizations:
  roles:
    owner: { description: Runs the company account, manage: [org, members, roles, teams] }
    hr:
      description: Sees every absence of the company and approves long ones
      manage: [members, teams]
      require_mfa: true
    member: { description: Every employee }
  default_roles: [member]
  # Roles held within one department.
  team_roles:
    manager:
      description: Approves the department's absences
      grants: [delegate]        # may hand approval to someone else, in this department only
      require_mfa: true
    delegate:
      description: Approves in place of the manager, for a period
