# Who sees and decides what: the employee, a delegate from another department, the manager and HR.
users:
  ana:   { id: u1, email: ana@acme.example, orgs: { acme: { roles: [member], teams: [sales] } } }
  ben:   { id: u2, email: ben@acme.example, orgs: { acme: { roles: [member], teams: [sales] } } }
  marta: { id: u3, email: marta@acme.example, orgs: { acme: { roles: [member], teams: [sales], team_roles: { sales: [manager] } } } }
  # Covers Sales from Support: holds delegate there, without belonging to it.
  dario: { id: u4, email: dario@acme.example, orgs: { acme: { roles: [member], teams: [support], team_roles: { sales: [delegate] } } } }
  hugo:  { id: u5, email: hugo@acme.example, orgs: { acme: { roles: [member, hr] } } }
  elsa:  { id: u6, email: elsa@acme.example, orgs: { acme: { roles: [member], teams: [support] } } }

documents:
  leave: { kind: vacation, from: "2026-08-03", until: "2026-08-14", status: requested, _meta: { owner: u1, org: acme, team: sales } }
  sick:  { kind: sick, from: "2026-09-01", until: "2026-09-02", status: requested, _meta: { owner: u2, org: acme, team: sales } }
  other: { kind: personal, from: "2026-09-10", until: "2026-09-10", status: requested, _meta: { owner: u6, org: acme, team: support } }

tests:
  - name: an employee sees and edits only their own request
    as: ana
    read: { allow: [leave], deny: [sick, other] }
    update:
      - { document: leave, patch: { note: "Moved to August" }, expect: allow }
      - { document: leave, patch: { status: approved }, expect: deny }
    delete: { allow: [leave] }
    create:
      - { data: { kind: vacation, from: "2026-12-20", until: "2026-12-31", status: requested }, org: acme, team: sales, expect: allow }
      - { data: { kind: vacation, from: "2026-12-20", until: "2026-12-31", status: approved }, org: acme, team: sales, expect: deny }
      - { data: { kind: vacation, from: "2026-12-20", until: "2026-12-31", status: requested }, org: acme, team: support, expect: deny }

  - name: the manager of Sales approves Sales' absences, and only theirs
    as: marta
    read: { allow: [leave, sick], deny: [other] }
    update:
      - { document: leave, patch: { status: approved }, expect: allow }
      - { document: other, patch: { status: approved }, expect: deny }

  - name: a delegate from another department decides for Sales without being in it
    as: dario
    read: { allow: [leave, sick], deny: [other] }
    update:
      - { document: sick, patch: { status: approved }, expect: allow }

  - name: HR reads the whole company and doesn't decide for a department
    as: hugo
    read: { allow: [leave, sick, other] }
    update:
      - { document: leave, patch: { status: approved }, expect: deny }

  - name: another department's employee sees nothing of Sales
    as: elsa
    read: { allow: [other], deny: [leave, sick] }
