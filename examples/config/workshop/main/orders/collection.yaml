rules:
  # A customer sees and edits only their own orders, and only drafts.
  # `status` is not theirs to set: it starts as `draft`, and only functions
  # move it on (payment_webhook -> paid, refund -> refunded), which use
  # ctx.admin.db because no customer rule should allow that.
  read: user != nil && document._meta.owner == user.id

  create: user != nil && data.status == 'draft'

  update: >
    user != nil
    && document._meta.owner == user.id
    && document.status == 'draft'
    && !('status' in changed())

  delete: user != nil && document._meta.owner == user.id && document.status == 'draft'
