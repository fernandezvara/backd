# The "workshop" realm: one small shop, with the server-side functions the
# documentation's Functions section walks through (docs: Functions ->
# Cookbook). Every function here is real and tested: a sync call reading
# data as the caller, a privileged atomic refund, an async report job, two
# cron schedules, and a webhook.
#
# Anyone can sign up and place orders. `staff` may call refund; the cron
# functions need at least one worker (`backd serve --with-worker`, which the
# local stack runs, or a dedicated `backd worker`).
auth: enabled
signup: open

# Email goes through the function `notifications/email-capture`, which only
# stores each message in the `outbox` collection instead of sending it: read
# them in the Mailbox of the local stack (https://localhost:8443/example/mailbox/).
# It is dev_only, so the local stack runs backd in dev mode. For real mail
# you would replace it with your provider's function (docs: Functions -> Email).
email:
  function: notifications/email-capture
  from: "Workshop <no-reply@workshop.example>"
  # Links point at BACKD_URL, which the local stack sets to https://localhost:8443.

# `backd bootstrap --realm workshop --email <email>` creates the first
# administrator; give people the staff role in `roles.staff.users` below or
# with `backd user add-role --role staff`.
#
# Two demo accounts get their roles when they sign up (seed assignments), so
# the companion app (https://localhost:8443/example/workshop/) can offer
# "sign in as staff" and "sign in as operator" with the fixed local password
# `dev-p4ssw0rd!`. They exist only in the local stack: never keep demo users
# like these in a real realm.
roles:
  admin:
    description: Manages users, invitations and API keys
    admin: true
    users:
      - operator@workshop.example
  staff:
    description: Refunds orders and reads the daily digests
    users:
      - staff@workshop.example
