# The "shelf" realm: a team asset library — the application the Tutorial
# builds, chapter by chapter (docs: Tutorial). The files here are its final
# state; each chapter says what to add or change.
#
# Chapter 2: anyone may sign up (signup: open); signing in with the seeded
# addresses below grants the demo roles — demo users like these belong in
# local stacks only. `backd bootstrap --realm shelf --email <email>` creates
# the first administrator on a fresh database.
auth: enabled
signup: open

roles:
  admin:
    description: "Operators: users, invitations and API keys"
    admin: true
    users:
      - operator@shelf.example
  curator:
    description: Publishes assets and manages share links (chapter 5)
    users:
      - curator@shelf.example
