# The "shelf" realm: a team asset library — the application the Tutorial
# builds, chapter by chapter (docs: Tutorial). The files here are its final
# state; each chapter says what to add or change.
#
# Chapter 2 turns auth on; chapter 4 closes the door: new members sign up
# only with an invitation (signup: invite). The seeded addresses below gain
# their roles when they sign up — demo users like these belong in local
# stacks only. `backd bootstrap --realm shelf --email <email>` creates the
# first administrator on a fresh database.
auth: enabled
signup: invite

roles:
  admin:
    description: "Operators: users, invitations and API keys"
    admin: true
    users:
      - operator@shelf.example
  curator:
    description: Publishes assets and manages share links (chapter 5)
    users:
      - curator@shelf.example
