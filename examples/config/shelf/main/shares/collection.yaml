rules:
  # Share links are private to their creator (created_by — the
  # share function writes them as admin, so _meta.owner is not the creator).
  # The public /s/{token} lookup happens through the share-open function —
  # nobody, not even anonymous readers, gets to list this collection.
  read: user != nil && document.created_by == user.id

  # No create or update rule: only the share function mints links (it checks
  # the asset and generates the token — the HOLE that lived here is closed).
  delete: user != nil && document.created_by == user.id

# Erasure policy (docs: Auth -> Deleting and erasing users): share links a
# member created die with the member.
on_owner_delete:
  action: delete
