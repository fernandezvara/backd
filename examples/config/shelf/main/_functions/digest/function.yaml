# Notifies every member what was published since `since_days` ago — the
# long-running kind of work an HTTP request shouldn't hold open, so
# `mode: async`: the call queues a job and answers with it immediately.
# `retry:` repeats a failed attempt (three tries, doubling the wait).
# Admin users and API keys run it by hand; chapter 9 adds the schedule.
mode: async
admin: true
invoke: "user != nil && hasRole(user, 'admin')"
calls: [notify]
retry:
  attempts: 3
  backoff: 5s
  max_backoff: 1m
