rules:
  # Who may do what with the documents of this collection. Each
  # key is an operation; its value is an expression that must be true to allow
  # it. Operations without a rule are denied. API keys bypass rules.
  #
  # `user` is the signed-in user (user.id, user.email, user.email_verified,
  # user.roles), or nil for anonymous callers. `document` is the stored asset;
  # `data` the asset being written; `changed()` the fields a write touches.

  # Everyone in the workspace reads published assets; a member also reads
  # their own drafts, and a curator reads every draft — including the ones
  # nobody owns, like what the import webhook (chapter 11) lands — because
  # publishing them is the curator's job.
  read: >
    user != nil
    && (document.published_at != nil || document._meta.owner == user.id
        || hasRole(user, 'curator'))

  # Members write their own assets — as drafts. published_at stays off-limits
  # to clients: only the publish function stamps it, as admin (chapter 5
  # closed the HOLE that lived here).
  #
  # Fields only functions write are refused here the same way: published_at and
  # the download count (chapter 15). On a create there is no `changed()`, so the
  # rule asks for the field to be absent.
  create: >
    user != nil && data.published_at == nil && data.downloads == nil
  update: >
    user != nil && document._meta.owner == user.id
    && !('published_at' in changed())
    && !('downloads' in changed())
  delete: user != nil && document._meta.owner == user.id

# What happens to this collection when an administrator erases a user
# (`backd user delete`, docs: Auth -> Deleting and erasing users). Chapter 2
# adds this with the account page's "delete my account" button: self-service
# deletion only deactivates; an erase is admin-run and applies this policy.
#
# A member's assets go with them: the library keeps what the team shared, not
# one person's shelf.
on_owner_delete:
  action: delete

# Chapter 13: the fields of an asset that hold files. backd adds their schema,
# so they are declared here and never in schema.json (it refuses them there).
files:
  # One document or image per asset, streamed through backd.
  file:
    max_size: 25MiB
    types: [application/pdf, image/png, image/jpeg, text/plain]
    # Chapter 14: a small copy of an image for the gallery, made by a worker
    # after the upload. A PDF or a text file has none (its version is skipped).
    versions:
      thumb: { max_width: 256, max_height: 256, fit: cover }
  # Chapter 14: big attachments go straight from the browser to the bucket.
  attachments:
    multiple: true
    max_files: 5
    upload: direct
    max_size: 1GiB
