# Chapter 20: the team's pinboard. Each pin belongs to one team, which is an
# organization of the realm: backd keeps it in _meta.org, taken from the
# session (a person signs in to one team at a time), and the rules read
# the caller's membership of it.
organization: required

# Chapter 24: the team's board is live. Subscriptions to this collection are
# filtered by the caller's read rule on every change, so a member sees only
# their own teams' pins, and loses the list the moment they leave the team.
realtime: true

# Chapter 25: a pin may carry private notes. They are encrypted before they
# reach MongoDB, with a key the operator holds a copy of (SHELF_NOTES, created
# with `backd secret create`, see the chapter), so a dump or a backup shows
# ciphertext. `reveal` decides who sees them in an answer: the member who
# pinned it and the team's admins and owners. Everybody else who can read the
# pin gets `null` and `_meta.redacted: ["private_notes"]`.
fields:
  private_notes:
    encrypt: { key: SHELF_NOTES }
    reveal: >
      user != nil && (document.author == user.id
      || hasOrgRole(document._meta.org, 'admin') || hasOrgRole(document._meta.org, 'owner'))

# When a team is deleted, its pins go with it (the other choice is `keep`).
on_org_delete:
  action: delete

rules:
  # A member of the team reads its pins; anybody else, nothing. This is applied
  # inside the database query, so lists and counts show only what is readable.
  read: inOrg(document._meta.org)

  # No create rule: a pin is made by the pin function (chapter 20), which
  # knows the team's plan and how many pins fit. Clients can't create one.

  # Editing and removing: the person who pinned it, and the team's admins.
  update: >
    user != nil && document.author == user.id
    && (hasOrgRole(document._meta.org, 'editor') || hasOrgRole(document._meta.org, 'admin') || hasOrgRole(document._meta.org, 'owner'))
  delete: >
    user != nil && (document.author == user.id
    || hasOrgRole(document._meta.org, 'admin') || hasOrgRole(document._meta.org, 'owner'))

# What happens to what a member pinned when they are erased: the pins stay
# with their team (the content is the team's), and only the personal link,
# `author`, is cleared.
on_owner_delete:
  unset:
    author: id

# Chapter 22: the team's dashboard counts pins per member per month. Only the
# fields named here can be grouped by, so what a summary costs is decided in
# this file; the index it needs is in indexes.json.
aggregate:
  group_by: [author, _meta.created_at]
