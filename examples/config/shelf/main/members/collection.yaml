rules:
  # Every member may read the directory (the app and the digest
  # function need it); a member writes their own document, and may not move it
  # to another user_id.
  read: user != nil
  create: user != nil && data.user_id == user.id && data.email == user.email
  update: >
    user != nil && document.user_id == user.id
    && !('user_id' in changed())

# Data a user owns — gone when the user is erased (see "Deleting and
# erasing users" in the auth docs).
on_owner_delete:
  action: delete
