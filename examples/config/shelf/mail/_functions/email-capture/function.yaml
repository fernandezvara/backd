# A delivery function for local development: instead of sending, it stores
# each message (links included) in the `outbox` collection of this database,
# so you can read it, or open it in the Mailbox of the local stack, and click
# through verification and password reset.
#
# Point the realm at it in realm.yaml:
#   email:
#     function: mail/email-capture
#     from: "Dev <dev@example.com>"
#
# `dev_only: true`: backd refuses to start with this function unless
# BACKD_DEV=true, because the outbox holds working links. Replace it with your
# provider's delivery function (see the docs, Functions -> Email) before you
# deploy anywhere real.
internal: true
mode: async
dev_only: true
# Writes to the outbox as itself, whatever its (nonexistent) caller may do.
admin: true
