name: Admin UI

on:
  push:
  pull_request:

jobs:
  admin-ui:
    # The admin UI (ui/admin): type-check, lint (v-html is an error), unit
    # tests, a build, and the audit of what ships in it.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui/admin
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            clients/js/package-lock.json
            ui/admin/package-lock.json
      # The linked backd-js builds its typings on install: its tools first.
      - run: cd ../../clients/js && npm ci
      - run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Audit (the dependencies that ship in the bundle)
        run: npm run audit

  admin-ui-e2e:
    # Playwright against the example stack: every test fails on a CSP
    # violation or a request to another origin; axe checks the main views.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Run the end-to-end tests
        run: scripts/ui-e2e.sh
      - name: Keep the report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: admin-ui-e2e-report
          path: ui/admin/playwright-report
