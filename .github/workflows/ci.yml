name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Build for every release target
        run: |
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            GOOS=${t%/*} GOARCH=${t#*/} CGO_ENABLED=0 go build -o /dev/null ./cmd/backd
          done
      - name: Validate compose files
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.js.yml config -q
          docker compose -f docker-compose.test.yml config -q
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Lint the OpenAPI spec
        run: npx --yes @redocly/cli@2 lint --config api/redocly.yaml api/openapi.yaml
      - name: Test (dockerized)
        run: make test
      - name: "@backd/functions-testing tests (dockerized)"
        run: make functions-testing-test
      - name: Check the release configuration
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Known vulnerabilities in code backd calls (govulncheck)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: Build the image
        run: docker build -t backd:ci .
      - name: Scan the image (Trivy; fails on fixable critical or high findings)
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          docker.io/aquasec/trivy:0.74.0 image --quiet
          --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 backd:ci

  js-client:
    name: js-client (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 26]   # an LTS and the newest release
    defaults:
      run:
        working-directory: clients/js
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: clients/js/package-lock.json
      - run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Integration tests (backd + MongoDB in Docker)
        run: ./test/integration/run.sh

  production-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test the production reference deployment
        run: deploy/production/test.sh

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history for "last updated" dates (enableGitInfo)
      - uses: actions/setup-go@v7 # Hugo modules (hugodoks theme) need Go
        with:
          go-version-file: docs/go.mod
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.154.5"
          extended: true
      - name: Build docs
        run: hugo --source docs --minify
      - name: Check the docs links and anchors
        run: scripts/check-docs-links.py
      - name: Check the docs callouts
        run: scripts/check-docs-callouts.py
