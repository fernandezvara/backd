name: Client JavaScript

on:
  push:
  pull_request:

jobs:
  js-client:
    name: js-client (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 26]   # an LTS and the newest release
    defaults:
      run:
        working-directory: clients/js
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: clients/js/package-lock.json
      - run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: The functions runner's step tracking (plain JavaScript, no Deno)
        working-directory: .
        run: node --test internal/executor/steps.test.js
      - name: The package, as a user installs it from npm
        working-directory: .
        run: scripts/check-js-package.sh
      - name: Validate the compose file
        working-directory: .
        run: docker compose -f docker-compose.js.yml config -q
      - name: Integration tests (backd + MongoDB in Docker)
        run: ./test/integration/run.sh
