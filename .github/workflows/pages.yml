name: pages

# Tag a release (v*) to publish the documentation site to GitHub Pages: the
# site always shows the most recently tagged version.
# Requires repo Settings → Pages → Source: "GitHub Actions".
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

env:
  # Keep in step with docker/docs/Dockerfile.
  HUGO_VERSION: "0.154.5"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install Hugo (extended)
        run: |
          curl -fsSL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin hugo
          hugo version

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build the site
        run: hugo --source docs --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Check links, anchors and callouts
        run: |
          python3 scripts/check-docs-links.py
          python3 scripts/check-docs-callouts.py

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
