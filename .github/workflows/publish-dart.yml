name: Publish Dart client

# Publishes clients/dart to pub.dev (package "backd") when a dart- tag is pushed:
#   1. set "version" in clients/dart/pubspec.yaml, merge it
#   2. git tag dart-v0.9.3 && git push origin dart-v0.9.3
# The tag must match the version, and point at a commit on main. A version with
# a suffix (dart-v0.9.3-rc.1) is a pub.dev pre-release automatically — pub.dev
# shows it only to users who ask for pre-release versions, so a suffix tag is
# all it takes; `dart pub add backd` keeps getting the latest stable one.
#
# Publishing uses pub.dev's OIDC trusted publishing: no token is stored in the
# repository. Set it up once on pub.dev (package backd -> Admin -> Automated
# publishing: GitHub Actions, repository fernandezvara/backd, workflow filename
# publish-dart.yml, tag pattern dart-v{{version}}). pub itself exchanges the
# GitHub OIDC token. See the docs page Contribute -> Releasing.
on:
  push:
    tags: ["dart-v[0-9]+.[0-9]+.[0-9]+", "dart-v[0-9]+.[0-9]+.[0-9]+-*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # pub.dev OIDC trusted publishing
    defaults:
      run:
        working-directory: clients/dart
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: The tag points at a commit on main
        working-directory: .
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Dependencies
        run: dart pub get
      - name: The tag matches the version in pubspec.yaml
        run: |
          version=$(awk '/^version:/{print $2}' pubspec.yaml)
          if [ "dart-v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME doesn't match pubspec.yaml version $version" >&2
            exit 1
          fi
      - name: Analyze
        run: dart analyze --fatal-warnings
      - name: Unit tests
        run: dart test
      - name: The package, as a user installs it
        working-directory: .
        run: scripts/check-dart-package.sh
      - name: Publish
        run: dart pub publish --force
