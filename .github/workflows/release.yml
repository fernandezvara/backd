name: Release

# Publishes a release when a version tag is pushed:
#   git tag v0.2.0 && git push origin v0.2.0
# The release notes are generated from the commits since the previous tag.
# See the docs page Development → Releasing.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-*"]

permissions:
  contents: read

jobs:
  binaries:
    name: Binaries and GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # The binaries embed the admin UI; the same build ships as static files.
      - name: Build the admin UI
        run: make ui
      # Outside the checkout: GoReleaser refuses to run on a dirty tree, and a
      # new file in it would be one.
      - name: Pack the admin UI as static files
        run: tar -C internal/adminui/dist --exclude=.gitkeep -czf "${{ runner.temp }}/admin-ui_${{ github.ref_name }}.tar.gz" .
      - name: Install Syft (SBOMs)
        uses: anchore/sbom-action/download-syft@v0
        with:
          syft-version: v1.52.0
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Add the static admin UI to the release
        run: gh release upload "${{ github.ref_name }}" "${{ runner.temp }}/admin-ui_${{ github.ref_name }}.tar.gz"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    name: Container image
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      packages: write # push to ghcr.io
      id-token: write # keyless cosign signature
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      # Scan before publishing: build the amd64 image locally first.
      - name: Build for the scan
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          build-args: VERSION=${{ github.ref_name }}
          tags: backd:scan
      - name: Scan the image (Trivy; fails on fixable critical or high findings)
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          docker.io/aquasec/trivy:0.74.0 image --quiet
          --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 backd:scan
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/fernandezvara/backd
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # SBOM and provenance attestations, attached to the image.
          sbom: true
          provenance: mode=max
      - uses: sigstore/cosign-installer@v3
      - name: Sign the image (keyless, GitHub OIDC)
        run: cosign sign --yes "ghcr.io/fernandezvara/backd@${{ steps.push.outputs.digest }}"

  executor-image:
    name: Executor container image
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      packages: write # push to ghcr.io
      id-token: write # keyless cosign signature
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      # Scan before publishing: build the amd64 image locally first.
      - name: Build for the scan
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/executor/Dockerfile
          load: true
          build-args: VERSION=${{ github.ref_name }}
          tags: backd-executor:scan
      - name: Scan the image (Trivy; fails on fixable critical or high findings)
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          docker.io/aquasec/trivy:0.74.0 image --quiet
          --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 backd-executor:scan
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/fernandezvara/backd-executor
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/executor/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # SBOM and provenance attestations, attached to the image.
          sbom: true
          provenance: mode=max
      - uses: sigstore/cosign-installer@v3
      - name: Sign the image (keyless, GitHub OIDC)
        run: cosign sign --yes "ghcr.io/fernandezvara/backd-executor@${{ steps.push.outputs.digest }}"
