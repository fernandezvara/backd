name: Dart

on:
  push:
  pull_request:

jobs:
  dart-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Flutter, not bare Dart: `dart pub get` also resolves ./example,
      # which needs flutter_test from the Flutter SDK.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Dependencies
        run: flutter pub get
        working-directory: clients/dart
      - name: Analyze
        run: dart analyze --fatal-warnings
        working-directory: clients/dart
      - name: Test
        run: dart test
        working-directory: clients/dart

  shelf-flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: The demo's types match the config
        run: go run ./cmd/backd types --realm shelf --lang dart --out clients/dart/example/lib/backd --check
        env:
          CONFIG_DIR: examples/config
      - name: Linux build toolchain
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - name: Dependencies
        run: flutter pub get
        working-directory: clients/dart/example
      - name: Analyze
        run: flutter analyze
        working-directory: clients/dart/example
      - name: Build the Linux bundle
        run: flutter build linux --release
        working-directory: clients/dart/example
