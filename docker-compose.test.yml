# Dockerized test environment. Run with: make test
#
# Its own project name, so running it never touches the local stack
# (docker-compose.yml, `make example`) or the JS integration stack.
name: backd-test
services:
  # A single-node replica set (backd refuses standalone servers). The health
  # check initiates it on first start and passes once it is the primary.
  mongo:
    image: docker.io/library/mongo:8.2
    command: ["--replSet", "rs0", "--bind_ip_all"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status() } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongo:27017'}]}) } if (!db.hello().isWritablePrimary) quit(1)"]
      interval: 2s
      timeout: 5s
      retries: 30

  # A standalone server, only to test that backd refuses it.
  mongo-standalone:
    image: docker.io/library/mongo:8.2
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 2s
      timeout: 5s
      retries: 30

  # An S3-compatible object storage for the storage tests (internal/storage's
  # smoke test and, later, the file tests). The tests create their bucket. Dev-only
  # credentials, never real secrets.
  minio:
    image: docker.io/minio/minio:latest
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: backd-test
      MINIO_ROOT_PASSWORD: dev-p4ssw0rd!
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /minio/health/live HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && read -r line <&3 && [[ $$line == *' 200 '* ]]"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Go plus Deno (for the function build tests): docker/test/Dockerfile.
  tests:
    build:
      context: .
      dockerfile: docker/test/Dockerfile
    entrypoint: []
    working_dir: /src
    volumes:
      - .:/src
      - gomodcache:/go/pkg/mod
    environment:
      CGO_ENABLED: "0"
      MONGO_TEST_URI: mongodb://mongo:27017/?replicaSet=rs0
      MONGO_STANDALONE_TEST_URI: mongodb://mongo-standalone:27017
      BACKD_TEST_MINIO_ENDPOINT: http://minio:9000
      BACKD_TEST_MINIO_ACCESS_KEY: backd-test
      BACKD_TEST_MINIO_SECRET_KEY: dev-p4ssw0rd!
    depends_on:
      minio:
        condition: service_healthy
      mongo:
        condition: service_healthy
      mongo-standalone:
        condition: service_healthy
    command: ["go", "test", "-count=1", "./..."]

volumes:
  gomodcache:
