# Release builds, run by .github/workflows/release.yml on vX.Y.Z tags.
# Check locally with `make release-check`.
version: 2
project_name: backd

# The JavaScript client has its own tags (js-vX.Y.Z, publish-js.yml). They are
# not releases of backd: without this, the release notes would start at the
# latest js- tag instead of the previous backd release.
git:
  ignore_tags:
    - "js-*"

before:
  hooks:
    - go mod download

builds:
  - id: backd
    main: ./cmd/backd
    binary: backd
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{ .Tag }}"]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - id: backd
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, README.md]

# An SPDX SBOM per archive, made with Syft (installed by the release workflow).
sboms:
  - artifacts: archive

checksum:
  name_template: checksums.txt
  algorithm: sha256

# Release notes are generated by GitHub from the commits and pull requests
# since the previous tag.
changelog:
  use: github
  sort: asc

release:
  github:
    owner: fernandezvara
    name: backd
  prerelease: auto
  footer: |
    Container images: `docker pull ghcr.io/fernandezvara/backd:{{ .Tag }}` and `ghcr.io/fernandezvara/backd-executor:{{ .Tag }}` (linux/amd64 and linux/arm64), signed with cosign (keyless) and published with their SBOM and provenance.
    Verify downloads against `checksums.txt`; each archive has an SPDX SBOM (`*.sbom.json`).
