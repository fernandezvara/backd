# Python client integration tests: backd (built from this checkout, running
# both the serve and worker roles) + a real functions executor + MongoDB with
# the config in clients/js/test/integration/config — a server's config, so
# one file serves the test suites. Run with `make python-integration`.
#
# Its own project name, so running it never touches the local stack
# (docker-compose.yml, `make example`) or the other test stacks'.
name: backd-python-test
services:
  mongo:
    image: docker.io/library/mongo:8.2
    # A single-node replica set, initiated by the health check.
    command: ["--replSet", "rs0", "--bind_ip_all"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status() } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongo:27017'}]}) } if (!db.hello().isWritablePrimary) quit(1)"]
      interval: 2s
      timeout: 5s
      retries: 30

  # S3-compatible storage for the files realm. The test process uploads to it straight
  # (direct uploads), so it is published on localhost and the realm signs links for that
  # address (public_endpoint). Dev-only credentials.
  minio:
    image: cgr.dev/chainguard/minio:latest
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: backd-python
      MINIO_ROOT_PASSWORD: dev-p4ssw0rd!
    ports:
      - "127.0.0.1:18090:9000"
    tmpfs: [/data]

  # One-shot: creates the bucket; the image has no shell, so it tries again until up.
  minio-setup:
    image: cgr.dev/chainguard/minio-client:latest
    environment:
      MC_HOST_local: "http://backd-python:dev-p4ssw0rd!@minio:9000"
    command: ["mb", "--ignore-existing", "local/files"]
    depends_on: [minio]
    restart: on-failure:30

  # One-shot: the public bucket (public) for public file fields, readable by anyone
  # without listing (docker/minio/read-only-public.json): objects only, no ListBucket. Two steps,
  # because the image has no shell.
  minio-public-setup:
    image: cgr.dev/chainguard/minio-client:latest
    environment:
      MC_HOST_local: "http://backd-python:dev-p4ssw0rd!@minio:9000"
    command: ["mb", "--ignore-existing", "local/public"]
    depends_on: [minio]
    restart: on-failure:30

  minio-public-policy:
    image: cgr.dev/chainguard/minio-client:latest
    environment:
      MC_HOST_local: "http://backd-python:dev-p4ssw0rd!@minio:9000"
    command: ["anonymous", "set-json", "/policy.json", "local/public"]
    volumes:
      - ./docker/minio/read-only-public.json:/policy.json:ro
    depends_on:
      minio-public-setup:
        condition: service_completed_successfully
    restart: on-failure:30

  # One-shot: bundles the test functions so backd's startup check passes.
  # Uses the executor image (backd + the pinned Deno) so no extra image
  # is needed to build (see docker/egress-test/docker-compose.yml).
  functions-build:
    build:
      context: .
      dockerfile: docker/executor/Dockerfile
    entrypoint: ["/usr/local/bin/backd"]
    command: ["functions", "build"]
    user: root
    environment:
      CONFIG_DIR: /config
    volumes:
      - ./clients/js/test/integration/config:/config

  backd:
    build: .
    # --with-worker: sync and async functions both run in this one
    # process, so the integration tests need no separate worker service.
    command: ["serve", "--with-worker"]
    ports:
      - "127.0.0.1:28080:8080"
    environment:
      CONFIG_DIR: /config
      MONGO_URI: mongodb://mongo:27017/?replicaSet=rs0
      LOG_LEVEL: warn
      BACKD_INTERNAL_ADDR: :8081
      BACKD_EXECUTOR_URL: http://executor:9100
      BACKD_EXECUTOR_TOKEN: python-integration-executor-token-012345678
      BACKD_CALLBACK_URL: http://backd:8081
      BACKD_CALLBACK_KEY: python-integration-callback-key-0123456789ab
      # The mail realm delivers email through the dev-only email-capture function.
      BACKD_DEV: "true"
      BACKD_DEV_ANY_ADDR: "true"
      # The files realm keeps its storage keys as secrets (set by run.sh).
      BACKD_SECRETS_KEY: python-integration-secrets-key-0123456789abcd
    volumes:
      - ./clients/js/test/integration/config:/config:ro
    depends_on:
      mongo:
        condition: service_healthy
      functions-build:
        condition: service_completed_successfully

  # No egress or network isolation here (unlike docker/egress-test): the
  # test functions never reach the network, so there's nothing to prove.
  executor:
    build:
      context: .
      dockerfile: docker/executor/Dockerfile
    depends_on: [backd]
    environment:
      BACKD_EXECUTOR_TOKEN: python-integration-executor-token-012345678
      LOG_LEVEL: warn
