# The development stack's Prometheus (docker-compose.dev.yml): backd (the API), the worker(s),
# the executor and egress, with the dev-only token the compose file gives them and the same
# alert rules as the production reference. Workers are found by DNS, so WORKERS=3 shows three.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: backd
    authorization:
      credentials: local-dev-metrics-token-not-a-secret-0123456789
    static_configs:
      - targets: ["backd:9090"]
        labels: { role: api }
      - targets: ["executor:9090"]
        labels: { role: executor }
      - targets: ["egress:9090"]
        labels: { role: egress }

  # The workers, under the same job and a role of their own, so the dashboards tell them apart.
  - job_name: backd-workers
    authorization:
      credentials: local-dev-metrics-token-not-a-secret-0123456789
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 9090
        refresh_interval: 15s
    relabel_configs:
      - { target_label: job, replacement: backd }
      - { target_label: role, replacement: worker }
