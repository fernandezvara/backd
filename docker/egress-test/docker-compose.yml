# Proves F4's layer 2 (backd egress) and layer 3 (network placement): a
# real backd + executor + egress stack, with the executor's network
# isolated from MongoDB and the internet. Run with: make egress-test
# (docker/egress-test/test.sh). Build context is the repository root.
services:
  mongo:
    image: docker.io/library/mongo:8.2
    command: ["--replSet", "rs0", "--bind_ip_all"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status() } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongo:27017'}]}) } if (!db.hello().isWritablePrimary) quit(1)"]
      interval: 2s
      timeout: 5s
      retries: 30
    networks:
      data:
        ipv4_address: 172.30.10.10

  # One-shot: bundles the probe function so backd's startup check passes.
  # Uses the executor image (backd + the pinned Deno) so no extra image is
  # needed to build.
  functions-build:
    build:
      context: ../..
      dockerfile: docker/executor/Dockerfile
    entrypoint: ["/usr/local/bin/backd"]
    command: ["functions", "build"]
    user: root
    environment:
      CONFIG_DIR: /config
    volumes:
      - ./config:/config

  backd:
    build:
      context: ../..
      dockerfile: Dockerfile
    depends_on:
      mongo:
        condition: service_healthy
      functions-build:
        condition: service_completed_successfully
    environment:
      CONFIG_DIR: /config
      MONGO_URI: mongodb://mongo:27017/?replicaSet=rs0
      HTTP_ADDR: :8080
      BACKD_INTERNAL_ADDR: :8081
      BACKD_EXECUTOR_URL: http://executor:9100
      BACKD_EXECUTOR_TOKEN: ${EXECUTOR_TOKEN:?}
      BACKD_CALLBACK_URL: http://backd:8081
      BACKD_CALLBACK_KEY: ${CALLBACK_KEY:?}
      LOG_LEVEL: info
    volumes:
      - ./config:/config:ro
    ports:
      - "${PORT:-18092}:8080"
    networks: [data, isolated]

  # No route to `data` (MongoDB) or the internet: only `isolated`, where
  # its only peers are backd's internal listener and egress.
  executor:
    build:
      context: ../..
      dockerfile: docker/executor/Dockerfile
    depends_on: [backd]
    environment:
      BACKD_EXECUTOR_TOKEN: ${EXECUTOR_TOKEN:?}
      EXECUTOR_PROXY: http://egress:3128
      BACKD_EGRESS_KEY: ${EGRESS_KEY:?}
      LOG_LEVEL: info
    extra_hosts:
      # Models a function whose declared host name resolves somewhere it
      # shouldn't: MongoDB's real address (layer 3 must still refuse raw
      # TCP to it) and the executor's own loopback (unavoidable; its
      # /invoke's own auth is what refuses it).
      - "mongo-clone.test:172.30.10.10"
      - "sneaky.test:127.0.0.1"
    networks: [isolated]

  # The executor network's only way out: on `isolated` (reachable by the
  # executor and backd) and `uplink` (the internet), bridging the two.
  egress:
    build:
      context: ../..
      dockerfile: Dockerfile
    command: ["egress"]
    depends_on: [backd]
    environment:
      BACKD_EGRESS_KEY: ${EGRESS_KEY:?}
      EGRESS_ALLOW_PRIVATE: "backd:8081"
      LOG_LEVEL: info
    extra_hosts:
      - "mongo-clone.test:172.30.10.10"
      - "sneaky.test:127.0.0.1"
    networks: [isolated, uplink]

networks:
  data:
    ipam:
      config: [{subnet: 172.30.10.0/24}]
  isolated:
    internal: true
  uplink: {}
